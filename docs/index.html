":"mcq","text":"The cost performance index (CPI) is given by which of the following expressions?","opts":["CPI = AC/EV","CPI = EV/AC","CPI = AC × EV","CPI = EV − AC"],"ans":[1],"exp":"CPI = EV / AC (value earned per rupee spent; &lt; 1 means over cost).","topic":"t-eva"},{"id":"A19-9-9","src":"A19","wk":9,"n":9,"type":"mcq","text":"Which one of the following would equal EV/PV?","opts":["SPI","CPI","SV","CV"],"ans":[0],"exp":"SPI = EV / PV.","topic":"t-eva"},{"id":"A19-9-10","src":"A19","wk":9,"n":10,"type":"mcq","text":"Assume that a medium-sized project is experiencing considerable schedule slippage. Which one of the following may not help to get the project back on schedule?","opts":["Shortening the critical path","Altering the activity precedence requirements","Speeding up non-critical path activities","Reducing scope of the project"],"ans":[2],"exp":"Project duration is set by the critical path; speeding up activities that already have float does not bring the end date forward.","topic":"t-backontrack"},{"id":"A19-10-1","src":"A19","wk":10,"n":1,"type":"mcq","text":"In software configuration management, system accounting deals with","opts":["Keeping track of who made a particular change to a configuration item, what change was exactly made, and when the change was made","Controlling access to the different deliverable objects","Undoing changes to some part of a revision","Preventing unauthorized changes to the work products"],"ans":[0],"exp":"System accounting = keeping track of who changed which configuration item, what exactly changed, and when.","topic":"t-scm"},{"id":"A19-10-2","src":"A19","wk":10,"n":2,"type":"mcq","text":"Which one of the following scenarios can occur even while a software development organization is impeccably using a configuration management tool?","opts":["Two team members overwrite each other's code that is under configuration control","Accidental deletion of a work product that is under configuration control and consequent loss of work","A user reporting a software configuration error during installation","Unauthorized modifications to a work product under configuration control by one of the developers"],"ans":[2],"exp":"A CM tool prevents overwrites, losses and unauthorised changes inside the development environment. It cannot stop a user from mis-configuring the product during installation.","topic":"t-scm"},{"id":"A19-10-3","src":"A19","wk":10,"n":3,"type":"mcq","text":"Pre-controlled work products are","opts":["those that are put under configuration control","those that are not yet under configuration control, but will eventually be under configuration control","those that will not be subject to configuration control","none of the above"],"ans":[1],"exp":"Controlled = under configuration control; pre-controlled = not yet, but will be; uncontrolled = never under configuration control.","topic":"t-scm"},{"id":"A19-10-4","src":"A19","wk":10,"n":4,"type":"mcq","text":"Which one of the following statements is NOT correct regarding the SCCS tool?","opts":["It is a popular configuration management tool on UNIX systems","It can be used for controlling and managing different versions of text files","It can handle binary files","It provides an efficient way of storing versions that minimizes the amount of occupied disk space"],"ans":[2],"exp":"SCCS and RCS manage TEXT files using deltas; they do not handle binary files (executables, documents with diagrams).","topic":"t-scm"},{"id":"A19-10-5","src":"A19","wk":10,"n":5,"type":"mcq","text":"Which is true concerning a bespoke system?","opts":["It is a system which is created especially for one customer","It is a package which is bought 'as is'","It is a core system which is customized to meet the needs of the client","none of the above"],"ans":[0],"exp":"Bespoke = created specially for one customer. Off-the-shelf = bought as is. COTS = core system customised for the client.","topic":"t-contract"},{"id":"A19-10-6","src":"A19","wk":10,"n":6,"type":"mcq","text":"The contract in which the customer is charged at a fixed rate per unit of effort is known as","opts":["fixed price contract","time and materials contract","fixed price per unit delivered contract","none of the above"],"ans":[1],"exp":"Time and materials: the customer pays a fixed rate per unit of effort (per staff-hour or person-month).","topic":"t-contract"},{"id":"A19-10-7","src":"A19","wk":10,"n":7,"type":"mcq","text":"Which one of the following is typically not expected in a fixed price contract?","opts":["Vendors tend to overprice the bids","The selected vendor may demand a higher price to accommodate new requirements","Better quality of software is realized compared to time and material contracts","Best model to follow when the bidder has stringent budget restrictions"],"ans":[2],"exp":"Fixed-price contracts threaten quality (supplier cuts corners to stay in budget); T&amp;M contracts help quality because there is no price pressure.","topic":"t-contract"},{"id":"A19-10-8","src":"A19","wk":10,"n":8,"type":"mcq","text":"Which one of the following is a project proposal evaluation method?","opts":["Interviews","Demonstrations","Practical tests","All of the above"],"ans":[3],"exp":"Proposal evaluation methods: reading/scrutinising proposals, interviews, demonstrations, site visits, practical tests.","topic":"t-contract"},{"id":"A19-10-9","src":"A19","wk":10,"n":9,"type":"mcq","text":"Which one of the following is NOT true concerning the project closeout report?","opts":["It documents the important results obtained from various project closeout tasks","It starts with a historical summary of the project's deliverables and baseline activities over the course of the project","It presents the summary of the survey results and the quantitative data gathered about the project's performance","It does not contain any recommendation for improvement for other similar projects"],"ans":[3],"exp":"The closeout report DOES contain recommendations for improvement for similar projects (lessons learned, best practices).","topic":"t-closeout"},{"id":"A19-10-10","src":"A19","wk":10,"n":10,"type":"mcq","text":"Which one of the following most accurately states the main aim of a post-project review?","opts":["Validate overall progress to date against the budget and schedule","Capture knowledge and document it for future usage","Ensure all documentation is accepted and signed by the sponsor","Establish that project benefits have been identified"],"ans":[1],"exp":"The post-implementation (post-mortem) review exists to learn: capture knowledge and document it for future projects.","topic":"t-closeout"},{"id":"A19-11-1","src":"A19","wk":11,"n":1,"type":"mcq","text":"Which one of the following is the basic focus of the modern quality assurance paradigms?","opts":["Process assurance","Product assurance","Thorough testing","Thorough testing and rejection of bad products"],"ans":[0],"exp":"The paradigm shifted from product assurance (inspect and reject) to process assurance: a good process followed rigorously gives good products.","topic":"t-quality"},{"id":"A19-11-2","src":"A19","wk":11,"n":2,"type":"mcq","text":"Which one of the following ISO quality assurance standards applies to software development organizations?","opts":["ISO 9000","ISO 9001","ISO 9002","ISO 9003"],"ans":[1],"exp":"ISO 9001 applies to organisations that design, develop, produce and service: software developers. 9002 = production only; 9003 = inspection and testing only.","topic":"t-iso"},{"id":"A19-11-3","src":"A19","wk":11,"n":3,"type":"mcq","text":"A software organization has been assessed at SEI CMM Level 4. Which one of the following does the organization need to achieve for satisfying one of the KPAs of CMM Level 5?","opts":["Defect detection","Defect prevention","Defect isolation","Defect localization"],"ans":[1],"exp":"Level 5 KPAs: defect prevention, technology change management, process change management.","topic":"t-cmm"},{"id":"A19-11-4","src":"A19","wk":11,"n":4,"type":"mcq","text":"Which one of the following can be considered to be the focus of 'quality control'?","opts":["All development work products are delivered on time and under budget","The development process is completely documented and adhered to during development","The performance of the development work products is measured","All development work products are thoroughly tested before delivery to the customer"],"ans":[3],"exp":"Quality control is product-oriented: test/inspect the work products and remove defects before delivery (also find causes).","topic":"t-quality"},{"id":"A19-11-5","src":"A19","wk":11,"n":5,"type":"mcq","text":"Which one of the following is expected to be observed in a software development organization assessed at the SEI CMM repeatable level?","opts":["Success in development of a software can be repeated","Success in development of a software can be repeated on similar software development projects","Success in development of a software can be repeated in all software development projects that the organization might undertake","When the same development team is chosen to develop another software, they can repeat their success"],"ans":[1],"exp":"Level 2 (Repeatable): basic project management (cost, schedule tracking); success can be repeated on projects SIMILAR to earlier ones.","topic":"t-cmm"},{"id":"A19-11-6","src":"A19","wk":11,"n":6,"type":"mcq","text":"Which one of the following is a requirement for ISO 9001 certification?","opts":["Demonstrate that the developed software has fulfilled its quality requirements","Submit the reliability assessment of all the developed software","Document the process being followed","Demonstrate that through stringent design and use of coding standards, testing is largely made redundant"],"ans":[2],"exp":"ISO 9001 requires a documented quality process that is actually followed; it does not certify products or require reliability figures.","topic":"t-iso"},{"id":"A19-11-7","src":"A19","wk":11,"n":7,"type":"mcq","text":"In CMMI, which one of the following is the name of maturity level 5?","opts":["Six Sigma","Optimized","Statistical","Optimizing"],"ans":[3],"exp":"Level 5 is called Optimizing (in both CMM and CMMI).","topic":"t-cmmi"},{"id":"A19-11-8","src":"A19","wk":11,"n":8,"type":"mcq","text":"Which one of the following summarizes an important difference between quality assurance and quality control?","opts":["Thorough product testing","Ensuring that a good process is in place and has been documented","Ensuring that a good team is in place","Ensuring adequate usage of modern automated development tools"],"ans":[1],"exp":"QA ensures that a good process is in place, documented and followed (preventive). QC tests and inspects products (detective).","topic":"t-quality"},{"id":"A19-11-9","src":"A19","wk":11,"n":9,"type":"mcq","text":"Which one of the following SEI CMM maturity levels should be recommended to a small startup company that focuses on outsourced software development and software maintenance work?","opts":["Level 1","Level 2","Level 4","Level 5"],"ans":[1],"exp":"A small outsourcing/maintenance company needs disciplined project management first: level 2 (repeatable). Higher levels are costly and not needed.","topic":"t-cmm"},{"id":"A19-11-10","src":"A19","wk":11,"n":10,"type":"mcq","text":"Which one of the following is a software defect?","opts":["A mistake made by a team member during requirements specification","A change that the team needs to make based on a finding during code review","A configuration management plan that is too elaborate","A change request that has been launched by the customer"],"ans":[1],"exp":"A defect (fault, bug) is something in a work product that must be changed; a finding from code review that requires a change is a defect. A mistake is the human error that causes it.","topic":"t-testing"},{"id":"A19-12-1","src":"A19","wk":12,"n":1,"type":"mcq","text":"Which one of the following is not a factor contributing to the increased difficulty of software reliability measurement, as compared to hardware reliability measurement?","opts":["The reliability improvement due to fixing a single bug depends on where the bug is located in the code","The perceived reliability of a software product is observer-dependent","The reliability of a software product keeps changing as errors are detected and fixed","Software is invisible in contrast to hardware, though the effect of execution of software can be observed"],"ans":[3],"exp":"Software reliability is hard to measure because improvement per fix depends on bug location (core/non-core), it is observer-dependent, and it changes with every fix. Invisibility is not the reason.","topic":"t-reliab"},{"id":"A19-12-2","src":"A19","wk":12,"n":2,"type":"mcq","text":"Which one of the following can be said about the overall reliability behaviour of a typical software during its life time?","opts":["Initially increases, but later decreases","Initially decreases, but later increases","Increasing trend throughout the life cycle","Decreasing trend throughout the life cycle"],"ans":[0],"exp":"Typical life: reliability grows during testing/early use as bugs are fixed, then degrades as maintenance changes introduce new bugs (software failure curve).","topic":"t-reliab"},{"id":"A19-12-3","src":"A19","wk":12,"n":3,"type":"mcq","text":"After a software is maintained, which type of testing involves repeating tests that were already performed, to ensure that the code modifications made during maintenance have not introduced additional faults?","opts":["Beta testing","Functional testing","Bottom-up testing","Regression testing"],"ans":[3],"exp":"Regression testing reruns previous tests after a change to make sure nothing that worked is now broken.","topic":"t-testing"},{"id":"A19-12-4","src":"A19","wk":12,"n":4,"type":"mcq","text":"Which one of the following statements is not an objective of software verification?","opts":["Ensuring that the software development steps are carried out correctly","Ensuring that the correct software has been developed","Achieving phase containment of errors","Ensuring that the outputs produced at a development stage conform to the outputs of the previous phase"],"ans":[1],"exp":"Verification: was each step done right (output of a phase conforms to its input), achieving phase containment. 'Did we build the correct software?' is validation.","topic":"t-testing"},{"id":"A19-12-5","src":"A19","wk":12,"n":5,"type":"mcq","text":"Which of the following is a practical use of reliability growth modelling?","opts":["Determine the operational life of an application software","Determine when to stop testing","Incorporate reliability growth information while designing","Incorporate reliability growth information in the code"],"ans":[1],"exp":"Reliability growth models predict when a target reliability will be reached, i.e. how long to test / when to stop testing.","topic":"t-relgrowth"},{"id":"A19-12-6","src":"A19","wk":12,"n":6,"type":"mcq","text":"Which one of the following is the objective of statistical testing?","opts":["Use statistical techniques to design test cases","Apply statistical techniques to the results of testing to determine the number of latent bugs in the software","Estimate software reliability","Apply statistical techniques to the results of testing to determine how long testing needs to be carried out"],"ans":[2],"exp":"Statistical testing uses the operational profile to estimate reliability, not to find as many bugs as possible.","topic":"t-relgrowth"},{"id":"A19-12-7","src":"A19","wk":12,"n":7,"type":"mcq","text":"What is the availability of a software with the following reliability figures? Mean Time Between Failures (MTBF) = 45 days, Mean Time To Repair (MTTR) = 5 hours.","opts":["10%","20%","90%","99%"],"ans":[3],"exp":"Availability = MTBF / (MTBF + MTTR) = (45 × 24 h) / (1080 + 5) = 1080/1085 ≈ 0.995 ≈ 99 %.","topic":"t-reliab"},{"id":"A19-12-8","src":"A19","wk":12,"n":8,"type":"mcq","text":"On 4000 service invocations, a software failed on 10 occasions. What is its POFOD (probability of failure on demand)?","opts":["4%","1%","0.25%","0.1%"],"ans":[2],"exp":"POFOD = failures / demands = 10 / 4000 = 0.0025 = 0.25 %.","topic":"t-reliab"},{"id":"A19-12-9","src":"A19","wk":12,"n":9,"type":"mcq","text":"On a bug fix, the reliability of a software may actually decrease rather than increase. Which one of the following explains this phenomenon?","opts":["The fixed bug is in the core part","The fixed bug is in the non-core part","The bug-fix induces several other bugs","The bug-fix is not proper"],"ans":[2],"exp":"If the bug fix itself introduces new bugs, reliability can drop: negative reliability growth (allowed by Littlewood-Verall).","topic":"t-reliab"},{"id":"A19-12-10","src":"A19","wk":12,"n":10,"type":"mcq","text":"Which one of the following statements is FALSE?","opts":["Every failure is caused due to a fault","A fault is a synonym for a bug","An error may or may not cause a fault","Every mistake committed by a programmer shows up as a failure"],"ans":[3],"exp":"Not every mistake shows up as a failure: a fault may never be executed with failing inputs. Every failure is caused by some fault.","topic":"t-testing"},{"id":"AI-1-1","src":"AI","paper":1,"wk":1,"n":1,"type":"mcq","diff":"Easy","text":"According to the introductory lecture, which of the following best describes the 'software crisis'?","opts":["A shortage of available hardware to run new software.","The high cost of software licenses compared to hardware.","A persistent set of problems where projects are late, over budget, and fail to meet requirements.","The rapid obsolescence of programming languages."],"ans":[2],"exp":"Symptoms of the software crisis: fails to meet user requirements, expensive, difficult to alter/debug/enhance, often delivered late (CHAOS: only ~29 % succeed).","topic":"t-intro","lec":1},{"id":"AI-1-2","src":"AI","paper":1,"wk":1,"n":2,"type":"mcq","diff":"Easy","text":"Barry Boehm's W5HH principle is a framework used by project managers primarily to:","opts":["conduct performance reviews for team members.","comprehensively define and clarify the project scope.","select the appropriate software development lifecycle model.","negotiate contracts with external vendors."],"ans":[1],"exp":"W5HH (Boehm) = Why, What, When, Who, Where, How, How much: a question list that leads to the project scope.","topic":"t-intro","lec":9},{"id":"AI-1-3","src":"AI","paper":1,"wk":1,"n":3,"type":"mcq","diff":"Medium","text":"What is the key difference between a software product targeting a 'horizontal market' versus a 'vertical market'?","opts":["Horizontal market products are custom-built, while vertical market products are off-the-shelf.","Horizontal market products are for a wide range of industries, while vertical market products are for a specific industry.","Horizontal market products are information systems, while vertical market products are embedded systems.","Horizontal market products are more expensive than vertical market products."],"ans":[1],"exp":"Horizontal-market software meets the needs of many companies/industries; vertical-market software is designed for one particular industry.","topic":"t-intro","lec":9},{"id":"AI-1-4","src":"AI","paper":1,"wk":1,"n":4,"type":"mcq","diff":"Easy","text":"Which of the following is NOT one of the five core project management process groups as defined by PMBOK?","opts":["Initiating","Planning","Designing","Closing"],"ans":[2],"exp":"PMBOK process groups: Initiating, Planning, Executing, Monitoring &amp; Controlling, Closing. 'Designing' is a product activity, not a PM process group.","topic":"t-pm","lec":4},{"id":"AI-1-5","src":"AI","paper":1,"wk":2,"n":5,"type":"mcq","diff":"Medium","text":"In the classical waterfall model, which phase is stated to consume the maximum effort among all development and post-delivery phases?","opts":["Requirements Analysis","Design","Testing","Maintenance"],"ans":[3],"exp":"Among ALL phases maintenance takes the most effort; among the development phases, testing takes the most.","topic":"t-waterfall","lec":5},{"id":"AI-1-6","src":"AI","paper":1,"wk":2,"n":6,"type":"mcq","diff":"Hard","text":"What is the primary reason the V-Model is considered more suitable for high-reliability systems compared to the iterative waterfall model?","opts":["It allows for more frequent customer feedback.","It integrates test planning and design activities into every development phase, not just at the end.","It completely eliminates the possibility of defects.","It is a risk-driven model that uses prototyping."],"ans":[1],"exp":"V-model plans and designs tests in parallel with each development phase (requirements↔system test, HLD↔integration test, detailed design↔unit test): natural choice for safety-critical/high-reliability systems.","topic":"t-waterfall","lec":6},{"id":"AI-1-7","src":"AI","paper":1,"wk":2,"n":7,"type":"mcq","diff":"Medium","text":"What is the key characteristic that distinguishes the RAD model from the traditional prototyping model?","opts":["RAD uses a strict waterfall approach after prototyping.","In RAD, the prototype is refined and evolves into the final product, whereas in the prototyping model, it is typically thrown away.","RAD is only suitable for large, high-performance systems.","The prototyping model does not involve customer feedback."],"ans":[1],"exp":"In the prototyping model the prototype is usually thrown away; in RAD the quick prototype is refined increment by increment into the product.","topic":"t-proto","lec":7},{"id":"AI-1-8","src":"AI","paper":1,"wk":2,"n":8,"type":"mcq","diff":"Hard","text":"The Spiral Model is considered a 'meta-model' because:","opts":["it is the most recently developed model.","it is exclusively used for meta-data projects.","it can incorporate characteristics of waterfall, prototyping, and iterative models within its loops.","it guarantees zero risk in project development."],"ans":[2],"exp":"Spiral subsumes the other models: a single loop is a waterfall, iterations are evolutionary, prototyping is used for risk reduction. Hence 'meta-model'.","topic":"t-proto","lec":8},{"id":"AI-1-9","src":"AI","paper":1,"wk":2,"n":9,"type":"mcq","diff":"Easy","text":"In Scrum, what is the primary responsibility of the Product Owner?","opts":["To facilitate the daily scrum meeting and remove impediments.","To write the code for the features in the sprint backlog.","To represent the customer's interests, define features, and prioritize the Product Backlog.","To manage the technical architecture of the system."],"ans":[2],"exp":"Product owner: acts for the customer, defines features, decides release date/content, prioritises the backlog, accepts or rejects results.","topic":"t-agile","lec":10},{"id":"AI-1-10","src":"AI","paper":1,"wk":2,"n":10,"type":"mcq","diff":"Medium","text":"During a Daily Scrum meeting, which of the following questions is NOT one of the three key questions each team member answers?","opts":["What did I accomplish yesterday?","What is my plan for today?","How can we solve the technical problem I am facing?","Are there any obstacles in my way?"],"ans":[2],"exp":"Daily scrum: yesterday / today / obstacles. It is not a problem-solving session.","topic":"t-agile","lec":10},{"id":"AI-1-11","src":"AI","paper":1,"wk":3,"n":11,"type":"mcq","diff":"Easy","text":"What is the primary purpose of a 'business case' or feasibility study?","opts":["To create a detailed technical design of the software.","To justify the project by demonstrating its financial and technical viability.","To hire the development team for the project.","To write the user manual for the final product."],"ans":[1],"exp":"The business case (feasibility study) justifies starting the project: benefits exceed development, implementation and operating costs, with business risks considered.","topic":"t-bizcase","lec":11},{"id":"AI-1-12","src":"AI","paper":1,"wk":3,"n":12,"type":"mcq","diff":"Medium","text":"Which project evaluation technique calculates the time required for a project's cumulative cash inflows to equal its initial investment but ignores all profitability after that point?","opts":["Net Present Value (NPV)","Return on Investment (ROI)","Payback Period","Net Profit"],"ans":[2],"exp":"Payback period = time for accumulated cash flow to become positive. It ignores everything after break-even (overall profitability).","topic":"t-cba","lec":13},{"id":"AI-1-13","src":"AI","paper":1,"wk":3,"n":13,"type":"mcq","diff":"Hard","text":"A project has an initial investment of $100,000, followed by five annual cash flows of $10,000, $10,000, $10,000, $20,000, and $100,000. According to the lecture's calculation using a 10% discount rate, what is the Net Present Value (NPV)?","opts":["$50,000","$618","$10,000","-$1,250"],"ans":[1],"exp":"NPV = −100,000 + 10,000×0.9091 + 10,000×0.8264 + 10,000×0.7513 + 20,000×0.6830 + 100,000×0.6209 = 618.","topic":"t-cba","lec":13},{"id":"AI-1-14","src":"AI","paper":1,"wk":3,"n":14,"type":"mcq","diff":"Easy","text":"In the context of program management, what is a 'program'?","opts":["A single, standalone software application.","A group of unrelated projects managed by the same person.","A group of related projects managed in a coordinated way to achieve benefits not possible if managed independently.","The source code written for a project."],"ans":[2],"exp":"Programme (Ferns): a group of projects managed in a coordinated way to gain benefits not possible if managed independently.","topic":"t-programme","lec":15},{"id":"AI-1-15","src":"AI","paper":1,"wk":4,"n":15,"type":"mcq","diff":"Medium","text":"What is the primary purpose of the Software Project Management Plan (SPMP) document?","opts":["It is the contract signed with the customer.","It is a marketing document for the final product.","It is the user manual for the software.","It formally records all project plans, estimates, schedules, and risk management strategies."],"ans":[3],"exp":"The SPMP documents the plans after planning: introduction, estimates, resource plan, schedules, risk management plan, tracking &amp; control plan, misc plans.","topic":"t-estbasics","lec":16},{"id":"AI-1-16","src":"AI","paper":1,"wk":4,"n":16,"type":"mcq","diff":"Medium","text":"According to the lecture, what is a major shortcoming of using Source Lines of Code (SLOC) as a size estimation metric?","opts":["It is too difficult to count.","It penalizes the use of high-level languages and concise coding styles.","It can only be used for object-oriented programming.","It is language-independent."],"ans":[1],"exp":"LOC penalises high-level languages, reuse and compact code; it is language- and programmer-dependent and hard to estimate early.","topic":"t-esttech","lec":17},{"id":"AI-1-17","src":"AI","paper":1,"wk":4,"n":17,"type":"mcq","diff":"Hard","text":"The Delphi estimation technique is designed to mitigate individual biases and groupthink by:","opts":["requiring all experts to agree on a single estimate in a face-to-face meeting.","using a mathematical formula based on historical data.","using multiple rounds of anonymous estimation and feedback facilitated by a coordinator.","averaging the estimates of the most senior and most junior team members."],"ans":[2],"exp":"Delphi: independent anonymous estimates, coordinator circulates the rationale, experts re-estimate over several rounds; experts never meet to argue.","topic":"t-esttech","lec":17},{"id":"AI-1-18","src":"AI","paper":1,"wk":6,"n":18,"type":"mcq","diff":"Easy","text":"In PERT/CPM, what does 'Slack' or 'Float' represent?","opts":["The total duration of the project.","The amount of time a non-critical activity can be delayed without affecting the project completion date.","The cost overrun on a specific task.","The number of resources assigned to a task."],"ans":[1],"exp":"Float/slack = how long an activity can be delayed without delaying the project end date: LS − ES = LF − EF.","topic":"t-cpm","lec":28},{"id":"AI-1-19","src":"AI","paper":1,"wk":6,"n":19,"type":"mcq","diff":"Hard","text":"During the backward pass in a PERT/CPM calculation, if an activity is a 'burst point' with multiple successors, how is its Latest Finish (LF) time determined?","opts":["It is the maximum of the Latest Start (LS) times of all its successors.","It is the sum of the Latest Start (LS) times of all its successors.","It is the minimum of the Latest Start (LS) times of all its successors.","It is equal to the project's overall earliest finish time."],"ans":[2],"exp":"Backward pass at a burst point: LF = the SMALLEST LS of the immediate successors.","topic":"t-cpm","lec":29},{"id":"AI-1-20","src":"AI","paper":1,"wk":7,"n":20,"type":"mcq","diff":"Medium","text":"What is the primary goal of 'Project Crashing'?","opts":["To intentionally fail a project to recover insurance costs.","To reduce the overall project duration by accelerating specific activities, usually at an increased cost.","To remove non-essential features from the project scope.","To re-assign all team members to different projects."],"ans":[1],"exp":"Crashing shortens critical activities by adding resources (people, overtime, faster tools), at extra cost, cheapest first.","topic":"t-pert","lec":31},{"id":"AI-1-21","src":"AI","paper":1,"wk":7,"n":21,"type":"mcq","diff":"Medium","text":"According to Herzberg's Two-Factor Theory, which of the following is a 'Motivator' (or satisfier)?","opts":["Company policy","Salary","Working conditions","Recognition of effort and performance"],"ans":[3],"exp":"Motivators (job content): recognition, the job itself, achievement, promotion. Pay, policy and working conditions are hygiene factors.","topic":"t-people","lec":32},{"id":"AI-1-22","src":"AI","paper":1,"wk":7,"n":22,"type":"mcq","diff":"Hard","text":"What is the primary disadvantage of a 'Chief Programmer Team' structure?","opts":["Decision-making is too slow due to extensive discussions.","It is only suitable for very large and complex projects.","The project is highly dependent on a single individual, creating a single point of failure.","It leads to poor code quality due to a lack of expertise."],"ans":[2],"exp":"The chief programmer makes all technical decisions and writes the critical code: if he/she leaves or errs, the project suffers (single point of failure).","topic":"t-org","lec":34},{"id":"AI-1-23","src":"AI","paper":1,"wk":8,"n":23,"type":"mcq","diff":"Easy","text":"What is the primary purpose of a resource histogram in project management?","opts":["To track the project budget over time.","To visualize the demand for a specific resource over the project's duration.","To list the dependencies between project activities.","To document the project's final deliverables."],"ans":[1],"exp":"A resource histogram shows the level of demand for one resource type over time; it is used to spot peaks and smooth them.","topic":"t-resource","lec":37},{"id":"AI-1-24","src":"AI","paper":1,"wk":9,"n":24,"type":"mcq","diff":"Medium","text":"In Earned Value Analysis (EVA), what does a Cost Performance Index (CPI) of less than 1 indicate?","opts":["The project is under budget.","The project is ahead of schedule.","The project is over budget.","The project is exactly on schedule and on budget."],"ans":[2],"exp":"CPI = EV/AC &lt; 1: less value earned than money spent → over budget.","topic":"t-eva","lec":44},{"id":"AI-1-25","src":"AI","paper":1,"wk":10,"n":25,"type":"mcq","diff":"Easy","text":"What is the primary function of a Change Control Board (CCB)?","opts":["To write the initial project requirements.","To test the final software product.","To review and approve proposed changes to controlled work products.","To manage the project's budget."],"ans":[2],"exp":"The CCB reviews a changed configuration item and authorises the restore (motivated, documented, tested, consistent with others' changes).","topic":"t-scm","lec":47},{"id":"AI-1-26","src":"AI","paper":1,"wk":10,"n":26,"type":"mcq","diff":"Medium","text":"What is the key difference between a 'Fixed Price' contract and a 'Time and Material' contract?","opts":["Fixed price contracts are only for hardware, while time and material are for software.","In a fixed price contract, the customer has budget certainty, while in a time and material contract, the customer bears the financial risk of overruns.","Fixed price contracts are more flexible for changing requirements.","Time and material contracts motivate suppliers to be more cost-effective."],"ans":[1],"exp":"Fixed price: customer knows the expenditure, supplier carries the risk. Time &amp; materials: customer pays per unit of effort and absorbs the risk of changing requirements.","topic":"t-contract","lec":48},{"id":"AI-1-27","src":"AI","paper":1,"wk":10,"n":27,"type":"mcq","diff":"Easy","text":"What is the primary purpose of a post-implementation project review, also known as a 'post-mortem analysis'?","opts":["To assign blame for project failures.","To calculate the final financial profit or loss of the project.","To identify successes, failures, and lessons learned to improve future projects.","To release the final software version to the public."],"ans":[2],"exp":"Post-implementation review (post-mortem): critical analysis to learn lessons and improve future projects, not to blame.","topic":"t-closeout","lec":50},{"id":"AI-1-28","src":"AI","paper":1,"wk":11,"n":28,"type":"mcq","diff":"Hard","text":"What is a fundamental distinction between ISO 9001 certification and SEI CMM assessment?","opts":["ISO 9001 is for software only, while SEI CMM is for all industries.","ISO 9001 provides a step-by-step improvement path, while SEI CMM is a go/no-go certification.","ISO 9001 is a generic quality assurance standard, while SEI CMM is a software-specific framework providing a gradual path for process maturity improvement.","Only SEI CMM requires configuration management."],"ans":[2],"exp":"ISO 9001: generic standard, certification, single level. SEI CMM: software-specific, five levels with KPAs giving a gradual improvement path; ISO 9001 ≈ CMM level 3.","topic":"t-cmm","lec":55},{"id":"AI-1-29","src":"AI","paper":1,"wk":12,"n":29,"type":"mcq","diff":"Medium","text":"In the context of software reliability, what does the '90-10 rule' state?","opts":["90% of bugs are found by 10% of testers.","A project is 90% complete with 10% of the work remaining.","Approximately 90% of a program's execution time is spent in only 10% of its code.","90% of development effort is spent on coding, and 10% on testing."],"ans":[2],"exp":"90-10 rule: 90 % of execution time is spent in 10 % of the instructions (the core). Fixing bugs in the non-core changes perceived reliability little.","topic":"t-reliab","lec":56},{"id":"AI-1-30","src":"AI","paper":1,"wk":5,"n":30,"type":"mcq","diff":"Hard","text":"According to Putnam's model, if a project's development time (td) is compressed by half, the total effort (K) required increases by a factor of:","opts":["2","4","8","16"],"ans":[3],"exp":"Putnam: K = C₁/td⁴. Halving td multiplies effort by 2⁴ = 16.","topic":"t-staffing","lec":25},{"id":"AI-2-1","src":"AI","paper":2,"wk":1,"n":1,"type":"mcq","diff":"Easy","text":"According to the lecture, what is the 'software crisis'?","opts":["A shortage of hardware to run modern software applications.","A persistent set of problems including projects failing to meet requirements, exceeding budgets, and being delivered late.","The rapid increase in software costs relative to hardware costs.","The difficulty in finding developers trained in older programming languages."],"ans":[1],"exp":"Software crisis: late, over budget, failing requirements, hard to maintain.","topic":"t-intro","lec":1},{"id":"AI-2-2","src":"AI","paper":2,"wk":1,"n":2,"type":"mcq","diff":"Easy","text":"What is a project stakeholder, as defined in the lecture?","opts":["Only the customers who pay for the software project.","Only the project manager and the development team.","Individuals or organizations actively involved in a project, or whose interests may be affected by its execution or completion.","The top management of the company that initiates the project."],"ans":[2],"exp":"Stakeholders: individuals and organisations actively involved in the project or whose interests may be affected by its execution or completion.","topic":"t-intro","lec":2},{"id":"AI-2-3","src":"AI","paper":2,"wk":1,"n":3,"type":"mcq","diff":"Easy","text":"The '99 percent complete syndrome' refers to a situation where:","opts":["A project is successfully completed with 99% of its features.","A project is perpetually reported as 'almost done' by team members, leading to significant delays.","99% of the project budget has been spent before completion.","The final product has a 99% defect-free rate."],"ans":[1],"exp":"Without a life cycle model (milestones) managers rely on developers' guesses, and work stays '99 % complete' for a long time.","topic":"t-pm","lec":5},{"id":"AI-2-4","src":"AI","paper":2,"wk":2,"n":4,"type":"mcq","diff":"Easy","text":"What is the principle of 'phase containment of errors'?","opts":["Containing all project errors within a single, dedicated testing phase.","The idea that errors should be detected and corrected as close as possible to the phase in which they were introduced.","A method for ensuring that errors in one module do not affect other modules.","The principle that a certain number of errors is acceptable in each phase."],"ans":[1],"exp":"Phase containment: detect and correct errors in the same phase in which they are introduced; the later a defect is found, the costlier it is.","topic":"t-waterfall","lec":6},{"id":"AI-2-5","src":"AI","paper":2,"wk":2,"n":5,"type":"mcq","diff":"Easy","text":"According to the lecture, what is a major criticism of the Waterfall Model?","opts":["It requires too much customer involvement throughout the project.","It is too flexible, leading to scope creep and chaos.","It is a 'heavy-weight process' with extensive documentation overhead and inflexibility to change requests.","It is only suitable for very small, trivial projects."],"ans":[2],"exp":"Waterfall-based models are 'heavy-weight': requirements frozen up front, documentation-heavy, poor at change requests (40 % of requirements change).","topic":"t-proto","lec":7},{"id":"AI-2-6","src":"AI","paper":2,"wk":2,"n":6,"type":"mcq","diff":"Easy","text":"What is the core philosophy of the evolutionary model of software development?","opts":["To define and freeze all requirements before development begins.","To develop core modules initially and then progressively refine and expand them through multiple iterations based on user feedback.","To complete the entire system in a single, large release after extensive testing.","To focus exclusively on risk mitigation through prototyping."],"ans":[1],"exp":"Evolutionary: build the core modules first, then refine and add capability in successive versions using user feedback.","topic":"t-proto","lec":21},{"id":"AI-2-7","src":"AI","paper":2,"wk":2,"n":7,"type":"mcq","diff":"Easy","text":"In the context of Extreme Programming (XP), what is 'pair programming'?","opts":["Two programmers dividing the work and coding separate modules in parallel.","A lead programmer mentoring a junior programmer.","Two programmers working together at one workstation, with one writing code and the other reviewing it.","A formal code review process conducted by a pair of senior developers."],"ans":[2],"exp":"XP takes code review to the extreme: pair programming, two programmers at one workstation, one codes while the other reviews.","topic":"t-agile","lec":9},{"id":"AI-2-8","src":"AI","paper":2,"wk":2,"n":8,"type":"mcq","diff":"Easy","text":"In the Scrum framework, who is the Product Owner?","opts":["The most senior developer on the team who owns the codebase.","The project manager responsible for the team's daily tasks.","A team member responsible for facilitating the Scrum process and removing impediments.","A team member who acts as the voice of the customer, defines features, and prioritizes the Product Backlog."],"ans":[3],"exp":"The Product Owner represents the customer's interests and owns/prioritises the product backlog.","topic":"t-agile","lec":10},{"id":"AI-2-9","src":"AI","paper":2,"wk":4,"n":9,"type":"mcq","diff":"Easy","text":"What is the 'Price to Win' estimation method?","opts":["A technique where the project cost is estimated based on the most competitive market price.","A method where the project cost is set at whatever the customer is willing or able to spend.","An estimation based on winning a government contract through the lowest possible bid.","A detailed bottom-up estimation to ensure the price is high enough to guarantee a win."],"ans":[1],"exp":"Price to win: the project costs whatever the customer can spend; you get the contract but the cost may not reflect the work.","topic":"t-esttech","lec":17},{"id":"AI-2-10","src":"AI","paper":2,"wk":5,"n":10,"type":"mcq","diff":"Easy","text":"What are the three development modes in the Basic COCOMO 81 model?","opts":["Simple, Moderate, Complex","Small, Medium, Large","Organic, Semi-detached, Embedded","Basic, Intermediate, Detailed"],"ans":[2],"exp":"COCOMO 81 modes: organic, semi-detached, embedded (models: basic, intermediate, detailed).","topic":"t-cocomo","lec":8},{"id":"AI-2-11","src":"AI","paper":2,"wk":2,"n":11,"type":"mcq","diff":"Medium","text":"What is the primary purpose of a feasibility study in the project management lifecycle?","opts":["To create a detailed project schedule and allocate resources.","To determine if a project is technically viable and financially worthwhile before significant resources are committed.","To gather all customer requirements for the software product.","To select the development team and assign roles and responsibilities."],"ans":[1],"exp":"Feasibility study: is the software technically feasible and financially worthwhile? It ends with a go/no-go decision.","topic":"t-waterfall","lec":3},{"id":"AI-2-12","src":"AI","paper":2,"wk":1,"n":12,"type":"mcq","diff":"Medium","text":"What is the key difference between project management processes and product-oriented processes?","opts":["Project management processes are done by the customer, while product-oriented processes are done by the development team.","Project management processes focus on planning and control, while product-oriented processes focus on creating the actual project deliverables.","Project management processes are only performed at the beginning of a project, while product-oriented processes are continuous.","There is no significant difference; the terms are used interchangeably."],"ans":[1],"exp":"Project management processes plan and control the work; product-oriented processes specify and create the product.","topic":"t-pm","lec":4},{"id":"AI-2-13","src":"AI","paper":2,"wk":3,"n":13,"type":"mcq","diff":"Medium","text":"What is the key difference between Project Risk and Business Risk as defined in the lecture?","opts":["Project Risk affects the budget, while Business Risk affects the schedule.","Project Risk relates to threats to the successful execution of the project itself, while Business Risk threatens the benefits of the delivered project.","Project Risk is managed by the project manager, while Business Risk is managed by the customer.","Project Risk is technical in nature, while Business Risk is purely financial."],"ans":[1],"exp":"Project risk: threats to successful execution. Business risk: threats to the benefits of the delivered project (the business case focuses on business risk).","topic":"t-bizcase","lec":11},{"id":"AI-2-14","src":"AI","paper":2,"wk":3,"n":14,"type":"mcq","diff":"Medium","text":"What is a key difference between the Payback Period and Net Present Value (NPV) as project evaluation techniques?","opts":["Payback Period considers overall profitability, while NPV only considers the time to recover investment.","Payback Period is more complex to calculate than NPV.","NPV accounts for the time value of money by discounting future cash flows, while Payback Period does not.","NPV is expressed in years, while Payback Period is a percentage."],"ans":[2],"exp":"Payback ignores the time value of money; NPV discounts every cash flow with DF = 1/(1+r)^t.","topic":"t-cba","lec":13},{"id":"AI-2-15","src":"AI","paper":2,"wk":3,"n":15,"type":"mcq","diff":"Medium","text":"In the context of risk evaluation, how is a 'risk premium' used when calculating the Net Present Value (NPV) for a risky project?","opts":["It is a bonus paid to the project team for managing risks successfully.","It is an additional amount added to the project's expected benefits to account for potential gains.","It is an additional percentage added to the discount rate, making riskier projects appear less attractive unless their returns are higher.","It is a separate fund set aside to cover any financial losses from risks."],"ans":[2],"exp":"Risk premium: add, e.g., 2 % (fairly safe) to 5 % (fairly risky) to the discount rate, so a risky project needs higher returns to show a positive NPV.","topic":"t-riskeval","lec":14},{"id":"AI-2-16","src":"AI","paper":2,"wk":3,"n":16,"type":"mcq","diff":"Medium","text":"How does a Program Manager's role differ from a Project Manager's role regarding resource optimization?","opts":["A Program Manager minimizes resource demand for their specific project, while a Project Manager optimizes across all projects.","A Program Manager aims for the optimal use of resources across all projects within the program, while a Project Manager seeks to minimize resource demand for their single project.","A Program Manager focuses only on financial resources, while a Project Manager focuses on human resources.","There is no difference; both roles have the same objective for resource optimization."],"ans":[1],"exp":"Programme manager: optimise resource use across many projects (personal relationships with skilled staff). Project manager: minimise demand for his one project.","topic":"t-programme","lec":15},{"id":"AI-2-17","src":"AI","paper":2,"wk":4,"n":17,"type":"mcq","diff":"Medium","text":"What is a primary disadvantage of the bottom-up estimation technique?","opts":["It is very fast to implement but often inaccurate.","It fails to consider the complexities of individual low-level tasks.","It can be very time-consuming and may overlook system-level costs like integration and configuration management.","It requires extensive historical data from similar past projects to be effective."],"ans":[2],"exp":"Bottom-up is time-consuming, needs detail early and tends to miss system-level costs (integration, CM, QA).","topic":"t-esttech","lec":18},{"id":"AI-2-18","src":"AI","paper":2,"wk":4,"n":18,"type":"mcq","diff":"Medium","text":"What is the purpose of the Value Adjustment Factor (VAF) in the Albrecht/IFPUG function point calculation?","opts":["To convert the final function point count into Lines of Code (LOC).","To determine the initial raw count of function points based on user inputs and outputs.","To refine the Unadjusted Function Point (UFP) count by accounting for 14 general system characteristics related to technical and environmental complexity.","To calculate the total cost of the project based on the function point size."],"ans":[2],"exp":"VAF = 0.65 + 0.01 × TDI, from 14 general system characteristics rated 0-5. AFP = UFP × VAF.","topic":"t-fp","lec":19},{"id":"AI-2-19","src":"AI","paper":2,"wk":4,"n":19,"type":"mcq","diff":"Medium","text":"COSMIC Full Function Points (FFPs) are designed for embedded and real-time systems. What are the four fundamental types of data movement that this method counts?","opts":["Inputs, Outputs, Inquiries, and Files","Creates, Reads, Updates, and Deletes","Entries, Exits, Reads, and Writes","Screens, Reports, Modules, and Interfaces"],"ans":[2],"exp":"COSMIC data movements: entries, exits, reads, writes; each counts 1 Cfsu.","topic":"t-fp","lec":20},{"id":"AI-2-20","src":"AI","paper":2,"wk":5,"n":20,"type":"mcq","diff":"Medium","text":"What is the purpose of calculating Program Volume (V) in Halstead's Software Science?","opts":["To measure the physical disk space occupied by the program.","To count the total number of operators and operands used in the program.","To compensate for the effect of the programming language used, providing a more standardized measure of program size in bits.","To estimate the number of mental discriminations required to write the program."],"ans":[2],"exp":"V = N log₂ η: minimum number of bits needed to encode the program; compensates for the language used.","topic":"t-halstead","lec":24},{"id":"AI-2-21","src":"AI","paper":2,"wk":5,"n":21,"type":"mcq","diff":"Medium","text":"How does Putnam's model demonstrate the concept of 'schedule compression'?","opts":["It shows that reducing development time by half will also cut the required effort in half.","It indicates that compressing the schedule has a linear and predictable impact on project cost.","It shows a highly non-linear relationship where reducing development time leads to a disproportionately large increase in required effort (effort scales with td^4).","It proves that schedule compression is impossible beyond a 10% reduction from the nominal time."],"ans":[2],"exp":"Putnam: effort ∝ 1/td⁴, so a small schedule compression costs a large increase in effort.","topic":"t-staffing","lec":25},{"id":"AI-2-22","src":"AI","paper":2,"wk":6,"n":22,"type":"mcq","diff":"Medium","text":"Why is it important for a project manager to avoid both too fine and too coarse granularity when creating a Work Breakdown Structure (WBS)?","opts":["Too fine granularity is expensive, while too coarse granularity is too simple.","Too fine granularity creates excessive management overhead, while too coarse granularity leads to a loss of project control and visibility.","Too fine granularity is only for agile projects, while too coarse granularity is for waterfall projects.","Too fine granularity requires expert developers, while too coarse granularity can be handled by junior developers."],"ans":[1],"exp":"WBS granularity: too fine = management overhead; too coarse = poor control and visibility. Lowest level ≈ one or two weeks of one person's work.","topic":"t-wbs","lec":26},{"id":"AI-2-23","src":"AI","paper":2,"wk":8,"n":23,"type":"mcq","diff":"Hard","text":"How does the concept of 'slack' or 'float time' in PERT/CPM provide flexibility for a project manager in resource management?","opts":["It allows the project manager to add extra features to activities with slack time.","It indicates which activities can be eliminated from the project to save time.","It allows the project manager to strategically reallocate resources from non-critical activities (with slack) to critical activities that are falling behind.","It represents the extra budget available for non-critical activities."],"ans":[2],"exp":"Non-critical activities have float, so their resources can be shifted to critical activities that are slipping.","topic":"t-resource","lec":27},{"id":"AI-2-24","src":"AI","paper":2,"wk":7,"n":24,"type":"mcq","diff":"Hard","text":"During project crashing, why must the critical path be re-evaluated after each incremental reduction in a task's duration?","opts":["To ensure the project budget is not exceeded.","Because reducing the duration of a critical task can cause a different, previously non-critical path to become the new critical path.","To confirm that the customer still requires the project to be accelerated.","To allow the project manager to add more tasks to the project."],"ans":[1],"exp":"Crashing one path can make a parallel path critical, so recompute the critical path after every step.","topic":"t-pert","lec":31},{"id":"AI-2-25","src":"AI","paper":2,"wk":7,"n":25,"type":"mcq","diff":"Hard","text":"How does the Oldham-Hackman Job Characteristic Model suggest a manager can redesign a job to make it more meaningful and motivating?","opts":["By increasing the salary and improving working conditions.","By implementing stricter supervision and control over tasks.","By increasing skill variety, task identity, task significance, autonomy, and feedback.","By reducing the number of tasks to minimize employee workload."],"ans":[2],"exp":"Oldham-Hackman: skill variety, task identity, task significance (meaningfulness) + autonomy + feedback.","topic":"t-people","lec":32},{"id":"AI-2-26","src":"AI","paper":2,"wk":7,"n":26,"type":"mcq","diff":"Hard","text":"According to Boehm's list of frequent risks, what is 'gold plating' and how can it be mitigated?","opts":["It is the risk of using expensive hardware; it can be mitigated by choosing cheaper alternatives.","It is the risk of developers adding features not specified in requirements; it can be mitigated by requirement scrubbing and prototyping for user evaluation.","It is the risk of delivering the project late; it can be mitigated by adding more developers to the team.","It is the risk of the user interface being poorly designed; it can be mitigated by hiring a dedicated UI/UX expert."],"ans":[1],"exp":"Gold plating = developers adding unrequested features. Boehm's remedy: requirements scrubbing, prototyping, cost-benefit analysis.","topic":"t-risk","lec":34},{"id":"AI-2-27","src":"AI","paper":2,"wk":8,"n":27,"type":"mcq","diff":"Hard","text":"The lecture advises not to add new dependencies to the activity network to reflect resource constraints. Why is this the recommended practice?","opts":["Because resource constraints are not as important as task dependencies.","Because adding such dependencies makes the network messy, and if the resource constraint disappears, the artificial link remains, causing confusion.","Because modern software tools cannot handle resource-based dependencies.","Because it violates the fundamental rules of PERT/CPM network construction."],"ans":[1],"exp":"Do not add resource-induced links to the activity network: it becomes messy and the link stays after the constraint disappears. Change dates on the schedule instead.","topic":"t-resource","lec":37},{"id":"AI-2-28","src":"AI","paper":2,"wk":9,"n":28,"type":"mcq","diff":"Hard","text":"The lecture mentions that Earned Value Analysis (EVA) has not achieved universal acceptance in software development. What is the primary reason for this challenge?","opts":["EVA calculations are too complex for most project managers to perform.","EVA is only suitable for hardware projects and cannot be applied to intangible products.","A 'half-completed software project' often has no functional value until it is fully deployed, making it difficult to assign meaningful 'earned value' to partial work.","The US Department of Defense has prohibited the use of EVA for software projects."],"ans":[2],"exp":"Objection: a half-built house has value, a half-built program has little. (This misunderstands EVA, which tracks budgeted cost of completed work.)","topic":"t-eva","lec":44},{"id":"AI-2-29","src":"AI","paper":2,"wk":9,"n":29,"type":"mcq","diff":"Hard","text":"What are the potential consequences and risks of altering activity precedence requirements to get a project back on target?","opts":["It always reduces project costs and improves team morale.","It has no impact on the project other than accelerating the schedule.","It can compromise quality and increase project risk, such as starting coding before design is complete, which can lead to extensive rework.","It is a forbidden practice in all project management methodologies."],"ans":[2],"exp":"Relaxing precedence (e.g. coding before design is final) can save time but compromises quality and raises risk of rework.","topic":"t-backontrack","lec":45},{"id":"AI-2-30","src":"AI","paper":2,"wk":11,"n":30,"type":"mcq","diff":"Hard","text":"The lecture states that an organization cannot advertise its products as 'ISO 9000 certified.' Why is this the case, and what is the underlying assumption of ISO 9000 certification?","opts":["Because ISO 9000 is an outdated standard that has been replaced by SEI CMM.","Because advertising individual products is too expensive for most ISO certified companies.","Because ISO certification is awarded to an organization's PROCESS, not its products, based on the assumption that a good process leads to a good product.","Because only the ISO organization itself is allowed to advertise certified products, not the companies that make them."],"ans":[2],"exp":"ISO 9000 certifies an organisation's process, not products. Advertising products as ISO-certified risks withdrawal of the certificate.","topic":"t-iso","lec":52},{"id":"AI-3-1","src":"AI","paper":3,"wk":1,"n":1,"type":"mcq","diff":"Easy","text":"According to the lecture, the \"software crisis\" refers to a persistent set of problems in software development. Which of the following is NOT a symptom of this crisis?","opts":["Projects exceeding their budget.","Software that is difficult to alter or maintain.","Hardware costs increasing faster than software costs.","Projects being delivered late."],"ans":[2],"exp":"Hardware cost has fallen relative to software cost; rising hardware cost is not a symptom of the software crisis.","topic":"t-intro","lec":1},{"id":"AI-3-2","src":"AI","paper":3,"wk":2,"n":2,"type":"mcq","diff":"Easy","text":"What is the primary purpose of conducting a feasibility study at the beginning of a project?","opts":["To write the initial lines of code for the project.","To determine if the project is viable and should be undertaken.","To hire the entire development team.","To finalize the user interface design."],"ans":[1],"exp":"Feasibility study: determine whether the project is technically feasible and financially worthwhile before committing resources.","topic":"t-waterfall","lec":5},{"id":"AI-3-3","src":"AI","paper":3,"wk":1,"n":3,"type":"mcq","diff":"Easy","text":"The \"Build and Fix Model\" is described as being suitable for which type of projects?","opts":["Large, complex projects with many team members.","All projects that require high reliability.","Trivial projects, such as student assignments.","Projects with a fixed, unchangeable budget."],"ans":[2],"exp":"Build-and-fix (exploratory) works only when one programmer can grasp the whole problem: trivial programs such as student assignments.","topic":"t-pm","lec":4},{"id":"AI-3-4","src":"AI","paper":3,"wk":2,"n":4,"type":"mcq","diff":"Easy","text":"In the Scrum framework, what is a \"Sprint\"?","opts":["A daily 15-minute meeting for the development team.","The final phase of the project where all testing is done.","A prioritized list of all desired features for a product.","A fixed-duration iteration during which a product increment is developed."],"ans":[3],"exp":"Sprint: fixed-length (≈ one month) time-box producing a potentially shippable increment; no changes entertained during the sprint.","topic":"t-agile","lec":10},{"id":"AI-3-5","src":"AI","paper":3,"wk":6,"n":5,"type":"mcq","diff":"Easy","text":"What does the acronym PERT stand for in the context of project scheduling?","opts":["Project Execution and Resource Tracking.","Program Evaluation and Review Technique.","Product Engineering and Revision Tool.","Process Enhancement and Reporting Technology."],"ans":[1],"exp":"PERT = Program Evaluation and Review Technique (US Navy, Polaris missile). CPM = Critical Path Method (DuPont).","topic":"t-wbs","lec":27},{"id":"AI-3-6","src":"AI","paper":3,"wk":4,"n":6,"type":"mcq","diff":"Easy","text":"What is the primary goal of the \"Price to Win\" estimation strategy?","opts":["To accurately calculate the total effort required for the project.","To set the project cost based on what the customer is willing to spend.","To estimate the project size using Function Points.","To ensure the highest possible quality for the final product."],"ans":[1],"exp":"Price to win: cost set to what the customer is willing to spend.","topic":"t-esttech","lec":17},{"id":"AI-3-7","src":"AI","paper":3,"wk":9,"n":7,"type":"mcq","diff":"Easy","text":"According to the lecture, what is a primary use of a Gantt chart in project management?","opts":["To write and compile source code.","To conduct user acceptance testing.","To plan the utilization of various resources.","To formally close a contract with a vendor."],"ans":[2],"exp":"Gantt charts help plan resource utilisation; PERT charts help monitor timely progress.","topic":"t-visual","lec":42},{"id":"AI-3-8","src":"AI","paper":3,"wk":7,"n":8,"type":"mcq","diff":"Easy","text":"What is the core concept of \"egoless programming\" within a democratic team structure?","opts":["Only the most senior programmer is allowed to write code.","No single individual \"owns\" a piece of code; work is reviewed by all.","Programmers work in complete isolation to avoid conflicts.","All technical decisions are made by the project manager."],"ans":[1],"exp":"Egoless programming (democratic team): code ownership is shared and code is exchanged for review.","topic":"t-org","lec":33},{"id":"AI-3-9","src":"AI","paper":3,"wk":12,"n":9,"type":"mcq","diff":"Easy","text":"What is the fundamental difference between a \"fault\" and a \"failure\" in software testing?","opts":["A fault is a human mistake, while a failure is a bug in the code.","A fault is an incorrect step in the code, while a failure is the observable deviation from expected behavior.","A fault can only be found by the developer, while a failure is found by the user.","A fault and a failure are synonyms for the same problem."],"ans":[1],"exp":"Error/mistake (human) → fault/defect/bug (in the code) → failure (observable wrong behaviour). A fault may never cause a failure.","topic":"t-testing","lec":60},{"id":"AI-3-10","src":"AI","paper":3,"wk":11,"n":10,"type":"mcq","diff":"Easy","text":"What does ISO 9001 certification primarily signify about an organization?","opts":["That its individual software products are guaranteed to be bug-free.","That the organization has a documented quality process or system.","That the organization is the most profitable in its industry.","That all its employees have passed a specific quality exam."],"ans":[1],"exp":"ISO 9001 certification says a documented quality system exists and is followed; it says nothing directly about product quality.","topic":"t-iso","lec":52},{"id":"AI-3-11","src":"AI","paper":3,"wk":1,"n":11,"type":"mcq","diff":"Medium","text":"According to Barry Boehm's W5HH principle for defining project scope, which question specifically addresses the project's budget and resource requirements?","opts":["Why is the software being built?","What will be done?","Who is responsible for a function?","How much of each resource is needed?"],"ans":[3],"exp":"W5HH 'How much of each resource is needed?' covers budget and resources.","topic":"t-intro","lec":9},{"id":"AI-3-12","src":"AI","paper":3,"wk":2,"n":12,"type":"mcq","diff":"Medium","text":"In the V-Model of software development, the design of integration test cases is typically carried out in parallel with which development phase?","opts":["Requirements Specification","High-Level Design","Detailed Design","Coding"],"ans":[1],"exp":"V-model pairs: requirements ↔ system test design, high-level design ↔ integration test design, detailed design ↔ unit test design.","topic":"t-waterfall","lec":6},{"id":"AI-3-13","src":"AI","paper":3,"wk":2,"n":13,"type":"mcq","diff":"Medium","text":"What is the key difference between a purely incremental model and an evolutionary model?","opts":["The incremental model uses iterations, while the evolutionary model does not.","The evolutionary model delivers working software to the customer, while the incremental model does not.","In the incremental model all requirements are defined upfront, while in the evolutionary model they emerge over time.","The incremental model is for large projects, while the evolutionary model is only for small projects."],"ans":[2],"exp":"Incremental: requirements known up front, split into increments. Evolutionary: requirements, plans and solution evolve over iterations.","topic":"t-proto","lec":21},{"id":"AI-3-14","src":"AI","paper":3,"wk":3,"n":14,"type":"mcq","diff":"Medium","text":"Which project evaluation technique calculates the difference between total income and total costs but is criticized for not accounting for the timing of cash flows?","opts":["Net Present Value (NPV)","Internal Rate of Return (IRR)","Payback Period","Net Profit"],"ans":[3],"exp":"Net profit = total income − total cost over the life of the project; it ignores timing of cash flows.","topic":"t-cba","lec":13},{"id":"AI-3-15","src":"AI","paper":3,"wk":4,"n":15,"type":"mcq","diff":"Medium","text":"What is a major shortcoming of using Source Lines of Code (SLOC) as a project size estimation metric?","opts":["It is too difficult for non-technical stakeholders to understand.","It can only be used for projects written in assembly language.","It penalizes the use of high-level languages and code reuse.","It requires expensive, specialized tools to calculate."],"ans":[2],"exp":"LOC penalises high-level languages and reuse.","topic":"t-esttech","lec":17},{"id":"AI-3-16","src":"AI","paper":3,"wk":5,"n":16,"type":"mcq","diff":"Medium","text":"In the COCOMO 81 model, how does the \"Embedded Mode\" of development typically differ from the \"Organic Mode\"?","opts":["Embedded mode projects are smaller and use experienced teams, while organic mode projects are large and innovative.","Embedded mode is for projects with flexible constraints, while organic mode has tight constraints.","Embedded mode projects are completely new and innovative, while organic mode projects are familiar and stable.","The constants used for effort estimation are lower for embedded mode than for organic mode."],"ans":[2],"exp":"Embedded: new, innovative, tight constraints (OS, real-time). Organic: familiar, stable, similar to past products (accounting).","topic":"t-cocomo","lec":8},{"id":"AI-3-17","src":"AI","paper":3,"wk":8,"n":17,"type":"mcq","diff":"Medium","text":"What is the primary goal of \"resource smoothing\" in project management?","opts":["To increase the total number of resources available to the project.","To ensure all activities start on their earliest possible date.","To create a more even and consistent demand for resources over time.","To identify the project's critical path."],"ans":[2],"exp":"Resource smoothing delays/splits non-critical activities so that demand is even and within availability.","topic":"t-resource","lec":37},{"id":"AI-3-18","src":"AI","paper":3,"wk":6,"n":18,"type":"mcq","diff":"Medium","text":"In PERT/CPM, when calculating the Earliest Start (ES) time for an activity that has multiple predecessors (a merge point), what rule is applied?","opts":["The ES is the average of the Earliest Finish (EF) times of all its predecessors.","The ES is the earliest (minimum) of the EF times of all its predecessors.","The ES is the latest (maximum) of the EF times of all its predecessors.","The ES is always set to zero."],"ans":[2],"exp":"Forward pass at a merge point: ES = the LATEST (maximum) EF of the predecessors.","topic":"t-cpm","lec":29},{"id":"AI-3-19","src":"AI","paper":3,"wk":7,"n":19,"type":"mcq","diff":"Medium","text":"According to Herzberg's Two-Factor Theory, what is the primary role of \"hygiene factors\" such as pay and company policy in employee motivation?","opts":["They are the main drivers of job satisfaction and high performance.","They have no impact on employee satisfaction or dissatisfaction.","Their absence causes dissatisfaction, but their presence does not actively motivate.","They are only important for employees at the self-actualization level."],"ans":[2],"exp":"Hygiene factors (pay, policy, conditions) prevent dissatisfaction but do not motivate.","topic":"t-people","lec":32},{"id":"AI-3-20","src":"AI","paper":3,"wk":9,"n":20,"type":"mcq","diff":"Medium","text":"A project has an Earned Value (EV) of $50,000, a Planned Value (PV) of $60,000, and an Actual Cost (AC) of $55,000. Based on these figures, what is the status of the project?","opts":["Ahead of schedule and under budget.","Behind schedule and over budget.","Ahead of schedule and over budget.","Behind schedule and under budget."],"ans":[1],"exp":"SV = 50k − 60k &lt; 0 (behind schedule); CV = 50k − 55k &lt; 0 (over budget).","topic":"t-eva","lec":44},{"id":"AI-3-21","src":"AI","paper":3,"wk":10,"n":21,"type":"mcq","diff":"Medium","text":"What is the primary advantage of using a restricted tendering process compared to an open tendering process for contractor selection?","opts":["It guarantees the lowest possible price due to maximum competition.","It is mandated by law for all government projects.","It reduces the evaluation time and effort by soliciting bids only from pre-selected suppliers.","It eliminates the need for a formal contract."],"ans":[2],"exp":"Restricted tendering: only invited suppliers bid; the customer can cut the list at any stage, so evaluation is cheaper and faster than open tendering.","topic":"t-contract","lec":48},{"id":"AI-3-22","src":"AI","paper":3,"wk":11,"n":22,"type":"mcq","diff":"Medium","text":"In the SEI CMM framework, what is the key characteristic that distinguishes a Level 3 (Defined) organization from a Level 2 (Repeatable) organization?","opts":["Level 3 uses quantitative quality goals, while Level 2 does not.","Level 3 has processes that are documented and standardized across the organization, while Level 2's processes are project-specific.","Level 3 relies on individual heroics, while Level 2 has basic project management.","Level 3 focuses on continuous process improvement, while Level 2 focuses on repeating success."],"ans":[1],"exp":"Level 2: basic project management, process may vary between projects. Level 3: defined, documented, organisation-wide standard process.","topic":"t-cmm","lec":54},{"id":"AI-3-23","src":"AI","paper":3,"wk":2,"n":23,"type":"mcq","diff":"Hard","text":"A project manager uses the Value-to-Cost (V/C) ratio to prioritize increments. Given the following functionalities and their customer-rated value (V) and developer-rated cost (C), which should be developed first? Profit Reports (V=9, C=2), Online Database (V=1, C=10), Ad Hoc Enquiry (V=5, C=5), Profit-Based Pay (V=9, C=1).","opts":["Profit Reports","Online Database","Ad Hoc Enquiry","Profit-Based Pay"],"ans":[3],"exp":"V/C: profit-based pay 9/1 = 9 (1st), profit reports 9/2 = 4.5, purchasing plans 2.25, ad hoc enquiry 1, online database 0.11.","topic":"t-proto","lec":7},{"id":"AI-3-24","src":"AI","paper":3,"wk":4,"n":24,"type":"mcq","diff":"Hard","text":"In the context of the Delphi estimation technique, what is the primary purpose of ensuring anonymity among experts during the estimation rounds?","opts":["To save time by avoiding lengthy group discussions.","To prevent a dominant personality from unduly influencing the group's estimates.","To make it easier for the coordinator to calculate the final average.","To allow experts to use different estimation formulas without conflict."],"ans":[1],"exp":"Anonymity in Delphi stops dominant personalities and group-think from biasing estimates.","topic":"t-esttech","lec":17},{"id":"AI-3-25","src":"AI","paper":3,"wk":4,"n":25,"type":"mcq","diff":"Hard","text":"A project is estimated using the Albrecht/IFPUG method. It has 50 user inputs, 40 user outputs, 35 inquiries, 6 internal files, and 4 external interfaces, all of average complexity. If the Total Degree of Influence (TDI) is calculated to be 42, what is the final Adjusted Function Point (AFP) count? (Use average weights: EI=4, EO=5, EQ=4, LIF=10, EIF=7).","opts":["628","672","618","661"],"ans":[1],"exp":"UFP = 50×4 + 40×5 + 35×4 + 6×10 + 4×7 = 628; VAF = 0.65 + 0.42 = 1.07; AFP = 628 × 1.07 ≈ 672.","topic":"t-fp","lec":20},{"id":"AI-3-26","src":"AI","paper":3,"wk":5,"n":26,"type":"mcq","diff":"Hard","text":"According to Putnam's estimation model, the relationship between effort (K) and development time (td) is K = C1 / td^4. If a project's schedule is compressed to half of its original planned time, by what factor will the total effort and cost increase?","opts":["2 times","4 times","8 times","16 times"],"ans":[3],"exp":"Putnam: (1/0.5)⁴ = 16.","topic":"t-staffing","lec":25},{"id":"AI-3-27","src":"AI","paper":3,"wk":7,"n":27,"type":"mcq","diff":"Hard","text":"A project manager needs to crash a project. The current critical path is A-B-D with a duration of 25 weeks. A parallel path, A-C-E, has a duration of 24 weeks. The costs to crash each task per week are: A=$100, B=$150, C=$80, D=$120. Which task should the manager crash first to reduce the project duration by one week?","opts":["Task A, because it is the cheapest on the critical path.","Task C, because it is the cheapest overall.","Task D, because it is on the critical path.","Tasks A and C must be crashed simultaneously."],"ans":[0],"exp":"A lies on both A-B-D (25) and A-C-E (24): crashing A by one week shortens both paths and is the cheapest critical activity ($100).","topic":"t-pert","lec":31},{"id":"AI-3-28","src":"AI","paper":3,"wk":12,"n":28,"type":"mcq","diff":"Hard","text":"What is the primary reason that the hardware \"bathtub curve\" of reliability, which includes burn-in, useful life, and wear-out phases, is not directly applicable to software?","opts":["Software is more complex than hardware.","Software failures are caused by design flaws (bugs), not physical wear and tear.","Software reliability cannot be measured, whereas hardware reliability can.","Hardware warranties cover the burn-in period, but software has no warranties."],"ans":[1],"exp":"Software does not wear out; failures come from design faults. Its failure rate falls as bugs are fixed and can rise with changes.","topic":"t-reliab","lec":58},{"id":"AI-3-29","src":"AI","paper":3,"wk":9,"n":29,"type":"mcq","diff":"Hard","text":"During a formal code inspection, which of the following error types is a primary target for discovery, as opposed to an error that is typically caught by a compiler?","opts":["A missing semicolon at the end of a statement.","Use of an uninitialized variable in a calculation.","An incorrectly spelled keyword like \"whle\" instead of \"while\".","A function call with the wrong number of arguments."],"ans":[1],"exp":"Inspection looks for common programmer mistakes (uninitialised variables, wrong operators, array bounds, parameter mismatch). The compiler catches syntax errors.","topic":"t-codereview","lec":41},{"id":"AI-3-30","src":"AI","paper":3,"wk":11,"n":30,"type":"mcq","diff":"Hard","text":"What is the core assumption of Quality Assurance (QA) that represents a fundamental shift from earlier Quality Control (QC) methods?","opts":["That testing every single product is the only way to ensure quality.","That a good, well-defined process, if followed rigorously, will inherently lead to quality products.","That statistical methods are not useful for monitoring product quality.","That defects should be identified and eliminated only after the product is fully manufactured."],"ans":[1],"exp":"QA premise: if an organisation's processes are good and followed rigorously, products are bound to be good.","topic":"t-quality","lec":51},{"id":"AI-4-1","src":"AI","paper":4,"wk":1,"n":1,"type":"mcq","diff":"Easy","text":"According to the lecture on project management standards, what does PMBOK stand for?","opts":["Project Management Baseline of Knowledge","Process Management Body of Knowledge","Project Management Body of Knowledge","Program Management Baseline of Knowledge"],"ans":[2],"exp":"PMBOK = Project Management Body of Knowledge (PMI, USA), knowledge-based and non-prescriptive; PRINCE2 (UK) is process-based.","topic":"t-pm","lec":4},{"id":"AI-4-2","src":"AI","paper":4,"wk":2,"n":2,"type":"mcq","diff":"Easy","text":"In Scrum, what is the term for a fixed-duration iteration, typically one month long, during which a potentially shippable product increment is developed?","opts":["Cycle","Sprint","Phase","Increment"],"ans":[1],"exp":"Sprint: the Scrum iteration, target duration one month.","topic":"t-agile","lec":10},{"id":"AI-4-3","src":"AI","paper":4,"wk":6,"n":3,"type":"mcq","diff":"Easy","text":"What is the primary purpose of a Work Breakdown Structure (WBS) in project scheduling?","opts":["To calculate the project's total cost","To assign resources to team members","To create a marketing plan for the product","To hierarchically decompose project work into smaller, manageable components"],"ans":[3],"exp":"WBS: hierarchical decomposition of work into manageable tasks; shows neither durations nor precedence.","topic":"t-wbs","lec":26},{"id":"AI-4-4","src":"AI","paper":4,"wk":3,"n":4,"type":"mcq","diff":"Easy","text":"In cost-benefit analysis, what does ROI stand for?","opts":["Rate of Interest","Return on Investment","Risk of Investment","Revenue of Initiative"],"ans":[1],"exp":"ROI = average annual profit / total investment × 100.","topic":"t-cba","lec":13},{"id":"AI-4-5","src":"AI","paper":4,"wk":7,"n":5,"type":"mcq","diff":"Easy","text":"What is the primary characteristic of a 'Functional Organization' structure?","opts":["Teams are formed for a single project and then disbanded","Employees report to multiple project managers simultaneously","Employees are grouped by specialized functions like design or testing","All decisions are made by consensus among team members"],"ans":[2],"exp":"Functional organisation: grouped by specialisation (analysts, designers, testers); pyramidal; common in military, police, hospitals.","topic":"t-org","lec":47},{"id":"AI-4-6","src":"AI","paper":4,"wk":9,"n":6,"type":"mcq","diff":"Easy","text":"What is the main goal of the 'Cleanroom Technique' in software development?","opts":["To test software in a sterile hardware environment","To prevent defects from entering the code in the first place","To write code that is easy for new developers to clean up","To ensure all developers have a clean and organized workspace"],"ans":[1],"exp":"Cleanroom: avoid defects by walkthroughs, inspection, formal verification; no execution-based testing by programmers.","topic":"t-codereview","lec":41},{"id":"AI-4-7","src":"AI","paper":4,"wk":2,"n":7,"type":"mcq","diff":"Easy","text":"What is the primary purpose of a feasibility study in the software development lifecycle?","opts":["To write the initial code for the project","To determine if a project is viable before committing significant resources","To train the new development team","To create the final user manual"],"ans":[1],"exp":"Feasibility: decide viability before committing major resources.","topic":"t-waterfall","lec":5},{"id":"AI-4-8","src":"AI","paper":4,"wk":4,"n":8,"type":"mcq","diff":"Easy","text":"According to the lecture, what is the most significant drawback of the 'Price to Win' estimation method?","opts":["It is too time-consuming to calculate","It requires extensive historical data","The estimated costs do not accurately reflect the actual work required","It can only be used for small projects"],"ans":[2],"exp":"Price to win: you win the contract but costs do not reflect the work; either the customer gets less or overpays.","topic":"t-esttech","lec":17},{"id":"AI-4-9","src":"AI","paper":4,"wk":10,"n":9,"type":"mcq","diff":"Easy","text":"What is the primary purpose of a Project Closure Report?","opts":["To request additional funding for the project","To assign new tasks to the project team","To document project outcomes, performance, and lessons learned for future projects","To market the newly completed software product"],"ans":[2],"exp":"Closure report: historical summary, survey results, performance data, final review findings, lessons learned and recommendations.","topic":"t-closeout","lec":50},{"id":"AI-4-10","src":"AI","paper":4,"wk":6,"n":10,"type":"mcq","diff":"Easy","text":"In PERT/CPM, what is the sequence of activities with zero slack that determines the minimum project duration called?","opts":["The
