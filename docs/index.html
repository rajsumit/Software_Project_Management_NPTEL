<title>SPM Exam Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>/* SPM Exam Lab — "project control room": paper planning board, navy ink, amber milestones, red critical path. */
:root{
  --bg:#F6F3EC; --surface:#FFFDF8; --surface2:#EFEADF; --ink:#1D2433; --muted:#5C6270; --line:#DCD3C2;
  --brand:#1F3A5F; --brand-ink:#FFFFFF; --hot:#F4B63E; --hot-ink:#3A2600; --good:#23774A; --bad:#C0392B; --warn:#9A5B00;
  --ch-v:#2F6DB5; --ch-i:#C8374B; --ch-d:#23855A; --ch-b:#7B4FBF; --ch-x:#0B7F86; --grid:#E5DDCD; --scope:#FFFCF4;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(29,36,51,.06),0 4px 14px rgba(29,36,51,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#191E28; --surface2:#212835; --ink:#E9E6DF; --muted:#A2A7B3; --line:#2D3543;
  --brand:#93B6EA; --brand-ink:#0F131A; --hot:#8C6612; --hot-ink:#FFEDC2; --good:#5BCB8B; --bad:#FF7D6D; --warn:#F0B75A;
  --ch-v:#6EA6F0; --ch-i:#FF7A8C; --ch-d:#4FD08F; --ch-b:#B892FF; --ch-x:#4CCFD8; --grid:#262E3C; --scope:#151A23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#191E28; --surface2:#212835; --ink:#E9E6DF; --muted:#A2A7B3; --line:#2D3543;
  --brand:#93B6EA; --brand-ink:#0F131A; --hot:#8C6612; --hot-ink:#FFEDC2; --good:#5BCB8B; --bad:#FF7D6D; --warn:#F0B75A;
  --ch-v:#6EA6F0; --ch-i:#FF7A8C; --ch-d:#4FD08F; --ch-b:#B892FF; --ch-x:#4CCFD8; --grid:#262E3C; --scope:#151A23; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--f-body);margin:0;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin-top:2.2rem;margin-bottom:.6rem}
h3{font-size:1.15rem;font-weight:700;margin-top:1.4rem;margin-bottom:.4rem}
p{margin:.55rem 0}
a{color:var(--brand)}
code,.mono{font-family:var(--f-mono);font-size:.9em}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px 40px;position:relative}
.main{overflow-y:auto;scroll-behavior:smooth;min-width:0}
.page{max-width:960px;margin:0 auto;padding-inline:20px;padding-block:20px 90px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{font-family:var(--f-display);font-size:1.05rem;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:.78rem}
.logo{width:34px;height:34px;flex:none}
.navmod{font:700 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 8px 4px}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer;line-height:1.25}
.navitem:hover{background:var(--surface2)}
.navitem[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.navitem .wk{font:600 .7rem var(--f-mono);color:var(--muted);min-width:2.2em}
.navitem[aria-current="page"] .wk{color:inherit;opacity:.8}
.navitem .stars{margin-left:auto;font-size:.7rem;letter-spacing:1px;color:var(--warn)}
.navitem[aria-current="page"] .stars{color:var(--hot)}
.navitem .done{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.topbar{display:none}
.tools{display:flex;gap:8px;align-items:center;padding:8px 4px 4px}
.btn{font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:focus-visible,.navitem:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ch-v);outline-offset:2px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem}
.crumb{font:600 .78rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pill{display:inline-block;font:700 .72rem var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);letter-spacing:.04em}
.pill.hot{background:var(--hot);color:var(--hot-ink);border-color:transparent}
.lede{font-size:1.12rem;color:var(--muted);max-width:68ch}
mark.hot{background:var(--hot);color:var(--hot-ink);padding:0 .2em;border-radius:3px;box-decoration-break:clone}
mark.hot[data-q]::after{content:attr(data-q);font:700 .62rem var(--f-mono);vertical-align:super;margin-left:3px;opacity:.75}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);margin:14px 0}
.card h3:first-child,.card h4:first-child{margin-top:0}
.must{border-left:5px solid var(--hot);background:var(--surface);border-radius:var(--r);padding:12px 16px;margin:14px 0;box-shadow:var(--shadow);border:1px solid var(--line);border-left-width:5px;border-left-color:var(--hot)}
.must h4{font:700 .75rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.must ul{margin:0;padding-left:1.1em}.must li{margin:.25rem 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.formula{font-family:var(--f-mono);font-size:.95rem;background:var(--surface2);border-radius:8px;padding:8px 12px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.formula b{color:var(--ch-v);font-weight:700}
.formula .tag{font:700 .65rem var(--f-mono);background:var(--hot);color:var(--hot-ink);padding:1px 6px;border-radius:99px;margin-left:8px;white-space:nowrap}
.tblwrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--surface2);font:700 .8rem var(--f-mono);letter-spacing:.03em}
.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:16px 0;overflow:hidden;box-shadow:var(--shadow)}
.lab>header{display:flex;gap:10px;align-items:center;padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--line);font:700 .78rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.lab>header i{width:9px;height:9px;border-radius:50%;background:var(--ch-d)}
.lab .body{padding:12px 14px;display:grid;gap:12px}
.lab .cap{font-size:.9rem;color:var(--muted)}
canvas.scope{width:100%;display:block;background:var(--scope);border:1px solid var(--line);border-radius:8px}
.ctl{display:grid;grid-template-columns:minmax(110px,170px) 1fr minmax(64px,auto);gap:10px;align-items:center;font-size:.92rem}
.ctl label{font-weight:600}
.ctl output{font:600 .88rem var(--f-mono);text-align:right}
input[type=range]{width:100%;accent-color:var(--ch-v)}
.ctls{display:grid;gap:6px 22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:600 .78rem var(--f-mono)}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.readout div{background:var(--surface2);border-radius:8px;padding:6px 10px}
.readout small{display:block;color:var(--muted);font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.readout b{font:700 1.1rem var(--f-mono)}
.calc{display:grid;gap:10px}
.calc .inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.calc label{display:grid;gap:3px;font:600 .75rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.calc input,.calc select,.sel{font:600 1rem var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin:12px 0}
.q .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.q .qt{font-weight:600}
.q .opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;background:var(--bg)}
.q .opt:hover{border-color:var(--ch-v)}
.q .opt.sel{border-color:var(--ch-v);box-shadow:inset 0 0 0 1px var(--ch-v)}
.q .opt.right{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:var(--good)}
.q .opt.wrong{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:var(--bad)}
.q .opt input{margin-top:5px}
.q .exp{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface2);font-size:.95rem}
.q .exp b.k{color:var(--good)}
.q img{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:#fff}
.q .nat{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .nat input{font:600 1rem var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:150px}
.verdict{font:700 .8rem var(--f-mono);letter-spacing:.04em}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.heat{display:grid;gap:6px}
.heatrow{display:grid;grid-template-columns:minmax(120px,230px) 1fr 3.2em;gap:10px;align-items:center;font-size:.92rem}
.heatrow .bar{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.heatrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ch-v),var(--ch-i));border-radius:99px}
.heatrow button{background:none;border:0;text-align:left;color:var(--brand);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;margin:8px 0}
.steps li::before{content:counter(s);font:700 .9rem var(--f-mono);width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.three{width:100%;aspect-ratio:16/10;max-height:460px;border-radius:8px;background:var(--scope);border:1px solid var(--line);position:relative;touch-action:none;cursor:grab}
.three canvas{width:100%!important;height:100%!important;display:block;border-radius:8px}
.three .hint{position:absolute;left:10px;bottom:8px;font:600 .7rem var(--f-mono);color:var(--muted);pointer-events:none}
.three .label3{position:absolute;right:10px;top:8px;font:700 .8rem var(--f-mono);background:var(--surface);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:7px 12px;font:600 .85rem var(--f-body);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
svg text{font-family:var(--f-mono)}
.svgfig{width:100%;height:auto;display:block}
.svgfig .ln{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svgfig .on{stroke:var(--ch-i);stroke-width:3.2}
.svgfig .box{fill:var(--surface2);stroke:var(--ink);stroke-width:1.6}
.svgfig .tx{fill:var(--ink);font-size:12px}
.svgfig .tx2{fill:var(--muted);font-size:10.5px}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:10px 0;background:var(--surface)}
summary{cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;font-weight:600;z-index:60}
.nextprev{display:flex;gap:10px;justify-content:space-between;margin-top:34px;flex-wrap:wrap}
.legendbox{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hide-m{display:initial}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar b{font-family:var(--f-display);flex:1;font-size:1rem}
  .rail{position:fixed;inset:0 auto 0 0;width:min(86vw,340px);z-index:50;transform:translateX(-102%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .page{padding-inline:16px}
  .ctl{grid-template-columns:1fr auto}.ctl input[type=range]{grid-column:1/-1;grid-row:2}
  h1{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* mock exam */
body.exam-on .rail,body.exam-on .topbar{display:none}body.exam-on .app{grid-template-columns:minmax(0,1fr)}body.exam-on .page{max-width:1200px}
.exbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--brand);color:var(--brand-ink);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.exname{font:800 .95rem var(--f-display)}.excnt{font:600 .85rem var(--f-mono);opacity:.85}.extl{margin-left:auto;font:600 .85rem var(--f-mono)}
.extimer{font:800 1.25rem var(--f-mono);font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--ink)}.extimer.low{background:var(--bad);color:#fff}
.exwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:900px){.exwrap{grid-template-columns:minmax(0,1fr)}}
.exq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.exq .qt{font-size:1.06rem;margin:10px 0}.exq .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:7px 0;cursor:pointer}
.exq .opt.sel{border-color:var(--ch-v);box-shadow:inset 0 0 0 1px var(--ch-v);background:color-mix(in srgb,var(--ch-v) 8%,transparent)}
.exfig{max-width:100%;border-radius:8px;background:#fff}
.exnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.exnav .mk{border-color:var(--ch-b);color:var(--ch-b)}
.expal{position:sticky;top:70px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.pallegend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:.78rem;margin-bottom:10px}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pq{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:7px;border:1px solid var(--line);font:700 .8rem var(--f-mono);background:var(--surface2);color:var(--ink);cursor:pointer;position:relative}
.palgrid .pq{height:36px}
.pq.a{background:var(--good);color:#fff;border-color:var(--good)}.pq.na{background:var(--bad);color:#fff;border-color:var(--bad)}.pq.m{background:var(--ch-b);color:#fff;border-color:var(--ch-b)}
.pq.am{background:var(--ch-b);color:#fff;border-color:var(--ch-b)}.pq.am::after{content:'';position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%;background:var(--good);border:1px solid #fff}
.pq.cur{outline:3px solid var(--hot);outline-offset:1px}
.tchips{display:flex;flex-wrap:wrap;gap:8px}.tchip{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit;max-width:100%}
.tchip small{color:var(--muted);font:600 .74rem var(--f-mono)}.tchip:hover{border-color:var(--brand)}
.q.rv.ok{border-left:5px solid var(--good)}.q.rv.no{border-left:5px solid var(--bad)}.q.rv.bl{border-left:5px solid var(--muted)}
.rvopts{margin:.3rem 0 .4rem;padding-left:1.6rem}.rvopts li{padding:2px 4px;border-radius:5px}.rvopts li.k{background:color-mix(in srgb,var(--good) 16%,transparent);font-weight:600}.rvopts li.y:not(.k){background:color-mix(in srgb,var(--bad) 14%,transparent);text-decoration:line-through}
.rvans{font-size:.95rem;margin:.3rem 0}.dx{font-size:.92rem;padding:5px 10px;border-radius:6px;margin:4px 0}.dx.silly{background:color-mix(in srgb,var(--warn) 14%,transparent)}.dx.gap{background:color-mix(in srgb,var(--bad) 10%,transparent)}.dx.blank{background:var(--surface2)}
/* revision sheet */
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:14px 0;box-shadow:var(--shadow)}
.rev.done{opacity:.72}.rev header{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.rev header h2{margin:0;font-size:1.2rem;flex:1 1 260px}
.revgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:8px}@media (max-width:900px){.revgrid{grid-template-columns:minmax(0,1fr)}}
.rev h4{font:700 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:.4rem 0}
.rev ul{margin:0;padding-left:1.1rem}.rev li{margin:.25rem 0;font-size:.96rem}
.revt{width:100%;border-collapse:collapse;font-size:.88rem}.revt td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.revt td.f{font-family:var(--f-mono);font-size:.84rem}.revt td.c{color:var(--muted);font-size:.82rem}
.trap{margin-top:10px;padding:7px 10px;border-radius:7px;background:color-mix(in srgb,var(--bad) 9%,transparent);font-size:.92rem}
.palsec{grid-column:1/-1;font:700 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.qscore{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:4;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0;box-shadow:var(--shadow)}
.qscore small{display:block;color:var(--muted);font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em}.qscore b{font:800 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
/* ===== SPM additions ===== */
body{font-size:16.5px}
@media (min-width:901px){.app{grid-template-columns:300px minmax(0,1fr)}body.exam-on .app{grid-template-columns:minmax(0,1fr)}}
.brand b{letter-spacing:-.01em}
h1{letter-spacing:-.025em}
.ivtxt{background:var(--surface2);border-left:4px solid var(--ch-i);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:.97rem;min-height:2.4em}
label.mini{display:inline-flex;align-items:center;gap:6px;font:600 .85rem var(--f-body)}label.mini .sel{width:auto}
.card.easy ul{margin:.4rem 0 .2rem;padding-left:1.2rem}.card.easy li{margin:.18rem 0}

<script>/* ---- qbank.js ---- */
/* Question bank: 2026 assignments (official solutions), 2019 assignments (accepted answers), NPTEL AI mock papers 1-5 */
window.QBANK=[{"id":"A26-1-1","src":"A26","wk":1,"n":1,"type":"msq","text":"Which of the following can be considered a job (routine operation) rather than a project?","opts":["Processing monthly employee salaries","Developing a new mobile application","Manufacturing cars on an assembly line","Organizing the Olympic Games","Handling daily customer support requests"],"ans":[0,2,4],"exp":"Processing monthly salaries, manufacturing cars on an assembly line, and handling daily customer support requests are all repetitive, ongoing operations with well-defined procedures. They lack the temporary, unique, and goal-oriented nature of projects, which have a clear start and end, such as developing a new app or organizing the Olympics.","topic":"t-intro"},{"id":"A26-1-2","src":"A26","wk":1,"n":2,"type":"msq","text":"Software projects are generally considered harder to manage than manufacturing projects. Which of the following are possible reasons for this?","opts":["Software products are intangible","Software development involves highly skilled intellectual work","Software projects are always larger than manufacturing projects","Requirement changes can have significant effects on software projects","Software projects require people management"],"ans":[0,1,3],"exp":"Software products are intangible, making progress difficult to measure visually, and development relies on highly skilled intellectual work, which is less predictable than manufacturing tasks. Additionally, requirement changes can have a significant ripple effect on software projects due to their malleable nature, whereas manufacturing changes are often costlier to implement later. People management, while important, is required in all projects and is not a unique reason for software's added difficulty.","topic":"t-intro"},{"id":"A26-1-3","src":"A26","wk":1,"n":3,"type":"msq","text":"Which of the following statements about software complexity are true?","opts":["Professional developers usually make any software that they develop as complex as possible","Making changes to software for maintenance purposes does not affect its complexity","Increased software complexity generally makes maintenance more difficult","Repeated modifications can increase software complexity","Software complexity automatically decreases as software ages","Higher software complexity can increase the likelihood of introducing defects during maintenance"],"ans":[2,3,5],"exp":"Increased software complexity makes the code harder to understand and modify, directly increasing maintenance difficulty. Repeated modifications over time tend to add structural clutter (often called software entropy), which raises complexity, and this higher complexity increases the chance of introducing new defects when changes are made. Professional developers aim for simplicity, maintenance changes do affect complexity, and complexity does not automatically decrease with age—it typically grows unless actively refactored.","topic":"t-intro"},{"id":"A26-1-4","src":"A26","wk":1,"n":4,"type":"msq","text":"Which of the following statements regarding project stakeholders are true?","opts":["Sponsors are not considered stakeholders because they only provide resources for the project","A stakeholder can be an individual or an organization","Stakeholders may influence project execution and outcomes","Customers are stakeholders because they use the project's product or service","Only project team members are the stakeholders of the project"],"ans":[1,2,3],"exp":"Stakeholders include any individual or organization that is actively involved in or affected by the project, which covers sponsors, customers, users, and the project team. They can influence project execution and outcomes, and customers are indeed stakeholders because they use or are impacted by the final product. Sponsors are also key stakeholders despite providing resources, and limiting stakeholders to just the project team is incorrect.","topic":"t-intro"},{"id":"A26-1-5","src":"A26","wk":1,"n":5,"type":"msq","text":"Which of the following factors can negatively affect the success of a software project?","opts":["Frequent changes in business needs","Inexperienced project team members","Effective project management","Rapid changes in the chosen technology","Poor understanding of customer expectations"],"ans":[0,1,3,4],"exp":"Frequent changes in business needs, inexperienced team members, rapid technology shifts, and poor understanding of customer expectations all introduce uncertainty, rework, and misalignment, which directly harm project success. In contrast, effective project management is a positive factor that helps mitigate risks and keep the project on track.","topic":"t-intro"},{"id":"A26-1-6","src":"A26","wk":1,"n":6,"type":"msq","text":"Which of the following statements is correct regarding various types of software projects?","opts":["Packaged software is rarely available for the vertical market","Packaged software is intended for multiple customers","Custom software is always developed from scratch","Custom software is developed to satisfy specific user requirements","Packaged software is always cheaper than custom software"],"ans":[1,3],"exp":"Packaged software is built for multiple customers with common needs, while custom software is tailored to satisfy specific user requirements for a particular organization. Custom software is not always developed from scratch (it can reuse components), and packaged software is not always cheaper—total costs depend on licensing, customization, and fit. Vertical-market packaged software is also widely available.","topic":"t-intro"},{"id":"A26-1-7","src":"A26","wk":1,"n":7,"type":"msq","text":"Which of the following is not considered to be Embedded Software?","opts":["TV Remote Software","Nuclear Plant Control Software","Patient Management Software for a hospital","Robot Control Software","Automobile Control Software"],"ans":[2],"exp":"Patient Management Software for a hospital runs on general-purpose computers or servers and is used for administrative and clinical data management, making it an information system rather than embedded software. In contrast, TV remote software, nuclear plant control, robot control, and automobile control software all run on specialized hardware (microcontrollers or processors) within larger devices to perform specific control functions, which is the defining characteristic of embedded software.","topic":"t-intro"},{"id":"A26-1-8","src":"A26","wk":1,"n":8,"type":"msq","text":"Which of the following statements regarding project management activities are correct?","opts":["Planning is performed during execution","Feasibility analysis generally precedes project planning","Project execution involves carrying out planned activities","Feasibility study and project execution are identical activities","A project manager may be involved in all three phases"],"ans":[1,2,4],"exp":"Feasibility analysis is conducted before detailed project planning to assess viability, and project execution is indeed the phase where planned activities are carried out. A project manager is typically involved across feasibility, planning, and execution phases. Planning is primarily done before execution (though some iterative planning may occur), and feasibility study and execution are completely distinct activities.","topic":"t-pm"},{"id":"A26-1-9","src":"A26","wk":1,"n":9,"type":"msq","text":"Which of the following activities are typically associated with project planning?","opts":["Formally accepting project deliverables","Developing schedules for project activities","Conducting lessons-learned reviews","Allocating project resources","Releasing project resources after completion"],"ans":[1,3],"exp":"Developing schedules for project activities and allocating project resources are core project planning activities. Formally accepting deliverables, conducting lessons-learned reviews, and releasing resources all occur during project closing or execution phases, not during planning.","topic":"t-pm"},{"id":"A26-1-10","src":"A26","wk":1,"n":10,"type":"msq","text":"Which of the following are benefits of defining milestones in a software project?","opts":["Automatic generation of source code","Elimination of the need for project planning","Effective addressing of manpower turnover","Improved progress tracking","Better visibility into project status"],"ans":[3,4],"exp":"Defining milestones improves progress tracking by providing clear checkpoints to measure achievement against the schedule, and it gives better visibility into project status for stakeholders. Milestones do not generate code, eliminate the need for planning, or directly address manpower turnover—they are management tools for monitoring and communication.","topic":"t-pm"},{"id":"A26-2-1","src":"A26","wk":2,"n":1,"type":"msq","text":"Which of the following statements regarding the Waterfall model are correct?","opts":["Integration activities are distributed evenly throughout development","Customer feedback is typically obtained through frequent prototypes","Requirement changes after project initiation can be difficult to accommodate","The model may create a false sense of project progress","Working software may not be available until late in the project"],"ans":[2,3,4],"exp":"In the Waterfall model, requirements are fixed early, making late changes difficult and costly to accommodate. Since working software is delivered only at the end, progress is often measured by documents and completed phases, which can create a false sense of progress, and stakeholders do not see executable software until late in the project. Integration also happens at the end (not evenly distributed), and prototypes are not a standard part of Waterfall.","topic":"t-waterfall"},{"id":"A26-2-2","src":"A26","wk":2,"n":2,"type":"msq","text":"Which of the following pairs are correctly matched in the V-Model of software development?","opts":["Requirements Specification ↔ System Testing","High-Level Design ↔ Integration Testing","Detailed Design ↔ Unit Testing","Project Planning ↔ Unit Testing","Coding ↔ System Testing"],"ans":[0,1,2],"exp":"In the V-Model, each development phase on the left has a corresponding testing phase on the right: Requirements Specification maps to System Testing, High-Level Design maps to Integration Testing, and Detailed Design maps to Unit Testing. Project Planning has no direct testing counterpart, and Coding corresponds to Unit Testing—not System Testing.","topic":"t-waterfall"},{"id":"A26-2-3","src":"A26","wk":2,"n":3,"type":"msq","text":"Which of the following are commonly cited reasons for using prototyping?","opts":["Guaranteed reduction in project duration","Requirements are only partially known","Improved communication between users and developers","Elimination of all testing activities","Improved user involvement"],"ans":[1,2,4],"exp":"Prototyping is commonly used when requirements are unclear or only partially known, as it helps clarify them through tangible feedback. It also improves communication between users and developers by giving users something concrete to interact with, and it actively involves users in the refinement process. However, prototyping does not guarantee shorter project duration (it can add time) and does not eliminate the need for testing.","topic":"t-proto"},{"id":"A26-2-4","src":"A26","wk":2,"n":4,"type":"msq","text":"Which of the following are major objectives of the RAD model?","opts":["Reduce software development time","Reduce software development cost","Delay requirement changes until after testing","Accommodate change requests as early as possible","Eliminate the need for user involvement"],"ans":[0,1,3],"exp":"The Rapid Application Development (RAD) model aims to reduce development time and cost through iterative prototyping, reusable components, and accelerated cycles. It also emphasizes accommodating change requests as early as possible, keeping the system flexible to user feedback. RAD does not delay changes until after testing—it welcomes early changes—and it relies heavily on continuous user involvement, not eliminates it.","topic":"t-proto"},{"id":"A26-2-5","src":"A26","wk":2,"n":5,"type":"msq","text":"Which of the following statements about refactoring in the agile model are correct?","opts":["Refactoring requires changing user-visible behavior","Refactoring improves internal code structure","Refactoring should preserve external behavior","Refactoring is intended to add major new functionality","Refactoring can improve maintainability"],"ans":[1,2,4],"exp":"Refactoring improves the internal structure of the code without altering its external behavior, which preserves functionality while making the system cleaner and easier to maintain. It is not meant to add new features or change what the user sees—those are separate development activities.","topic":"t-agile"},{"id":"A26-2-6","src":"A26","wk":2,"n":6,"type":"msq","text":"Which of the following are important practices in the XP model of software development?","opts":["Frequent integration instead of end-of-project integration","Ongoing refactoring and design improvement","Strict requirement freeze before development starts","Greater emphasis on feedback and adaptation","Testing only after implementation is complete"],"ans":[0,1,3],"exp":"Extreme Programming (XP) emphasizes frequent integration (often multiple times a day), continuous refactoring and design improvement to keep code clean, and strong feedback and adaptation through practices like test-driven development and customer involvement. XP does not freeze requirements early—it welcomes changing requirements—and it promotes testing before or alongside implementation, not only after.","topic":"t-agile"},{"id":"A26-2-7","src":"A26","wk":2,"n":7,"type":"msq","text":"Which of the following statements are FALSE regarding Scrum Sprints?","opts":["A Sprint is a time-boxed development cycle","Software increments can be designed, coded, and tested within a Sprint","Sprint duration is exactly one month","Changes are normally entertained throughout the Sprint without restriction","Scrum projects progress through a series of Sprints"],"ans":[2,3],"exp":"Sprint duration is not fixed at exactly one month—it is typically 1 to 4 weeks, and the team chooses the length. Also, once a Sprint begins, the Sprint Backlog is fixed, and changes are not entertained without restriction; any change requires canceling the Sprint or deferring it to the next Sprint. The other statements (a, b, and e) are true regarding Scrum Sprints. <br>Lecture slides: sprint 'target duration is one month' (not exactly) and 'no changes entertained during a sprint'.","topic":"t-agile"},{"id":"A26-2-8","src":"A26","wk":2,"n":8,"type":"msq","text":"Which of the following statements regarding the Product Backlog are correct?","opts":["It contains only completed tasks","It contains a list of desired work for the project","It may contain both story-based and task-based work items","It is prioritized by the Product Owner","It cannot be modified once the project starts"],"ans":[1,2,3],"exp":"The Product Backlog contains a list of all desired work for the project, including user stories, technical tasks, and bug fixes, and it is continuously prioritized by the Product Owner to maximize value. It is not limited to completed tasks—those are removed or marked done—and it is dynamic, meaning it can be refined, reprioritized, or updated throughout the project, not frozen at the start.","topic":"t-agile"},{"id":"A26-2-9","src":"A26","wk":2,"n":9,"type":"msq","text":"Which of the following are typically represented in a Sprint Burn Down Chart?","opts":["Customer satisfaction ratings","Remaining effort or hours","Progress across Sprint days","Number of employees in the organization","Work remaining until Sprint completion"],"ans":[1,2,4],"exp":"A Sprint Burndown Chart tracks the remaining effort (e.g., hours or story points) across the days of the Sprint, showing how much work is left until completion. It does not display customer satisfaction, organizational headcount, or any metric outside the Sprint's work progress.","topic":"t-agile"},{"id":"A26-2-10","src":"A26","wk":2,"n":10,"type":"msq","text":"Which of the following statements about Product Backlog prioritization are correct?","opts":["Backlog items are typically ordered according to priority","The Product Owner is responsible for backlog prioritization","Prioritization helps determine what work should be addressed first","All backlog items must have equal priority","Priorities cannot change during a project"],"ans":[0,1,2],"exp":"The Product Backlog is an ordered list where items are ranked by priority, and the Product Owner is solely responsible for this prioritization to ensure the team works on the most valuable items first. Prioritization directly guides the sequence of development, but items do not have equal priority—they vary in importance—and priorities can and do change frequently based on feedback, market conditions, or business needs.","topic":"t-agile"},{"id":"A26-3-1","src":"A26","wk":3,"n":1,"type":"msq","text":"Which of the followings is an example of development cost?","opts":["Salary to staffs","Hardware cost","Recruitment cost","Staff training cost","Operational cost"],"ans":[0],"exp":"Salaries of developers, testers, and other technical staff directly involved in building the product are considered direct development costs. Hardware used for development can sometimes be included, but it is often classified as infrastructure; recruitment and training are overheads, and operational costs occur after deployment.","topic":"t-bizcase"},{"id":"A26-3-2","src":"A26","wk":3,"n":2,"type":"msq","text":"Which element of Project Portfolio Management (PPM) is responsible for determining the scope of the portfolio, such as whether it should include all organizational projects or only projects from a specific domain (e.g., Healthcare Projects)?","opts":["portfolio definition","portfolio management","portfolio optimization","portfolio deletion","portfolio creation"],"ans":[0],"exp":"Portfolio definition is the PPM element responsible for establishing the portfolio's purpose, boundaries, and selection criteria—including deciding which types of projects (e.g., all organizational projects or only healthcare projects) are included. Portfolio management, optimization, deletion, and creation are related but focus on ongoing governance, value maximization, removal, or establishment, rather than defining scope.","topic":"t-bizcase"},{"id":"A26-3-3","src":"A26","wk":3,"n":3,"type":"mcq","text":"Which one of the following is generally classified as an indirect cost in a software project?","opts":["Insurance","Development cost","setup cost","operational cost","Hardware procurement cost"],"ans":[0],"exp":"Insurance is generally classified as an indirect cost (overhead) because it supports overall business operations and cannot be traced directly to a specific project. Development costs, setup costs, operational costs, and hardware procurement are typically treated as direct costs tied to specific project activities.","topic":"t-bizcase"},{"id":"A26-3-4","src":"A26","wk":3,"n":4,"type":"mcq","text":"Which one of the followings is an example of a variable cost?","opts":["Cost of computer forms according to the amount of processing","Straight-line depreciation of hardware","exempt employee salaries","insurance","Annual software license fee paid at a fixed rate"],"ans":[0],"exp":"The cost of computer forms varies directly with the amount of processing activity—more processing means more forms consumed, making it a true variable cost. In contrast, straight-line depreciation, exempt salaries, insurance, and fixed-rate software license fees remain constant regardless of usage volume, so they are fixed costs.","topic":"t-bizcase"},{"id":"A26-3-5","src":"A26","wk":3,"n":5,"type":"mcq","text":"In break-even analysis, return period is the period when","opts":["the candidate system provides greater benefit than the old one","the candidate system provides less benefit than the old one","the candidate system provides equal benefit as the old one","the candidate system does not provide any benefit","the old system does not provide any benefit"],"ans":[0],"exp":"The return period is defined as the time when the candidate system provides greater benefit than the old one — that is, the point at which the investment has not just broken even, but actually started delivering net positive advantage.","topic":"t-cba"},{"id":"A26-3-6","src":"A26","wk":3,"n":6,"type":"mcq","text":"What will be the ROI for the following project details?<div class=\"tblwrap\"><table class=\"mini\"><tr><th>Year</th><th>Cash flow, project B (Rs.)</th></tr><tr><td>0</td><td>−1,000,000</td></tr><tr><td>1</td><td>200,000</td></tr><tr><td>2</td><td>200,000</td></tr><tr><td>3</td><td>200,000</td></tr><tr><td>4</td><td>200,000</td></tr><tr><td>5</td><td>300,000</td></tr></table></div>","opts":["2%","2.5%","5%","10%","10.5%","12%","12.5%"],"ans":[0],"exp":"Total net profit = Rs. 100,000 Project duration = 5 years Average annual net profit = 100,000 / 5 = Rs. 20,000 Average annual ROI = (20,000 / 1,000,000) × 100 = 2%","topic":"t-cba"},{"id":"A26-3-7","src":"A26","wk":3,"n":7,"type":"msq","text":"In which of the following risk evaluation methods, it is required to construct a project risk matrix?","opts":["Risk identification and ranking","Risk and net present value","Cost-Benefit Analysis","Risk profile analysis","Using decision trees"],"ans":[0],"exp":"A project risk matrix (probability-impact matrix) is constructed during risk identification and ranking to visually prioritize risks based on their likelihood and potential impact. This helps determine which risks need immediate attention. Other methods like NPV analysis, cost-benefit analysis, risk profile analysis, or decision trees do not require constructing a risk matrix as their primary tool.","topic":"t-riskeval"},{"id":"A26-3-8","src":"A26","wk":3,"n":8,"type":"msq","text":"In Cost-Benefit Analysis method for risk evaluation, it is required","opts":["to categorize the projects as high, medium or low risk projects using a scoring method and assign an appropriate risk premium for each category","to evaluate whether the risk is important and, decide on a suitable course of action","to construct risk profiles using sensitive analysis","to construct a project risk matrix","to consider each possible outcome and estimate the probability of its occurring and the corresponding value of the outcome"],"ans":[4],"exp":"In Cost-Benefit Analysis (CBA) for risk evaluation, the standard approach is to consider each possible outcome, estimate its probability of occurrence, and assign a corresponding monetary value to it. This allows calculation of Expected Monetary Value (EMV), which adjusts the benefits and costs for risk. Constructing risk profiles, risk matrices, or categorizing projects by risk premium are associated with other risk techniques, not the core of CBA.","topic":"t-riskeval"},{"id":"A26-3-9","src":"A26","wk":3,"n":9,"type":"msq","text":"Innovative partnerships contain the projects","opts":["that an organization undertakes within a particular planning cycle","implementing a single strategy","performing the activities of identifying common infrastructure and its implementation and maintenance","involved in developing new innovative products based on some research","based on collaboration by different organizations"],"ans":[4],"exp":"Innovative partnerships are defined by collaboration between different organizations—such as companies, research institutions, or universities—to jointly develop new products, share risks, and combine resources and expertise. While option (d) mentions developing innovative products, it lacks the essential element of cross-organizational collaboration, which is the defining feature of innovative partnerships.","topic":"t-programme"},{"id":"A26-3-10","src":"A26","wk":3,"n":10,"type":"msq","text":"Which of the following statements is NOT generally true about a programme manager managing multiple concurrent projects?","opts":["They are responsible for coordinating several projects at the same time","They typically maintain impersonal relationships with skilled resources","They seek to minimize the overall demand for resources across projects","They often view projects as having distinct objectives and characteristics","They strive to optimize the utilization of resources across concurrent projects"],"ans":[1],"exp":"Programme managers managing multiple concurrent projects generally build strong, collaborative, and personal relationships with skilled resources to secure their commitment, motivation, and availability—not impersonal ones. The other statements (a, c, d, and e) are generally true: they coordinate multiple projects, seek to minimize resource demand, view projects as distinct, and optimize resource utilization across the portfolio. Thus, (b) is the statement that is NOT generally true. <br><b>Watch out:</b> in the textbook table (Hughes, Cotterell & Mall), the programme manager has <i>personal</i> relationships with skilled resources, <i>optimises</i> resource use and sees projects as <i>similar</i>; 'minimise demand' and 'projects as unique' are project-manager traits. The official key marks only (b); if the exam asks this as an MSQ, (c) and (d) are also project-manager traits.","topic":"t-programme"},{"id":"A26-4-1","src":"A26","wk":4,"n":1,"type":"mcq","text":"How many hours is a person month?","opts":["122","132","142","152","162","172","720"],"ans":[3],"exp":"A person-month is a unit of effort representing the work done by one person in one month. COCOMO II and many project management standards assume 152 hours per person-month (based on 19 working days × 8 hours/day).","topic":"t-estbasics"},{"id":"A26-4-2","src":"A26","wk":4,"n":2,"type":"msq","text":"Which of the following software effort estimation methods is most suitable when an existing software system is being modified or enhanced?","opts":["Parametric Models","Expert Judgment Technique","Analogy-Based Method","Price-to-Win Method","Similarity-Based Method"],"ans":[2],"exp":"When modifying or enhancing an existing system, the most suitable estimation method is one that compares the proposed changes to similar modifications made previously in the same system or in comparable projects. The Analogy-Based Method does exactly that — it uses historical data from past, similar work to estimate effort for the new changes.","topic":"t-esttech"},{"id":"A26-4-3","src":"A26","wk":4,"n":3,"type":"mcq","text":"Which one of the following is a key advantage of the Delphi estimation technique compared to estimation by a single expert?","opts":["It is largely free from the bias of any individual expert","It always produces a quantitative estimate","It explicitly accounts for project-specific peculiarities","It considers that different system components may have different complexities","It requires significantly less time and effort than expert estimation"],"ans":[0],"exp":"The Delphi estimation technique (including Wideband Delphi) involves multiple experts providing anonymous estimates in iterative rounds, with feedback and revision between rounds. Its key advantage over a single expert is that it reduces individual bias, groupthink, and the undue influence of dominant personalities, leading to a more balanced and reliable estimate.","topic":"t-esttech"},{"id":"A26-4-4","src":"A26","wk":4,"n":4,"type":"mcq","text":"Which one of the followings is NOT a limitation of algorithmic estimation models?","opts":["They lack effective mechanisms to account for exceptional situations, such as outstanding teamwork or an unusually good match between skills and tasks","They can be calibrated using data from past projects to improve estimation accuracy","Inaccurate size estimates or cost-driver ratings can lead to unreliable effort estimates","Some important factors, such as experience and team cohesion, are difficult to quantify accurately","They may not adequately capture qualitative aspects of the development environment"],"ans":[1],"exp":"It is actually an advantage or feature of algorithmic models. Calibration improves accuracy, which is a strength, not a drawback.","topic":"t-esttech"},{"id":"A26-4-5","src":"A26","wk":4,"n":5,"type":"mcq","text":"Consider a transaction project of 90,000 lines of code. Productivity is about 500 SLOC/person- month. What will be the effort required to develop the project?","opts":["60 person-month","90 person-month","120 person-month","180 person-month","240 person-month","300 person-month","500 person-month"],"ans":[3],"exp":"Effort = size / productivity = 90,000 SLOC ÷ 500 SLOC per person-month = 180 person-months.","topic":"t-esttech"},{"id":"A26-4-6","src":"A26","wk":4,"n":6,"type":"mcq","text":"Which one of the followings is NOT true regarding function points?","opts":["independent of the language, tools, or methodologies used for implementation","based on the user’s external view of the system","measure functionality that the user requests and receives","can be estimated early in analysis and design","computed from the code implementing the requirements"],"ans":[4],"exp":"Function points are a size metric based on the functional requirements of the system as seen from the user's perspective. They are intentionally designed to be independent of implementation details such as programming language, tools, or actual code.","topic":"t-fp"},{"id":"A26-4-7","src":"A26","wk":4,"n":7,"type":"mcq","text":"Which one of the followings is NOT a key component in function point analysis?","opts":["Number of Inputs","Number of Outputs","Number of Inquiries","Number of Interfaces","Number of Operations"],"ans":[4],"exp":"Number of Operations is not a standard component in function point analysis. \"Operations\" is more relevant to object-oriented metrics (e.g., number of methods) or UML, not to function points.","topic":"t-fp"},{"id":"A26-4-8","src":"A26","wk":4,"n":8,"type":"mcq","text":"In a software project, if the degree of influence (DI) for each of the 14 General System Characteristics is 5, then what will be value of VAF (Value Adjustment Factor), using Function Point analysis?","opts":["1.07","1.21","2.07","2.21","1.35","70"],"ans":[4],"exp":"VAF=0.65+70/100​=0.65+0.70=1.35 where, total degree influence, TDI=14×5=70","topic":"t-fp"},{"id":"A26-4-9","src":"A26","wk":4,"n":9,"type":"msq","text":"Which of the followings are limitations of function point analysis?","opts":["It does not consider algorithmic complexity of a function","It is hard to fudge","It is language independent","It is understandable by clients","It requires extensive training"],"ans":[0,4],"exp":"Function point analysis does not account for internal algorithmic complexity, making it less accurate for highly complex functions, and it demands significant training to apply consistently. In contrast, being language-independent, hard to manipulate, and understandable to clients are considered strengths, not limitations.","topic":"t-fp"},{"id":"A26-4-10","src":"A26","wk":4,"n":10,"type":"mcq","text":"Consider a project with the following functional units: 80 user inputs, 60 user outputs, 50 user enquiries, 10 user files, 7 external interfaces. What will be the unadjusted function points for the project?","opts":["769","869","969","1069","1169"],"ans":[2],"exp":"Using standard IFPUG average complexity weights: External Inputs (EI): 80 × 4 = 320 External Outputs (EO): 60 × 5 = 300 External Inquiries (EQ): 50 × 4 = 200 Internal Logical Files (ILF): 10 × 10 = 100 External Interface Files (EIF): 7 × 7 = 49 Total UFP = 320 + 300 + 200 + 100 + 49 = 969","topic":"t-fp"},{"id":"A26-5-1","src":"A26","wk":5,"n":1,"type":"msq","text":"Which of the followings are NOT examples of expert judgment-based technique?","opts":["Basic expert judgement","Weighted average estimating","Delphi cost estimation","COCOMO","Consensus estimating","Halstead’s software science"],"ans":[3,5],"exp":"Expert judgment techniques rely on human expertise, experience, and consensus—examples include basic expert judgement, weighted average estimating, Delphi, and consensus estimating. COCOMO is an algorithmic model based on mathematical formulas, and Halstead’s software science is an analytical metric based on operators and operands; neither uses expert judgment as their primary mechanism.","topic":"t-esttech"},{"id":"A26-5-2","src":"A26","wk":5,"n":2,"type":"msq","text":"Which of the followings are examples of organic project?","opts":["Accounting system","Compilers","Operating systems","Real-time systems","Student Information System","Linkers"],"ans":[0,4],"exp":"In the COCOMO model, organic projects are small, simple, and well-understood, with experienced teams and flexible requirements—typical examples include accounting systems and student information systems. Compilers and linkers are semi-detached, while operating systems and real-time systems are embedded due to their complexity and tight constraints.","topic":"t-cocomo"},{"id":"A26-5-3","src":"A26","wk":5,"n":3,"type":"msq","text":"In intermediate COCOMO, if there are stringent reliability requirements on the product, then the initial cost and effort estimates obtained by the basic COCOMO, are","opts":["scaled downwards","scaled upwards","remained unchanged","potentially decreased","halved"],"ans":[1],"exp":"In intermediate COCOMO, the cost driver RELY (required software reliability) has a value greater than 1.0 for stringent reliability requirements (e.g., High = 1.15, Very High = 1.30). This multiplies the basic COCOMO estimate by an Effort Adjustment Factor (EAF) &gt; 1.0, thus scaling the effort and cost upwards—not downward, unchanged, decreased, or halved.","topic":"t-cocomo"},{"id":"A26-5-4","src":"A26","wk":5,"n":4,"type":"msq","text":"A distributed decision support System (DSS) for an organization having offices at several places across the country has the following modules: a database module, a graphical user interface (GUI) module and a communication module. Which of the following COCOMO models will be best suitable for estimating the development cost?","opts":["Basic COCOMO","Intermediate COCOMO","COCOMO 81","Detailed (Complete) COCOMO","All of these"],"ans":[3],"exp":"A distributed DSS with database, GUI, and communication modules involves different types of components, each with its own complexity, cost drivers, and development environment. The Detailed (Complete) COCOMO model is best suited because it allows estimating effort module by module (with phase-level and module-level cost drivers) and then summing them, providing greater accuracy than Basic or Intermediate COCOMO, which apply uniform cost drivers to the entire project.","topic":"t-cocomo"},{"id":"A26-5-5","src":"A26","wk":5,"n":5,"type":"mcq","text":"Which one of the following COCOMO II sub-models would be used when requirements are available but design has not yet started?","opts":["Application composition","Early design","Reuse","Post-architecture","Application configuration"],"ans":[1],"exp":"The Early design sub-model of COCOMO II is specifically used when requirements are known but the detailed software design and architecture have not yet been completed. It uses fewer cost drivers (7 instead of 17) and provides a coarse estimate based on function points or KSLOC. Application composition is for very early prototyping, reuse is for estimating effort to integrate reused components, and post-architecture applies once the architecture is fully defined.","topic":"t-cocomo2"},{"id":"A26-5-6","src":"A26","wk":5,"n":6,"type":"msq","text":"Post-architecture model of COCOMO II is primarily used for","opts":["systems developed using dynamic languages, DB programming etc","initial effort estimation based on system requirements and design options","computing the effort to integrate the reusable components or automatically generated code","estimating the development effort based on system design specification","Evaluating the impact of project cost drivers and scale factors on the final effort estimate"],"ans":[3,4],"exp":"The Post-Architecture model of COCOMO II is primarily used for estimating development effort based on the system design specification (d), as it leverages detailed size inputs and 17 cost drivers once the architecture is stable. Additionally, it serves to evaluate the impact of project cost drivers and scale factors (e) by allowing managers to adjust parameters like team capability or reliability requirements and observe their effect on the final effort estimate, making both options correct and complementary uses of the model.","topic":"t-cocomo2"},{"id":"A26-5-7","src":"A26","wk":5,"n":7,"type":"msq","text":"Which of the following estimation techniques are based on making an educated guess of the project parameters?","opts":["Expert judgement","Basic COCOMO","Halstead’s software science","Delphi cost estimation","Intermediate COCOMO","Complete COCOMO"],"ans":[0,3],"exp":"Expert judgement and Delphi cost estimation rely on human expertise, experience, and consensus to make informed \"educated guesses\" about project parameters. In contrast, Basic COCOMO, Intermediate COCOMO, Complete COCOMO, and Halstead's software science are algorithmic or analytical models that use fixed mathematical formulas or metrics, not subjective human estimation. .","topic":"t-halstead"},{"id":"A26-5-8","src":"A26","wk":5,"n":8,"type":"msq","text":"In Halstead’s software science,","opts":["the programming effort varies inversely with the volume","the programming effort varies linearly with the volume","the programming effort varies as the square of the volume","the programming effort varies as the cube of the volume","the programming effort does not vary with the volume"],"ans":[2],"exp":"In Halstead's software science E = V/L and L = V*/V, so E = V²/V*: programming effort varies as the square of the volume V (V measures the information content from operators and operands).","topic":"t-halstead"},{"id":"A26-5-9","src":"A26","wk":5,"n":9,"type":"mcq","text":"Which one of the following is NOT a reason for late project becoming later due to addition of manpower?","opts":["Increased communication among team members","Learning by the added members","Increased project scope","Limited scope for parallelizing various project activities","Additional effort required from experienced team members to train and mentor new members"],"ans":[2],"exp":"Brooks' Law states that adding manpower to a late project makes it later due to factors like increased communication overhead, learning curves for new members, limited parallelizability of tasks, and training efforts required from experienced staff. Increased project scope, however, is not a consequence of adding manpower—it is a separate decision (scope creep) and not a reason why additional people delay the project.","topic":"t-staffing"},{"id":"A26-5-10","src":"A26","wk":5,"n":10,"type":"mcq","text":"Suppose the development time of a small software product has been estimated to be one and half year. Then, in order to develop the product in six months, what will be total increase in development effort? (Use Jensen's model).","opts":["3 times","6 times","9 times","12 times","18 times","27 times","81 times"],"ans":[2],"exp":"Jensen's model (a softened Putnam model) gives effort ∝ 1/td². Compressing 18 months to 6 months is a ratio of 3, so effort grows 3² = 9 times. (Putnam's model would give 3⁴ = 81 times.)","topic":"t-staffing"},{"id":"A26-6-1","src":"A26","wk":6,"n":1,"type":"msq","text":"Which of the following statements regarding a Work Breakdown Structure (WBS) are correct?","opts":["A WBS represents a hierarchical decomposition of project work","A WBS decomposes tasks into smaller subtasks","A WBS shows the duration of each activity","A WBS helps organize project scope into manageable components","A WBS explicitly shows task dependencies"],"ans":[0,1,3],"exp":"A WBS is a hierarchical decomposition of the total project work into smaller, manageable components (work packages), which helps organize and define the project scope. It decomposes tasks into subtasks but does not show activity durations (that belongs to schedules like Gantt charts) or task dependencies (shown in network diagrams).","topic":"t-wbs"},{"id":"A26-6-2","src":"A26","wk":6,"n":2,"type":"msq","text":"Which of the following statements regarding an Activity Network are correct?","opts":["It cannot represent concurrent activities","An Activity Network depicts the flow of project tasks","It is primarily used to define software requirements","It can show task dependencies","It can represent task sequence relationships"],"ans":[1,3,4],"exp":"An Activity Network (e.g., PERT or CPM) depicts the logical flow and sequence of project tasks, clearly showing task dependencies and relationships (e.g., finish-to-start). It can also represent concurrent activities using parallel paths, so option (a) is false. It is used for project scheduling, not for defining software requirements, making option (c) incorrect.","topic":"t-wbs"},{"id":"A26-6-3","src":"A26","wk":6,"n":3,"type":"msq","text":"Which of the following pieces of information is typically represented in a WBS?","opts":["Major project deliverables","Critical path information","Subtasks associated with project activities","Activity durations","Hierarchical relationships among work items"],"ans":[0,2,4],"exp":"A WBS typically represents major project deliverables, subtasks (work packages) associated with project activities, and hierarchical relationships among work items. It does not include critical path information (shown in network diagrams) or activity durations (shown in schedules like Gantt charts).","topic":"t-wbs"},{"id":"A26-6-4","src":"A26","wk":6,"n":4,"type":"msq","text":"Which statements about the critical path are true?","opts":["It always includes the maximum number of activities","It is a path from project start to finish","It determines the minimum project duration","It always contains all project tasks","Delays on critical activities may delay the project"],"ans":[1,2,4],"exp":"The critical path is the longest sequence of dependent activities from project start to finish, and it determines the minimum project duration. Delaying any critical activity will delay the project unless corrective action is taken. It does not necessarily contain the maximum number of activities (duration matters more), and it never includes all project tasks—only those with zero slack.","topic":"t-cpm"},{"id":"A26-6-5","src":"A26","wk":6,"n":5,"type":"msq","text":"What can be the effect of the delay of an activity in the critical path?","opts":["The project completion date may be delayed","The critical path may change","The project duration is guaranteed to remain unchanged","The delay is always absorbed by slack time","Corrective actions may be required"],"ans":[0,1,4],"exp":"Delaying a critical-path activity directly threatens the project completion date (a), may cause the critical path to shift to another sequence of activities (b), and typically forces the project manager to take corrective actions such as crashing or fast-tracking to recover (e). Critical activities have zero slack, so the delay is never absorbed by slack time (d), and the project duration is not guaranteed to remain unchanged (c).","topic":"t-cpm"},{"id":"A26-6-6","src":"A26","wk":6,"n":6,"type":"msq","text":"Which activities have zero float (slack) in the network in the PERT chart shown?","opts":["A","B","E (Recruit staff)","F (Draft office procedures)","G (Install and test)"],"ans":[2,3],"exp":"E (Recruit staff) ES=0, DUR=10, EF=10 LS=0, SL=0, LF=10 F (Draft office procedures) ES=10, DUR=3, EF=13 LS=10, SL=0, LF=13","topic":"t-cpm","fig":"brigette"},{"id":"A26-6-7","src":"A26","wk":6,"n":7,"type":"msq","text":"Which of the following activities are on the critical path in the PERT chart diagram?","opts":["A","E (Recruit staff)","F (Draft office procedures)","C","G"],"ans":[1,2],"exp":"The critical path is the longest path from start to finish with zero slack: E (Recruit staff) → F (Draft office procedures). No other activities are on the critical path because they have positive slack and are not required to be completed on the critical timeline. .","topic":"t-cpm","fig":"brigette"},{"id":"A26-6-8","src":"A26","wk":6,"n":8,"type":"msq","text":"Suppose activity D is delayed by 2 weeks while all other activities remain unchanged in the PERT chart diagram. Which statements are true?","opts":["Activity G must start at week 11","D will finish at week 10","The project completion time remains 13 weeks","D will still not be on the critical path","The float of D becomes 1 week"],"ans":[1,2,3],"exp":"D will finish at 10 (8+2) where the completion will remain 13 as both EF =LF=13, and D will still not be on the critical path.","topic":"t-cpm","fig":"brigette"},{"id":"A26-6-9","src":"A26","wk":6,"n":9,"type":"msq","text":"Which statements about CPM/PERT are correct?","opts":["Activities with larger durations always have larger float","Forward pass computes earliest times","All activities can have non-zero float","Critical-path activities have positive float","Backward pass computes latest times","Float = LS − ES"],"ans":[1,4,5],"exp":"In CPM/PERT, the forward pass calculates earliest start and finish times (b), while the backward pass calculates latest start and finish times (e). Float (slack) is correctly computed as LS − ES (or LF − EF) (f). Larger duration does not guarantee larger float (a), critical activities have zero float (d), and not all activities can have non-zero float—critical ones have zero (c).","topic":"t-cpm"},{"id":"A26-6-10","src":"A26","wk":6,"n":10,"type":"msq","text":"Given an activity with Earliest Start (ES) = 5 days, Latest Finish (LF) = 30 days, and Duration = 10 days, which of the following are true?","opts":["Earliest Finish (EF) = 15 days","Float = 20 days","Latest Start (LS) = 20 days","Float = 15 days","Latest Start (LS) = 25 day"],"ans":[0,2,3],"exp":"EF = ES + Duration = 5 + 10 = 15 days → (a) is true. LS = LF − Duration = 30 − 10 = 20 days → (c) is true, (e) is false. Float = LS − ES = 20 − 5 = 15 days → (d) is true, (b) is false. Thus, the correct statements are a, c, and d.","topic":"t-cpm"},{"id":"A26-7-1","src":"A26","wk":7,"n":1,"type":"msq","text":"If the optimistic estimate is 4 days, the most likely estimate is 10 days, and the pessimistic estimate is 16 days, which of the following statements are correct?","opts":["Expected time is 10 days","Variance is 4","Standard deviation is 2","Expected time is 12 days","Variance is 2"],"ans":[0,1,2],"exp":"Expected time (TE) = (O + 4M + P) / 6 = (4 + 4×10 + 16) / 6 = 60/6 = 10 days → (a) is true, (d) is false. Variance (V) = ((P − O) / 6)² = ((16 − 4) / 6)² = (12/6)² = 2² = 4 → (b) is true, (e) is false. Standard deviation (SD) = √V = √4 = 2 → (c) is true.","topic":"t-pert"},{"id":"A26-7-2","src":"A26","wk":7,"n":2,"type":"msq","text":"A project manager is asked to deliver a project earlier than planned. Which actions are consistent with project crashing?","opts":["Increase the duration of critical activities","Add more skilled personnel to critical tasks","Use faster equipment or tools for critical activities","Reduce the scope of the project","Assign overtime to critical-path activities"],"ans":[1,2,4],"exp":"Project crashing is a schedule compression technique that aims to shorten the project duration without changing scope by adding resources or increasing efficiency, typically on critical-path activities. Adding skilled personnel (b), using faster tools/equipment (c), and assigning overtime (e) are classic crashing actions. Increasing activity duration (a) would lengthen the project, and reducing scope (d) is not part of standard crashing—it is scope reduction, not crashing.","topic":"t-pert"},{"id":"A26-7-3","src":"A26","wk":7,"n":3,"type":"msq","text":"Which of the following conclusions are consistent with the Hawthorne Effect?","opts":["Human factors play a role in workplace productivity","Worker productivity is independent of observation","Employee performance can be influenced by perceived interest from management","Lighting conditions are the sole determinant of productivity","Being part of a study may affect worker behavior"],"ans":[0,2,4],"exp":"The Hawthorne Effect shows that workers' productivity is influenced by being observed and by perceived management interest, not just by physical conditions like lighting. This confirms that human factors (a), management attention (c), and awareness of being studied (e) all affect behavior. Observation does affect productivity (b is false), and lighting is not the sole determinant (d is false).","topic":"t-people"},{"id":"A26-7-4","src":"A26","wk":7,"n":4,"type":"msq","text":"Which of the following statements about a functional organization are true?","opts":["Functional organizations eliminate the need for management layers","Functional groups often follow a pyramidal structure","Functional organizations discourage technical specialization","Functional organizations are commonly found in military, police, and hospitals","Individuals are grouped according to specialized functions"],"ans":[1,3,4],"exp":"Functional organizations group individuals by specialized functions (e.g., engineering, marketing) and typically follow a pyramidal hierarchy with multiple management layers. They are common in military, police, and hospitals. They do not eliminate management layers (a), nor do they discourage technical specialization—they actually encourage it (c).","topic":"t-org"},{"id":"A26-7-5","src":"A26","wk":7,"n":5,"type":"msq","text":"According to Belbin, which of the following statements are correct?","opts":["An eligible candidate has the required qualifications","A suitable candidate is capable of performing the job effectively","Eligibility and suitability always imply the same thing","A person may be eligible but not suitable","A suitable candidate can never lack formal qualifications"],"ans":[0,1,3],"exp":"Belbin distinguishes eligibility (formal qualifications, experience) from suitability (behavioral attributes, team fit, and capability to perform effectively). A candidate can be eligible but not suitable (e.g., highly qualified but poor collaborator), and eligibility and suitability are not the same. Suitability does not require formal qualifications, so option (e) is false. Thus, a, b, and d are correct.","topic":"t-people"},{"id":"A26-7-6","src":"A26","wk":7,"n":6,"type":"msq","text":"Which of the following statements are consistent with Maslow's theory of motivation?","opts":["Food and shelter are examples of higher-level needs","Human needs can be arranged in a hierarchy","Higher-level needs emerge as lower-level needs are fulfilled","All individuals are motivated by exactly the same needs","Self-actualization is at the highest level of the hierarchy"],"ans":[1,2,4],"exp":"Maslow's theory proposes a hierarchy of human needs, where lower-level needs (physiological, safety) must be substantially satisfied before higher-level needs (esteem, self- actualization) emerge as motivators. Food and shelter are lower-level, not higher-level (a), and individuals differ in which needs they are pursuing (d). Self-actualization is indeed the highest level (e). Thus, b, c, and e are correct.","topic":"t-people"},{"id":"A26-7-7","src":"A26","wk":7,"n":7,"type":"msq","text":"Which statements correctly distinguish organization structure from team structure?","opts":["Organization structure focuses on teams within the organization","Team structure focuses on individuals within a team","Team structure determines how organizations are divided into departments","Organization structure and team structure operate at different levels","Team structure is unrelated to the arrangement of individuals"],"ans":[0,1,3],"exp":"Organization structure operates at the macro level, defining how the entire enterprise is divided into departments, reporting lines, and teams—making option (a) correct. Team structure works at the micro level, focusing on the roles and relationships of individuals within a specific team (b), and the two structures function at fundamentally different levels of analysis (d). <br><i>The official solution itself flagged option (a) as doubtful.</i>","topic":"t-org"},{"id":"A26-7-8","src":"A26","wk":7,"n":8,"type":"msq","text":"According to Herzberg, motivators are factors that:","opts":["Make the job feel worthwhile","Create a sense of achievement","Eliminate all dissatisfaction","Increase job satisfaction","Include working conditions"],"ans":[0,1,3],"exp":"According to Herzberg's Two-Factor Theory, motivators (intrinsic factors like achievement, recognition, and meaningful work) make the job feel worthwhile (a), create a sense of achievement (b), and directly increase job satisfaction (d). They do not eliminate dissatisfaction— that is the role of hygiene factors (c), and working conditions are hygiene factors, not motivators (e).","topic":"t-people"},{"id":"A26-7-9","src":"A26","wk":7,"n":9,"type":"msq","text":"Which of the following statements are consistent with the Oldham–Hackman model?","opts":["A job requiring multiple skills may be perceived as more meaningful","Seeing a whole piece of work contributes to task identity","Understanding the importance of one's work relates to task significance","Motivation depends solely on financial rewards","Feedback can enhance job satisfaction"],"ans":[0,1,4],"exp":"In the Oldham–Hackman model, skill variety (a) makes work feel more meaningful by engaging multiple talents, task identity (b) enhances meaning by allowing workers to see a complete, identifiable piece of work, and feedback (e) directly improves job satisfaction by providing clear information about performance. These are three of the five core job characteristics that foster intrinsic motivation, while the model does not rely on financial rewards alone, and task significance is specifically about the job's impact on others—not merely understanding importance. <br><i>The official solution flagged option (c) as doubtful: task significance is about the impact of the job on other people, not just 'understanding importance'.</i>","topic":"t-people"},{"id":"A26-7-10","src":"A26","wk":7,"n":10,"type":"msq","text":"Which of the following are ways in which good project management can reduce stress?","opts":["Providing realistic effort estimates","Reducing unexpected crises through better control","Increasing uncertainty about responsibilities","Reducing role ambiguity","Encouraging conflicting responsibilities"],"ans":[0,1,3],"exp":"Good project management reduces stress by setting realistic effort estimates (a), minimizing unexpected crises through proactive control (b), and clarifying roles to reduce ambiguity (d). In contrast, increasing uncertainty about responsibilities (c) and encouraging conflicting responsibilities (e) would heighten stress, not reduce it.","topic":"t-people"},{"id":"A26-8-1","src":"A26","wk":8,"n":1,"type":"mcq","text":"In the context of resource allocation, which one of the followings is true regarding resource schedule?","opts":["It indicates the planned start and completion dates for each activity","It indicates the actual start and completion dates for each activity","It shows the dates on which each resource will be required and level of that requirement","It shows the planned cumulative expenditure incurred by the use of resources over time","It shows the actual expenditure incurred by the use of resources over time","It usually shows the weekly or monthly costs over the life of the project"],"ans":[2],"exp":"A resource schedule specifies when each resource (e.g., personnel, equipment, materials) is needed and at what quantity or intensity over the project timeline. It focuses on resource availability and usage, not activity start/end dates (a), actual dates (b), cumulative expenditure (d), actual costs (e), or periodic cost breakdowns (f)—those belong to activity schedules, cost baselines, or financial reports.","topic":"t-resource"},{"id":"A26-8-2","src":"A26","wk":8,"n":2,"type":"mcq","text":"Which one of the followings indicates the planned start and completion dates for each activity?","opts":["Activity schedule","Resource schedule","Cost schedule","Time schedule","Program schedule"],"ans":[0],"exp":"An activity schedule (often represented as a Gantt chart or project calendar) shows the planned start and completion dates for each individual activity in the project. A resource schedule shows resource requirements over time, a cost schedule tracks costs, and program schedule refers to a broader set of related projects—none of which focus specifically on activity start/end dates. Thus, (a) is the correct answer.","topic":"t-resource"},{"id":"A26-8-3","src":"A26","wk":8,"n":3,"type":"mcq","text":"Which one of the following is not TRUE about resource histograms?","opts":["A resource histogram is a representation of the distribution of the resources required over the duration of the project","The ideal resource histogram should be smooth with an initial build-up and a staged run-down","Based on the resource histogram, some activities may be delayed to reduce the maximum demand of a resource","A resource histogram is used to estimate activity durations","The initial activity network is refined based on the resource histogram"],"ans":[3],"exp":"A resource histogram displays the distribution of resource requirements over time, helps in resource leveling (smoothing demand), and can lead to refining the activity network. However, it is not used to estimate activity durations—durations are estimated first using effort, productivity, and dependencies. The histogram is derived from the schedule, not used to create it. Thus, (d) is the statement that is NOT true.","topic":"t-resource"},{"id":"A26-8-4","src":"A26","wk":8,"n":4,"type":"msq","text":"There is a need to prioritize the activities of a project, because","opts":["finding the best allocation of resources is time consuming and difficult","allocating a resource to one activity limits the flexibility for resource allocation and scheduling of other activities","resources can be allocated to competing activities in some rational order","the lower-priority activities can be made to fit around the more critical, already scheduled activities","activity prioritization eliminates the need for resource-constrained scheduling"],"ans":[0,1,2,3],"exp":"Prioritizing activities is necessary because resource allocation is complex and time-consuming (a), assigning a resource to one task reduces flexibility for others (b), it provides a rational order for competing activities (c), and lower-priority tasks can then be scheduled around critical ones (d). However, prioritization does not eliminate the need for resource-constrained scheduling—it only helps manage it; constraints still exist and must be addressed (e is false).","topic":"t-resource"},{"id":"A26-8-5","src":"A26","wk":8,"n":5,"type":"mcq","text":"The expenditures incurred in an organization, which cannot be directly related to individual projects or jobs, are known as","opts":["Staff cost","Overheads","Usage charges","Service charges","Materials cost"],"ans":[1],"exp":"Overheads are indirect costs that cannot be traced directly to a specific project or job—they support overall operations (e.g., rent, utilities, administrative salaries, insurance). Staff costs, usage charges, service charges, and materials costs are typically direct costs tied to specific activities or projects. Thus, (b) is correct.","topic":"t-costsched"},{"id":"A26-8-6","src":"A26","wk":8,"n":6,"type":"mcq","text":"Which one of the followings is the proper scheduling sequence?","opts":["activity plan,
