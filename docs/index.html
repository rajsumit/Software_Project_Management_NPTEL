page({ id: 't-resource', wk: 8, topic: 1, stars: 3, lec: [36, 37], title: 'Resource allocation, histograms & smoothing', kw: 'activity schedule resource schedule cost schedule resource categories labour equipment materials space services time money requirement list histogram smoothing clash total float priority ordered list Burman critical path dependencies', lede: 'The activity network assumes unlimited people. Resource allocation brings the plan back to reality.',
  render(b) {
    H(b, MUST('Resource allocation produces three schedules: <b>activity schedule</b> (planned start and completion of each activity), <b>resource schedule</b> (dates each resource is needed and at what level), <b>cost schedule</b> (planned cumulative expenditure over time).',
      'Resource categories: <b>labour, equipment, materials</b> (consumed: disks, paper), <b>space, services</b> (telecom, courier), <b>time</b> (can be reduced by adding staff), <b>money</b> (secondary: buys the others; costs interest).',
      '<b>Resource histogram</b>: demand for one resource over time. Earliest-start scheduling gives a peak then a tail; the ideal histogram is <b>smooth with an initial build-up and a staged run-down</b>. <b>Smoothing</b>: delay (within float) or split non-critical activities to even out demand and keep within availability.',
      '<b>Resource clash</b>: same resource needed in two places at once → delay one activity (use float, or wait), move a resource from a non-critical activity, or add resources (costs more).',
      'Prioritise activities: <b>total float priority</b> (smallest float first, recompute as you go) or an <b>ordered list</b> such as <b>Burman\'s</b>: 1 shortest critical, 2 other critical, 3 shortest non-critical, 4 non-critical with least float, 5 other non-critical.',
      'Resource scheduling can <b>create new critical paths</b> and dependencies. Do <b>not</b> add resource links to the activity network (messy, and the link stays after the constraint disappears): amend dates on the schedule instead.'));
    const L = lab(b, 'Resource smoothing: module-testing team', 'Each bar is an activity needing testers. Critical activities (red) cannot move; drag the start sliders of the others within their float. Goal: peak ≤ 5 testers, no idle gaps.');
    const A = [{ id: 'A', es: 0, d: 3, n: 1, fl: 0 }, { id: 'B', es: 0, d: 2, n: 2, fl: 3 }, { id: 'C', es: 0, d: 4, n: 2, fl: 4 }, { id: 'D', es: 3, d: 3, n: 1, fl: 0 }, { id: 'E', es: 2, d: 2, n: 2, fl: 4 }, { id: 'F', es: 3, d: 2, n: 2, fl: 3 }, { id: 'G', es: 6, d: 3, n: 1, fl: 0 }, { id: 'H', es: 4, d: 2, n: 1, fl: 3 }];
    const shift = {}; A.forEach(a => shift[a.id] = 0);
    const ctl = h('div', { class: 'ctls' }); L.add(ctl);
    A.filter(a => a.fl > 0).forEach(a => { const id = 'rs' + a.id, out = h('output', {}, '+0'), inp = h('input', { type: 'range', min: 0, max: a.fl, value: 0, id }); inp.addEventListener('input', () => { shift[a.id] = +inp.value; out.textContent = '+' + inp.value; d(); }); ctl.append(h('div', { class: 'ctl' }, h('label', { for: id }, `Delay ${a.id} (float ${a.fl}, needs ${a.n})`), inp, out)); });
    const gbox = h('div', { class: 'netwrap' }); L.add(gbox);
    const sc = L.scope({ xmin: 0, xmax: 9, ymin: 0, ymax: 10, xt: 9, yt: 5, h: 190, xl: 'week', yl: 'testers needed' }); const ro = L.readout();
    L.add(h('button', { class: 'btn', onclick: () => { Object.assign(shift, { B: 3, C: 0, E: 2, F: 3, H: 3 }); $$('input[type=range]', ctl).forEach((x, i) => { const a = A.filter(a => a.fl > 0)[i]; x.value = shift[a.id]; x.nextSibling.textContent = '+' + shift[a.id]; }); d(); } }, 'Show one smoothed solution'));
    function d() { const T = 9, dem = Array(T).fill(0); A.forEach(a => { const s = a.es + shift[a.id]; for (let t = s; t < s + a.d; t++) dem[t] += a.n; }); let g = `<svg class="gantt" viewBox="0 0 560 ${A.length * 22 + 26}">`; const gx = v => 40 + v * 56; for (let t = 0; t <= T; t++) g += `<line class="ax" x1="${gx(t)}" y1="0" x2="${gx(t)}" y2="${A.length * 22 + 4}"/><text class="axt" x="${gx(t)}" y="${A.length * 22 + 18}" text-anchor="middle">${t}</text>`; A.forEach((a, i) => { const s = a.es + shift[a.id]; g += `<text x="6" y="${i * 22 + 17}">${a.id}</text>${a.fl ? `<rect class="fl" x="${gx(a.es)}" y="${i * 22 + 4}" width="${(a.d + a.fl) * 56}" height="14" rx="3"/>` : ''}<rect class="bar${a.fl ? '' : ' cr'}" x="${gx(s)}" y="${i * 22 + 4}" width="${a.d * 56}" height="14" rx="3"/><text x="${gx(s) + 4}" y="${i * 22 + 15}" style="fill:#fff;font-size:10px">${a.n}p</text>`; }); gbox.innerHTML = g + '</svg>';
      const bars = dem.map((v, t) => [t + .08, t + .92, 0, v]); sc.draw([{ bars, c: '--ch-v' }], { h: [{ y: 5, t: 'available: 5', c: '--bad' }] }); const pk = Math.max(...dem), idle = dem.filter(v => v < 3).length; ro([['peak demand', pk + (pk > 5 ? ' (over limit!)' : ' ✔')], ['demand per week', dem.join(' ')], ['shape', pk <= 5 ? 'within availability' : 'peaked: smooth it']]); }
    d();
    H(b, `<h2>Identifying resource requirements</h2><div class="grid2">${CARD('Hardware (5 steps)', '<ol><li>List all hardware needs (desktops, servers, backup media, switches, printers…)</li><li>What each piece must do</li><li>What each needs to function (software, cables)</li><li>Who needs what (not everyone needs everything)</li><li>When it is needed (maybe in advance)</li></ol>')}${CARD('Software and support', '<p><b>Software</b>: list requirements (OS, compilers, CM system, email, libraries, office tools, CASE/test/SPM tools) → specify versions → identify upgrades and service packs → who upgrades which → when (never just before a milestone; plan time for problems).</p><p><b>Support</b>: identify support needed from each group, when, how (phone, email, in person), gain commitment, keep a good relationship.</p>')}</div>
    <p>The first step of a resource allocation plan is a <b>resource requirement list</b> (resource, days, quantity, notes) built by walking through every activity of the precedence network, plus non-activity resources such as the project manager and office space.</p>
    ${TRAP('A resource schedule shows when each resource is needed and at what level (2026 A8 Q1); planned start/completion dates per activity = activity schedule (A8 Q2).', 'A resource histogram is NOT used to estimate durations (2026 A8 Q3).', 'Resource scheduling usually does NOT shorten the critical path; it may create new ones (2019 W8 Q3).', 'Prioritisation does not eliminate resource-constrained scheduling (2026 A8 Q4, e is false).')}`);
  } });

page({ id: 't-costsched', wk: 8, topic: 1, stars: 2, lec: [38], title: 'Allocating people, work schedules & cost schedules', kw: 'allocation individuals availability criticality risk training team building work schedule publishing cost schedule staff costs overheads usage charges scheduling sequence', lede: 'Software people are not interchangeable bricklayers. How to assign individuals, publish the plan and turn it into a cost schedule.',
  render(b) {
    H(b, MUST('Factors when allocating individuals: <b>availability, criticality</b> (experienced staff on the critical path), <b>risk</b> (best people on the riskiest activities), <b>training</b> (juniors on non-critical activities with slack), <b>team building</b>.',
      'Best way to publish and communicate schedules: a <b>work plan / work schedule</b> (lists or charts per person), not activity plans, bar charts or histograms.',
      'Cost categories: <b>staff costs</b> (salaries + employment costs, charged hourly from timesheets), <b>overheads</b> (expenditure that cannot be related to individual projects: space rental, interest, service departments like HR), <b>usage charges</b> (e.g. computer time, "as used").',
      '<b>Scheduling sequence: activity plan → risk assessment → resource allocation → cost schedule</b> (and revisions flow back).',
      'Typical cost profile: builds up slowly to a peak, tails off quickly at the end.'));
    const L = lab(b, 'Weekly and cumulative cost schedule', 'A typical profile over a 20-week project. Change the peak week and the staff rate.');
    const v = controls(L.body, [{ k: 'pk', label: 'Peak week', min: 5, max: 16, v: 12, d: 0 }, { k: 'rate', label: 'Weekly cost at peak (k Rs.)', min: 20, max: 200, v: 100, d: 0 }, { k: 'ovh', label: 'Overhead (% of staff cost)', min: 0, max: 100, v: 30, d: 0 }], () => d());
    const sc = L.scope({ xmin: 0, xmax: 20, ymin: 0, ymax: 200, xt: 10, yt: 4, h: 200, xl: 'week', yl: 'weekly cost (k Rs.)' }); const sc2 = L.scope({ xmin: 0, xmax: 20, ymin: 0, ymax: 2000, xt: 10, yt: 4, h: 180, xl: 'week', yl: 'cumulative (k Rs.)' }); const ro = L.readout();
    function d() { const w = t => { const x = t <= v.pk ? t / v.pk : 1 - (t - v.pk) / (20 - v.pk); return v.rate * Math.max(0, Math.sin(x * Math.PI / 2)) ** (t <= v.pk ? 1.2 : 0.6) * (1 + v.ovh / 100); }; const xs = [], ys = [], cs = []; let c = 0; for (let t = 0; t <= 20; t++) { xs.push(t); const y = w(t); ys.push(y); c += y; cs.push(c); } sc.set({ ymax: Math.ceil(v.rate * (1 + v.ovh / 100) / 50) * 50 + 50 }); sc.draw([{ x: xs, y: ys, c: '--ch-v', fill: true, step: true }]); sc2.set({ ymax: Math.ceil(c / 500) * 500 }); sc2.draw([{ x: xs, y: cs, c: '--ch-i', w: 2.5 }]); ro([['total cost', fmt(c, 0) + 'k'], ['of which overhead', fmt(c * v.ovh / (100 + v.ovh), 0) + 'k']]); }
    d();
    sorter(b, 'Game: staff cost, overhead or usage charge?', 'DPM lecture 18 and 2026 A8 Q5.', [['st', 'Staff cost'], ['ov', 'Overhead'], ['us', 'Usage charge']], [['Programmer salaries', 'st'], ["Employer's pension contribution", 'st'], ['Holiday pay and sickness benefit', 'st'], ['Office space rental', 'ov'], ['Interest charges', 'ov'], ['Cost of the HR department', 'ov'], ['Computer time charged as used', 'us']]);
    H(b, `<div class="flowline"><span class="st on">Activity plan</span><span class="ar">→</span><span class="st on">Risk assessment</span><span class="ar">→</span><span class="st on">Resource allocation</span><span class="ar">→</span><span class="st on">Cost schedule</span></div><p>Successful resource allocation often forces revisions to the activity plan, which changes the risk assessment; the cost schedule may force reallocation. Some trade-offs can be compared in money (extra staff vs late delivery); others (increased risk) are subjective. Good tools help, but success depends on the PM's skill in juggling these factors.</p>
    ${TRAP('Proper sequence: activity plan, risk assessment, resource allocation, cost schedule (2026 A8 Q6, 2019 W8 Q6).', 'Expenditure that cannot be related to individual projects = overheads (2026 A8 Q5).', 'Best way to publish schedules = work schedule (2019 W8 Q5).')}`);
  } });

page({ id: 't-monitor', wk: 8, topic: 1, stars: 3, lec: [39, 40], title: 'Monitoring framework: reporting, checkpoints, RAG', kw: 'project control cycle shortfalls steering committee reporting oral written formal informal regular ad hoc checkpoints event driven time driven review points partial completion 99 percent timesheet red amber green traffic light milestone', lede: 'Once the plan is published, attention shifts to progress: what is happening, how it compares to the plan, and what to do about it.',
  render(b) {
    H(b, MUST('Project control cycle: publish plan → gather information → compare with targets → (on target? continue : take remedial action / revise plan) → … → post-project review feeds the next project\'s planning.',
      'Four kinds of shortfall: <b>delays</b>, <b>quality</b> shortfalls, inadequate <b>functionality</b>, <b>costs</b> over target.',
      'Responsibility: overall with the <b>steering committee / project board</b>, day-to-day with the <b>project manager</b>, parts delegated to team leaders.',
      'Reporting: <b>oral or written, formal or informal, regular or ad hoc</b>. Oral formal regular = weekly/monthly progress meetings; oral formal ad hoc = end-of-stage reviews; written formal regular = job sheets, progress reports; written formal ad hoc = exception reports, change reports; oral informal ad hoc = canteen discussion, social interaction (early warning, must be backed by formal reporting).',
      'Checkpoints: <b>event-driven</b> (tied to a deliverable) or <b>time-driven</b> (regular dates, e.g. monthly). Higher management levels report less often and in less detail; major reviews = review/control points.',
      'Partial completion → "99 % complete syndrome". Fixes: control products not activities, subdivide into 1-2 week tasks, timesheets with work done and estimated slippage, or <b>RAG</b>: green = on target, amber = not on target but recoverable, red = not on target and recoverable only with difficulty.'));
    sorter(b, 'Game: classify the reporting method', 'DPM lecture 19 table.', [['ofr', 'Oral formal regular'], ['ofa', 'Oral formal ad hoc'], ['wfr', 'Written formal regular'], ['wfa', 'Written formal ad hoc'], ['oia', 'Oral informal ad hoc']], [
      ['Weekly progress meeting', 'ofr'], ['Monthly progress meeting', 'ofr'], ['End-of-stage review meeting', 'ofa'], ['Job sheets', 'wfr'], ['Progress reports (weekly forms)', 'wfr'], ['Exception report', 'wfa'], ['Change report', 'wfa'], ['Canteen discussion', 'oia'], ['Social interaction', 'oia']]);
    const L = lab(b, 'Red / Amber / Green assessment', 'Assess the second-level elements of "Code and test module C"; the first-level status is reviewed from them. Any critical activity at amber or red usually forces a schedule revision.');
    const els = ['Screen handling procedures', 'File update procedures', 'Error handling', 'Test data', 'Unit test execution'], st = els.map(() => 'G');
    const tb = h('table', { class: 'etbl' }); L.add(h('div', { class: 'tblwrap' }, tb)); const out = h('div', { class: 'ivtxt' }); L.add(out);
    let crit = true; L.add(h('label', { class: 'mini' }, (() => { const c = h('input', { type: 'checkbox', checked: true }); c.addEventListener('change', () => { crit = c.checked; d(); }); return c; })(), 'Activity is on the critical path'));
    function d() { tb.innerHTML = '<tr><th>Second-level element</th><th>Status</th></tr>'; els.forEach((e, i) => { const s = h('select', { class: 'sel' }, [['G', 'Green: on target'], ['A', 'Amber: not on target but recoverable'], ['R', 'Red: recoverable only with difficulty']].map(([k, t]) => h('option', { value: k, selected: st[i] === k }, t))); s.addEventListener('change', () => { st[i] = s.value; d(); }); tb.append(h('tr', {}, h('td', {}, e), h('td', {}, s))); }); const lvl = st.includes('R') ? 'R' : st.includes('A') ? 'A' : 'G', col = { G: 'var(--good)', A: 'var(--warn)', R: 'var(--bad)' }[lvl]; out.style.borderLeftColor = col; out.innerHTML = `First-level status: <b style="color:${col}">${{ G: 'GREEN', A: 'AMBER', R: 'RED' }[lvl]}</b>. ${lvl === 'G' ? 'No action.' : crit ? 'Critical activity at ' + (lvl === 'A' ? 'amber' : 'red') + ': further consideration, usually a schedule revision.' : lvl === 'R' ? 'Non-critical but red: a problem, especially if all its float may be consumed.' : 'Non-critical amber: watch it.'}`; }
    d();
    H(b, `<h2>Assessing progress</h2><p>Information should be objective and tangible (was the report delivered?). Some is collected routinely, some triggered by events. Set <b>checkpoints</b> in the initial plan: event-driven (production of the SRS, a module, test cases) or time-driven (monthly checks). Frequency depends on size and risk; team leaders may assess daily, managers weekly or monthly.</p>
    <p>Collecting data: achievements and costs. Break long activities into 1-2 week tasks; count products (record specs, screen layouts) to measure progress; intermediate products (first successful compilation) can be in-activity milestones. Accounting timesheets show time booked, not what was produced, so they are enhanced to ask for work done, estimated completion, or hours spent and hours still needed.</p>
    ${TRAP('Canteen discussion = oral informal ad hoc (2026 A8 Q8). Progress and exception reports are WRITTEN (2026 A8 Q7).', 'Green = on target; Amber = not on target but recoverable (2026 A8 Q9, 2019 W8 Q9).', '"Checking the progress monthly" is a time-driven checkpoint; producing the SRS is event-driven (2019 W8 Q8).')}`);
  } });

page({ id: 't-review', wk: 8, topic: 1, stars: 2, lec: [40], title: 'Reviews: roles & process', kw: 'review cost effective defect removal moderator recorder reviewer planning preparation overview review meeting rework follow up preparation log review log summary report candidate work products', lede: 'Reviews find defects in documents and code before they turn into failures, and they do it more cheaply than testing.',
  render(b) {
    H(b, MUST('Review is more <b>cost-effective</b> than testing for removing defects, and works on non-executable work products (requirements, design, plans) too. It also spreads learning and understanding.',
      'Candidate work products: requirements specification, UI specification and design, architectural/high-level/detailed design, source code, test plan and test cases, project management plan, configuration management plan.',
      'Roles: <b>moderator</b> (schedules and convenes meetings, distributes material, leads sessions, tracks defects to closure), <b>recorder</b> (records defects, time and effort data), <b>reviewers</b> (review and give specific suggestions).',
      'Process: <b>planning → review preparation (and overview) → review meeting → rework and follow-up</b>. Team of 5-7 works best; fewer than 3 drastically reduces effectiveness.',
      'Records: review preparation log (defects, locations, criticality, time), review log (defects agreed by the author), review summary report (totals of defects and time).'));
    const L = lab(b, 'Review process, step by step', 'Click through the four activities.');
    const S = [['Planning', 'Author is ready; PM nominates a moderator (familiar with the work product) and, with him, the reviewers: author of the preceding work product, the user of this one, peers, authors of interfacing products. Moderator schedules meetings.'], ['Preparation & overview', 'Moderator convenes a brief preparation meeting: copies distributed, author gives an overview, objectives highlighted. Reviewers then review individually and record observations in review logs.'], ['Review meeting', 'Reviewers give comments from their logs, the author responds, others join in. The recorder scribes all agreed defects and the review statistics in the review log.'], ['Rework & follow-up', 'Author fixes all issues and prepares a rejoinder; the corrected product is circulated; a final brief meeting checks every logged issue is resolved; a summary report is prepared.']];
    const fl = h('div', { class: 'flowline' }); L.add(fl); const t = h('div', { class: 'ivtxt' }); L.add(t); let i = 0;
    const d = () => { fl.innerHTML = ''; S.forEach((s, k) => { fl.append(h('button', { class: 'st' + (k === i ? ' on' : ''), style: 'cursor:pointer', onclick: () => { i = k; d(); } }, (k + 1) + ' · ' + s[0])); if (k < 3) fl.append(h('span', { class: 'ar' }, '→')); }); t.innerHTML = `<b>${S[i][0]}</b>: ${S[i][1]}`; }; d();
    H(b, TRAP('Correct order: Planning, Review preparation, Review meeting, Rework and follow-up (2026 A8 Q10).', 'Review is MORE cost-effective than testing, and it is a static (not dynamic) technique (2019 W8 Q10).'));
  } });

page({ id: 't-codereview', wk: 9, topic: 1, stars: 3, lec: [41], title: 'Code walkthrough, inspection & cleanroom', kw: 'code review walkthrough inspection cleanroom IBM formal verification commonly made errors syntax logical algorithmic debugging', lede: 'Two ways to read code for errors without running it, and one radical method that bans programmers from running their own code at all.',
  render(b) {
    H(b, MUST('Code review is done <b>after the module compiles successfully</b> (syntax errors gone) and before testing. It targets <b>logical, algorithmic and programming</b> errors, not syntax errors.',
      'Why cheaper than testing: removing an error = testing (find a failure) + <b>debugging</b> (locate the error, the most laborious step) + correction. Reviews detect the error directly, skipping debugging.',
      '<b>Walkthrough</b>: informal; a few members select test cases and <b>hand-simulate</b> execution; 3-7 members; discuss discovery, not fixes; managers should not attend.',
      '<b>Inspection</b>: examine code for <b>commonly made errors</b> (checklist from the organisation\'s error statistics) and adherence to coding standards; programmer gets feedback on style, algorithm, technique.',
      '<b>Cleanroom</b> (IBM, analogy with semiconductor clean rooms): walkthroughs, inspection, <b>formal verification</b>; programmers may <b>not test their code by executing it</b> (only syntax checks with a compiler). Pros: more reliable, maintainable code and docs. Cons: time-consuming for simple errors; some errors may escape.',
      'A review meeting identifies errors only: no solutions, no blame (the product, not the producer, is reviewed).'));
    sorter(b, 'Game: who catches it?', 'The compiler catches syntax; inspection hunts the classic programmer mistakes that compile fine.', [['comp', 'Compiler (syntax)'], ['insp', 'Code inspection target']], [
      ['Missing semicolon', 'comp'], ['Misspelt keyword "whle"', 'comp'], ['Undeclared identifier', 'comp'],
      ['Use of an uninitialised variable', 'insp'], ['Wrong logical operator or precedence', 'insp'], ['Non-terminating loop', 'insp'], ['Array index out of bounds', 'insp'], ['Incompatible assignment', 'insp'], ['Improper storage allocation / deallocation', 'insp'], ['Actual vs formal parameter mismatch', 'insp'], ['Jump into a loop', 'insp'], ['Improper modification of a loop variable', 'insp'], ['Procedure modifies a formal parameter called with a constant', 'insp']]);
    const L = lab(b, 'Mini inspection', 'Read the function as an inspector with the common-errors checklist. Tick every line that has a defect, then check.');
    const code = [['int sum_pos(int a[], int n) {', 0], ['  int s, i;', 1, 'Uninitialised variable: s is never set to 0 before use.'], ['  for (i = 0; i <= n; i++)', 1, 'Array index out of bounds: i <= n reads a[n].'], ['    if (a[i] > 0 || a[i] < 100)', 1, 'Incorrect logical operator: || makes the test always true; && was meant.'], ['      s = s + a[i];', 0], ['  return s;', 0], ['}', 0]];
    const box = h('div', { style: 'font:600 .95rem var(--f-mono);display:grid;gap:3px' }); L.add(box); const chk = []; code.forEach(([t], i) => { const c = h('input', { type: 'checkbox' }); chk.push(c); box.append(h('label', { class: 'opt', style: 'margin:0;padding:4px 8px' }, c, h('span', {}, t))); });
    const res = h('div', { class: 'ivtxt' }); L.add(h('button', { class: 'btn primary', onclick: () => { let ok = 0; code.forEach(([t, bad, why], i) => { const lab2 = chk[i].parentNode; lab2.classList.remove('right', 'wrong'); if (bad) lab2.classList.add('right'); else if (chk[i].checked) lab2.classList.add('wrong'); if (!!bad === chk[i].checked) ok++; }); res.innerHTML = `${ok}/${code.length} lines judged correctly.<br>` + code.filter(c => c[1]).map(c => '• ' + c[2]).join('<br>') + '<br>None of these is a syntax error: the code compiles.'; } }, 'Check')); L.add(res);
    H(b, TRAP('Code review comes after coding and COMPILING, not after unit testing (2026 A9 Q1).', 'Cleanroom does not use execution-based testing by programmers (2026 A9 Q2).', 'A review meeting does not seek solutions or identify who is responsible (2026 A9 Q3).', 'Code review does not target syntax errors (2019 W9 Q1).'));
  } });

page({ id: 't-visual', wk: 9, topic: 1, stars: 2, lec: [42], title: 'Gantt, slip & timeline charts; cost monitoring', kw: 'Gantt chart today cursor slip chart slip line timeline chart cost monitoring cumulative expenditure', lede: 'Three pictures of progress. Gantt and slip charts are snapshots; only the timeline chart shows how the targets themselves moved.',
  render(b) {
    H(b, MUST('<b>Gantt chart</b> (Henry Gantt): bar per activity along a time line, often with float (unshaded "lax time"); reported progress is shaded and a <b>today cursor</b> shows what is ahead or behind. Useful for <b>resource planning</b>; PERT chart for monitoring timely progress.',
      '<b>Slip chart</b>: a line joins the actual progress of each activity at "today"; <b>the more the slip line bends, the greater the variation from the plan</b>; successive lines bending less = improving; very jagged = reschedule.',
      '<b>Timeline chart</b>: records and displays how <b>targets have changed</b> through the project (planned time across, elapsed time down); shows slippage of the completion date over the project\'s life; useful in execution and in the post-implementation review.',
      '<b>Cost monitoring</b>: a project can be late but under budget (staff not deployed) or on time but over budget (extra resources): monitor both. A cumulative expenditure chart becomes meaningful with projected future costs (cost of uncompleted work added).'));
    const L = lab(b, 'Gantt chart vs slip chart at "today"', 'Set how far each module\'s code-and-test has progressed at the end of week 17. The slip line connects the actual progress points.');
    const acts = [['Code & test A', 12, 20], ['Code & test B', 13, 21], ['Code & test C', 14, 22], ['Code & test D', 12, 18]]; const prog = [6, 2, 1, 6];
    const ctl = h('div', { class: 'ctls' }); L.add(ctl); acts.forEach((a, i) => { const id = 'gp' + i, out = h('output', {}, prog[i] + ' wk'), inp = h('input', { type: 'range', min: 0, max: a[2] - a[1], value: prog[i], id }); inp.addEventListener('input', () => { prog[i] = +inp.value; out.textContent = inp.value + ' wk'; d(); }); ctl.append(h('div', { class: 'ctl' }, h('label', { for: id }, a[0] + ' done'), inp, out)); });
    const box = h('div', { class: 'netwrap' }); L.add(box); const out = h('div', { class: 'ivtxt' }); L.add(out); const today = 17;
    function d() { const gx = v => 120 + (v - 10) * 40; let s = `<svg class="gantt" viewBox="0 0 640 ${acts.length * 40 + 40}">`; for (let t = 10; t <= 22; t++) s += `<line class="ax" x1="${gx(t)}" y1="0" x2="${gx(t)}" y2="${acts.length * 40}"/><text class="axt" x="${gx(t)}" y="${acts.length * 40 + 16}" text-anchor="middle">${t}</text>`; const pts = []; acts.forEach((a, i) => { const y = i * 40 + 10, px = a[1] + prog[i]; s += `<text x="4" y="${y + 13}">${a[0]}</text><rect class="bar" x="${gx(a[1])}" y="${y}" width="${(a[2] - a[1]) * 40}" height="16" rx="3" style="opacity:.3"/><rect class="bar" x="${gx(a[1])}" y="${y}" width="${prog[i] * 40}" height="16" rx="3"/>`; pts.push([gx(px), y + 8]); });
      s += `<line class="today" x1="${gx(today)}" y1="0" x2="${gx(today)}" y2="${acts.length * 40}"/><text x="${gx(today) + 3}" y="10" style="fill:var(--warn);font-weight:800">today</text><polyline points="${gx(today)},0 ${pts.map(p => p.join(',')).join(' ')} ${gx(today)},${acts.length * 40}" style="fill:none;stroke:var(--ch-i);stroke-width:2.5"/></svg>`; box.innerHTML = s;
      const dev = acts.map((a, i) => a[1] + prog[i] - today), bend = dev.reduce((m, x) => m + Math.abs(x), 0); out.innerHTML = acts.map((a, i) => `${a[0]}: ${dev[i] > 0 ? '<b style="color:var(--good)">ahead ' + dev[i] + '</b>' : dev[i] < 0 ? '<b style="color:var(--bad)">behind ' + (-dev[i]) + '</b>' : 'on schedule'}`).join(' · ') + `<br>Total bend of the slip line: <b>${bend}</b> weeks. ${bend > 6 ? 'Very jagged: rescheduling needed.' : bend ? 'Some deviation.' : 'Straight line: exactly on plan.'}`; }
    d();
    const L2 = lab(b, 'Timeline chart (DPM example, end of week 6)', 'Planned completion dates run across; each week down, the manager re-states the targets. Lines bending right = target dates slipping. The final activity ends up 7 days late.');
    const tl = [['Analyse existing system', [13, 13, 13, 13, 13, 13], 3], ['Obtain user requirements', [24, 27, 27, 27, 27, 27], 6], ['Issue tender', [41, 44, 44, 47, 47, 48], null], ['Draft tender', [36, 39, 39, 42, 42, 43], null], ['Specify system', [31, 34, 34, 34, 36, 37], null]];
    const sc = L2.scope({ xmin: 10, xmax: 50, ymin: -6.5, ymax: 0.5, xt: 8, yt: 6, h: 240, xl: 'planned completion (working days)', yl: 'elapsed weeks (down)', yfmt: v => 'wk ' + Math.round(-v) });
    sc.draw(tl.map((r, i) => ({ x: r[1], y: r[1].map((_, k) => -k - 0.5), c: ['--ch-d', '--ch-v', '--ch-i', '--ch-b', '--ch-x'][i], w: 2.2, dots: 3 })), { t: tl.map((r, i) => ({ x: r[1][5] + 0.5, y: -5.6 + (i % 2) * 0.3, s: r[0].split(' ')[0], c: ['--ch-d', '--ch-v', '--ch-i', '--ch-b', '--ch-x'][i] })) });
    L2.add(h('p', { class: 'cap' }, 'Illustrative redraw of the lecture chart: vertical segments = target unchanged that week; diagonal steps = the manager pushed the target date. Analysing why targets moved helps future estimation.'));
    H(b, TRAP('The chart that records how targets changed = timeline chart (2026 A9 Q4, 2019 W9 Q5).', 'Slip chart: MORE bend = GREATER variation (2019 W9 Q4).', 'Gantt chart = resource planning; PERT = monitoring timely progress (AI mock 3 Q7).'));
  } });

page({ id: 't-eva', wk: 9, topic: 1, stars: 3, lec: [43, 44], title: 'Earned value analysis', kw: 'earned value EV BCWP planned value PV BCWS actual cost AC ACWP schedule variance cost variance time variance SPI CPI EAC BAC TEAC SAC 0/100 50/50 75/25 milestone percentage complete baseline budget', lede: 'One number for "how much of the planned work is really done", measured in the plan\'s own money. Five formulas and you can read any project\'s health.',
  gens: ['eva-sv', 'eva-cpi', 'eva-eac', 'eva-teac', 'eva-pct'],
  render(b) {
    H(b, MUST('Originated in the US Department of Defense. <b>PV</b> (planned value, BCWS) = budgeted cost of work scheduled by now. <b>EV</b> (earned value, BCWP) = budgeted cost of work actually performed = the <b>total value credited</b> to the project. <b>AC</b> (ACWP) = actual cost of the work performed.',
      '<b>SV = EV − PV</b> (negative ⇒ behind schedule). <b>CV = EV − AC</b> (negative ⇒ over cost). <b>TV</b> = time when the current EV was planned − time now (negative ⇒ late).',
      '<b>SPI = EV/PV</b>, <b>CPI = EV/AC</b>: < 1 is bad (slower / costlier than planned), > 1 is good.',
      '<b>EAC = BAC/CPI</b> (revised cost forecast); <b>TEAC = SAC/SPI</b> (revised duration). Lecture: CPI 0.64, BAC £100,000 → EAC £156,250; SPI 0.88, SAC 23 months → 26.14 months.',
      'Crediting partially complete tasks: <b>0/100</b> (preferred for software), <b>50/50</b> (false sense of security), <b>75/25</b> (equipment purchase), <b>milestone</b>, <b>percentage complete</b> (only when objectively measurable, e.g. records typed into a database).',
      'Why EVA is not universal in software: "a half-built house has value, a half-built program has none" (a misunderstanding: EVA tracks budgeted cost of completed work).'));
    const L = lab(b, 'EVA calculator', 'Defaults are the lecture example: PV £40,000, EV £35,000, AC £55,000, BAC £100,000, SAC 23 months.');
    const v = { pv: 40000, ev: 35000, ac: 55000, bac: 100000, sac: 23 };
    const inp = h('div', { class: 'inputs' }); L.add(h('div', { class: 'calc' }, inp)); [['pv', 'PV (BCWS)'], ['ev', 'EV (BCWP)'], ['ac', 'AC (ACWP)'], ['bac', 'BAC'], ['sac', 'SAC (months)']].forEach(([k, l]) => { const i = h('input', { type: 'number', value: v[k], step: 'any' }); i.addEventListener('input', () => { v[k] = +i.value; d(); }); inp.append(h('label', {}, l, i)); });
    const ro = L.readout(); const sc = L.scope({ xmin: 0.4, xmax: 1.6, ymin: 0.4, ymax: 1.6, xt: 6, yt: 6, h: 260, xl: 'SPI (schedule)', yl: 'CPI (cost)' }); const st = h('div', { class: 'ivtxt' }); L.add(st);
    function d() { const sv = v.ev - v.pv, cv = v.ev - v.ac, spi = v.ev / v.pv, cpi = v.ev / v.ac; ro([['SV = EV − PV', fmt(sv, 0)], ['CV = EV − AC', fmt(cv, 0)], ['SPI = EV/PV', spi.toFixed(2)], ['CPI = EV/AC', cpi.toFixed(2)], ['EAC = BAC/CPI', fmt(v.bac / cpi, 0)], ['TEAC = SAC/SPI', fmt(v.sac / spi, 2)]]);
      sc.draw([{ x: [1, 1], y: [0.4, 1.6], c: '--muted', w: 1, dash: [4, 4] }, { x: [0.4, 1.6], y: [1, 1], c: '--muted', w: 1, dash: [4, 4] }, { x: [Math.max(.42, Math.min(1.58, spi))], y: [Math.max(.42, Math.min(1.58, cpi))], c: '--ch-i', dots: 7, w: 0 }], { t: [{ x: 1.05, y: 1.5, s: 'ahead & under budget', c: '--good' }, { x: 0.43, y: 1.5, s: 'behind & under budget' }, { x: 1.05, y: 0.47, s: 'ahead & over budget' }, { x: 0.43, y: 0.47, s: 'behind & over budget', c: '--bad' }] });
      st.innerHTML = `Status: <b>${spi < 1 ? 'behind schedule' : spi > 1 ? 'ahead of schedule' : 'on schedule'}</b> and <b>${cpi < 1 ? 'over budget' : cpi > 1 ? 'under budget' : 'on budget'}</b>. For every rupee spent you get ${cpi.toFixed(2)} rupees of planned work.`; }
    d();
    const L2 = lab(b, 'How much value does a half-done task earn?', 'A task with PV Rs. 10,000 is scheduled to finish now. Slide how complete it is and compare the five crediting techniques (milestones at 25 %, 50 %, 75 %).');
    const v2 = controls(L2.body, [{ k: 'p', label: 'Actually complete', min: 0, max: 100, v: 90, d: 0, unit: '%' }, { k: 'ac', label: 'Actual cost (Rs.)', min: 0, max: 15000, step: 500, v: 8000, d: 0 }], () => d2()); const tb = h('div'); L2.add(tb);
    function d2() { const p = v2.p, PV = 10000, rows = [['0/100', p === 100 ? PV : 0, 'nothing until finished (preferred for software)'], ['50/50', p === 0 ? 0 : p === 100 ? PV : PV / 2, '50 % on start, rest on completion'], ['75/25', p === 0 ? 0 : p === 100 ? PV : PV * .75, '75 % on start/delivery (equipment)'], ['Milestone', PV * Math.floor(p / 25) / 4, 'value per milestone reached'], ['% complete', PV * p / 100, 'only if progress is objectively measurable']]; tb.innerHTML = TBL(['Technique', 'EV', 'SV = EV − PV', 'CV = EV − AC', 'Idea'], rows.map(r => [r[0], fmt(r[1], 0), fmt(r[1] - PV, 0), fmt(r[1] - v2.ac, 0), r[2]])); }
    d2();
    const L3 = lab(b, 'Earned value tracking chart', 'Planned value follows the baseline budget; EV and AC are recorded until "now". The horizontal gap between the PV curve and the current EV is the time variance.');
    const v3 = controls(L3.body, [{ k: 'eff', label: 'Productivity vs plan', min: .5, max: 1.3, step: .05, v: .8, d: 2 }, { k: 'cost', label: 'Cost per unit of work vs plan', min: .7, max: 1.6, step: .05, v: 1.25, d: 2 }, { k: 'now', label: 'Now (month)', min: 2, max: 20, v: 11, d: 0 }], () => d3());
    const sc3 = L3.scope({ xmin: 0, xmax: 24, ymin: 0, ymax: 110, xt: 8, yt: 5, h: 240, xl: 'month', yl: '% of budget' }); L3.legend([['PV (baseline)', '--ch-v'], ['EV', '--ch-d'], ['AC', '--ch-i']]); const ro3 = L3.readout();
    function d3() { const pv = t => 100 / (1 + Math.exp(-(t - 11) / 3.2)) - 100 / (1 + Math.exp(11 / 3.2)), N = v3.now, ev = t => pv(t * v3.eff), ac = t => ev(t) * v3.cost; const xs = [], e = [], a = []; for (let t = 0; t <= N; t += .25) { xs.push(t); e.push(ev(t)); a.push(ac(t)); } let tv = N; for (let t = 0; t <= 24; t += .01) if (pv(t) >= ev(N)) { tv = t; break; } sc3.draw([{ fn: pv, c: '--ch-v', dash: [6, 4] }, { x: xs, y: e, c: '--ch-d', w: 2.5 }, { x: xs, y: a, c: '--ch-i', w: 2.5 }], { v: [{ x: N, t: 'now' }, { x: tv, t: 'EV was planned here', c: '--ch-d', dy: 14 }] }); ro3([['SV', fmt(ev(N) - pv(N), 1) + ' %'], ['CV', fmt(ev(N) - ac(N), 1) + ' %'], ['TV', fmt(tv - N, 2) + ' months'], ['SPI', (ev(N) / pv(N)).toFixed(2)], ['CPI', (ev(N) / ac(N)).toFixed(2)]]); }
    d3();
    H(b, `<h2>Worked examples from the lectures</h2>${TBL(['Example', 'Working', 'Result'], [['Tasks: specify 5 days, code 8, test 6. Beginning of day 20, everything except testing done.', 'PV = 19, EV = 13; SV = 13 − 19; SPI = 13/19', 'SV −6, SPI 0.68 (behind)'], ['Same, specify took 3 days, code 4.', 'AC = 7; CV = 13 − 7; CPI = 13/7; EAC = 19,000/1.86', 'CV +6, CPI 1.86, EAC ≈ £10,215'], ['1-year project, Rs. 1,00,000. After 3 months 30 % complete, Rs. 40,000 spent.', 'PV = 25 % × 1 lakh = 25,000; EV = 30,000; CPI = 30k/40k; SPI = 30k/25k', 'CPI 0.75 (over budget), SPI 1.2 (ahead)'], ['EV £19,000 planned for 1 April, reached on 1 July', 'TV = planned time − actual time', 'TV −3 months'], ['Baseline budget (0/100)', '"Specify overall system" 34 person-days is credited only at day 34', 'step-shaped EV curve']])}
    ${TRAP('Total value credited to a project = earned value (2026 A9 Q5).', 'Records typed into a database → percentage complete technique (2026 A9 Q6).', 'SV = EV − PV (not PV − EV): PV 55k, EV 45k → −10,000 (2026 A9 Q7). SPI = EV/PV = 40/50 = 0.80 (A9 Q8).', 'Negative CV ⇒ over cost (A9 Q9). CPI = EV/AC, not AC/EV (2019 W9 Q8).', '0/100 with a task 90 % done: EV = 0 (AI mock 4 Q27).')}`);
  } });

page({ id: 't-backontrack', wk: 9, topic: 1, stars: 2, lec: [45], title: 'Prioritising monitoring & getting back on target', kw: 'prioritising monitoring critical path free float high risk critical resources shorten critical path adding resources overtime reallocate reduce scope reduce quality precedence overlap split activities renegotiate deadline', lede: 'Not every activity deserves the same attention, and when a project slips there are only a few honest levers.',
  render(b) {
    H(b, MUST('Monitor most closely: <b>critical path activities</b>, activities with <b>no free float</b>, activities with <b>less than a specified float</b> (e.g. < 1 week), <b>high-risk</b> activities (in PERT: high duration variance), activities using <b>critical resources</b>.',
      'Getting back on target, two strategies: <b>shorten the critical path</b> (add resources, especially staff; increase use of current resources: overtime, evenings; reallocate staff to critical activities; reduce scope; reduce quality) and <b>reconsider precedence requirements</b> (overlap, start some activities earlier, split activities).',
      'Speeding up non-critical activities does NOT bring the end date forward. Adding staff reduces negative SV at the price of a more negative CV. Shortening the critical path often makes another path critical.',
      'Altering precedence (e.g. coding before design is final) risks quality and rework. First option in a nutshell: renegotiate the deadline.'));
    const L = lab(b, 'You are 4 weeks late: pick your levers', 'Starting point: critical path 30 weeks, deadline 26 weeks, a parallel path of 27 weeks. Each lever has a time effect, a cost and a risk.');
    const lev = [['Add 2 experienced developers to critical coding', 2, 400, 'cost ↑; small modules do not speed up with more people'], ['Overtime on critical activities', 1.5, 150, 'stress ↑ if prolonged'], ['Move staff from non-critical to critical tasks', 1, 0, 'uses float on other paths'], ['Reduce scope (defer two reports)', 2, -50, 'needs client agreement'], ['Cut system testing short (reduce quality)', 2, -80, 'more corrective work after go-live'], ['Start user training before system test ends', 1.5, 0, 'training may need redoing'], ['Speed up a non-critical activity', 0, 100, 'no effect on the end date!']];
    const on = lev.map(() => false); const bx = h('div'); L.add(bx); const ro = L.readout(); const nt = h('div', { class: 'ivtxt' }); L.add(nt);
    function d() { bx.innerHTML = ''; lev.forEach((l, i) => { const c = h('input', { type: 'checkbox', checked: on[i] }); c.addEventListener('change', () => { on[i] = c.checked; d(); }); bx.append(h('label', { class: 'opt', style: 'margin:4px 0' }, c, h('span', {}, `${l[0]} — ${l[1] ? '−' + l[1] + ' wk' : '0 wk'}, ${l[2] >= 0 ? '+' : ''}${l[2]}k Rs.`))); }); let gain = 0, cost = 0; const risks = []; lev.forEach((l, i) => { if (on[i]) { gain += l[1]; cost += l[2]; risks.push(l[3]); } }); const cp = 30 - gain, T = Math.max(cp, 27 - (on[2] ? 0 : 0)); ro([['critical path now', fmt(cp, 1) + ' wk'], ['project end (parallel path 27)', fmt(Math.max(cp, 27), 1) + ' wk'], ['deadline', '26 wk'], ['extra cost', fmt(cost, 0) + 'k Rs.']]); nt.innerHTML = (Math.max(cp, 27) > 26 ? `Still late. ${cp <= 27 ? 'The <b>parallel path (27 wk) is now critical</b>: shortening the old critical path alone no longer helps.' : ''}` : 'On target.') + (risks.length ? '<br>Watch out: ' + risks.join('; ') + '.' : ''); }
    d();
    H(b, TRAP('Speeding up non-critical path activities may not help (2026 A9 Q10, 2019 W9 Q10).', 'Coding a module before its design is complete: possible but foolhardy (quality, rework risk) (AI mock 2 Q29).'));
  } });

page({ id: 't-scm', wk: 10, topic: 1, stars: 3, lec: [46, 47], title: 'Change control & configuration management', kw: 'change control baseline request for change RFC configuration librarian software configuration management version revision release variant baseline system accounting concurrent access controlled pre-controlled uncontrolled reserve restore change control board CCB release management SCCS RCS delta GanttProject Microsoft Project Primavera portfolio', lede: 'Every work product keeps changing during development and maintenance. Configuration management keeps those changes controlled, traceable and reversible.',
  render(b) {
    H(b, MUST('A <b>baseline</b> is a configuration formally reviewed and agreed on, serving as the basis for further development; changes to baselined items need stringent control.',
      '<b>Configuration</b> = state of all work products under configuration control (<b>configuration items</b>). <b>Version</b> = a configuration at a point in time (version m.n = version m, release n). <b>Revision</b> = successive state of ONE configuration item. <b>Variant</b> = versions meant to co-exist (different OS/hardware, novice/pro editions).',
      'Purposes of SCM: avoid <b>concurrent access</b> problems (overwrites), <b>undo changes</b>, <b>system accounting</b> (who changed what, when), <b>handle variants</b> (fix a bug once for all), accurate <b>project status</b>, <b>prevent unauthorised access</b>. It also avoids keeping many copies of the same files.',
      'Process: <b>configuration identification</b> (work products are <b>controlled</b>, <b>pre-controlled</b> (will be controlled) or <b>uncontrolled</b>; controllable = controlled + pre-controlled) and <b>configuration control</b> (<b>reserve</b> a private copy; only one person can reserve an item; <b>restore</b> needs <b>CCB</b> approval).',
      '<b>SCCS</b> and <b>RCS</b> (UNIX): manage versions of <b>text</b> files by storing the original + <b>deltas</b> (save disk space); check-out/check-in; <b>cannot handle binary files</b>; revisions numbered 1.1, 1.2…; variants by forking.',
      'PM tools: <b>GanttProject</b> (free, GPL) and ProjectLibre do NOT support portfolio management; <b>Microsoft Project</b> and <b>Primavera</b> (SureTrack entry-level, P6 advanced) do.'));
    const L = lab(b, 'Change control procedure (7 steps)', 'Follow a request for change (RFC) from a user to the operational release.');
    const S = ['One or more users perceive the need for a change.', 'User management decide the change is valid and worthwhile and pass it to development management (single authorised channel for RFCs).', 'A developer is assigned to assess the practicality and cost of the change (and which products are affected).', 'Development management report the cost back; user management decide whether to go ahead. (A project board may prioritise RFCs; PMs may accept minor changes within targets.)', 'One or more developers are authorised to make copies of the components to be modified (through the configuration librarian).', 'The copies are modified (code changed, recompiled, tested); a test version may be released for user acceptance testing.', 'When users are satisfied, operational release is authorised and the master configuration items are updated.'];
    let i = 0; const box = h('div', { class: 'ivtxt' }); L.add(h('div', { class: 'stepper' }, h('button', { class: 'btn', onclick: () => { i = Math.max(0, i - 1); d(); } }, '←'), h('button', { class: 'btn primary', onclick: () => { i = Math.min(S.length - 1, i + 1); d(); } }, 'Next step →'))); L.add(box); const d = () => { box.innerHTML = `<b>Step ${i + 1} of 7</b>: ${S[i]}`; }; d();
    const L2 = lab(b, 'Reserve / restore simulator', 'Two developers, one controlled module. Try to make both reserve it.');
    let holder = null, ver = 1.1, staged = null; const log = h('div', { class: 'ivtxt' }); const ro = L2.readout();
    const act = (who, op) => { if (op === 'reserve') { if (holder) { log.innerHTML = `${who} tries to reserve MOD — <b>refused</b>: reserved by ${holder}. Concurrent-access problem prevented.`; } else { holder = who; log.innerHTML = `${who} reserves MOD ${ver.toFixed(1)}: a private copy is created in ${who}'s workspace.`; } } else if (op === 'edit') { if (holder !== who) log.innerHTML = `${who} has no private copy.`; else { staged = who; log.innerHTML = `${who} modifies the private copy.`; } } else if (op === 'restore') { if (holder !== who || staged !== who) log.innerHTML = 'Nothing to restore.'; else { log.innerHTML = `${who} asks to restore. <b>CCB reviews</b>: motivated? effects documented? consistent with others' changes? tested? → approved. The PM restores it: MOD ${(ver + .1).toFixed(1)} (SCCS stores only the delta).`; ver += .1; holder = null; staged = null; } } ro([['current revision', 'MOD ' + ver.toFixed(1)], ['reserved by', holder || '—']]); };
    ['Asha', 'Ravi'].forEach(w => L2.add(h('div', { class: 'flowline' }, h('b', {}, w + ':'), h('button', { class: 'btn', onclick: () => act(w, 'reserve') }, 'reserve'), h('button', { class: 'btn', onclick: () => act(w, 'edit') }, 'edit copy'), h('button', { class: 'btn', onclick: () => act(w, 'restore') }, 'restore'))));
    L2.add(log); act('', 'none');
    sorter(b, 'Game: name the SCM term', 'DPM lectures 46-47.', [['ver', 'Version'], ['rev', 'Revision'], ['var', 'Variant'], ['base', 'Baseline'], ['acc', 'System accounting']], [
      ['Configuration that existed at a certain point in time', 'ver'], ['Successive state of one configuration item after each update', 'rev'], ['Unix and Windows builds of the same package', 'var'], ['Novice, professional and enterprise editions', 'var'], ['Configuration formally reviewed and agreed, basis for further work', 'base'], ['Who changed which item, what, and when', 'acc']]);
    H(b, `${TBL(['Tool', 'Portfolio mgmt', 'Web-based', 'Scheduling', 'Cost mgmt', 'Resource mgmt', 'Open source'], [['GanttProject', '', '', '✔', '', '✔', '✔'], ['Microsoft Project', '✔', '✔', '✔', '✔', '✔', ''], ['Primavera SureTrack', '✔', '✔', '✔', '✔', '✔', '']])}
    <p>Duties of the configuration librarian/manager: identify all items subject to change control; set up and manage the central repository of master copies; run formal change procedures; keep records of who has access and the status of each item (under development, under test, released). <b>Release management</b> systemises releasing and installing new versions (changed components and dependencies retrieved as a group, no unnecessary retrievals).</p>
    ${TRAP('All work products (SRS, DFDs, UML, code, test cases) change during development AND maintenance (2026 A10 Q1).', 'Post-controlled and semi-controlled are NOT categories (2026 A10 Q3).', 'SCCS cannot handle binary files (2026 A10 Q4, 2019 W10 Q4).', 'A user reporting a configuration error during installation can still happen with perfect CM use (2019 W10 Q2).', 'Version = configuration (whole product) at a time; revision = state of one item (AI mock 5 Q29).')}`);
  } });

page({ id: 't-contract', wk: 10, topic: 1, stars: 3, lec: [48, 49], title: 'Contract management', kw: 'bespoke off the shelf COTS fixed price time and materials fixed price per unit delivered function point open tendering restricted negotiated single requirements evaluation plan invitation to tender memoranda of agreement value for money contract checklist escrow acceptance services goods', lede: 'Buying software instead of building it moves the risk into the contract. Know the three contract types by payment, the three tendering procedures and the checklist.',
  gens: ['fp-price'],
  render(b) {
    H(b, MUST('By what is bought: <b>bespoke</b> (created specially for one customer), <b>off-the-shelf</b> (bought "as is", shrink-wrapped), <b>customised off-the-shelf (COTS)</b> (core system customised for the client).',
      'By payment: <b>fixed price</b> (price fixed at signing; requirements fixed up front), <b>time and materials</b> (fixed rate per unit of effort, e.g. per staff-hour), <b>fixed price per unit delivered</b> (size, usually in <b>function points</b>, × price per unit).',
      'Fixed price: ✔ known expenditure, supplier motivated to be cost-effective; ✘ supplier adds contingency, requirements hard to change, changes costly, threat to quality. T&M: ✔ easy to change requirements, no price pressure helps quality; ✘ customer absorbs all risk, no incentive for supplier efficiency. Per-unit: ✔ understandable, comparable, emerging functionality priced, supplier efficient; ✘ size measurement (independent FP counter), how to charge changed requirements.',
      'Tendering: <b>open</b> (any supplier can bid; same evaluation for all; compulsory for some public bodies; time-consuming), <b>restricted</b> (only invited suppliers; can cut the list at any stage), <b>negotiated/single</b> (one supplier, e.g. emergency after a fire, or extension by the original supplier; risk of favouritism).',
      'Stages: requirements analysis → evaluation plan → invitation to tender → evaluation of proposals. <b>MoA</b>: technical proposals discussed, agreed solution frozen, then tenders judged on <b>price</b>.',
      'Contract checklist: definitions, form of agreement, goods and services, ownership of software (escrow), environment, customer commitments, acceptance procedures, standards (e.g. ISO 12207), project and quality management, timetable, price and payment.'));
    const L = lab(b, 'Fixed price per FP: slab pricing (lecture table)', 'A supplier charges more per FP for larger systems. Lecture example: 2700 FP → 2000 × 900 + 500 × 1000 + 200 × 1040 = Rs. 25,08,000.');
    const S = [[2000, 200, 700, 900], [2500, 240, 760, 1000], [3000, 260, 780, 1040], [3500, 270, 800, 1070], [4000, 280, 820, 1100], [4500, 300, 840, 1140], [5000, 330, 870, 1200]];
    const v = controls(L.body, [{ k: 'fp', label: 'System size (FP)', min: 100, max: 5000, step: 50, v: 2700, d: 0 }], () => d()); const tb = h('div'); L.add(tb); const ro = L.readout();
    function d() { let left = v.fp, lo = 0, tot = 0; const rows = []; S.forEach(([hi, ds, cd, t]) => { const n = Math.max(0, Math.min(left, hi - lo)); if (n) { rows.push([`${lo + 1}-${hi}`, n, 'Rs. ' + t, 'Rs. ' + fmt(n * t, 0)]); tot += n * t; left -= n; } lo = hi; }); tb.innerHTML = TBL(['Slab (FP)', 'FPs in slab', 'Total cost/FP', 'Charge'], rows); ro([['total price', 'Rs. ' + fmt(tot, 0)], ['average per FP', 'Rs. ' + fmt(tot / v.fp, 1)]]); }
    d();
    H(b, `${TBL(['FP count', 'Design cost/FP', 'Coding cost/FP', 'Total cost/FP'], S.map((s, i) => [(i ? S[i - 1][0] + 1 : 'up to ') + (i ? '-' : '') + s[0], s[1], s[2], s[3]]))}`);
    sorter(b, 'Game: which contract or tendering term?', 'Lectures 48-49 and the assignments.', [['bes', 'Bespoke system'], ['ots', 'Off-the-shelf'], ['tm', 'Time & materials'], ['fpu', 'Fixed price per unit delivered'], ['res', 'Restricted tendering'], ['neg', 'Negotiated / single tender']], [
      ['Created specially for one customer', 'bes'], ['Bought "as is"', 'ots'], ['Charged a fixed rate per staff-hour', 'tm'], ['Price = FP count × rate per FP', 'fpu'], ['Only specifically invited suppliers may bid', 'res'], ['Replace fire-damaged equipment quickly with one supplier', 'neg'], ['Extend an existing system with its original developer', 'neg'], ['Customer absorbs the risk of changing requirements', 'tm']]);
    H(b, `<h2>Evaluation and value for money</h2><p>Evaluation methods: reading/scrutinising proposals, interviews, demonstrations, site visits, practical tests (a volume test as last resort). Record clarifications in writing. Judge features by <b>value for money</b> rather than lowest bid. Lecture exercise: a feeder file saves 4 hours a month at £20/hour over 4 years = 4 × 20 × 12 × 4 = <b>£3,840</b> > £1,000 cost → worth it.</p>
    <p>Goods vs services in the contract: <b>goods</b> = equipment and consumables (with model numbers); <b>services</b> = training, documentation, installation, conversion of existing files, maintenance agreements, transitional insurance arrangements, telecom facilities. Ownership: can either party sell the software? copyright? <b>escrow</b> deposit of source code protects the client if the supplier goes out of business. Acceptance: accept only after user acceptance tests.</p>
    ${TRAP('Bought "as is" = off-the-shelf (2026 A10 Q6). Fixed price per unit → function point counting (A10 Q7). Restricted tendering → only invited suppliers (A10 Q8).', 'Equipment and consumables are NOT services (2026 A10 Q9, answer a and d).', 'Better quality is typically NOT expected from a fixed-price contract (2019 W10 Q7).', 'MoA freezes the technical solution so tenders compete on price (AI mock 4 Q17).')}`);
  } });

page({ id: 't-closeout', wk: 10, topic: 1, stars: 2, lec: [50], title: 'Project close-out', kw: 'project closure administrative contract closure premature termination reasons not properly closed lack of interest know-how emotional indecision problems client acceptance archiving financial closure post implementation review post mortem closeout report releasing staff', lede: 'Every project ends, successfully or prematurely. Closing it properly is what turns one project\'s experience into the next project\'s knowledge.',
  render(b) {
    H(b, MUST('Closure activities: <b>administrative closure</b> (deliverables achieved, know-how transferred, documented, archived) and <b>contract closure</b> (all contract terms with the customer and subcontractors met).',
      'Two reasons to close: all goals achieved, or the project is unlikely to meet its objectives (premature termination: lack of resources, changed business need, benefits no longer valid, incomplete requirements, regulatory change, obsolete technology, unacceptable risk).',
      'Why projects are not closed properly: <b>lack of interest</b> of the team, <b>underestimating how fast know-how is lost</b>, <b>emotional factors</b>, <b>indecision</b>. Problems: time and cost overrun, locked-up resources, stress on personnel.',
      'Closure process: <b>getting client acceptance → archiving deliverables → preserving know-how → financial closure → post-implementation review → review report → releasing staff</b> (last).',
      'Post-implementation review (post-mortem): survey → collect metrics → debriefing meeting → final review meeting and report → publish. Report: project description, what worked, what impeded, prescription for other projects.',
      'Closeout report: historical summary, survey results and performance data, final review results, variances, lessons learned, best practices, <b>recommendations for similar projects</b>.'));
    const L = lab(b, 'Put the close-out steps in order', 'Tap the steps in the order the lecture gives them.');
    const steps = ['Getting client acceptance', 'Archiving project deliverables', 'Preserving project know-how', 'Performing a financial closure', 'Performing post-implementation project review', 'Preparing post-implementation review report', 'Releasing staff'];
    const pool = h('div', { class: 'flowline' }), seq = h('div', { class: 'flowline', style: 'margin-top:8px' }), msg = h('div', { class: 'ivtxt' }); L.add(pool); L.add(seq); L.add(msg); let got = [];
    const d = () => { pool.innerHTML = ''; seq.innerHTML = ''; shuffle(steps.filter(s => !got.includes(s))).forEach(s => pool.append(h('button', { class: 'btn', onclick: () => { if (s === steps[got.length]) { got.push(s); msg.textContent = got.length === 7 ? 'Perfect order!' : 'Right.'; } else msg.innerHTML = `Not yet: "${s}" comes later. Next is step ${got.length + 1}.`; d(); } }, s))); got.forEach((s, i) => { seq.append(h('span', { class: 'st on' }, (i + 1) + '. ' + s)); }); }; d();
    L.add(h('button', { class: 'btn', onclick: () => { got = []; msg.textContent = ''; d(); } }, 'Restart'));
    H(b, `<p>Client acceptance: informal for a sister organisation or another department; <b>formal acceptance testing and written acceptance</b> for an external client. Archive electronically with a description of what is archived, the tools used, locations and contacts. Financial closure: reconcile capital and contingency budgets, book-transfer capital goods, complete subcontractor payments. Releasing staff: last meeting, assign people according to skills, celebrate and recognise performance.</p>
    <p>Issues at termination are emotional (team uncertainty about the next assignment, loss of interest; client loses interest or changes personnel) and intellectual (renegotiate deliverables, verify dropped items with the client, communicate the decision to all stakeholders).</p>
    ${TRAP('"Availability of a well-defined closure process" is NOT a reason for poor closure (2026 A10 Q10).', 'The closeout report DOES contain recommendations (2019 W10 Q9). Main aim of the post-project review: capture knowledge for future use (2019 W10 Q10).')}`);
  } });

/* ---- topics/w11.js ---- */
/* ===== Week 11 (lectures 51-55): quality, ISO 9000, SEI CMM ===== */
page({ id: 't-quality', wk: 11, topic: 1, stars: 3, lec: [35, 51], title: 'Software quality: QC, QA, TQM', kw: 'quality fitness of purpose Crosby attributes correctness reliability efficiency portability usability reusability maintainability inspection quality control statistical quality assurance process TQM process improvement', lede: 'Quality used to mean "inspect and reject". Modern quality means "fix the process and good products follow".',
  render(b) {
    H(b, MUST('Traditional definition: <b>fitness of purpose</b> ("quality is conformance to requirements", Crosby 1979). Not enough for software: a functionally correct product with an unusable UI or unmaintainable code is not a quality product.',
      'Quality attributes: <b>correctness, reliability, efficiency</b> (no wasteful use of disk, memory, CPU; meet response times), <b>portability, usability, reusability, maintainability</b>. Huge code size and hardware dependence are undesirable.',
      'Evolution: <b>product inspection</b> (pre-WWII: inspect and eliminate defects) → <b>quality control</b> (also find the causes; <b>statistical QC</b> infers process quality from samples) → <b>quality assurance</b> (if processes are good and followed rigorously, products are bound to be good) → <b>TQM</b> (continuous process improvement through measurement; redesign processes). Shift: product assurance → <b>process assurance</b>.',
      '<b>QA</b>: process-oriented, preventive, spans the whole life cycle. <b>QC</b>: product-oriented, detects defects in work products by testing, inspections, reviews.',
      'Process improvement: process changes to improve product quality, reduce costs, accelerate schedules. For design activities (software) people\'s capability also matters, not just the process.'));
    sorter(b, 'Game: QA or QC?', 'Quality assurance builds the process; quality control checks the product.', [['qa', 'Quality assurance (process)'], ['qc', 'Quality control (product)']], [
      ['Defining and documenting the development process', 'qa'], ['Process audits and process improvement', 'qa'], ['Preventing defects from occurring', 'qa'], ['Starts at project inception, spans the life cycle', 'qa'],
      ['Testing the software', 'qc'], ['Code inspection of a module', 'qc'], ['Identifying defects in delivered work products', 'qc'], ['Thoroughly test all work products before delivery', 'qc']]);
    H(b, `<div class="flowline"><span class="st">Product inspection</span><span class="ar">→</span><span class="st">Quality control (QC)</span><span class="ar">→</span><span class="st">Quality assurance (QA)</span><span class="ar">→</span><span class="st on">Total quality management (TQM)</span></div>
    <p>Many advances came from Japan and helped resurrect its economy. TQM goes beyond documenting processes: it optimises them through redesign. Nested view from the slides: software testing ⊂ software quality control ⊂ software quality assurance ⊂ TQM.</p>
    ${TRAP('QA is NOT limited to testing and does NOT start after coding (2026 A11 Q9). QC aims at defect detection, not process improvement (A11 Q10).', 'Modern QA focuses on process assurance (2019 W11 Q1). Difference QA vs QC: a good, documented process in place (2019 W11 Q8).')}`);
  } });

page({ id: 't-iso', wk: 11, topic: 1, stars: 3, lec: [52, 53], title: 'ISO 9000 & ISO 9001', kw: 'ISO 9000 9001 9002 9003 9000-3 certification registrar pre-assessment document review adequacy audit compliance audit registration surveillance requirements management responsibility shortcomings advertise products', lede: 'ISO 9000 certifies that an organisation has a documented quality process and follows it. Nothing more, nothing less.',
  render(b) {
    H(b, MUST('ISO (63-country consortium) published the 9000 series in 1987: guidelines for the production <b>process</b>, not the product. Premise: a good process gives good products.',
      '<b>ISO 9001</b>: design, development, production, servicing → applies to software development organisations. <b>ISO 9002</b>: production and servicing only (no design; e.g. steel or car manufacturing). <b>ISO 9003</b>: final inspection and testing only. <b>ISO 9000-3</b> (1991): guidelines for applying 9001 to software.',
      'Certification steps: <b>application</b> to a registrar → <b>pre-assessment</b> → <b>document review and adequacy audit</b> → <b>compliance audit</b> → <b>registration</b> → <b>continued surveillance</b>.',
      'A certified organisation can use the certificate in corporate advertisements but <b>not to advertise its products</b> (risks withdrawal): it certifies the process.',
      'ISO 9001 requirements include management responsibility, quality system, contract review, design control, document and data control, purchasing, process control, inspection and testing, corrective and preventive action, internal quality audits, training, servicing, statistical techniques.',
      'Shortcomings: requires a process to be followed but does not guarantee it is a good one, gives no guideline for defining one; certification not fool-proof; no international accreditation agency, so norms vary between registrars. ISO itself does not certify, issue certificates or accredit certification bodies.'));
    const L = lab(b, 'ISO certification process', 'Click each stage.');
    const S = [['Application', 'The organisation applies to an ISO 9000 registrar for registration.'], ['Pre-assessment', 'The registrar makes a rough assessment of the organisation.'], ['Document review & adequacy audit', 'The registrar reviews process and quality documents and suggests improvements.'], ['Compliance audit', 'The registrar checks whether its suggestions have been complied with.'], ['Registration', 'Certificate awarded after all previous phases.'], ['Continued surveillance', 'The registrar keeps monitoring the organisation periodically.']];
    const fl = h('div', { class: 'flowline' }), t = h('div', { class: 'ivtxt' }); L.add(fl); L.add(t); let i = 0; const d = () => { fl.innerHTML = ''; S.forEach((s, k) => { fl.append(h('button', { class: 'st' + (k === i ? ' on' : ''), style: 'cursor:pointer', onclick: () => { i = k; d(); } }, (k + 1) + ' · ' + s[0])); if (k < S.length - 1) fl.append(h('span', { class: 'ar' }, '→')); }); t.innerHTML = `<b>${S[i][0]}</b>: ${S[i][1]}`; }; d();
    H(b, `<h2>Why software is awkward for ISO 9000</h2><p>ISO 9000 is generic (steel plants to service companies) and many clauses use generic terms; the only raw material in software is data, so the many clauses about raw-material control are irrelevant. Hence ISO 9000-3. ISO 9000:2000 added process performance metrics, continual process improvement and tracking customer satisfaction.</p>
    <p>Why get certified: many contracts insist on it; it requires a well-documented process, contributes to repeatable higher-quality software, makes development focused, efficient and cost-effective, points out weaknesses and sets the framework for an optimal process and TQM.</p>
    ${TRAP('ISO 9001 emphasises management responsibility, a quality system and process control; it does NOT mandate a language or guarantee defect-free products (2026 A11 Q2).', 'Certification shows documented procedures are followed, but does not guarantee product quality; an ineffective process can still be certified (A11 Q3).', 'Requirement for certification: document the process being followed (2019 W11 Q6). For software organisations: ISO 9001 (2019 W11 Q2).')}`);
  } });

page({ id: 't-cmm', wk: 11, topic: 1, stars: 3, lec: [53, 54, 55], title: 'SEI CMM: five levels & KPAs', kw: 'SEI capability maturity model initial repeatable defined managed optimizing key process area capability evaluation software process assessment DoD Crosby ISO comparison', lede: 'The Capability Maturity Model ranks how mature a software organisation\'s process is, and tells it which process areas to fix to climb a level.',
  render(b) {
    H(b, MUST('Developed by the <b>SEI, Carnegie Mellon</b>, for the US <b>DoD</b> to judge likely contractor performance. Used for <b>capability evaluation</b> (choosing a contractor) and <b>software process assessment</b> (internal improvement). Based on Philip Crosby\'s work.',
      '<b>L1 Initial</b>: ad hoc, chaotic; success depends on individual heroics; schedules missed. <b>L2 Repeatable</b>: basic project management (cost, schedule tracking, size/cost estimation such as FP, COCOMO); success repeatable on <b>similar</b> projects; process not documented. <b>L3 Defined</b>: management and development processes defined and documented organisation-wide (ISO 9001 aims at this level); not measured. <b>L4 Managed</b>: quantitative quality goals; process and product measured and controlled; predictable. <b>L5 Optimizing</b>: continuous process improvement from measurements; defect prevention; innovations transferred.',
      'KPAs: <b>L2</b> requirements management, software project planning, project tracking and oversight, subcontract management, configuration management (quality assurance). <b>L3</b> process definition and documentation, training program, peer reviews. <b>L4</b> quantitative process management (measurements). <b>L5</b> <b>defect prevention, technology change management, process change management</b>.',
      'ISO 9001 vs CMM: ISO is a <b>certification</b> for all industries, single level, third-party, yearly re-certification, quotable officially; CMM is an <b>assessment</b>, software-specific, five levels with KPAs (gradual path), goes beyond QA towards TQM, no follow-up after reaching a level. ISO 9001 ≈ CMM level 3.'));
    const L = lab(b, 'Climb the maturity ladder', 'Click a level for its characteristics and key process areas.');
    const LV = [['1', 'Initial', 'Ad hoc and chaotic; no formal process or plans; different engineers follow their own process; success from heroics; frequent crises and fire-fighting; hard to recover when good people leave; schedules and budgets missed; progress not measured; defects proliferate.', 'No KPAs (starting point).'], ['2', 'Repeatable', 'Basic project management: tracking cost and schedule; size and cost estimation (FP, COCOMO); process ad hoc and not documented, may vary between projects, but earlier success on similar applications can be repeated. Disciplined process.', 'Requirements management, software project planning, project tracking & oversight, subcontract management, software configuration management.'], ['3', 'Defined', 'All management and development activities defined and documented; common organisation-wide understanding of activities, roles, responsibilities; standard, consistent process. Process and product qualities not yet measured. ISO 9001 aims here.', 'Process definition and documentation, training program, peer reviews.'], ['4', 'Managed', 'Quantitative quality goals set; process and product quality measured and used to control quality and evaluate project performance; variation within quantitative bounds: predictable.', 'Quantitative measurements, quantitative process management.'], ['5', 'Optimizing', 'Statistics analysed for continuous process improvement; known defect types prevented by tuning the process; lessons learned incorporated; best practices and innovations transferred across the organisation.', 'Defect prevention, technology change management, process change management.']];
    const lad = h('div', { class: 'ladder' }), out = h('div', { class: 'ivtxt' }); L.add(lad); L.add(out);
    LV.forEach(l => { const bt = h('button', { 'aria-pressed': 'false', onclick: () => { $$('button', lad).forEach(x => x.setAttribute('aria-pressed', 'false')); bt.setAttribute('aria-pressed', 'true'); out.innerHTML = `<b>Level ${l[0]} · ${l[1]}</b><br>${l[2]}<br><b>KPAs:</b> ${l[3]}`; } }, h('b', { class: 'lv' }, l[0]), h('span', {}, l[1])); lad.append(bt); });
    $$('button', lad)[0].click();
    sorter(b, 'Game: which level does this KPA belong to?', 'SW-CMM key process areas from the slides and assignments.', [['2', 'Level 2'], ['3', 'Level 3'], ['4', 'Level 4'], ['5', 'Level 5']], [
      ['Requirements management', '2'], ['Software project planning', '2'], ['Software project tracking and oversight', '2'], ['Subcontract management', '2'], ['Configuration management', '2'],
      ['Process definition and documentation', '3'], ['Training program', '3'], ['Peer reviews', '3'],
      ['Quantitative process management', '4'], ['Quantitative measurements', '4'],
      ['Defect prevention', '5'], ['Technology change management', '5'], ['Process change management', '5']]);
    H(b, `${TBL(['', 'ISO 9001', 'SEI CMM'], [['Nature', 'Certification', 'Assessment'], ['Scope', 'All industries', 'Software development'], ['Levels', 'Single level', 'Five levels (KPAs show how to move up)'], ['Follow-up', 'Yearly re-certification, surveillance', 'No follow-up after reaching a level'], ['Who', 'Third-party registrar; quotable in official documents', 'No certification; internal or limited use'], ['Aim', 'Quality assurance (≈ CMM level 3)', 'Beyond QA, towards TQM']])}
    <p>Implementing a defined process before a repeatable one is counterproductive: managers overwhelmed by schedule and budget pressure. Metrics deployed: estimated vs actual SLOC, issues raised in code inspection, defects in unit and system testing. Many CMMs proliferated (software, systems engineering, people, acquisition, IPD, security engineering…), causing confusion → CMMI.</p>
    ${TRAP('Level 1: ad hoc, success from individual effort, lowest level. Quantitative management is level 4; continuous improvement is level 5 (2026 A11 Q4).', 'Level 3: documented, standardised, organisation-wide (A11 Q5). Matching: L2 disciplined, L3 standard consistent, L4 predictable (A11 Q6).', 'Level 5 KPAs: defect prevention, technology change management, process change management. Quantitative process management is L4; project tracking and oversight is L2 (A11 Q7, Q8).', 'Small outsourcing start-up → aim for level 2 (2019 W11 Q9). Repeatable = success repeatable on SIMILAR projects (2019 W11 Q5).')}`);
  } });
