page({ id: 't-intro', wk: 1, topic: 1, stars: 3, lec: [1, 2, 3], title: 'Why software projects are hard', kw: 'software crisis intangible job project exploration stakeholder scope W5HH product service embedded packaged custom horizontal vertical', lede: 'The course starts with one question: why do so many software projects end late, over budget or unusable? Everything else in SPM is a tool for that problem.',
  render(b) {
    H(b, MUST('Software crisis symptoms: fails to meet requirements, expensive, hard to alter/debug/enhance, delivered late. CHAOS report: ~29 % success, 52 % challenged, 19 % failed.',
      'Software is harder to manage than a road or a factory because it is <b>intangible</b> (invisible until it runs), <b>intellectual</b> work, and a small change can have a <b>large impact</b>; changing requirements are the rule, and staff turnover hurts.',
      'Task/job (routine, almost no uncertainty) ↔ <b>project</b> (middle: challenge + routine) ↔ exploration (outcome very uncertain, e.g. finding a cure for cancer).',
      'A <b>project</b> = temporary endeavour to create a unique product, service or result (PMBOK); finite duration, non-trivial, non-repetitive, needs resources, defined goals and budget.',
      '<b>Stakeholders</b>: anyone actively involved in, or whose interests are affected by, the project: PM, customer, team, sponsor (internal: PM, team, top management; external: customers, vendors).',
      '<b>W5HH</b> (Barry Boehm) defines scope: Why, What, When, Who is responsible, Where located, How (technically and managerially), How much of each resource.',
      '<b>Products</b> (generic) vs <b>services</b> (custom). Services = customization, maintenance, testing, contract programming. Indian companies focus on services.'));
    H(b, `<h2>The software crisis</h2><p>Hardware has become cheap and software expensive, yet software failures are common. The lecture lists four symptoms: software <b>fails to meet user requirements</b>, is <b>expensive</b>, is <b>difficult to alter, debug and enhance</b>, and is <b>often delivered late</b>. Contributing factors: larger problems, poor project management, lack of training in software engineering, skill shortage and manpower turnover, and low productivity improvements.</p>
    <p>Two properties of software make it worse: the more complex a program is, the harder it is to change, and the more changes are made, the more complex it becomes (software entropy). Its virtue is the same thing: it is relatively easy to change and needs no space, weight or power.</p>`);
    const L1 = lab(b, 'Standish CHAOS report: how projects end', 'The figure the lecture uses. Slide the number of projects your company runs to see what the averages mean.');
    const sc = L1.scope({ xmin: 0, xmax: 3, ymin: 0, ymax: 60, xt: 3, yt: 6, h: 210, xfmt: v => ['', '', '', ''][Math.round(v)] || '', yfmt: v => v + ' %', yl: 'share of projects' });
    const ro = L1.readout(); const cv = controls(L1.body, [{ k: 'n', label: 'Projects per year', min: 10, max: 200, step: 10, v: 50, d: 0 }], () => draw());
    function draw() { sc.draw([{ bars: [[0.15, 0.85, 0, 29]], c: '--ch-d' }, { bars: [[1.15, 1.85, 0, 52]], c: '--warn' }, { bars: [[2.15, 2.85, 0, 19]], c: '--ch-i' }], { t: [{ x: 0.5, y: 33, s: 'success 29 %', a: 'center', c: '--ch-d' }, { x: 1.5, y: 56, s: 'challenged 52 %', a: 'center', c: '--warn' }, { x: 2.5, y: 23, s: 'failed 19 %', a: 'center', c: '--ch-i' }] }); const n = cv.n; ro([['succeed', Math.round(n * .29)], ['late / over budget / fewer features', Math.round(n * .52)], ['cancelled or never used', Math.round(n * .19)]]); }
    draw();
    H(b, `<h2>Why managing software is different</h2>${VS([['Intangible', 'cannot see it', ['Software is invisible till it is ready and runs', 'Progress is hard to judge → "99 % complete syndrome"']], ['Large change impact', 'small change, big ripple', ['A small change request can have a terrible impact', 'Change is the rule rather than the exception']], ['Intellectual, complex work', 'people, not machines', ['Hard to estimate and to measure productivity', 'Manpower turnover takes the knowledge away']]])}
    ${ANALOGY('A half-built bridge shows you exactly how far it has got. A half-written program shows you nothing until it runs. That single difference (intangibility) is behind most of the course: milestones, reviews, earned value and reporting all exist to make invisible progress visible.')}`);
    H(b, `<h2>Jobs, projects and exploration</h2><p>Work can be placed on a line by <b>uncertainty of outcome</b>: routine <b>tasks/jobs</b> (well-defined, repeated, very little uncertainty) → <b>projects</b> (in the middle: some challenge and some routine) → <b>exploration</b> (outcome very uncertain). A task is a small piece of work of a few person-hours done by one or two people, usually a repetition (attend a lecture, book a ticket). Non-software projects: a wedding, a B.Tech degree, house construction, an election campaign.</p>`);
    sorter(b, 'Game: job, project or exploration?', 'Sort the examples used in the lectures and assignments.', [['job', 'Routine job / task'], ['proj', 'Project'], ['exp', 'Exploration']], [
      ['Processing monthly salaries', 'job'], ['Manufacturing cars on an assembly line', 'job'], ['Handling daily customer support requests', 'job'], ['Buying grocery from a supermarket', 'job'], ['Booking a railway ticket', 'job'],
      ['Developing a new mobile app', 'proj'], ['Organising the Olympic Games', 'proj'], ['A wedding', 'proj'], ['A political election campaign', 'proj'], ['Construction of a house', 'proj'], ['A B.Tech degree', 'proj'],
      ['Finding a cure for cancer', 'exp']]);
    H(b, `<h2>Stakeholders and scope</h2><p><b>Project stakeholders</b> are individuals and organisations that are actively involved in the project, or whose interests may be positively or negatively affected by its execution or completion; they may also exert influence over the project. Key ones: <b>project manager</b>, <b>customer</b> (uses the product), <b>project team members</b>, <b>sponsor</b> (provides the money; still a stakeholder). Internal: PM, team, top management. External: customers outside the organisation, vendors.</p>
    <p><b>Project scope</b> = what needs to be achieved and the work that must be done to deliver it: a list of goals, deliverables, tasks, deadlines and costs. Signs of failure ("sounds of failure's footsteps"): team does not understand the customer's needs, scope poorly defined, changes poorly managed, chosen technology changes, business needs change, unrealistic deadlines, inexperienced team, poor project management.</p>`);
    const L2 = lab(b, 'W5HH scope builder', 'Boehm\'s seven questions. Pick a project, then click each question to see what a good answer looks like.');
    const ex = { lib: ['Library automation for a college', ['Students waste time finding books; the college wants online search and issue/return.', 'Catalogue search, issue/return, fines, reports.', 'Pilot in 4 months, full roll-out in 6.', 'Librarian (requirements), 3 developers, 1 tester, PM.', 'Developers at the IT cell, librarian in the library block.', 'Web app, incremental delivery; weekly review with the librarian.', '18 person-months, 2 servers, Rs. 9 lakh.']], ecu: ['Body-control ECU software update', ['New lighting regulation and customer complaints about wipers.', 'Adaptive headlamp logic, wiper speed control, diagnostics.', 'SOP in 9 months, freeze 3 months before.', 'System engineer, 4 embedded developers, 2 testers, functional-safety manager.', 'Software team in Pune, hardware team in Germany.', 'V-model with model-based design; reviews at each phase gate.', '30 person-months, HIL rig, test vehicles.']] };
    const qs = ['Why is the software being built?', 'What will be done?', 'When will it be done?', 'Who is responsible for a function?', 'Where are they organizationally located?', 'How will the job be done technically and managerially?', 'How much of each resource is needed?'];
    let curEx = 'lib'; const out = h('div', { class: 'ivtxt' }, 'Click a question.'); const btns = h('div', { class: 'flowline' });
    segmented(L2.body, [['lib', 'College library system'], ['ecu', 'Automotive ECU update']], 'lib', k => { curEx = k; out.textContent = 'Click a question.'; });
    qs.forEach((q, i) => btns.append(h('button', { class: 'btn', onclick: () => { out.innerHTML = `<b>${q}</b><br>${ex[curEx][1][i]}`; } }, ['Why', 'What', 'When', 'Who', 'Where', 'How', 'How much'][i])));
    L2.add(btns); L2.add(out); L2.add(h('p', { class: 'cap' }, '"Who will be the project manager?" is NOT one of the W5HH questions (2019 W1 Q9).'));
    H(b, `<h2>Types of software and software projects</h2>${TBL(['Classification', 'Kinds', 'Examples / notes'], [
      ['By business model', '<b>Products</b> (generic) vs <b>services</b> (custom)', 'World IT business ~$3.5 trillion, about half each; services growing fast'],
      ['Packaged vs custom', 'Packaged (prewritten, for many customers): <b>horizontal</b> market (needs of many companies) or <b>vertical</b> market (one industry). Custom (at user\'s request, or developer tailors its generic solution)', 'Vertical packages are widely available. Custom is not always from scratch; packaged is not always cheaper'],
      ['By what it does', '<b>Information systems</b> (store, process, present data; web or stand-alone) vs <b>embedded</b> (control hardware)', 'IS: MIS, hotel management, patient management. Embedded: automobile control, nuclear plant control, robots, toys, TV remote'],
      ['Software services', 'Customization, maintenance, testing, contract programmers', 'Why the shift to services: lots of code already exists (modify the closest), business velocity → shorter projects, programs have become large']])}`);
    sorter(b, 'Game: embedded software or information system?', 'From 2026 assignment 1 Q7 and the slides.', [['emb', 'Embedded'], ['is', 'Information system']], [
      ['TV remote software', 'emb'], ['Nuclear plant control software', 'emb'], ['Robot control software', 'emb'], ['Automobile control software', 'emb'], ['Toy control software', 'emb'],
      ['Patient management software for a hospital', 'is'], ['Hotel management software', 'is'], ['MIS for a company', 'is'], ['Payroll system', 'is']]);
    H(b, TRAP('"Software projects are always larger than manufacturing projects" is <b>not</b> a reason they are harder to manage; "people management" is needed in every project, so it is not special either (2026 A1 Q2).',
      'Sponsors ARE stakeholders even though they "only" provide money (2026 A1 Q4).',
      'Professional developers do not make software as complex as possible; complexity does not fall with age; maintenance changes DO add complexity (2026 A1 Q3).',
      'A security guard of the building is not a stakeholder (2019 W1 Q2).'));
  } });

page({ id: 't-pm', wk: 1, topic: 1, stars: 3, lec: [3, 4, 5], title: 'PM activities, life cycle & standards', kw: 'planning staffing directing monitoring controlling feasibility PMBOK PRINCE2 ISO 21500 process groups initiating closing milestone 99 percent complete build and fix phase entry exit', lede: 'What a project manager actually does, the phases every project passes through, and the three standards (PMBOK, PRINCE2, ISO 21500) that write them down.',
  render(b) {
    H(b, MUST('Project management = "plan the work and work the plan": <b>planning</b> (estimation, resource allocation, scheduling), <b>staffing</b>, <b>directing</b>, <b>monitoring & controlling</b>.',
      'Project manager\'s job in time order: <b>feasibility study</b> (technically feasible? financially worthwhile?) → <b>planning</b> (only if feasible) → <b>execution monitoring and control</b>. A PM may be involved in all three.',
      'PMBOK process groups (5): <b>Initiating, Planning, Executing, Monitoring & Controlling, Closing</b>. "Designing" is not one.',
      'PMBOK = Project Management Body of Knowledge, PMI (USA), knowledge-based, non-prescriptive. PRINCE2 = PRojects IN Controlled Environments, UK OGC, process-based, prescriptive but tailorable.',
      'Milestones (e.g. phase entry/exit) let the PM track progress; without a life cycle model the PM depends on guesses → <b>99 % complete syndrome</b>.',
      'Build-and-fix (exploratory) works only for trivial, one-programmer programs (e.g. student assignments).'));
    H(b, `<h2>What a project manager does</h2>${VS([['Planning', 'before development starts', ['Estimation: effort, cost, duration, resources', 'Scheduling', 'Staffing plan', 'Risk management', 'Miscellaneous plans (QA, configuration management)']], ['Staffing & directing', '', ['Recruiting and motivating personnel', 'Ensuring the team acts as a whole']], ['Monitoring & control', 'whole active project duration', ['Monitoring: checking progress, revising plans', 'Controlling: action to remedy hold-ups', 'Innovating: solutions when problems emerge', 'Representing: liaison with clients, users, developers']]])}
    <p>Typical planning activities (2026 A1 Q9): <b>developing schedules</b> and <b>allocating resources</b>. Formally accepting deliverables, lessons-learned reviews and releasing resources happen at <b>closing</b>.</p>`);
    H(b, `<h2>Project life cycle vs product life cycle</h2><p>Every project goes through: need → <b>initiate</b> → <b>plan</b> → <b>execute</b> → <b>control</b> → <b>close out</b>. Two kinds of processes run in parallel: <b>project management processes</b> (planning and controlling the work) and <b>product-oriented processes</b> (specifying and creating the product, i.e. the SDLC). Maintenance is a product phase, not a project management phase (2019 W1 Q7).</p>
    ${TBL(['Process group', 'Key outputs (lecture)'], [['Initiating', 'Business case, <b>project charter</b>; assign the PM; identify key stakeholders'], ['Planning', '<b>WBS</b>, scope statement, schedule (Gantt chart with dependencies and resources), cost estimate, list of prioritised risks'], ['Executing', 'Perform the work described in the plan'], ['Monitoring & controlling', 'Measure progress, detect deviation from the plan, corrective action'], ['Closing', 'Formal acceptance of the work, closing documents']])}`);
    sorter(b, 'Game: which PMBOK process group?', 'Where does each activity belong?', [['ini', 'Initiating'], ['pla', 'Planning'], ['exe', 'Executing'], ['mon', 'Monitoring & controlling'], ['clo', 'Closing']], [
      ['Complete the project charter', 'ini'], ['Assign the project manager', 'ini'], ['Identify key stakeholders', 'ini'],
      ['Prepare the WBS', 'pla'], ['Develop the schedule', 'pla'], ['Allocate resources', 'pla'], ['Prioritise risks', 'pla'],
      ['Carry out the planned activities', 'exe'],
      ['Compare progress with the plan', 'mon'], ['Take corrective action on a slip', 'mon'],
      ['Formal acceptance of deliverables', 'clo'], ['Lessons-learned review', 'clo'], ['Release project resources', 'clo']]);
    H(b, `<h2>Project management standards</h2><p><b>Off-the-shelf</b> standards: PMBOK, PRINCE2, ISO 21500. <b>In-house</b> standards: developed by an organisation for its own requirements, policies and environment; may borrow from off-the-shelf ones.</p>
    ${TBL(['', 'PRINCE2', 'PMBOK'], [['Origin', 'United Kingdom (Office of Government Commerce)', 'United States'], ['Administered by', 'APMG', 'PMI (Project Management Institute)'], ['Approach', '<b>Process-based</b> method', '<b>Knowledge-based</b> body of knowledge'], ['Style', 'Prescriptive, but tailorable', 'Non-prescriptive'], ['Use', 'Mostly within the UK', 'Worldwide, over 75 % of projects'], ['Contents', '7 processes: starting up, initiating, directing, managing a stage boundary, controlling a stage, managing product delivery, closing', '5 process groups; standard terminology and guidelines; 5th edition 2013; basis of PMI certifications']])}
    <p>PRINCE1 was specific to IT projects; PRINCE2 is generic and can be used for small and big projects. ISO 21500 also defines a project life cycle.</p>`);
    H(b, `<h2>Life cycle models: the basics the PM relies on</h2><p>A <b>software life cycle model</b> (process model, SDLC) is a descriptive and diagrammatic model that identifies all activities, establishes their <b>precedence ordering</b> and divides the life cycle into <b>phases</b>. Each phase has <b>entry and exit criteria</b>; a phase is complete only when its exit criteria are met (e.g. SRS complete, reviewed and approved by the customer). Phase entry and exit are important <b>milestones</b>, so the PM can tell at any time which stage the project is in.</p>
    <p>Without a model, the PM depends on team members' guesses: the <b>99 % complete syndrome</b>. Another myth: "the only deliverable is the working program". In reality documentation of all aspects is needed for operation and maintenance.</p>
    <p><b>Build and fix</b> (exploratory) model: a single programmer can follow any order (code → test → design, specify → code → design …) and still succeed because the problem is within one person's grasp. With a team this leads to chaos.</p>`);
    H(b, TRAP('Feasibility study and execution are different activities; feasibility generally precedes planning; planning is mainly before execution (2026 A1 Q8).',
      'Milestones give progress tracking and visibility. They do not generate code, do not remove the need for planning and do not solve manpower turnover (2026 A1 Q10).',
      'PMBOK process groups do not include "Designing" (AI mock 1 Q4).'));
  } });

/* ===== Week 2 (lectures 5-10) ===== */
page({ id: 't-waterfall', wk: 2, topic: 1, stars: 3, lec: [5, 6], title: 'Waterfall, iterative waterfall & V-model', kw: 'classical waterfall feasibility study relative effort maintenance testing iterative feedback phase containment V model verification validation', lede: 'The classical waterfall is the "theorem proof" of software development: neat on paper, rarely followed literally, but every other model is described relative to it.',
  render(b) {
    H(b, MUST('Classical waterfall phases: <b>feasibility study → requirements analysis & specification → design → coding & unit testing → integration & system testing → maintenance</b>.',
      'Relative effort: among ALL phases <b>maintenance</b> takes the most; among the development phases (feasibility to testing) <b>testing</b> takes the most.',
      'Feasibility study dimensions: <b>economic (cost/benefit), technical, schedule</b> (DPM adds operational). Output: go/no-go, the business case.',
      'Iterative waterfall = classical + <b>feedback paths</b>, because defects are introduced in every phase. <b>Phase containment</b>: detect and fix an error in the phase where it was introduced; the later it is found, the costlier.',
      'Waterfall: easy, clear milestones, requirement stability, strong control. But all requirements up front, <b>false impression of progress</b>, big-bang integration at the end, customer sees software late.',
      '<b>V-model</b>: test planning in parallel with development. Requirements ↔ <b>system</b> testing, high-level design ↔ <b>integration</b> testing, detailed design ↔ <b>unit</b> testing. Natural choice for high-reliability, safety-critical, embedded systems.'));
    H(b, `<h2>Classical waterfall</h2><p>Simplest and most intuitive model: each phase starts after the previous one ends. The phases between feasibility study and testing are called <b>development phases</b>. Organisations define standards for the deliverables of every phase, entry/exit criteria, and methodologies for specification, design, testing and PM. Together these are the organisation's <b>software development methodology</b>, which fresh engineers are expected to master.</p>
    <p>Whatever model is actually followed, the <b>documents should reflect a classical waterfall</b> development (like a mathematician who presents a proof as a single chain of deductions, even if it came from a convoluted set of attempts).</p>`);
    const L1 = lab(b, 'Where the effort goes', 'Relative effort per phase as drawn on the lecture slide (indicative). Toggle to see the two "maximum effort" answers the exam likes.');
    const sc = L1.scope({ xmin: 0, xmax: 5, ymin: 0, ymax: 60, xt: 5, yt: 6, h: 230, xfmt: () => '', yl: 'relative effort' });
    const ph = [['Req. spec', 10], ['Design', 12], ['Coding', 13], ['Testing', 25], ['Maintenance', 55]];
    let mode = 'all'; segmented(L1.body, [['all', 'All phases'], ['dev', 'Development phases only']], 'all', k => { mode = k; draw(); }); const note = h('div', { class: 'ivtxt' }); L1.add(note);
    function draw() { const show = mode === 'all' ? ph : ph.slice(0, 4), mx = Math.max(...show.map(p => p[1])); sc.draw(show.map((p, i) => ({ bars: [[i + .15, i + .85, 0, p[1]]], c: p[1] === mx ? '--ch-i' : '--ch-v' })), { t: show.map((p, i) => ({ x: i + .5, y: p[1] + 3, s: p[0], a: 'center' })) }); note.innerHTML = mode === 'all' ? 'Among <b>all</b> life cycle phases, <b>maintenance</b> needs the maximum effort (≈ 60 % of the total).' : 'Among the <b>development</b> phases, <b>testing</b> needs the maximum effort.'; }
    draw();
    H(b, `<h2>Feasibility study</h2><p>Main aim: decide whether developing the software is <b>financially worthwhile</b> and <b>technically feasible</b> (also schedule-feasible). The manager first roughly understands what the customer wants: input data, processing, output data, constraints. Then: work out an overall understanding of the problem → formulate different solution strategies → examine them in terms of resources, cost and development time → perform a <b>cost/benefit analysis</b> to pick the best (or find none is feasible: high cost, resource constraints, technical reasons).</p>
    <p>Lecture case: <i>SPF scheme for CFL</i>, a mining company with over 50,000 mostly casual employees; PF settlement is slow, so a special PF needs faster disbursement. The manager visits the main office (functionality) and the mine site (input data), suggests alternatives, picks the best and presents it: <b>go/no-go decision</b>. The feasibility study helps write the <b>business case</b> (executive summary, background, business opportunity, costs, benefits, risks).</p>`);
    const L2 = lab(b, 'Phase containment: why late defects are expensive', 'Pick where a defect is introduced and where it is found. The rework has to redo that phase and every later one (indicative cost factors).');
    const P = ['Requirements', 'Design', 'Coding', 'Testing', 'Maintenance'], cost = [1, 3, 6, 15, 40];
    const s1 = h('select', { class: 'sel' }, P.slice(0, 3).map((p, i) => h('option', { value: i }, p))), s2 = h('select', { class: 'sel' }, P.map((p, i) => h('option', { value: i, selected: i === 3 }, p)));
    const out2 = h('div', { class: 'ivtxt' }); L2.add(h('div', { class: 'calc' }, h('div', { class: 'inputs' }, h('label', {}, 'Defect introduced in', s1), h('label', {}, 'Detected in', s2)))); L2.add(out2);
    const fl = h('div', { class: 'flowline' }); L2.add(fl);
    const upd2 = () => { const a = +s1.value, d = Math.max(+s2.value, a); s2.value = d; fl.innerHTML = P.map((p, i) => `<span class="st${i >= a && i <= d ? ' on' : ''}">${p}</span>`).join('<span class="ar">→</span>'); const f = cost[d] / cost[a]; out2.innerHTML = d === a ? '<b>Contained!</b> Found in the same phase: cheapest possible fix. This is the goal of reviews at every phase.' : `Rework spans ${d - a + 1} phases. Relative fix cost ≈ <b>${f.toFixed(0)}×</b> the cost of fixing it in ${P[a]}. Iterative waterfall adds feedback paths for exactly this rework.`; };
    s1.addEventListener('change', upd2); s2.addEventListener('change', upd2); upd2();
    H(b, `<h2>Waterfall: strengths, deficiencies, when to use</h2>${VS([['Strengths', '', ['Easy to understand and use, even by inexperienced staff', 'Milestones well understood', 'Requirements stability', 'Strong management control (plan, staff, track)']], ['Deficiencies', '', ['All requirements must be known up front (40 % change after start)', 'Can give a <b>false impression of progress</b>', 'Integration is one big bang at the end', 'Little opportunity for the customer to preview the system', '"Heavy-weight" process']], ['Use when', '', ['Requirements are well known and stable', 'Technology is understood', 'Team has experience with similar projects']]])}`);
    H(b, `<h2>V-model</h2><p>A variant of the waterfall that emphasises <b>verification and validation</b>: in every development phase the matching test activity is planned in parallel. Steps: planning; requirements analysis & specification ↔ <b>system test design</b>; high-level design ↔ <b>integration test design</b>; detailed design ↔ <b>unit test design</b>; coding at the bottom of the V.</p>`);
    const L3 = lab(b, 'Click a phase to see its partner', 'The left arm develops, the right arm tests what the left arm promised.');
    const pairs = [['Project planning', 'Production, operation & maintenance'], ['Requirements specification', 'System testing'], ['High-level design', 'Integration testing'], ['Detailed design', 'Unit testing']];
    const svg = h('div', { class: 'netwrap' }); L3.add(svg); const msg = h('div', { class: 'ivtxt' }, 'Pick any box.'); L3.add(msg);
    const drawV = (k) => { let s = '<svg class="net" viewBox="0 0 700 300" style="min-width:560px">'; pairs.forEach((p, i) => { const y = 30 + i * 58, xl = 40 + i * 55, xr = 660 - i * 55 - 180; const on = k === i; s += `<g class="nd${on ? ' cr' : ''}" data-i="${i}" style="cursor:pointer"><rect x="${xl}" y="${y}" width="180" height="36" rx="6"/><text class="nm" x="${xl + 90}" y="${y + 23}" text-anchor="middle">${p[0]}</text></g><g class="nd${on ? ' cr' : ''}" data-i="${i}" style="cursor:pointer"><rect x="${xr}" y="${y}" width="180" height="36" rx="6"/><text class="nm" x="${xr + 90}" y="${y + 23}" text-anchor="middle">${p[1]}</text></g><path class="ed${on ? ' cr' : ''}" d="M${xl + 180} ${y + 18} L${xr} ${y + 18}" stroke-dasharray="5 4"/>`; }); s += `<g class="nd"><rect x="260" y="262" width="180" height="32" rx="6"/><text class="nm" x="350" y="283" text-anchor="middle">Coding</text></g></svg>`; svg.innerHTML = s; $$('[data-i]', svg).forEach(g => g.addEventListener('click', () => { const i = +g.dataset.i; drawV(i); msg.innerHTML = ['Planning has no direct test counterpart (2026 A2 Q2 option d is wrong).', 'System test cases are designed from the <b>SRS</b>, while the requirements are being specified.', 'Integration test cases are designed from the <b>high-level design</b> (module structure, interfaces).', 'Unit test cases are designed from the <b>detailed design</b> of each module. Coding pairs with unit testing, not system testing.'][i]; })); };
    drawV(-1);
    H(b, VS([['V-model strengths', '', ['Plans V&V from the earliest stages', 'Each deliverable is made testable', 'Easy to use']], ['V-model weaknesses', '', ['No overlapping of phases, no iterations', 'Does not easily accommodate late requirement changes', 'No support for effective risk handling']], ['Use V-model when', '', ['High reliability needed: embedded control, safety-critical', 'All requirements known up front', 'Solution and technology known']]]));
    H(b, TRAP('In waterfall, integration is NOT spread evenly; it happens at the end. Prototypes are not part of waterfall (2026 A2 Q1).', 'V-model pairs: Coding ↔ <b>unit</b> testing, never system testing (2026 A2 Q2).', 'Maximum effort overall = maintenance; among development phases = testing (AI mock 1 Q5).'));
  } });

page({ id: 't-proto', wk: 2, topic: 1, stars: 3, lec: [6, 7, 8], title: 'Prototyping, incremental, RAD, evolutionary & spiral', kw: 'prototype throw away incremental value cost ratio RAD time box evolutionary iteration spiral risk meta model quadrant Capers Jones', lede: 'Five answers to the same problem: requirements are not known (or not stable) at the start.',
  gens: ['vc'],
  render(b) {
    H(b, MUST('<b>Prototyping</b>: build a toy implementation first (limited functions, low reliability, inefficient) to clarify requirements and resolve technical issues; the prototype is usually <b>thrown away</b>, then waterfall. Overall cost is usually lower for unclear requirements.',
      '<b>Incremental</b>: requirements split into features; core first, then increments, each a mini-project; prioritise by <b>value/cost ratio</b> (V 1-10 by customer, C 0-10 by developers; highest V/C first).',
      '<b>RAD</b> (rapid prototyping model): reduce time and cost and accommodate change early; plans for one increment at a time (<b>time box</b>); heavy reuse, visual tools; prototype is refined into the product (not thrown away).',
      '<b>Evolutionary</b>: core modules first, then refined in successive versions; requirements, plans and solution evolve (Capers Jones: 40 % of requirements arrive after development begins). Problems: hard to manage, poorly structured, may not converge.',
      '<b>Spiral</b> (Boehm 1988): main feature <b>risk handling</b>; each loop = a phase; quadrants: objectives → risk analysis & reduction (prototype) → develop & validate → review & plan. <b>Meta-model</b>: subsumes waterfall, prototyping, evolutionary.'));
    H(b, `<h2>Prototyping model</h2><div class="grid2">${CARD('Why build a prototype?', '<ul><li>Learning by doing when requirements are only <b>partially known</b></li><li>Improved <b>communication</b> and <b>user involvement</b></li><li>Illustrate input formats, messages, reports, dialogs</li><li>Resolve technical issues (response time of a controller, efficiency of a sort)</li><li>"Plan to throw one away": you cannot get it right the first time</li></ul>')}${CARD('How', '<ol><li>Start with approximate requirements, quick design</li><li>Build with short-cuts (dummy functions, table look-up instead of computation)</li><li>Customer evaluates → refine → repeat until approved</li><li>Then develop the real system with the waterfall model. The final prototype acts as an animated SRS; its code is usually thrown away.</li></ol><p>Pros: more usable software, user needs met, higher design quality, easier maintenance, less overall cost. Cons: expensive for some projects; over-engineering (designers add the sophistications they could not add to the prototype).</p>')}</div>
    ${TRAP('Prototyping does NOT guarantee a shorter project and does NOT remove testing (2026 A2 Q3).')}`);
    H(b, `<h2>Incremental model</h2><p>"Start with a simple implementation of a subset of the requirements and iteratively enhance the evolving sequence of versions" (Basili). Requirements are split into features; the first increment delivers the <b>core</b>, later increments add or fix functionality, the last gives the complete product. Each increment is a short mini-project (e.g. its own waterfall). It is the foundation of RUP and XP. Which increment first? Some are forced by physical dependencies; for the rest use <b>value-to-cost</b> ratios.</p>`);
    const L1 = lab(b, 'Value-to-cost prioritiser (lecture example)', 'Edit the customer value (1-10) and developer cost (0-10). The list re-ranks by V/C.');
    const rows = [['profit reports', 9, 2], ['online database', 1, 9], ['ad hoc enquiry', 5, 5], ['purchasing plans', 9, 4], ['profit-based pay for managers', 9, 1]];
    const tb = h('table', { class: 'etbl' }); L1.add(h('div', { class: 'tblwrap' }, tb));
    const drawVC = () => { const rk = rows.map((r, i) => [i, r[1] / Math.max(r[2], 0.01)]).sort((a, b) => b[1] - a[1]).map(x => x[0]); tb.innerHTML = '<tr><th>Step</th><th class="num">Value</th><th class="num">Cost</th><th class="num">V/C</th><th>Order</th></tr>'; rows.forEach((r, i) => { const tr = h('tr', {}, h('td', {}, r[0])); [1, 2].forEach(k => { const inp = h('input', { type: 'number', value: r[k], min: 0, max: 10 }); inp.addEventListener('change', () => { r[k] = +inp.value; drawVC(); }); tr.append(h('td', {}, inp)); }); tr.append(h('td', { class: 'num' }, fmt(r[1] / Math.max(r[2], 0.01), 2)), h('td', {}, h('span', { class: 'chipnum' }, String(rk.indexOf(i) + 1)))); tb.append(tr); }); };
    drawVC();
    H(b, `<h2>RAD: Rapid Application Development</h2><p>Also called the <b>rapid prototyping model</b>. Aims: <b>decrease development time and cost</b> and <b>accommodate change requests as early as possible</b>, before large investments in development and testing. Principle: make only short-term plans and reuse code heavily. Each increment gets a <b>time box</b>; in it a quick-and-dirty prototype of some functionality is built, the customer evaluates it and it is refined. Speed comes from specialised tools: visual development, reusable components, standard APIs.</p>
    ${VS([['RAD suits', '', ['Performance and reliability not critical', 'System can be split into independent modules']], ['RAD does not suit', '', ['Few plug-in components available', 'High performance or reliability required', 'No precedent for similar products', 'System cannot be modularised']], ['Prototyping vs RAD', '', ['Prototyping: prototype gives insight, compares alternatives, elicits feedback, and is usually <b>thrown away</b>', 'RAD: the prototype is <b>refined into the final product</b>']]])}`);
    H(b, `<h2>Evolutionary model (with iterations)</h2><p>Develop the core modules first, then refine the skeletal software into increasing capability by adding functionality in successive versions. Each iteration is a mini-waterfall that ends in tested, integrated, executable code; iterations are short and fixed (2-6 weeks; 10-15 iterations). Requirements are not frozen: "plan a little, design a little, code a little" (Capers Jones: 40 % of final requirements arrived after development began).</p>
    ${VS([['Advantages', '', ['Users experiment with a partial system early → exact requirements', 'Core modules tested thoroughly', 'Better management of complexity and changing requirements', 'Training can start on an earlier release; frequent releases fix problems quicker']], ['Problems', '', ['Process unpredictable: hard to schedule and allocate workforce', 'Continual changes degrade the structure', 'System may not converge to a final version']], ['Incremental vs evolutionary', '', ['Incremental: requirements known up front and split into increments', 'Evolutionary: requirements, plans and solution <b>evolve</b> over iterations']]])}`);
    const L2 = lab(b, 'Spiral model: walk one loop', 'Each loop is one phase; the radius is the cumulative cost. Step through the four quadrants.');
    const Q = [['1 · Determine objectives', 'Identify the objectives of the phase, examine the risks to them, find alternative solutions.'], ['2 · Identify & resolve risks', 'Detailed analysis of each risk and steps to reduce it, e.g. build a prototype if requirements may be wrong.'], ['3 · Develop next level of product', 'Develop and validate the next level of the product.'], ['4 · Review & plan', 'Review results with the customer and plan the next loop around the spiral.']];
    const cvs = h('canvas', { class: 'scope' }); L2.add(cvs); const sp = new Scope(cvs, { xmin: -1.2, xmax: 1.2, ymin: -1.2, ymax: 1.2, xt: 2, yt: 2, h: 260, xfmt: () => '', yfmt: () => '', pad: [10, 10, 10, 10] });
    const txt = h('div', { class: 'ivtxt' }); L2.add(txt); let step = 0;
    const drawS = () => { const th = []; const xs = [], ys = []; for (let t = 0; t <= step * Math.PI / 2 + 0.001; t += 0.05) { const r = 0.12 + t * 0.09; xs.push(r * Math.cos(Math.PI / 2 + t)); ys.push(r * Math.sin(Math.PI / 2 + t)); } sp.draw([{ x: [-1.2, 1.2], y: [0, 0], c: '--grid', w: 1 }, { x: [0, 0], y: [-1.2, 1.2], c: '--grid', w: 1 }, { x: xs, y: ys, c: '--ch-i', w: 3 }], { t: [{ x: -1.1, y: 1.05, s: 'Objectives' }, { x: 0.45, y: 1.05, s: 'Risk analysis' }, { x: 0.35, y: -1.05, s: 'Develop & validate' }, { x: -1.1, y: -1.05, s: 'Review & plan' }] }); const q = Q[(step + 3) % 4]; txt.innerHTML = step ? `<b>Loop ${Math.ceil(step / 4)}, quadrant ${q[0]}</b>: ${q[1]}` : 'Press "Next quadrant".'; };
    L2.add(h('div', { class: 'stepper' }, h('button', { class: 'btn primary', onclick: () => { step = Math.min(step + 1, 12); drawS(); } }, 'Next quadrant →'), h('button', { class: 'btn', onclick: () => { step = 0; drawS(); } }, 'Reset')));
    drawS();
    H(b, `<p>No fixed phases: the phases in the figure are examples. With each loop a more complete version is built. A single loop is the waterfall; iterations are evolutionary levels; prototyping is the risk-reduction mechanism; the step-wise waterfall approach is retained. Hence the spiral is called a <b>meta-model</b>.</p>${TRAP('RAD aims to <b>reduce</b> time and cost and accommodate change <b>early</b>; it relies on user involvement (2026 A2 Q4).', 'Spiral is a meta-model because it subsumes other models, not because it is the newest or risk-free (AI mock 1 Q8, 5 Q27).')}`);
  } });

page({ id: 't-agile', wk: 2, topic: 1, stars: 3, lec: [9, 10], title: 'Agile, XP & Scrum', kw: 'agile manifesto user story metaphor spike refactor XP extreme programming pair programming TDD scrum sprint product owner scrum master backlog burndown daily scrum retrospective selecting model', lede: 'Agile models were proposed in the mid-1990s to handle change requests. Scrum and XP are the two the exam asks about most.',
  render(b) {
    H(b, MUST('Agility = fitting the process to the project + <b>avoiding things that waste time</b>. Manifesto: individuals & interactions over processes & tools; working software over documentation; customer collaboration over contract negotiation; responding to change over following a plan.',
      'Techniques: <b>user stories</b> (simpler than use cases), <b>metaphor</b> (common vision), <b>spike</b> (simple program to explore potential solutions), <b>refactoring</b> (restructure code without changing behaviour).',
      'Only one increment is planned at a time; a <b>new release is invariably made at the end of every iteration</b>, even if little was added. Small teams (5-9), face-to-face communication, travel light on documents. Best for small projects.',
      '<b>XP</b> (Kent Beck, 1999): take good practices to the extreme: review → pair programming; testing → test-driven development; integration → several times a day; design → refactoring daily; architecture → metaphor. Values: communication, simplicity, feedback, courage.',
      '<b>Scrum</b>: roles <b>Product Owner, Scrum Master, Team</b>; ceremonies <b>sprint planning, daily scrum, sprint review, sprint retrospective</b>; artifacts <b>product backlog, sprint backlog, burndown chart</b>. Sprint ≈ one month (target), no changes during a sprint.',
      'Daily scrum: 15 min standing, 3 questions (yesterday, today, obstacles). Not problem-solving, not finding who is behind.'));
    H(b, `<h2>Agile in one page</h2>${VS([['Principles', '', ['Primary progress measure: incremental release of working software', 'Frequent delivery (every few weeks)', 'Change requests easily accommodated', 'Close customer-developer cooperation', 'Face-to-face communication (shared office)']], ['Agile documentation', '"travel light"', ['Concise, describes stable "good to know" information', 'Write when stakeholders require it, to define a contract model, to talk to an external group, or to think something through']], ['Shortcomings', '', ['Knowledge stays tacit in the team → misinterpretation, hard external review, maintenance difficult after the team disperses', 'Sketchy definitions, needs high people skills, short iterations inhibit long-term view, feature creep']]])}
    <p>Agile methodologies named in the lectures: XP, Scrum, Unified Process, Crystal, DSDM, Lean. Prototyping is <i>not</i> agile.</p>`);
    H(b, `<h2>Extreme Programming (XP)</h2>${TBL(['If this is good…', '…XP does it all the time'], [['Code review', '<b>Pair programming</b>: two programmers at one workstation, one codes, one reviews'], ['Testing', 'Write and run tests continually: <b>test-driven development</b> (tests from user stories first)'], ['Incremental development', 'New increments every few days'], ['Simplicity', 'Simplest design that supports only the currently required functionality'], ['Design', 'Everybody designs daily: <b>refactoring</b>'], ['Architecture', 'Everybody defines and refines it: <b>metaphor</b>'], ['Integration testing', 'Build and integrate several times a day: <b>continuous integration</b>']])}
    <p>XP best practices emphasised: coding, testing, listening, designing, feedback. XP also recommends a maximum 40-hour working week. XP welcomes changing requirements (no requirement freeze) and tests before/alongside implementation.</p>`);
    H(b, `<h2>Scrum</h2><div class="grid2">${CARD('Roles', '<ul><li><b>Product Owner</b>: acts for the customers; defines features, decides release date and content, <b>prioritises the product backlog</b> by market value, adjusts every iteration, accepts or rejects work.</li><li><b>Scrum Master</b> (≈ project manager): facilitates the process, <b>removes impediments</b>, keeps the team productive, shields it from outside interference.</li><li><b>Team</b>: 5-9 (typically 5-10), cross-functional, self-organising; membership changes only between sprints.</li></ul>')}${CARD('Ceremonies & artifacts', '<ul><li><b>Sprint planning</b>: PO and team negotiate the backlog items → sprint backlog; SM ensures realistic goals.</li><li><b>Daily scrum</b>: 15 min, standing, three questions; a commitment meeting, not problem-solving.</li><li><b>Sprint review</b>: informal demo of new features (2-hour prep rule) to customers, management, PO, team.</li><li><b>Sprint retrospective</b>.</li><li><b>Product backlog</b>: all desired work (stories + tasks), prioritised by the PO, changes any time.</li><li><b>Sprint backlog</b>: subset for the sprint, created and updated (daily) only by the team.</li><li><b>Burndown charts</b>: sprint (hours left per day), release (story points per sprint), product (all releases).</li></ul>')}</div>`);
    const L1 = lab(b, 'Sprint burndown simulator', 'Plan a sprint, then let the team burn hours each day. Interruptions add work mid-sprint (which Scrum tries to forbid).');
    const sc = L1.scope({ xmin: 0, xmax: 20, ymin: 0, ymax: 400, xt: 10, yt: 4, h: 230, xl: 'sprint day', yl: 'hours remaining' });
    const ro = L1.readout(); const v = controls(L1.body, [{ k: 'tot', label: 'Sprint backlog (h)', min: 100, max: 400, step: 10, v: 300, d: 0 }, { k: 'cap', label: 'Team capacity (h/day)', min: 5, max: 30, step: 1, v: 16, d: 0 }, { k: 'add', label: 'Work added on day 8 (h)', min: 0, max: 100, step: 5, v: 0, d: 0 }], () => draw());
    function draw() { const xs = [], ys = []; let r = v.tot; for (let d = 0; d <= 20; d++) { xs.push(d); ys.push(Math.max(r, 0)); r -= v.cap * (0.8 + 0.4 * Math.abs(Math.sin(d * 1.7))); if (d === 8) r += v.add; } sc.set({ ymax: Math.max(100, Math.ceil((v.tot + v.add) / 100) * 100) }); sc.draw([{ x: [0, 20], y: [v.tot, 0], c: '--muted', dash: [6, 4], w: 1.5 }, { x: xs, y: ys, c: '--ch-i', w: 2.5, dots: 2.5 }]); const left = ys[20]; ro([['ideal line', 'straight to 0 on day 20'], ['left at sprint end', fmt(left, 0) + ' h'], ['verdict', left > 0 ? 'sprint goal missed' : 'burned down in time']]); }
    draw();
    const L2 = lab(b, 'Which model should I choose?', 'Answer five questions. The rule of thumb from lecture 10: high uncertainty → evolutionary/agile; well-understood → waterfall; novice team → incremental; high reliability → V-model; high risk → spiral.');
    const qd = [['req', 'Requirements', [['stable', 'Well known and stable'], ['vague', 'Partially known / likely to change']]], ['rel', 'Reliability', [['normal', 'Normal'], ['safety', 'Safety-critical / very high']]], ['size', 'Project size & team', [['small', 'Small, co-located team'], ['large', 'Large']]], ['risk', 'Technical risk', [['low', 'Low'], ['high', 'High / new technology']]], ['team', 'Team experience', [['exp', 'Experienced'], ['novice', 'Novice']]]];
    const ans = { req: 'stable', rel: 'normal', size: 'small', risk: 'low', team: 'exp' }; const res = h('div', { class: 'ivtxt' });
    qd.forEach(([k, l, o]) => { L2.add(h('div', {}, h('b', {}, l + ': '))); segmented(L2.body, o, ans[k], val => { ans[k] = val; rec(); }); });
    L2.add(res);
    function rec() { let m, why; if (ans.rel === 'safety') { m = 'V-model'; why = 'high reliability with requirements known up front'; } else if (ans.risk === 'high') { m = 'Spiral model'; why = 'risk handling is its main feature (prototypes reduce risk)'; } else if (ans.req === 'vague' && ans.size === 'small') { m = 'Agile (Scrum / XP)'; why = 'changing requirements, small co-located team, frequent releases'; } else if (ans.req === 'vague') { m = 'Evolutionary / prototyping'; why = 'requirements must be discovered; core first, refine with feedback'; } else if (ans.team === 'novice') { m = 'Incremental model'; why = 'lecture: for novice team members the incremental model is preferable'; } else { m = 'Waterfall (iterative)'; why = 'well-understood application, stable requirements, experienced team'; } res.innerHTML = `Suggested: <b>${m}</b> — ${why}.`; }
    rec();
    H(b, TRAP('Sprint duration is NOT "exactly one month" and changes are NOT entertained freely during a sprint (2026 A2 Q7).', 'The product backlog is dynamic: it can be modified and is prioritised by the PO; items do not have equal priority (2026 A2 Q8, Q10).', 'Refactoring keeps external behaviour unchanged; it is not for adding major features (2026 A2 Q5).', '"A new release may not be made at the end of some iterations" is FALSE for agile (2019 W2 Q10).', 'Daily scrum does not ask "Why are you getting delayed?" (2019 W2 Q3). "Project start-up meeting" is not a sprint ceremony (2019 W2 Q4).'));
  } });

page({ id: 't-bizcase', wk: 3, topic: 1, stars: 3, lec: [11, 12], title: 'Business case, portfolio & cost categories', kw: 'business case feasibility project portfolio management definition optimization cost benefit tangible intangible direct indirect fixed variable overhead opportunity cash flow forecast', lede: 'Before anyone asks "how do we build it?", someone has to show it is worth building. That is the business case, and the language of costs and benefits it uses.',
  render(b) {
    H(b, MUST('Feasibility study = <b>business case</b>: justifies starting the project; benefits must exceed development, implementation and operation costs; takes account of <b>business risks</b>. Types: technical, financial, operational.',
      'Two kinds of risk: <b>project risk</b> (threats to successful execution) vs <b>business risk</b> (threats to the benefits of the delivered project). The business case focuses on business risk.',
      'PPM has three elements in this order: portfolio <b>definition</b> (which projects are in, e.g. all or only ICT/healthcare) → portfolio <b>management</b> (record actual costs and performance) → portfolio <b>optimisation</b> (balance risky-valuable vs safe projects). No "deletion".',
      'Costs: <b>development</b> (salaries of staff), <b>set-up</b> (hardware, recruitment, staff training), <b>operational</b> (running after installation).',
      'Cost categories: <b>tangible/intangible</b> (can it be measured?), <b>direct/indirect</b> (can a money figure be tied to the project? indirect = overhead: insurance, maintenance, lighting, AC), <b>fixed/variable</b> (constant vs proportional to volume, e.g. computer forms).',
      'C-B analysis steps: identify → categorise → select technique → interpret → take action.'));
    H(b, `<h2>Contents of a business case</h2>${TBL(['Section', 'What it says'], [['Introduction / background', 'The problem to solve or opportunity to exploit'], ['Proposed project', 'Brief outline of scope'], ['The market', 'Likely demand, e.g. for a new computer game'], ['Organisational & operational infrastructure', 'How the organisation must change'], ['Benefits', 'Normally in financial terms; the client assesses them'], ['Outline implementation plan', 'How it will be done, disruption caused'], ['Costs', 'From the implementation plan'], ['Financial case', 'Combines costs and benefits (NPV, ROI…)'], ['Risks', 'Mainly business risks'], ['Management plan', 'How the project will be managed']])}
    <p>Rajib Mall's version (lecture 5): executive summary, project background, business opportunity (what difference will it make, what if we don't do it), costs (development, implementation, training, change management, operations), benefits (revenue generation, cost reductions), risks (identify and explain management).</p>`);
    H(b, `<h2>Project portfolio management (PPM)</h2><p>PPM gives an overview of all projects of an organisation, prioritises resource allocation, decides which new projects to accept and which to drop. Concerns: evaluating proposals, assessing risk, sharing resources, dependencies between projects, removing duplication, ensuring nothing necessary is missed.</p>
    <div class="flowline"><span class="st on">1 · Portfolio definition</span><span class="ar">→</span><span class="st on">2 · Portfolio management</span><span class="ar">→</span><span class="st on">3 · Portfolio optimisation</span></div>
    <p><b>Definition</b>: central record; decide whether ALL projects or only, say, ICT projects; distinguish new product development (NPD) from renewal (process improvement) projects. <b>Management</b>: actual costing and performance recorded and assessed. <b>Optimisation</b>: better balance of projects. Pro: small ad-hoc tasks (quick fixes) can stay outside. Cons: "full-time" staff are effectively part-time because of routine work; the portfolio may not reflect real activity if some projects are excluded.</p>
    <p><b>Evaluation of an individual project</b>: technical assessment (can the functionality be achieved with affordable current technology?) + financial assessment (cost-benefit analysis). Also produce a <b>cash-flow forecast</b>: when expenditure and income take place, so you know whether you can fund the expenses yourself or must borrow.</p>`);
    sorter(b, 'Game: classify the cost or benefit', 'Examples from DPM lecture 12 and the assignments.', [['dir', 'Direct cost'], ['ind', 'Indirect cost (overhead)'], ['var', 'Variable cost'], ['tb', 'Tangible benefit'], ['ib', 'Intangible benefit']], [
      ['Purchase of a box of CDs/diskettes', 'dir'], ['Salary of developers (development cost)', 'dir'], ['Hardware purchase (set-up cost)', 'dir'],
      ['Insurance', 'ind'], ['Building maintenance', 'ind'], ['Air conditioning and lighting', 'ind'], ['Protection of computer centre from heat and fire', 'ind'],
      ['Computer forms, in proportion to processing', 'var'],
      ['Completing jobs in fewer hours', 'tb'], ['Reports produced with no errors', 'tb'], ['Saving manpower costs', 'tb'],
      ['Improved corporate image', 'ib'], ['More satisfied customers', 'ib']]);
    H(b, `${TBL(['Category', 'Definition', 'Examples'], [['Tangible cost', 'Cash outlay for a specific item', 'Hardware, software, training, salaries'], ['Intangible cost', 'Known to exist, value hard to measure', 'Morale problems, lowered image, online system breakdown in banking hours'], ['Direct cost', 'A money figure can be directly associated', 'Box of diskettes $35; development, set-up, operational costs'], ['Indirect cost', 'Overhead, not tied to one activity', 'Insurance, maintenance, heat/fire protection, lighting, AC'], ['Fixed cost', 'Constant regardless of use; does not recur', 'Straight-line depreciation, exempt employee salaries, insurance'], ['Variable cost', 'Proportional to work volume, recurring', 'Computer forms vs amount of processing'], ['Fixed benefit', 'Constant', '20 % fewer personnel'], ['Variable benefit', 'Varies with volume', 'Safe-deposit system saves 20 min per notice'], ['Direct benefit', 'Attributable to the project', '25 % more transactions per day'], ['Indirect benefit', 'By-product of another activity', 'Selling fertiliser from a steel plant, empty oil tins'], ['Opportunity cost/benefit', 'Forgone by choosing one alternative', 'Hard to identify']])}
    ${TRAP('Insurance is indirect AND fixed. Hardware cost is a set-up cost (direct), but the 2026 key gave "salary to staff" as the example of DEVELOPMENT cost (2026 A3 Q1, Q3).', 'Straight-line depreciation, exempt salaries, insurance, a fixed annual licence fee are all FIXED costs (2026 A3 Q4).', 'In 2019 W1: "Once the business case is approved, the feasibility study is undertaken" is FALSE: the feasibility study produces the business case.')}`);
  } });

page({ id: 't-cba', wk: 3, topic: 1, stars: 3, lec: [12, 13], title: 'Net profit, payback, ROI, NPV, IRR, break-even', kw: 'net profit payback period return on investment ROI present value NPV discount factor IRR internal rate break even investment period return period cash flow', lede: 'The numerical heart of week 3. Four ways to judge a project from its cash flows, and why only NPV/IRR respect the time value of money.',
  gens: ['roi', 'npv', 'payback', 'pv'],
  render(b) {
    H(b, MUST('<b>Net profit</b> = total income − total cost over the project life. Ignores timing.',
      '<b>Payback period</b> = time until accumulated cash flow turns positive (lecture counts whole years). Simple, insensitive to small errors, but ignores profitability after break-even.',
      '<b>ROI</b> = average annual profit / total investment × 100. Ignores timing, unrelated to bank interest: "potentially very misleading".',
      '<b>Discount factor</b> DF = 1/(1+r)<sup>t</sup>; present value P = F/(1+r)<sup>t</sup>. <b>NPV</b> = Σ discounted cash flows (both signs). Difficulty: choosing the discount rate.',
      '<b>IRR</b> = discount rate that makes NPV = 0; comparable with interest rates. Cons: does not show the absolute size of the return; may give multiple rates (take the lowest).',
      '<b>Break-even</b> compares costs of the current vs candidate system: before = <b>investment period</b> (candidate costs more), after = <b>return period</b> (candidate gives more benefit).'));
    const L = lab(b, 'Cash-flow workbench', 'Pick a preset from the lectures/assignments or type your own cash flows (year 0 negative). Everything recomputes live.');
    const presets = { p1: ['Project 1 (lecture)', [-100000, 10000, 10000, 10000, 20000, 100000]], p2: ['Project 2 (= 2026 A3 Q6 Project B)', [-1000000, 200000, 200000, 200000, 200000, 300000]], p3: ['Project 3 (lecture)', [-100000, 30000, 30000, 30000, 30000, 30000]], p4: ['Project 4 (lecture)', [-120000, 30000, 30000, 30000, 30000, 75000]] };
    let cf = presets.p1[1].slice(), r = 10;
    const sel = h('select', { class: 'sel' }, Object.entries(presets).map(([k, v]) => h('option', { value: k }, v[0])));
    const rate = h('input', { type: 'number', value: r, step: 'any' });
    L.add(h('div', { class: 'calc' }, h('div', { class: 'inputs' }, h('label', {}, 'Preset', sel), h('label', {}, 'Discount rate (%)', rate))));
    const tb = h('table', { class: 'etbl' }); L.add(h('div', { class: 'tblwrap' }, tb));
    const addBtn = h('button', { class: 'btn', onclick: () => { cf.push(0); draw(); } }, '+ year'); L.add(addBtn);
    const sc = L.scope({ xmin: 0, xmax: 5, ymin: -1, ymax: 1, xt: 5, yt: 4, h: 230, xl: 'year', yl: 'accumulated cash flow', yfmt: v => fmt(v / 1000, 0) + 'k' });
    L.legend([['accumulated', '--ch-v'], ['accumulated, discounted', '--ch-i']]);
    const ro = L.readout();
    sel.addEventListener('change', () => { cf = presets[sel.value][1].slice(); draw(); }); rate.addEventListener('input', () => { r = +rate.value; draw(); });
    const npvAt = (c, rr) => c.reduce((s, x, t) => s + x / (1 + rr / 100) ** t, 0);
    function irr(c) { let lo = -99, hi = 500; if (npvAt(c, lo) * npvAt(c, hi) > 0) return NaN; for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npvAt(c, lo) * npvAt(c, m) <= 0) hi = m; else lo = m; } return (lo + hi) / 2; }
    function draw() {
      tb.innerHTML = '<tr><th>Year</th><th class="num">Cash flow</th><th class="num">Accumulated</th><th class="num">DF</th><th class="num">Discounted</th><th></th></tr>';
      let acc = 0, accd = 0; const xs = [], ya = [], yd = [];
      cf.forEach((c, t) => { const df = 1 / (1 + r / 100) ** t; acc += c; accd += c * df; xs.push(t); ya.push(acc); yd.push(accd); const inp = h('input', { type: 'number', value: c, step: 1000 }); inp.addEventListener('change', () => { cf[t] = +inp.value; draw(); }); tb.append(h('tr', {}, h('td', {}, String(t)), h('td', {}, inp), h('td', { class: 'num' }, fmt(acc, 0)), h('td', { class: 'num' }, df.toFixed(4)), h('td', { class: 'num' }, fmt(c * df, 0)), h('td', {}, t > 0 ? h('button', { class: 'rm', title: 'remove year', onclick: () => { cf.splice(t, 1); draw(); } }, '×') : ''))); });
      const inv = -cf[0], net = cf.reduce((a, b) => a + b, 0), n = cf.length - 1; let pb = '—'; let a2 = 0; for (let t = 0; t < cf.length; t++) { a2 += cf[t]; if (t > 0 && a2 >= 0) { pb = 'year ' + t; break; } }
      const lo = Math.min(...ya, ...yd, 0), hi = Math.max(...ya, ...yd, 0); sc.set({ xmax: n, xt: n, ymin: lo * 1.1, ymax: Math.max(hi * 1.1, 1) });
      sc.draw([{ x: xs, y: ya, c: '--ch-v', w: 2.5, dots: 3 }, { x: xs, y: yd, c: '--ch-i', w: 2.5, dots: 3 }]);
      const I = irr(cf);
      ro([['net profit', fmt(net, 0)], ['payback', pb], ['ROI', fmt(net / n / inv * 100, 2) + ' %'], ['NPV @ ' + r + ' %', fmt(npvAt(cf, r), 0)], ['IRR', isNaN(I) ? '—' : fmt(I, 2) + ' %']]);
    }
    draw();
    H(b, `${TBL(['', 'Project 1', 'Project 2', 'Project 3', 'Project 4'], [['Investment (year 0)', '100,000', '1,000,000', '100,000', '120,000'], ['Net profit', '50,000', '<b>100,000</b> (largest, but huge investment)', '50,000', '75,000'], ['Payback', 'Year 5', 'Year 5', '<b>Year 4</b> (best)', 'End of year 4'], ['ROI', '10 %', '2 %', '10 %', '<b>12.5 %</b> (best)'], ['NPV @10 %', '618', '<i>exercise</i>', '<i>exercise</i>', '<i>exercise</i>']])}
    <p class="cap">The lecture's point: each technique picks a different "best" project. Use the workbench to finish the NPV exercise (Project 3 ≈ 13,724; Project 4 ≈ 21,665, the best; Project 2 ≈ −179,750). Project 1 gives 618 with the 4-digit table and 621 with exact factors: both are accepted.</p>
    ${F('ROI = <b>(net profit ÷ years) ÷ investment × 100</b>', '2026 A3 Q6: 100,000/5 = 20,000 → 2 %')}${F('P = F / (1 + r)<sup>t</sup>  ·  NPV = Σ<sub>t</sub> CF<sub>t</sub> / (1 + r)<sup>t</sup>', 'Rs.1500 at 10 % after 4 years → 1027.39')}`);
    const L2 = lab(b, 'Break-even chart', 'Current (manual) system has low fixed cost and high cost per transaction; the candidate system costs more up front but less per transaction.');
    const sc2 = L2.scope({ xmin: 0, xmax: 120, ymin: 0, ymax: 300, xt: 6, yt: 5, h: 230, xl: 'transactions (thousand)', yl: 'total cost (thousand $)' });
    L2.legend([['current system', '--ch-v'], ['candidate system', '--ch-i']]);
    const ro2 = L2.readout(); const v2 = controls(L2.body, [{ k: 'f1', label: 'Current: fixed cost', min: 0, max: 100, v: 20, d: 0 }, { k: 'c1', label: 'Current: cost / 1000 tx', min: 1, max: 4, step: .1, v: 2.5, d: 1 }, { k: 'f2', label: 'Candidate: fixed cost', min: 20, max: 200, v: 105, d: 0 }, { k: 'c2', label: 'Candidate: cost / 1000 tx', min: .1, max: 3, step: .1, v: 1.2, d: 1 }], () => d2());
    function d2() { const be = v2.c1 > v2.c2 ? (v2.f2 - v2.f1) / (v2.c1 - v2.c2) : NaN; sc2.draw([{ fn: x => v2.f1 + v2.c1 * x, c: '--ch-v' }, { fn: x => v2.f2 + v2.c2 * x, c: '--ch-i' }], { v: isNaN(be) ? [] : [{ x: be, t: 'break-even', c: '--hot-ink' }] }); ro2([['break-even volume', isNaN(be) ? 'never' : fmt(be, 1) + 'k tx'], ['below it', 'investment period: candidate costs more'], ['above it', 'return period: candidate gives more benefit']]); }
    d2();
    H(b, TRAP('Return period = candidate gives MORE benefit than the old system (2026 A3 Q5); investment period = candidate costs MORE (2019 W3 Q6).', 'IRR is inferior to NPV because it may give multiple rates, is harder to compute AND does not show the absolute size of the return → "all of the above" (2019 W3 Q5).', 'Payback ignores everything after break-even; net profit and ROI ignore timing; only NPV/IRR discount.'));
  } });

page({ id: 't-riskeval', wk: 3, topic: 1, stars: 2, lec: [14], title: 'Risk evaluation of projects & decision trees', kw: 'risk evaluation identification ranking risk matrix risk premium NPV cost benefit expected value risk profile sensitivity decision tree', lede: 'A project can be profitable on paper and still a bad bet. Five methods to bring risk into project evaluation.',
  gens: ['exp-income', 'dtree'],
  render(b) {
    H(b, MUST('Five risk evaluation methods: <b>risk identification & ranking</b> (build a project <b>risk matrix</b>: importance × likelihood), <b>risk and NPV</b> (add a <b>risk premium</b> to the discount rate: e.g. +2 % safe, +5 % fairly risky), <b>cost-benefit analysis</b> (each outcome × its probability → expected value), <b>risk profile analysis</b> (sensitivity analysis to find the most important factors), <b>decision trees</b> (evaluate a decision and its effect on future options).',
      'Use a decision tree when you must decide whether the risk matters and choose a course of action (2019 W3 Q8).',
      'Expected value of a path = Σ outcome × probability; choose the path with the highest.'));
    H(b, `<h2>1 · Risk identification and ranking</h2><p>Use a checklist of possible risks and classify each by <b>importance</b> and <b>likelihood</b> separately: a serious but very unlikely risk may matter less than a moderate, almost certain one.</p>${TBL(['Risk', 'Importance', 'Likelihood'], [['Client rejects proposed look and feel of site', 'H', '–'], ['Competitors undercut prices', 'H', 'M'], ['Warehouse unable to deal with increased demand', 'M', 'L'], ['Online payment has security problems', 'M', 'M'], ['Maintenance costs higher than estimated', 'L', 'L'], ['Response times deter purchasers', 'M', 'M']])}
    <h2>2 · Risk and NPV</h2><p>For riskier projects use a <b>higher discount rate</b>: a risk premium, e.g. an additional 2 % for a reasonably safe project, 5 % for a fairly risky one. Projects can be scored high/medium/low risk and given premiums per category: arbitrary, but consistent.</p>
    <h2>3 · Cost-benefit analysis with probabilities</h2><p>Consider each possible outcome, estimate its probability and value; the project value is the probability-weighted sum. Lecture example (payroll product): high sales $800,000 (p 0.1), medium $650,000 (p 0.6), low $100,000 (p 0.3) → expected income $500,000/year. Development cost $750,000, annual costs $200,000, 4 years → expected 4×500,000 − 4×200,000 = $1,200,000, a good return on $750,000, <i>but</i> with a 30 % chance of low sales the company loses money: lecture advises not to go ahead. Limitations: assigning probabilities is hard; worst cases are not fully accounted for.</p>
    <h2>4 · Risk profile analysis</h2><p>Construct risk profiles using sensitivity analysis: vary each factor to find which matter most, then control or mitigate them; otherwise live with the risk or abandon the project.</p>`);
    const L = lab(b, '5 · Decision tree: extend or replace the sales-order system?', 'Lecture example (DPM 14). Move the probability that the market expands and watch the decision flip.');
    const v = controls(L.body, [{ k: 'p', label: 'P(market expands)', min: 0, max: 1, step: .05, v: .2, d: 2 }], () => d());
    const svgBox = h('div', { class: 'netwrap' }); L.add(svgBox); const ro = L.readout();
    function d() { const p = v.p, eE = (1 - p) * 75000 + p * -100000, eR = p * 250000 + (1 - p) * -50000, best = eE >= eR ? 'E' : 'R';
      const node = (x, y, t, cls) => `<g class="nd${cls ? ' cr' : ''}"><rect x="${x}" y="${y - 16}" width="150" height="32" rx="6"/><text class="nm" x="${x + 75}" y="${y + 5}" text-anchor="middle">${t}</text></g>`;
      svgBox.innerHTML = `<svg class="net" viewBox="0 0 720 260" style="min-width:600px"><path class="ed" d="M90 130 L190 70"/><path class="ed" d="M90 130 L190 190"/><path class="ed" d="M340 70 L470 35"/><path class="ed" d="M340 70 L470 105"/><path class="ed" d="M340 190 L470 155"/><path class="ed" d="M340 190 L470 225"/>
      <g class="se"><rect x="30" y="112" width="60" height="36" rx="4"/><text x="60" y="135" text-anchor="middle">D</text></g>${node(190, 70, 'Extend: E = ' + fmt(eE, 0), best === 'E')}${node(190, 190, 'Replace: E = ' + fmt(eR, 0), best === 'R')}
      ${node(470, 35, `expands (${p.toFixed(2)}): −100,000`)}${node(470, 105, `no (${(1 - p).toFixed(2)}): 75,000`)}${node(470, 155, `expands (${p.toFixed(2)}): 250,000`)}${node(470, 225, `no (${(1 - p).toFixed(2)}): −50,000`)}</svg>`;
      ro([['E(extend)', fmt(eE, 0)], ['E(replace)', fmt(eR, 0)], ['decision', best === 'E' ? 'extend the existing system' : 'replace now']]); }
    d();
    H(b, `<p class="cap">At p = 0.2: extend = 0.8×75,000 − 0.2×100,000 = <b>40,000</b>; replace = 0.2×250,000 − 0.8×50,000 = <b>10,000</b> → extend (the slide's text says −$500,000 but its calculation uses −$50,000, as in the textbook).</p>`);
    H(b, TRAP('A project <b>risk matrix</b> belongs to "risk identification and ranking" (2026 A3 Q7).', 'In C-B analysis for risk: consider each outcome, its probability and value (2026 A3 Q8). Categorising projects and assigning a risk premium is "risk and NPV".', 'For a risky project use a HIGHER discount rate (2019 W3 Q7).'));
  } });

page({ id: 't-programme', wk: 3, topic: 1, stars: 2, lec: [15], title: 'Programme & benefits management', kw: 'programme management strategic business cycle infrastructure research development innovative partnership programme manager project manager mandate brief vision blueprint benefits quantified valued', lede: 'Several related projects managed together can deliver benefits none of them gives alone. Short lecture, steady source of one-mark questions.',
  render(b) {
    H(b, MUST('<b>Programme</b> (D.C. Ferns): a group of projects managed in a coordinated way to gain benefits not possible if managed independently.',
      'Five programme types: <b>strategic</b> (implement a single strategy), <b>business cycle</b> (projects within a planning cycle), <b>infrastructure</b> (identify and implement common infrastructure), <b>research & development</b> (new innovative products from research), <b>innovative partnerships</b> (collaboration between organisations).',
      'Programme manager: many simultaneous projects, <b>personal</b> relationship with skilled resources, <b>optimise</b> resource use, projects seen as <b>similar</b>. Project manager: one project, <b>impersonal</b> relationship, <b>minimise</b> demand for resources, projects seen as <b>unique</b>.',
      'Strategic programme documents (OGC): programme <b>mandate</b> → programme <b>brief</b> (≈ feasibility study) → <b>vision statement</b> (new capability) → <b>blueprint</b> (changes needed).',
      'Benefits can be: quantified and valued (x staff saving £y) · quantified but not valued (x % fewer complaints) · identified but not easily quantified (public approval in the locality).'));
    sorter(b, 'Game: which type of programme?', 'Match each description to the programme type.', [['str', 'Strategic'], ['bc', 'Business cycle'], ['inf', 'Infrastructure'], ['rd', 'Research & development'], ['ip', 'Innovative partnership']], [
      ['Projects implementing a single strategy', 'str'], ['All projects in this year\'s budget', 'bc'], ['Common network and data centre for all departments', 'inf'], ['New innovative product from lab research', 'rd'], ['Joint product with a university and another company', 'ip'], ['Portfolio of projects contributing to a common objective (OGC)', 'str']]);
    H(b, `${TBL(['Programme manager', 'Project manager'], [['Many simultaneous projects', 'One project at a time'], ['Personal relationship with skilled resources', 'Impersonal relationship with resources'], ['Optimisation of resource use', 'Minimisation of demand for resources'], ['Projects tend to be seen as similar', 'Projects tend to be seen as unique']])}
    <h2>Aids to programme management</h2><p>Physical and technical dependencies between projects are shown with <b>dependency diagrams</b> (similar to activity networks).</p>
    <h2>Benefits management</h2><p>Giving an organisation a capability does not guarantee the benefits: developers build the application, users must use it, the organisation must exploit it. Benefits appear after the project ends, so benefits management is done at <b>programme level</b>: define expected benefits → analyse balance of costs and benefits → plan how they will be achieved → allocate responsibilities → monitor achievement.</p>
    <p>Typical benefits: mandatory requirement, improved quality of service, increased productivity, more motivated workforce, internal management benefits, risk reduction, economies, revenue enhancement/acceleration, strategic fit.</p>`);
    sorter(b, 'Game: how measurable is the benefit?', 'From DPM lecture 15 and 2019 W3 Q10.', [['qv', 'Quantified and valued'], ['qn', 'Quantified but not valued'], ['iq', 'Identified, not easily quantified']], [
      ['Reduction of 3 staff saving Rs. 18 lakh per year', 'qv'], ['10 % decrease in customer complaints', 'qn'], ['Public approval for the organisation in its locality', 'iq'], ['Local administration approval for a mobile tower', 'iq'], ['Processing time cut from 5 to 2 days', 'qn']]);
    H(b, TRAP('Innovative partnerships = collaboration of DIFFERENT organisations (2026 A3 Q9).', 'Programme managers have PERSONAL, not impersonal, relationships with skilled resources (2026 A3 Q10). By the textbook table, "minimise demand" and "projects as distinct/unique" are project-manager traits too: if asked as MSQ, think about them.'));
  } });
