/* ===== Week 4 · story + theory ===== */
learn('t-estbasics', { ch: '4.1', title: 'How big is Saarthi? Planning and estimation basics', line: 'Mr Bhosale wants a price and a date. Riya learns the estimation sequence (size → effort → duration and cost), the SPMP document, person-months and why both over- and under-estimates hurt.' }, L => {
  H(L, STORY('4.1', 'How big is Saarthi?', `
    ${SAY('bho', 'Simple question, Riya. How much will Saarthi cost, and when will it be ready?')}
    ${SAY('riya', 'I\'ll get back to you by Friday.')}
    ${NARR('Back at the office.')}
    ${SAY('arjun', 'Easy. It\'s about forty thousand lines of code. Ten people, four months.')}
    ${SAY('kul', 'Forty thousand lines in which language? Counted how? And would ten people for four months be the same as forty people for one month?')}
    ${SAY('riya', 'No... more people means more coordination.')}
    ${SAY('kul', 'So go in order. First the <b>size</b> of the product. From the size, the <b>effort</b>. From the effort, the <b>duration</b> and the <b>cost</b>. And write it all in a plan that you will update every few weeks, because you know very little today.')}
    ${SAY('mehta', 'And remember that cost is not price. What we charge PCT is a business decision.')}`));
  H(L, `<h2>1 · What success means, and why planning matters</h2>
    <p>A successful project delivers the <b>agreed functionality</b>, <b>on time</b>, at the <b>agreed cost</b>, with the <b>required quality</b>. Management happens in two stages: set targets, then attempt to achieve them. But what if the targets are not achievable? That is why estimates must be realistic: commitments to unrealistic time and resource estimates lead to irritating <b>delays</b>, <b>customer dissatisfaction</b>, an adverse effect on <b>team morale</b>, <b>poor quality work</b> and finally <b>project failure</b>.</p>
    <p>A PM's activities fall into two groups: <b>project planning</b> and <b>project monitoring and control</b>. Planning starts once the project is found feasible; an <b>initial plan is made before development starts and is then updated frequently</b>.</p>
    ${COLS(`<h4>Planning activities</h4><ul><li><b>Estimation</b>: effort, cost, resources, duration</li><li><b>Scheduling</b></li><li><b>Staff organisation</b>: staffing plans</li><li><b>Risk handling</b>: identification, analysis, abatement procedures</li><li><b>Miscellaneous plans</b>: quality assurance, configuration management</li></ul>`, `<h4>Planning in eight steps</h4><ol style="padding-left:1.2rem;margin:.2rem 0"><li>steps needed to reach the objectives</li><li>tasks in each step (work breakdown structure)</li><li>effort per task</li><li>resources per task</li><li>duration of each task (from 3 and 4)</li><li>task, step and project costs (from 4 and 5)</li><li>interdependencies between tasks</li><li>schedule: milestones, deliverables, costs, payments</li></ol>`)}
    <h3>Sliding window planning</h3>
    <p>Planning is done over <b>several stages</b>: it protects the manager from making big commitments too early, and more information becomes available as the project progresses, so plans become more accurate.</p>`);
  stepper(L, 'Sliding window planning on Saarthi', SVG(660, 190, `<line x1="20" y1="120" x2="640" y2="120" class="ln"/>${['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'M9', 'M10', 'M11', 'M12'].map((m, i) => tx(42 + i * 51, 140, m, { c: 'xs mu' })).join('')}
    ${[0, 1, 2].map(k => `<g${X(k)}><rect x="${20 + k * 204}" y="40" width="204" height="70" rx="8" class="bx blu"/>${tx(122 + k * 204, 62, 'detailed plan', { c: 'sm' })}${tx(122 + k * 204, 84, ['requirements, prototype', 'pilot: 3 routes', 'roll-out, all depots'][k], { c: 'xs mu' })}<rect x="${224 + k * 204}" y="40" width="${416 - k * 204}" height="70" rx="8" class="bx ghost"/>${k < 2 ? tx(432 + k * 102, 75, 'outline only (rough estimates)', { c: 'xs mu' }) : ''}</g>`).join('')}
    ${tx(330, 178, 'the window of detailed planning slides forward stage by stage', { c: 'xs pur' })}`),
    ['Month 1: Riya plans the first stage (requirements and prototype) in detail; the rest of the year is only an outline.', 'At the end of stage 1 she knows much more (the prototype settled the requirements), so she plans the pilot in detail and re-estimates the rest.', 'Then the roll-out. No big commitment was made before the information existed to support it.']);
  H(L, `<h3>The SPMP document</h3>
    <p>When planning is complete, the plans are documented in a <b>Software Project Management Plan (SPMP)</b>. Its organisation:</p>
    ${TBL(['Section', 'Contents'], [['Introduction', 'objectives, major functions, performance issues, management and technical constraints'], ['Project estimates', 'historical data, estimation techniques, effort, cost and duration estimates'], ['Project resources plan', 'people, hardware and software, special resources'], ['Schedules', 'work breakdown structure, task network, Gantt chart, PERT chart'], ['Risk management plan', 'risk analysis, identification, estimation, abatement procedures'], ['Project tracking and control plan', ''], ['Miscellaneous plans', 'process tailoring, quality assurance, configuration management']])}`);

  H(L, `<h2>2 · The estimation sequence</h2>
    <p>Four fundamental questions: What is the <b>size</b> of the software? How much <b>effort</b>? How much <b>calendar time</b>? What is the total <b>cost</b>? They are answered in a fixed order:</p>`);
  stepper(L, 'Size → effort → duration, cost, staffing → schedule', SVG(660, 220, `
    ${bx(10, 85, 120, 50, 'Size\nestimation', { c: 'pur', at: S(0) })}${ar(130, 110, 170, 60, { at: S(1) })}${ar(130, 110, 170, 160, { at: S(2) })}
    ${bx(172, 35, 130, 50, 'Effort\nestimation', { c: 'blu', at: S(1) })}${bx(172, 135, 130, 50, 'Duration\nestimation', { c: 'amb', at: S(2) })}
    ${ar(302, 60, 342, 40, { at: S(3) })}${ar(302, 60, 342, 110, { at: S(3) })}${bx(344, 15, 130, 44, 'Cost\nestimation', { c: 'grn', at: S(3) })}${bx(344, 88, 130, 44, 'Staffing\nestimation', { c: 'grn', at: S(3) })}
    ${ar(302, 160, 506, 160, { at: S(4) })}${ar(474, 110, 506, 150, { at: S(4) })}${bx(508, 135, 140, 50, 'Scheduling', { c: 'red', at: S(4) })}`, 'wide'),
    ['<b>First, estimate the size</b> of the product: lines of code or function points (chapter 4.3). It is hard to estimate effort or duration directly from a problem description; size is the measurable "amount of work".', 'From the size estimate, determine the <b>effort</b> needed (person-months; COCOMO in chapter 5.1). Duration is also derived from size and effort.', 'Effort → <b>duration</b> (calendar months).', 'Effort → <b>cost</b> (effort × salary + other costs) and <b>staffing</b> (how many people, when).', 'Duration and staffing feed <b>scheduling</b> (chapter 6).']);
  H(L, `<h3>What goes into the cost</h3>
    ${COLS(`<ul><li><b>Hardware and software</b> costs</li><li><b>Travel and training</b> costs</li><li><b>Effort costs</b>: the salaries of the engineers, the <b>dominant factor</b> in most projects</li></ul>`, `<ul><li><b>Overheads</b>: building, heating, lighting; networking and communications; shared facilities (library, staff restaurant). Rule of thumb: overheads can be <b>as much as the effort costs</b>.</li></ul>`)}
    <h3>The person-month</h3>
    <p>Effort is measured in <b>person-months</b> (PM): the effort an individual can typically put in in one month. Default value: <b>152 hours per month = 19 days × 8 hours</b>. Why not person-days or person-years? Modern projects take a few months, so person-years are too coarse, and person-days would make estimation and monitoring tedious.</p>`);
  choice(L, 'Saarthi\'s app is estimated at 30 person-months. Is "1 person for 30 months" the same as "30 people for 1 month"?', [
    ['Yes, a person-month is a person-month.', 'Effort is not freely divisible: tasks have precedence and every extra person adds communication overhead.', false],
    ['No: tasks depend on each other and more people means more communication, so the work cannot be compressed that way.', 'Right. Effort and duration are related but not interchangeable; chapter 5.4 shows how compressing the schedule increases effort (Putnam, Jensen).', true]]);
  H(L, `<h3>Costing is not pricing</h3>
    <p>Estimates discover what it costs to produce the software. There is no simple relationship between that cost and the <b>price</b> charged; broader organisational, economic, political and business considerations decide the price.</p>
    ${TBL(['Pricing factor', 'Effect on price'], [['<b>Market opportunity</b>', 'Quote low to move into a new market segment; a low profit now may bring more profit later, and the experience may enable new products'], ['<b>Cost estimate uncertainty</b>', 'If unsure of its estimate, the organisation adds a contingency over its normal profit'], ['<b>Contractual terms</b>', 'If the developer may keep the source code and reuse it, the price can be lower than if the code is handed over'], ['<b>Requirements volatility</b>', 'If requirements are likely to change, quote low to win; charge high prices for the changes later'], ['<b>Financial health</b>', 'A developer in difficulty may lower its price: a smaller profit or breaking even is better than going out of business']])}
    ${IDEA('Words of wisdom (from the slides)', '"Unless a software project has clear definitions of its key milestones and realistic estimates of the time and money it will take to achieve them, there is no way that a project manager can tell whether the project is under control or not."')}
    <h3>When are estimates needed?</h3>
    ${TBL(['Project phase', 'Estimates required'], [['Initiation', 'time, cost and benefit estimates in the project definition'], ['Planning', 'time estimates in the schedule; cost estimates in the budget; cost and benefit estimates in the business case'], ['Start of each stage', 'time and cost estimates reconfirmed for the stage']])}`);
  H(L, `<h2>3 · Why estimating is hard, and the cost of getting it wrong</h2>
    ${COLS(DEF('Subjective', 'Much of estimating is judgement; hard to produce evidence for a precise target.') + DEF('Political pressure', 'Managers may cut estimates to win acceptance of a proposal.'), DEF('Changing technologies', 'Uncertainty, especially early on the learning curve.') + DEF('Projects differ', 'Experience from one project may not apply to another.'))}`);
  stepper(L, 'Over-estimate vs under-estimate', SVG(640, 230, `<line x1="320" y1="20" x2="320" y2="210" class="ln dash"/>${tx(320, 222, 'the right estimate', { c: 'xs mu' })}
    <g${S(1)}>${bx(20, 30, 270, 160, '', { c: 'amb' })}${tx(155, 52, 'OVER-ESTIMATE', { c: 'sm hot' })}${tx(155, 88, 'Parkinson\'s law:', { c: 'sm' })}${tx(155, 110, '"Work expands to fill\nthe time available"', { c: 'xs' })}${tx(155, 160, 'the extra time gets used up', { c: 'xs mu' })}</g>
    <g${S(2)}>${bx(350, 30, 270, 160, '', { c: 'red' })}${tx(485, 52, 'UNDER-ESTIMATE', { c: 'sm red' })}${tx(485, 82, '+ no overspend', { c: 'xs grn' })}${tx(485, 104, '− system usually unfinished', { c: 'xs red' })}${tx(485, 126, '− morale drops; substandard work', { c: 'xs red' })}${tx(485, 148, '− may lead to abandonment', { c: 'xs red' })}</g>
    <g${S(3)}>${tx(320, 14, 'Weinberg\'s zeroth law of reliability: drop the reliability requirement and you can meet any other', { c: 'xs pur' })}</g>`),
    ['There is no free lunch on either side of the right estimate.', '<b>Over-estimating</b>: Parkinson\'s law, "work expands to fill the time available". Give a task 4 weeks and it takes 4 weeks.', '<b>Under-estimating</b>: no overspend, but the system is usually unfinished. Research confirms that motivation and morale drop with highly aggressive targets, and developers respond to pressing deadlines with <b>substandard work</b>; it can even lead to abandonment of the project.', '<b>Weinberg\'s zeroth law of reliability</b>: "a software project that does not have to meet a reliability requirement can meet any other requirement". Under pressure, quality is what silently gets sacrificed.']);
  H(L, `<h3>Basis for successful estimating, and refining estimates</h3>
    <p>You need <b>information about past projects</b> (how big were they, how much effort and time they needed) and a way to <b>measure the amount of work</b> (traditionally lines of code, which has known problems: chapter 4.2). Estimates must then be <b>refined</b>: interaction costs are hidden in them, normal conditions do not apply, things go wrong, and scope and plans change. Time and cost estimates of activities are adjusted as risks, resources and situation details become clearer.</p>`);
  quickcheck(L, [['Order of estimation?', 'Size → effort → duration and cost (→ staffing and scheduling).'], ['How many hours in a COCOMO person-month?', '152 (19 days × 8 hours).'], ['State Parkinson\'s law.', 'Work expands to fill the time available.'], ['Name three SPMP sections.', 'Any of: introduction, project estimates, resources plan, schedules, risk management plan, tracking and control plan, miscellaneous plans.']]);
  H(L, RECAP('Success = agreed functionality, on time, agreed cost, required quality. Unrealistic estimates → delays, dissatisfaction, low morale, poor quality, failure.', 'Planning: estimation, scheduling, staffing, risk, misc plans; initial plan before development, updated often; sliding window planning.', 'SPMP: introduction, estimates, resources, schedules, risk plan, tracking & control, misc plans.', 'Sequence: size → effort → duration/cost/staffing → schedule. Cost: hardware/software, travel/training, effort (dominant), overheads (≈ effort costs).', '1 PM = 152 h; costing ≠ pricing (market opportunity, uncertainty, contract terms, volatility, financial health).', 'Over-estimate → Parkinson\'s law; under-estimate → unfinished, low morale, substandard work; Weinberg\'s zeroth law.'));
  H(L, NEXT('Riya now needs an actual number. She has five ways to get one, from asking experts to applying a formula.', 't-esttech', 'Chapter 4.2 · Five ways to guess well'));
});

learn('t-esttech', { ch: '4.2', title: 'Five ways to guess well: estimation techniques', line: 'Price to win, LOC and its traps, expert judgement and Delphi, analogy, top-down vs bottom-up, and the simplistic algorithmic model.' }, L => {
  H(L, STORY('4.2', 'Five ways to guess well', `
    ${NARR('Riya puts the passenger app\'s requirements in front of four people and asks each, separately, for an effort estimate.')}
    ${SAY('arjun', '18 person-months.')}${SAY('imran', '9.')}${SAY('neha', '30. Nobody ever counts testing.')}${SAY('vik', 'I built a similar app for Mysuru buses. 14, if the team is good.')}
    ${SAY('riya', 'Nine to thirty. Which one do I believe?')}
    ${SAY('kul', 'None of them yet. Ask each for the reasoning behind the number, share the reasons anonymously, and ask again. That is the Delphi method. Then cross-check with an analogy to the Mysuru project, and with a formula. Never trust a single estimate.')}`));
  H(L, `<h2>1 · A taxonomy of estimating methods</h2>
    ${TBL(['Method', 'Idea'], [['<b>Top-down</b> or <b>bottom-up</b>', 'Split an overall estimate, or add up task estimates (activity-based, analytical)'], ['<b>Parametric / algorithmic</b> models', 'A formula from measurable parameters, e.g. function points, COCOMO'], ['<b>Expert judgement</b>', '"Just guessing?" Experienced people predict'], ['<b>Analogy</b>', 'Case-based, compare with a similar completed project'], ['<b>Price to win</b>', 'The project costs whatever the customer can spend']])}
    <h3>Price to win</h3>
    <p>The advantage: you get the contract. The disadvantage: costs do not reflect the work, so either the customer does not get the desired system or the customer overpays. It may seem unethical and unbusinesslike, yet when detailed information is lacking it may be the <b>only appropriate strategy</b>. The most ethical version: agree the project cost on an outline proposal and constrain development by that cost; negotiate a detailed specification or use an evolutionary approach.</p>`);
  H(L, `<h2>2 · Size: lines of code and its problems</h2>
    <p>Effort and duration are hard to estimate directly, but they correlate with project <b>size</b>, a measure of the problem's complexity in terms of the effort and time needed. Two metrics are popular: <b>source lines of code (SLOC)</b> and <b>function points (FP)</b>. SLOC is conceptually simple, but FP is favoured today because of SLOC's many shortcomings.</p>
    <p>Units: LOC (line of code), KLOC (thousands of LOC), KSLOC (thousands of source LOC), NCKSLOC (new or changed KSLOC). But what is a line? LOC was proposed when programs were typed on punched cards, one line per card. What about a Java statement spanning several lines, or several statements on one line? Do GUI code and built-in classes count?</p>`);
  stepper(L, 'Two counter-intuitive LOC "productivity" results', SVG(640, 230, `
    ${tx(160, 18, 'same feature, two languages', { c: 'sm mu' })}${tx(480, 18, 'same feature, two programmers', { c: 'sm mu' })}
    <g${S(0)}><rect x="40" y="${200 - 160}" width="80" height="160" rx="4" class="fill-v"/>${tx(80, 214, 'assembly', { c: 'xs' })}<rect x="200" y="${200 - 40}" width="80" height="40" rx="4" class="fill-g"/>${tx(240, 214, 'Python', { c: 'xs' })}</g>
    <g${S(1)}><rect x="360" y="${200 - 140}" width="80" height="140" rx="4" class="fill-a"/>${tx(400, 214, 'verbose coder', { c: 'xs' })}<rect x="520" y="${200 - 60}" width="80" height="60" rx="4" class="fill-g"/>${tx(560, 214, 'concise coder', { c: 'xs' })}</g>
    <g${S(2)}>${tx(240, 100, '"assembly programmer is\n4× as productive"?!', { c: 'sm red' })}${tx(560, 100, '"verbose coder is more\nproductive"?!', { c: 'sm red' })}</g>`),
    ['The same functionality takes much more code in a lower-level language than in a high-level one.', 'Likewise, a verbose programmer writes far more lines than a concise one for the same feature.', 'Measured in LOC per month, the <b>lower the level of the language</b>, the more "productive" the programmer, and the <b>more verbose</b> the programmer, the "higher" the productivity. Both conclusions are absurd: LOC rewards profligate code.']);
  H(L, `${COLS(`<h4>Major shortcomings of SLOC</h4><ul><li>Size varies with coding style</li><li>Focuses on coding alone</li><li>Correlates poorly with quality and efficiency of code</li><li>Penalises higher-level languages, code reuse</li><li><b>Difficult to estimate at the start</b> from the problem description: only a guess, so not useful for planning</li></ul>`, `<ul style="margin-top:1.9rem"><li>Only a code measure; programmer-dependent</li><li>Measures lexical/textual complexity only, not structural or logical complexity</li><li>Ambiguous with language advances, automatic code generation, custom software and reuse, object orientation</li></ul>`)}`);
  H(L, `<h2>3 · Expert judgement</h2>
    <p>One or more experts, familiar with the application area and the technologies, predict the cost; the process iterates until some consensus is reached. Simple, and accurate if the experts have direct experience of similar systems; particularly appropriate where existing code is to be modified. Very inaccurate if there are no experts. Research shows expert judgement in practice tends to be based on <b>analogy</b>. Four forms:</p>
    ${STEPS(['<b>Basic expert judgement</b>: coordinator gives each expert the specification and an estimation form → group meeting to discuss estimation issues → experts fill forms anonymously → coordinator distributes a summary on an iteration form → group meeting focusing on points where estimates varied widely → experts fill forms again anonymously; repeat as many rounds as appropriate.', '<b>Weighted average estimating</b> (also called sensitivity analysis estimating): three estimates instead of one: optimistic O (best case), most likely M, pessimistic P. Estimated effort = (O + 4M + P) / 6: more accurate than a single estimate.', '<b>Consensus estimating</b>: briefing to the team → each person gets a list of work components → each independently estimates O, M, P per component → estimates written on the whiteboard → each explains the basis and assumptions → a revised set is produced → averages of O, M and P → plugged into the formula.', '<b>Delphi</b>: a variation of consensus estimating (next).'])}
    ${F('Estimated effort = (O + 4M + P) / 6', 'O 10, M 14, P 24 → (10 + 56 + 24)/6 = 15 PM')}
    <h3>Delphi: experts who never meet</h3>
    <p>A team of experts and a coordinator. Experts estimate <b>independently</b> and note the rationale behind their estimate; the coordinator notes any extraordinary rationale and <b>circulates it</b>; experts <b>re-estimate</b>. It is an expert survey in two or more rounds; from the second round onwards feedback on the previous round is given, and the same experts assess the same matter again, influenced by the others' opinions. <b>Anonymity is essential</b>: the experts never meet to discuss their viewpoints, so nobody is swayed by seniority or a loud voice.</p>`);
  const R1 = [9, 14, 18, 30], R2 = [13, 15, 18, 22], R3 = [15, 16, 17, 18], who = ['Imran', 'Vikram', 'Arjun', 'Neha'];
  stepper(L, 'Delphi on Saarthi\'s app: three rounds', SVG(640, 230, `<line x1="40" y1="190" x2="620" y2="190" class="ln"/>${[5, 10, 15, 20, 25, 30, 35].map(v => `<line x1="${40 + v * 16}" y1="186" x2="${40 + v * 16}" y2="194" class="ln"/>${tx(40 + v * 16, 208, v + ' PM', { c: 'xs mu' })}`).join('')}
    ${[R1, R2, R3].map((R, k) => R.map((v, i) => `<g${X(k)}><circle cx="${40 + v * 16}" cy="${150 - i * 26}" r="9" class="${['fill-t', 'fill-a', 'fill-g', 'fill-r'][i]}"/>${tx(40 + v * 16 + 14, 150 - i * 26, who[i] + ' ' + v, { anchor: 'start', c: 'xs' })}</g>`).join('')).join('')}
    ${[R1, R2, R3].map((R, k) => `<g${X(k)}><rect x="${40 + Math.min(...R) * 16}" y="164" width="${(Math.max(...R) - Math.min(...R)) * 16}" height="8" rx="4" class="fill-p op5"/>${tx(320, 20, ['Round 1: spread 9-30', 'Round 2: after reading the anonymous rationales', 'Round 3: converged ≈ 16 PM'][k], { c: 'sm pur' })}</g>`).join('')}`),
    ['<b>Round 1</b>: independent, anonymous estimates with rationale: 9, 14, 18 and 30 PM. Imran forgot the server side; Neha counted full regression testing for 3 platforms.', '<b>Round 2</b>: the coordinator circulates the rationales (without names). Imran adds the back end; Neha learns the app shares tests with the web portal. Estimates: 13, 15, 18, 22.', '<b>Round 3</b>: 15, 16, 17, 18. The spread has collapsed; Riya takes ≈ 16 PM. The experts never met, so nobody simply deferred to the most senior person.']);
  H(L, `${VS([['Cons of expert judgement', '', ['Hard to quantify', 'Hard to document the factors the experts used', 'Experts may be biased, optimistic or pessimistic (group consensus reduces this)', 'It should <b>complement</b> other methods such as algorithmic models']]])}
    <h2>4 · Estimation by analogy</h2>
    <p>The cost of a project is computed by comparing it with a <b>similar project in the same application domain</b> (case-based). Stages: identify the significant features of the current project → find previous projects with similar features → identify the differences between them → identify possible reasons for error (risk) → take measures to reduce uncertainty. Vikram's Mysuru bus app is Saarthi's analogue.</p>
    ${VS([['Pros', '', ['May be accurate if project data are available and people/tools are the same']], ['Cons', '', ['Impossible if no comparable project has been tackled', 'Needs a systematically maintained cost database']]])}
    <h2>5 · Top-down vs bottom-up</h2>`);
  stepper(L, 'Top-down: split one overall estimate', SVG(640, 200, `${bx(220, 10, 200, 50, 'Overall project\n100 days', { c: 'b', tc: 'wh', at: S(0) })}
    ${['design 30 %', 'code 30 %', 'test 40 %'].map((t, i) => `<g${S(1)}>${ar(320, 60, 110 + i * 210, 112)}${bx(40 + i * 210, 114, 140, 50, t + '\n= ' + [30, 30, 40][i] + ' days', { c: ['blu', 'amb', 'grn'][i] })}</g>`).join('')}
    ${tx(320, 190, 'proportions come from past projects', { c: 'xs mu', at: S(1) })}`),
    ['<b>Top-down</b>: produce an overall estimate from effort drivers, based on past project data: 100 days for the depot portal.', 'Then distribute proportions to the components: design 30 %, code 30 %, test 40 % (30, 30 and 40 days).']);
  stepper(L, 'Bottom-up: add up the smallest tasks', SVG(640, 220, `${bx(240, 10, 160, 44, 'Depot portal\n= 108 days', { c: 'b', tc: 'wh', at: S(2) })}
    ${['Routes module\n= 41', 'Reports module\n= 37', 'Duty roster\n= 30'].map((t, i) => `<g${S(1)}>${bx(30 + i * 210, 84, 160, 44, t, { c: 'amb' })}</g><g${S(2)}>${ar(110 + i * 210, 84, 320, 56)}</g>`).join('')}
    ${[[12, 9, 20], [10, 15, 12], [8, 10, 12]].map((g, i) => g.map((v, j) => `<g${S(0)}>${bx(20 + i * 210 + j * 62, 160, 56, 40, v + ' d', { c: 'blu', r: 5 })}</g><g${S(1)}>${ar(48 + i * 210 + j * 62, 160, 110 + i * 210, 130)}</g>`).join('')).join('')}`),
    ['<b>Bottom-up</b>: break the activities into smaller and smaller components, stopping at what one person can do in one or two weeks; estimate each lowest-level activity.', 'At each higher level, add the estimates of the level below.', 'The total emerges at the top: 108 days. Different from the top-down 100: comparing the two is itself useful.']);
  H(L, `${TBL(['', 'Top-down', 'Bottom-up'], [['How', 'overall estimate from cost drivers and past data, then divided', 'estimate every lowest-level task, then add up'], ['Use when', 'past project data exist', 'no data about similar past projects'], ['Pros', 'accounts for <b>system-level</b> activities (integration, documentation, configuration management); needs minimal detail; faster, easier', 'teams estimate familiar components in a traditional way; more <b>stable</b>: errors in components tend to balance out'], ['Cons', 'overlooks difficult low-level problems (tends to underestimate); no detailed basis to justify the estimate', 'may <b>overlook system-level costs</b> (integration, configuration management, QA); information may not exist early; time-consuming']])}`);
  H(L, `<h2>6 · Algorithmic (parametric) models</h2>
    <p>Effort and duration are expressed in terms of characteristics that correlate with them, called <b>size</b> (any easily measured characteristic that correlates with effort: SLOC, function points). COCOMO (based on lines of code) and function points are examples. A problem with LOC-based models: you must <b>guess</b> the LOC first, then feed the guess to the algorithm, whereas what you want is an estimate from a measurable <b>system characteristic</b>.</p>
    ${COLS(`<h4>A good algorithmic model is</h4><ul><li><b>Defined</b>: clear procedure</li><li><b>Accurate</b></li><li><b>Objective</b>: avoids subjective factors</li><li>Results <b>understandable</b></li><li><b>Stable</b>: valid over a wide range of parameter values</li><li><b>Easy to use</b></li><li><b>Causal</b>: needs no future data</li></ul>`, `<h4>Pros</h4><ul><li>Repeatable estimates</li><li>Easy to modify inputs and refine/customise formulas</li><li>Efficient; supports families of estimates and sensitivity analysis</li><li>Can be calibrated to previous experience</li></ul><h4>Cons</h4><ul><li>Cannot handle exceptional conditions (exceptional teamwork, exceptional skill-task match)</li><li>Poor sizing inputs and wrong cost-driver ratings → inaccurate results</li><li>Some factors (experience) are hard to quantify</li></ul>`)}
    <p><b>Calibration</b>: many models are built for specific situations and are not useful outside them; calibration customises a generic model (product types, operating environments, labour rates, relationships between cost items). <b>Recommendations</b>: do not depend on a single estimate; use several techniques and investigate large differences; document the assumptions; monitor the project for assumptions that turn out wrong; improve the process by keeping a <b>historical database</b>.</p>
    <h3>The simplistic model</h3>
    ${F('estimated effort = system size ÷ productivity     (productivity = size ÷ effort, from past projects)', 'e.g. LOC per day or SLOC per staff-month')}
    <p>The lecture's example: a transaction project of <b>38,000 lines</b>; productivity about <b>400 SLOC per staff-month</b>. Effort = 38 KSLOC ÷ 0.4 KSLOC/SM = 2.5 × 38 = 95 ≈ <b>100 SM</b>. The shortest time: min time = 0.75 T = 0.75 × 2.5 × (SM)<sup>1/3</sup> ≈ 1.875 × 100<sup>1/3</sup> ≈ 1.875 × 4.63 ≈ <b>9 months</b>. (The 0.75 is Boehm's compression limit, chapter 5.4.) What is wrong with the simplistic model? Productivity is not constant: it falls as projects grow, which is why COCOMO uses an exponent greater than 1 on size.</p>`);
  choice(L, 'Riya has no historical data for depot systems and must justify every number to PCT\'s auditors. Which approach fits best?', [
    ['Top-down from past project proportions', 'Top-down needs past project data, and gives no detailed basis to justify estimates.', false],
    ['Bottom-up from a work breakdown', 'Right: use bottom-up when there is no data on similar projects; it gives a detailed, justifiable basis (watch out for missing system-level costs).', true],
    ['Price to win', 'That produces a number, not a justification.', false]], { tag: 'Quick check' });
  quickcheck(L, [['Weighted average with O = 6, M = 9, P = 18?', '(6 + 36 + 18)/6 = 10.'], ['How does Delphi differ from basic expert judgement?', 'In Delphi the experts never meet; they estimate anonymously with rationale, the coordinator circulates the rationales, and they re-estimate over rounds.'], ['Two counter-intuitive LOC effects?', 'Lower-level language and more verbose code both look more "productive".']]);
  H(L, RECAP('Taxonomy: top-down/bottom-up, parametric, expert judgement, analogy, price to win.', 'Price to win: get the contract, but costs don\'t reflect work; sometimes the only option; ethical form: cost fixed on outline proposal.', 'SLOC: card-era measure; style-dependent; penalises high-level languages and reuse; unknown at the start. FP preferred.', 'Expert judgement forms: basic, weighted average (O + 4M + P)/6, consensus, Delphi (anonymous rounds, experts never meet).', 'Analogy: similar project in the same domain; needs a cost database.', 'Top-down (system-level costs included, may underestimate low-level) vs bottom-up (stable, may miss system-level costs, slow).', 'Algorithmic models: defined, accurate, objective, understandable, stable, easy, causal; calibrate; never rely on one estimate. Simplistic: effort = size ÷ productivity.'));
  H(L, NEXT('Arjun\'s "forty thousand lines" was a guess. Is there a size measure you can count from the requirements alone, before any code exists?', 't-fp', 'Chapter 4.3 · Counting what the user sees'));
});

learn('t-fp', { ch: '4.3', title: 'Counting what the user sees: function points', line: 'Dev and Riya size the depot portal with IFPUG function points, try Mark II, and Imran uses COSMIC for the embedded bus unit.' }, L => {
  H(L, STORY('4.3', 'Counting what the user sees', `
    ${SAY('dev', 'I can\'t tell you lines of code. But I can tell you what the depot portal does: the screens where depot staff enter data, the reports it prints, the look-ups, and the files it keeps.')}
    ${SAY('kul', 'That is exactly what Allan Albrecht counted at IBM in the 1970s. He wanted to compare the productivity of programming languages without counting lines of code. He counted the functions the user sees: function points.')}
    ${SAY('imran', 'And my bus unit? Its "user" is a GPS chip and a ticket machine, not a person.')}
    ${SAY('kul', 'Then you need COSMIC, the function-point method made for embedded software.')}`));
  H(L, `<h2>1 · Why function points?</h2>
    <p><b>Albrecht</b> (IBM) needed to measure the relative productivity of different programming languages, and the size of an application without counting lines of code. He identified <b>five parameters</b> and counted occurrences of each type of functionality to indicate the size of an information system. It is a <b>top-down</b> approach. FPs were originally used to estimate lines of code, rather than effort. The <b>International Function Point Users Group (IFPUG)</b> promotes FP use and develops consistent counting guidelines (Counting Practices Manual, certification; 1,200+ members in 30+ countries).</p>
    ${VS([['Why IFPUG rejects LOC', '', ['Rewards profligate design, penalises concise design', 'No industry (ISO) standard for a line of code', 'Cannot normalise across platforms, languages, organisations', 'Some 4GLs do not even use lines of code', 'Can be misleading']], ['How FP overcomes it', '', ['Independent of language, tools and methodology', 'Can be estimated <b>early</b> in analysis and design', 'Based on the <b>user\'s external view</b>, so non-technical users understand what is measured']], ['Count when?', '', ['<b>Early and often</b>: once requirements are finalised (IFPUG 4.1 rules)', 'Refine the count through development', 'Recount to measure <b>scope creep</b> and breakage']]])}
    <h2>2 · The counting procedure</h2>`);
  stepper(L, 'IFPUG function point computation steps', SVG(660, 210, `
    ${bx(10, 80, 120, 50, 'Determine type\nof count', { c: 's2', at: S(0) })}${ar(130, 105, 152, 105, { at: S(1) })}
    ${bx(154, 80, 130, 50, 'Identify scope &\napplication boundary', { c: 'pur', at: S(1), lh: 13 })}${ar(284, 95, 306, 55, { at: S(2) })}${ar(284, 115, 306, 155, { at: S(2) })}
    ${bx(308, 30, 130, 46, 'Count data\nfunctions', { c: 'blu', at: S(2) })}${bx(308, 134, 130, 46, 'Count transactional\nfunctions', { c: 'blu', at: S(2), lh: 13 })}
    ${ar(438, 53, 466, 95, { at: S(3) })}${ar(438, 157, 466, 115, { at: S(3) })}${bx(468, 80, 90, 50, 'UFP', { c: 'amb', at: S(3) })}
    ${bx(468, 6, 90, 50, 'Value\nadjustment\nfactor', { c: 'grn', at: S(4), lh: 12 })}${ar(558, 105, 578, 105, { at: S(4) })}${ar(513, 56, 513, 78, { at: S(4) })}${bx(580, 80, 74, 50, 'FP', { c: 'b', tc: 'wh', at: S(4) })}`, 'wide'),
    ['Decide what kind of count it is (a new development, an enhancement, an existing application).', 'Draw the <b>application boundary</b>: what is inside the depot portal and what belongs to other systems.', 'Count the <b>data functions</b> (internal logical files, external interface files) and the <b>transactional functions</b> (external inputs, outputs, inquiries), each rated for complexity.', 'Weighted sum = <b>unadjusted function points (UFP)</b>.', 'Rate the 14 general system characteristics to get the <b>value adjustment factor (VAF)</b>; FP = UFP × VAF.']);
  H(L, `<h2>3 · The five components</h2>`);
  stepper(L, 'Five things that cross (or sit inside) the boundary', SVG(660, 330, `<rect x="200" y="30" width="300" height="250" rx="14" class="bx ghost"/>${tx(350, 20, 'depot portal (application boundary)', { c: 'xs mu' })}
    ${bx(20, 80, 110, 120, 'Depot\nmanager', { c: 's2' })}
    <g${S(0)}><circle cx="380" cy="140" r="40" class="bx blu"/>${tx(380, 140, 'ILF\nRoutes', {})}</g>
    <g${S(1)}>${ar(130, 96, 338, 124, { c: 'g thick' })}${tx(230, 86, 'EI: add route (updates ILF)', { c: 'xs grn' })}</g>
    <g${S(2)}>${ar(342, 156, 134, 150, { c: 'a thick' })}${tx(236, 140, 'EO: revenue report (derived)', { c: 'xs hot' })}</g>
    <g${S(3)}>${pth('M130 180 C 210 250, 330 250, 368 182', { c: 'v' })}${pth('M384 182 C 380 300, 180 300, 120 204', { c: 'v dash' })}${tx(300, 268, 'EQ: where is bus 214? (retrieval only)', { c: 'xs blu' })}</g>
    <g${S(4)}>${bx(540, 60, 110, 70, 'PCT HR system\n(other app.)', { c: 's2', lh: 14 })}<circle cx="595" cy="200" r="24" class="bx pur"/>${tx(595, 200, 'EIF', { c: 'xs' })}${pth('M595 130 L 595 174', { c: 'p', m: false })}${ar(571, 196, 424, 152, { c: 'p' })}${tx(560, 250, 'EIF: driver master,\nreferenced, kept by HR', { c: 'xs pur' })}</g>`, 'wide'),
    ['<b>Internal logical file (ILF)</b>: a user-identifiable group of logically related data <b>maintained within</b> the application boundary. Roughly a data store: created and accessed by the system (Routes, Buses, Duty roster).', '<b>External input (EI)</b>: processes data from outside the boundary and <b>updates an internal file</b> (adds or changes data in an ILF). "Add a route" updates the Routes ILF.', '<b>External output (EO)</b>: data sent outside the boundary, extracted from internal files, generally a <b>report</b>, typically with derived data or calculations (daily revenue per depot).', '<b>External inquiry (EQ)</b>: a user-initiated input-output combination: the input causes an immediate output; it <b>retrieves</b> data, does <b>not update</b> files, and the result contains <b>no derived data</b> ("where is bus 214?").', '<b>External interface file (EIF)</b>: a group of data <b>referenced</b> by the application but <b>maintained by another application</b> (the driver master kept by PCT\'s HR system; the lecture\'s example: a ZIP-code table used to validate customer updates).']);
  sorter(L, 'Sort Saarthi\'s depot-portal functions', 'Pick the IFPUG type of each.', [['EI', 'External input'], ['EO', 'External output'], ['EQ', 'External inquiry'], ['ILF', 'Internal logical file'], ['EIF', 'External interface file']], [
    ['Depot clerk records a bus breakdown', 'EI'], ['Assign a driver to a duty', 'EI'], ['Monthly punctuality report with percentages', 'EO'], ['Daily revenue report per depot', 'EO'], ['Look up a driver\'s duty for today', 'EQ'], ['Show current location of a bus', 'EQ'], ['Routes data kept by the portal', 'ILF'], ['Duty roster data kept by the portal', 'ILF'], ['Fare table maintained by the new fare system', 'EIF'], ['Employee master maintained by PCT HR', 'EIF']]);
  H(L, `<h2>4 · Weights and the unadjusted count</h2>
    <p>Each occurrence is rated low, medium or high complexity and weighted (Albrecht's multipliers):</p>
    ${TBL(['Type', 'Low', 'Medium (average)', 'High'], [['EI', 3, '<b>4</b>', 6], ['EO', 4, '<b>5</b>', 7], ['EQ', 3, '<b>4</b>', 6], ['ILF (LIF)', 7, '<b>10</b>', 15], ['EIF', 5, '<b>7</b>', 10]])}
    ${F('UFP = Σ (number of elements of a given type × weight)', 'all average: UFP = 4·EI + 5·EO + 4·EQ + 10·ILF + 7·EIF')}
    <h3>Worked example: the spell checker</h3>
    <p>"The spell checker accepts a document file and an optional personal dictionary file. It lists all words not contained in either file. The user can query the number of words processed and the number of spelling errors found at any stage."</p>`);
  stepper(L, 'Spell checker: from description to FP', SVG(640, 250, `${['2 inputs × 4', '3 outputs × 5', '2 inquiries × 4', '1 internal file × 10', '2 external files × 7'].map((t, i) => `<g${S(i)}>${bx(20, 12 + i * 40, 280, 32, t, { c: ['grn', 'amb', 'blu', 'pur', 'tea'][i], r: 5 })}${tx(340, 28 + i * 40, '= ' + [8, 15, 8, 10, 14][i], { anchor: 'start', c: 'mono' })}</g>`).join('')}
    <g${S(5)}><line x1="330" y1="214" x2="420" y2="214" class="ln"/>${tx(340, 232, 'UFP = 55', { anchor: 'start', c: 'lg' })}</g>
    <g${S(6)}>${tx(530, 90, 'all 14 GSCs = 3\nVAF = 0.65 + 0.42 = 1.07\nFP = 55 × 1.07 = 58.85', { c: 'sm grn', lh: 20 })}</g>
    <g${S(7)}>${tx(530, 176, 'given DIs, TDI = 36\nVAF = 1.01\nFP = 55 × 1.01 = 55.55', { c: 'sm blu', lh: 20 })}</g>`),
    ['<b>2 user inputs</b> (document file name, personal dictionary name), average: 2 × 4 = 8.', '<b>3 user outputs</b> (error report, word count, misspelled-error count), average: 3 × 5 = 15.', '<b>2 user requests</b> (# processed words?, # spelling errors?): inquiries, 2 × 4 = 8.', '<b>1 internal file</b> (the dictionary): 1 × 10 = 10.', '<b>2 external files</b> (document file, personal dictionary): 2 × 7 = 14.', 'UFP = 8 + 15 + 8 + 10 + 14 = <b>55</b>.', 'If every one of the 14 general system characteristics has degree of influence 3: TDI = 42, VAF = 0.65 + 0.42 = 1.07, FP = 55 × 1.07 = <b>58.85</b>.', 'With the lecture\'s actual ratings (TDI = 36): VAF = 1.01, FP = 55 × 1.01 = <b>55.55</b>.']);
  H(L, `<h2>5 · The value adjustment factor</h2>
    <p>Each of the <b>14 general system characteristics (GSCs)</b> is rated by its <b>degree of influence (DI)</b> from 0 to 5: 0 not present / no influence · 1 incidental · 2 moderate · 3 average · 4 significant · 5 strong influence throughout. Add the 14 DIs to get the <b>total degree of influence (TDI)</b>, 0 to 70.</p>
    ${F('VAF (or TCF) = 0.65 + 0.01 × TDI       FP = UFP × VAF', 'VAF range 0.65 (TDI 0) to 1.35 (TDI 70)')}
    <div class="flowline">${['Data communication', 'Distributed data processing', 'Performance objectives', 'Heavily used configuration', 'Transaction rate', 'On-line data entry', 'End-user efficiency', 'On-line update', 'Complex processing', 'Reusability', 'Conversion & install ease', 'Operational ease', 'Multiple-site use', 'Facilitate change'].map((t, i) => `<span class="st"><b class="mono">${i + 1}</b> ${t}</span>`).join('')}</div>
    <h3>More worked examples from the slides</h3>
    ${TBL(['Problem', 'Working', 'Answer'], [['Payroll: medium EI (input/amend/delete employee), high EI (pay from timesheets), medium EO (pay-to-date), medium LIF (payroll file), simple EIF (personnel file of another system)', '4 + 6 + 5 + 10 + 5', 'UFP = <b>30</b>; at 5 FP/day → 30/5 = <b>6 days</b>'], ['50 inputs, 40 outputs, 35 enquiries, 6 files, 4 interfaces, all average; 70 LOC per FP', 'UFP = 200 + 200 + 140 + 60 + 28 = 628; VAF = 1.07', 'AFP = <b>672</b>; size = 672 × 70 = <b>47,040 LOC</b>'], ['32 inputs, 60 outputs, 24 inquiries, 8 files, 2 interfaces, all average', 'UFP = 128 + 300 + 96 + 80 + 14 = 618; VAF = 1.07', 'AFP = <b>661.26</b>']])}
    <p>Saarthi's depot portal, counted by Dev: 3 EIs (4 + 3 + 4 = 11), 2 EOs (7 + 5 = 12), 2 EQs (4 + 3 = 7), 3 ILFs (3 × 10 = 30), 2 EIFs (5 + 7 = 12) → <b>UFP = 72</b>; with TDI = 40, VAF = 1.05 and FP ≈ <b>75.6</b>.</p>`);
  choice(L, 'A system has 10 average EIs, 8 average EOs, 5 average EQs, 4 average ILFs and 2 average EIFs, and TDI = 30. What is the FP count?', [
    ['UFP 134, FP 127.3', 'Check: 40 + 40 + 20 + 40 + 14 = 154.', false],
    ['UFP 154, FP 146.3', 'Right: 10×4 + 8×5 + 5×4 + 4×10 + 2×7 = 154; VAF = 0.65 + 0.30 = 0.95; FP = 154 × 0.95 = 146.3.', true],
    ['UFP 154, FP 200.2', 'That used VAF = 1.30, i.e. forgot that VAF = 0.65 + 0.01 × TDI.', false]], { tag: 'Try it' });
  H(L, `<h2>6 · Symons Mark II function points</h2>
    <p>Developed by <b>Charles R. Symons</b> (1991), building on Albrecht's work in parallel with IFPUG: <b>simpler and more usable</b>, widely used in the <b>UK</b>. For each <b>transaction</b> count the data items input (n<sub>i</sub>), the data items output (n<sub>o</sub>) and the entity types accessed (n<sub>e</sub>); add them up for the whole system (N<sub>i</sub>, N<sub>o</sub>, N<sub>e</sub>).</p>
    ${F('Mk II FP = 0.58 × N<sub>i</sub> + 1.66 × N<sub>e</sub> + 0.26 × N<sub>o</sub>', 'note the order: entities have the biggest weight')}
    <p><b>Example, "place purchase order"</b>: inputs Date, Supplier Number, Product Code, Quantity Required, Date Required (5); output PO Number (1); entities Product, Purchase Order, Supplier, Purchase Order Item (4) → 0.58 × 5 + 1.66 × 4 + 0.26 × 1 = <b>9.8</b>. The slide's twelve-transaction system totals N<sub>i</sub> = 120, N<sub>o</sub> = 120, N<sub>e</sub> = 60 → 69.6 + 99.6 + 31.2 = <b>200.4</b>.</p>
    <h2>7 · COSMIC: function points for embedded systems</h2>
    <p>IFPUG and Mark II were designed for information systems, dominated by input and output. In an embedded system the "user" is usually a hardware device or another software component, so features are hidden. <b>COSMIC full function points</b> decompose the architecture into a hierarchy of <b>software layers</b>: a component receives requests for services from layers above and requests services from layers below, and communicates with peers. This fixes the boundary; inputs and outputs are aggregated into <b>data groups</b> (items about the same object of interest).</p>`);
  stepper(L, 'COSMIC: four data movements in Imran\'s bus unit', SVG(640, 290, `${bx(200, 10, 240, 40, 'Higher layer: trip scheduler', { c: 's2' })}${bx(200, 240, 240, 40, 'Lower layer: GPS / modem drivers', { c: 's2' })}
    ${bx(220, 110, 200, 70, 'Ticket store-and-\nforward component', { c: 'b', tc: 'wh' })}${bx(20, 115, 130, 60, 'Ticket machine\n(peer)', { c: 's2' })}${bx(500, 110, 120, 70, 'Flash memory\n(persistent\nstorage)', { c: 'amb', lh: 13 })}
    <g${S(1)}>${ar(150, 135, 216, 135, { c: 'g thick' })}${tx(184, 122, 'Entry', { c: 'xs grn' })}</g>
    <g${S(2)}>${ar(422, 132, 496, 132, { c: 'a thick' })}${tx(460, 120, 'Write', { c: 'xs hot' })}</g>
    <g${S(3)}>${ar(496, 160, 422, 160, { c: 'a thick' })}${tx(460, 176, 'Read', { c: 'xs hot' })}</g>
    <g${S(4)}>${ar(320, 182, 320, 236, { c: 'r thick' })}${tx(370, 212, 'Exit (to modem\n→ server)', { c: 'xs red' })}</g>
    <g${S(5)}>${tx(110, 230, '1 + 1 + 1 + 1\n= 4 Cfsu', { c: 'lg pur' })}</g>`),
    ['A ticket record moves through the bus unit\'s store-and-forward component.', '<b>Entry</b>: data moves into the component from a higher layer or a peer component (the ticket machine sends a ticket record).', '<b>Write</b>: data moves to persistent storage (the record is saved to flash in case the network is down).', '<b>Read</b>: data moves from persistent storage (unsent records are read back).', '<b>Exit</b>: data moves out of the component (towards the modem and the server).', 'Each movement counts <b>1 COSMIC functional size unit (Cfsu)</b>; the overall count is simply the sum: 4. COSMIC FFP is an <b>ISO standard</b>. Cons: it ignores the processing of data groups once moved in, so it is not recommended for systems with complex mathematical algorithms.']);
  H(L, `<h2>8 · Strengths, weaknesses and relatives of FP</h2>
    ${VS([['FP pros', '', ['Language independent', 'Understandable by the client', 'Simple modelling', 'Hard to fudge', 'Makes feature creep visible']], ['FP cons', '', ['Labour intensive; needs extensive training', 'Inexperience → inaccuracy; one rater can introduce errors (use several)', 'Weighted to file manipulation and transactions', '<b>Ignores the algorithmic complexity</b> of a function']]])}
    ${COLS(DEF('Feature point metric', 'An extension of FP adding a parameter for <b>algorithm complexity</b>, so a more complex function gets a larger size (FP assumes size is independent of complexity).'), DEF('Object points', 'Nothing to do with object-oriented programming: count the <b>screens</b> displayed, <b>reports</b> produced and <b>modules</b> in the code. Simpler, and account for the GUI (used by COCOMO II, chapter 5.2).'))}
    <h3>Converting FP to lines of code</h3>
    ${TBL(['Language', 'C', 'C++', 'HTML', 'Java', 'Perl', 'J2EE', 'Visual Basic'], [['Median SLOC per FP', 104, 53, 42, 59, 60, 50, 42]])}
    <p>Saarthi's portal (≈ 75.6 FP) in Java: 75.6 × 59 ≈ <b>4,460 SLOC</b>. That size feeds COCOMO in the next chapter.</p>`);
  quickcheck(L, [['Which component updates an internal file?', 'External input (EI).'], ['EQ vs EO?', 'EQ: input causes immediate retrieval, no update, no derived data. EO: output (often a report) with derived data/calculations.'], ['Mark II formula?', '0.58 N<sub>i</sub> + 1.66 N<sub>e</sub> + 0.26 N<sub>o</sub>.'], ['COSMIC\'s four data movements?', 'Entries, exits, reads, writes: 1 Cfsu each.']]);
  H(L, RECAP('FP (Albrecht, IBM): size from the user\'s view; language independent; countable early; recount for scope creep.', 'Five components: EI (updates ILF), EO (report, derived data), EQ (retrieval, no update, no derived data), ILF (maintained inside), EIF (maintained by another application).', 'Weights L/M/H: EI 3/4/6, EO 4/5/7, EQ 3/4/6, ILF 7/10/15, EIF 5/7/10. UFP = Σ count × weight.', 'VAF = 0.65 + 0.01 × TDI (14 GSCs × DI 0-5); FP = UFP × VAF. Spell checker: UFP 55 → 58.85 (all 3s).', 'Mark II (Symons, UK): 0.58 N<sub>i</sub> + 1.66 N<sub>e</sub> + 0.26 N<sub>o</sub>. COSMIC (embedded, layers): entries + exits + reads + writes, 1 Cfsu each.', 'FP ignores algorithmic complexity → feature points. Object points: screens, reports, modules.'));
  H(L, NEXT('Now Riya has sizes: about 4,500 lines for the portal, more for the app and the bus unit. Next: turning size into person-months with Boehm\'s COCOMO.', 't-cocomo', 'Chapter 5.1 · COCOMO: from size to effort'));
