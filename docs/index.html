page({ id: 't-cmmi', wk: 12, topic: 1, stars: 3, lec: [55, 56], title: 'CMMI, PSP & Six Sigma', kw: 'CMMI development services acquisition PSP personal software process Humphrey PSP0 PSP1 PSP2 PSP3 time management logs six sigma DPMO 3.4 230 6210 DMAIC DMADV green belt black belt Pareto chart', lede: 'From the organisation (CMMI) down to the individual (PSP), plus the statistics-driven Six Sigma.',
  gens: ['dpmo'],
  render(b) {
    H(b, MUST('<b>CMMI</b> (CMM Integrated) is the successor of CMM (v1.1 in 2002, v1.2 in Aug 2006); integrates many models into one framework. Three flavours: <b>CMMI for Development</b> (software and systems engineering, collaborative teams, acquisition from suppliers), <b>CMMI for Services</b> (any service organisation, from taxi aggregators to call centres), <b>CMMI for Acquisition</b> (acquiring products and services). Level 5 = Optimizing.',
      '<b>PSP</b> (Humphrey): a scaled-down industrial process for <b>individual</b> use; recognises that an individual process differs from a team process; defined, can be fine-tuned by the individual; helps estimating, planning, tracking performance. Record time for design, code, compile, test (boring work feels longer).',
      'PSP levels: <b>PSP0</b> personal measurement (basic size measures), <b>PSP1</b> personal planning (time and schedule), <b>PSP2</b> personal quality management (design and code reviews), <b>PSP3</b> personal process evolution. Measurement comes before planning.',
      'PSP steps: planning (estimate max/min/total LOC, minutes/LOC, times; plan summary form) → design → code → compile → test → postmortem (actual time and size), all logged.',
      '<b>Six Sigma</b>: quantitative defect elimination for any industry; a defect is anything outside the customer\'s tolerance; <b>≤ 3.4 defects per million opportunities</b>; 5σ ≈ 230, 4σ ≈ 6210 DPMO. Methodologies <b>DMAIC</b> (Define, Measure, Analyze, Improve, Control) and <b>DMADV</b> (Define, Measure, Analyze, Design, Verify); green belts and black belts supervised by a master black belt. <b>Pareto chart</b>: bar chart of defects to find the most frequent/costly.'));
    const L = lab(b, 'Sigma level vs defects per million', 'The three figures from the slide, on a log scale. Enter your own defect data to see your DPMO.');
    const sc = L.scope({ xmin: 3.5, xmax: 6.5, ymin: 0, ymax: 4.5, xt: 6, yt: 4.5, h: 220, xl: 'sigma level', yl: 'log₁₀ DPMO', yfmt: v => '10^' + v.toFixed(1) });
    const v = controls(L.body, [{ k: 'u', label: 'Units inspected', min: 100, max: 100000, step: 100, v: 5000, d: 0 }, { k: 'o', label: 'Opportunities per unit', min: 1, max: 20, v: 5, d: 0 }, { k: 'd', label: 'Defects found', min: 0, max: 500, v: 12, d: 0 }], () => d()); const ro = L.readout();
    function d() { const dpmo = v.d / (v.u * v.o) * 1e6; sc.draw([{ x: [4, 5, 6], y: [Math.log10(6210), Math.log10(230), Math.log10(3.4)], c: '--ch-v', w: 2.5, dots: 5 }], { t: [{ x: 4.05, y: Math.log10(6210) + .25, s: '4σ: 6210' }, { x: 5.05, y: Math.log10(230) + .25, s: '5σ: 230' }, { x: 5.6, y: Math.log10(3.4) + .3, s: '6σ: 3.4' }], h: dpmo > 0 ? [{ y: Math.log10(dpmo), t: 'yours: ' + fmt(dpmo, 1), c: '--ch-i' }] : [] }); ro([['DPMO', fmt(dpmo, 1)], ['six sigma?', dpmo <= 3.4 ? 'yes (≤ 3.4)' : 'no'], ['band', dpmo <= 3.4 ? '≥ 6σ' : dpmo <= 230 ? '5σ-6σ' : dpmo <= 6210 ? '4σ-5σ' : 'below 4σ']]); }
    d();
    const L2 = lab(b, 'PSP: grow your personal process', 'Each level adds to the one below it.');
    const P = [['PSP0', 'Personal measurement', 'Basic size measures; time and defect logging.'], ['PSP1', 'Personal planning', 'Size estimation, time and schedule planning.'], ['PSP2', 'Personal quality management', 'Design and code reviews.'], ['PSP3', 'Personal process evolution', 'Scaling up and evolving the personal process.']];
    const lad = h('div', { class: 'ladder' }), out = h('div', { class: 'ivtxt' }); L2.add(lad); L2.add(out);
    P.forEach(p => { const bt = h('button', { 'aria-pressed': 'false', onclick: () => { $$('button', lad).forEach(x => x.setAttribute('aria-pressed', 'false')); bt.setAttribute('aria-pressed', 'true'); out.innerHTML = `<b>${p[0]} · ${p[1]}</b>: ${p[2]}`; } }, h('b', { class: 'lv' }, p[0].slice(3)), h('span', {}, p[0] + ' ' + p[1])); lad.append(bt); }); $$('button', lad)[0].click();
    H(b, TRAP('CMMI for Services is NOT limited to IT help desks; CMMI for Development is NOT about supplier contracts (2026 A12 Q1).', 'PSP is for individuals (TSP is for teams); it does not eliminate other processes (A12 Q2). Reviews come in PSP2, not PSP0 (A12 Q3).', 'Six Sigma: 3.4 DPMO, not 340; 4σ has MORE defects than 5σ (A12 Q4). CMMI level 5 = Optimizing (2019 W11 Q7).'));
  } });

page({ id: 't-reliab', wk: 12, topic: 1, stars: 3, lec: [57, 58], title: 'Software reliability & reliability metrics', kw: 'reliability definition 90-10 rule core observer dependent operational profile hardware software failure curve bathtub wear MTTF MTTR MTBF ROCOF POFOD availability failure classes transient permanent recoverable unrecoverable cosmetic', lede: 'Reliability = probability of working correctly for a given time under given conditions. For software that number depends on who is using it and how.',
  gens: ['pofod', 'avail', 'mttf'],
  render(b) {
    H(b, MUST('Reliability (IEEE 1991): probability of the software working "correctly" over a given period under specified operating conditions; informally trustworthiness/dependability.',
      'Why hard to measure: errors do not cause failures equally (<b>90-10 rule</b>: 90 % of execution time in 10 % of the code, the <b>core</b>; removing 60 % of defects from the least used parts improves reliability only ≈ 3 %); no simple relation to latent defects; <b>observer-dependent</b> (operational profile); reliability <b>changes with every fix</b>.',
      'Hardware fails by wear and tear (bathtub curve: burn-in, useful life, wear-out); repair keeps reliability; goal = <b>stability</b>. Software never wears out; it fails until the design/code is changed; repair can increase or decrease reliability; goal = <b>reliability growth</b>.',
      'Metrics: <b>MTTF</b> = average time between successive failures = Σ(t<sub>i+1</sub> − t<sub>i</sub>)/(n − 1); <b>MTTR</b> = average repair time; <b>MTBF = MTTF + MTTR</b> (clock time); <b>ROCOF</b> = failures per unit time over an interval; <b>POFOD</b> = probability of failure per service request (no time: 0.001 ⇒ 1 in 1000); <b>availability</b> = MTBF/(MTBF + MTTR) (inherent), MTBM/(MTBM + MDT) (operational).',
      'Failure classes: <b>transient</b> (only for some inputs), <b>permanent</b> (all inputs), <b>recoverable</b> (system recovers with or without operator), <b>unrecoverable</b> (restart needed), <b>cosmetic</b> (minor irritation, e.g. double click needed).'));
    const L = lab(b, 'Hardware vs software failure curves', 'Hardware: bathtub. Software: no wear-out, but each upgrade introduces new faults (spikes), so the actual curve drifts up from the ideal.');
    const sc = L.scope({ xmin: 0, xmax: 10, ymin: 0, ymax: 1, xt: 5, yt: 2, h: 220, xl: 'time', yl: 'failure rate', yfmt: () => '' }); L.legend([['hardware (bathtub)', '--ch-v'], ['software actual', '--ch-i'], ['software ideal', '--muted']]);
    const v = controls(L.body, [{ k: 'u', label: 'Upgrades during life', min: 0, max: 5, v: 3, d: 0 }], () => d());
    function d() { const hw = t => 0.6 * Math.exp(-t * 1.6) + 0.12 + (t > 7 ? 0.08 * (t - 7) ** 2 : 0); const ideal = t => 0.65 * Math.exp(-t * 0.9) + 0.05; const ups = Array.from({ length: v.u }, (_, i) => 2 + i * 7 / Math.max(1, v.u)); const act = t => { let r = ideal(t); ups.forEach((u, i) => { if (t >= u) r += 0.18 * Math.exp(-(t - u) * 1.5) + 0.03 * (i + 1) / Math.max(1, v.u); }); return r; }; sc.draw([{ fn: hw, c: '--ch-v' }, { fn: ideal, c: '--muted', dash: [5, 4] }, { fn: act, c: '--ch-i', n: 600 }]); }
    d();
    const L2 = lab(b, 'Operational profile: why reliability is observer-dependent', 'The same program, two users. Faults sit in functions f12 and f22. A user who rarely calls them sees a reliable program.');
    const prof = [['f11', .4, 0], ['f12', .1, 1], ['f13', .1, 0], ['f21', .05, 0], ['f22', .15, 1], ['f31', .15, 0], ['f32', .05, 0]];
    let user = 'avg'; segmented(L2.body, [['avg', 'Average user (slide profile)'], ['clerk', 'Data-entry clerk (uses F1 a lot)'], ['admin', 'Admin (uses F2 a lot)']], user, k => { user = k; d2(); }); const ro2 = L2.readout(); const tb = h('div'); L2.add(tb);
    function d2() { const p = prof.map(r => r[1]); if (user === 'clerk') { p[0] = .6; p[1] = .02; p[2] = .2; p[3] = .05; p[4] = .03; p[5] = .05; p[6] = .05; } if (user === 'admin') { p[0] = .1; p[1] = .25; p[2] = .05; p[3] = .1; p[4] = .4; p[5] = .05; p[6] = .05; } const pf = prof.reduce((s, r, i) => s + p[i] * r[2] * 0.01, 0); tb.innerHTML = TBL(['Function', 'Probability of use', 'Faulty?'], prof.map((r, i) => [r[0], p[i].toFixed(2), r[2] ? '<b style="color:var(--bad)">yes</b>' : ''])); ro2([['P(failure) per request (1 % of calls to a faulty function fail)', (pf * 100).toFixed(3) + ' %'], ['perceived reliability', ((1 - pf) * 100).toFixed(3) + ' %']]); }
    d2();
    H(b, `${F('MTTF = Σ (t<sub>i+1</sub> − t<sub>i</sub>) / (n − 1)  ·  MTBF = MTTF + MTTR', 'MTBF 100 h: next failure expected 100 h of clock time after one occurs')}${F('POFOD = failures / demands  ·  A<sub>inherent</sub> = MTBF / (MTBF + MTTR)  ·  A<sub>operational</sub> = MTBM / (MTBM + MDT)', '45 days, 5 h → 1080/1085 ≈ 99 %')}
    <p>A good reliability metric should be observer-independent. Most metrics centre on the probability of failure and ignore its consequences, hence the need to classify failures. MTTF is less appropriate for software than hardware: when a software error is repaired, the same error never appears again. Availability matters for systems that must never be down (telecom, operating systems).</p>
    ${TRAP('POFOD 0.001 ⇒ 1 in 1000 requests, 0.1 %; it is NOT time-based (2026 A12 Q7). 10 failures in 4000 → 0.25 % (2019 W12 Q8).', 'Hardware has a bathtub curve; software does not wear out but changes can add failures; HW failure rate is NOT constant throughout (A12 Q6).', 'Reliability varies among users because they exercise different features (A12 Q5).', 'Mixing days and hours in availability: convert first (45 days = 1080 h).', '"Software is invisible" is NOT a reason reliability is hard to measure (2019 W12 Q1).')}`);
  } });

page({ id: 't-relgrowth', wk: 12, topic: 1, stars: 2, lec: [58, 59], title: 'Reliability growth models & statistical testing', kw: 'reliability growth model step function Jelinski Moranda Littlewood Verall gamma negative growth diminishing returns when to stop testing statistical testing operational profile', lede: 'Reliability grows as bugs are found and fixed. Growth models predict when you will reach the target; statistical testing measures where you are.',
  render(b) {
    H(b, MUST('A <b>reliability growth model</b> models how reliability grows as errors are detected and repaired; it predicts when (if at all) a reliability level will be reached, i.e. <b>how long to test / when to stop testing</b>. No model is universal: fit the data to several and take the best.',
      '<b>Step function model</b>: reliability increases by a <b>constant</b> amount at each repair (assumes all errors contribute equally: unrealistic).',
      '<b>Jelinski-Moranda</b>: failure rate <b>proportional to the number of faults remaining</b>; improvement per fix depends on faults present. Shortcoming: frequent failures are found first, so growth should be large initially and slow later.',
      '<b>Littlewood-Verall</b>: allows <b>negative reliability growth</b> (a repair introduces errors); each fix\'s contribution is an independent <b>gamma</b>-distributed random variable; bugs with large contributions are removed earlier → <b>diminishing returns</b>.',
      '<b>Statistical testing</b>: objective is to <b>determine reliability</b>, not find errors. Steps: determine the <b>operational profile</b> (input classes with probabilities) → select/generate test data per the profile → apply, record time between failures → after a statistically significant number of failures compute reliability. ✔ realistic reliability as perceived by the average user. ✘ hard to define profiles; proportionate unlikely inputs are hard to create.'));
    const L = lab(b, 'Three growth models after each bug fix', 'ROCOF (failure rate) after successive repairs. Toggle "bad fix" to let Littlewood-Verall show negative growth at fix 6.');
    const sc = L.scope({ xmin: 0, xmax: 12, ymin: 0, ymax: 1.05, xt: 12, yt: 5, h: 230, xl: 'fixes', yl: 'failure rate (ROCOF)' }); L.legend([['step function', '--ch-v'], ['Jelinski-Moranda', '--ch-d'], ['Littlewood-Verall', '--ch-i']]);
    let bad = false; L.add(h('label', { class: 'mini' }, (() => { const c = h('input', { type: 'checkbox' }); c.addEventListener('change', () => { bad = c.checked; d(); }); return c; })(), 'Fix 6 introduces new bugs'));
    function d() { const xs = [], s = [], j = [], l = []; let lv = 1; const contrib = [.32, .2, .12, .08, .06, .04, .03, .02, .015, .01, .008, .005]; for (let k = 0; k <= 12; k++) { xs.push(k); s.push(Math.max(0.02, 1 - k * 0.075)); j.push(1 * (12 - k) / 12 + 0.02); if (k > 0) lv = Math.max(0.02, lv - contrib[k - 1] + (bad && k === 6 ? 0.15 : 0)); l.push(lv); } sc.draw([{ x: xs, y: s, c: '--ch-v', step: true, w: 2 }, { x: xs, y: j, c: '--ch-d', step: true, w: 2 }, { x: xs, y: l, c: '--ch-i', step: true, w: 2.5 }]); }
    d();
    H(b, TRAP('A reliability growth model is used mainly during system testing (not only after deployment); it assumes reliability INCREASES as defects are fixed (2026 A12 Q8).', 'Littlewood-Verall: growth is NOT uniform, early fixes give big gains, remaining bugs have smaller impact (A12 Q9).', 'Statistical testing selects tests by the operational profile to assess reliability; it does not use random source code (A12 Q10). Its objective is to estimate reliability (2019 W12 Q6).', 'Practical use of growth modelling: decide when to stop testing (2019 W12 Q5).'));
  } });

page({ id: 't-testing', wk: 12, topic: 1, stars: 2, lec: [60], title: 'Testing basics: error, fault, failure; V&V', kw: 'error mistake fault defect bug failure IEEE 1044 bug distribution testing effort verification validation regression testing how long to test seeding', lede: 'The last lecture: vocabulary that turns up in quality and reliability questions.',
  render(b) {
    H(b, MUST('<b>Error/mistake</b> (human, in spec, design or code) → <b>fault/defect/bug</b> (in the work product) → <b>failure</b> (observable wrong behaviour). A fault may never cause a failure; every failure is caused by a fault. IEEE 1044 (1993) treated errors and faults as synonyms; the 2010 revision distinguished them.',
      'Even experienced programmers make ≈ 50 bugs per 1000 LOC; extensively tested software still has ≈ 1 per 1000. Bug sources: 60 % specification/design, 40 % implementation. Bugs are reduced by review, testing, formal specification and verification, a good development process.',
      'Testing consumes the largest effort (≈ 50 % of development effort but ≈ 10 % of development time) and the most manpower; testing activities now spread over the whole life cycle.',
      '<b>Verification</b>: does the output of each phase conform to its previous phase? ("doing things right"; phase containment). <b>Validation</b>: does the fully developed system conform to the SRS? ("doing the right thing").',
      'How long to test: plot bugs found over time until it flattens, or <b>seed</b> known bugs and see if (most of) them are detected. After maintenance, <b>regression testing</b> reruns earlier tests to check nothing broke.'));
    sorter(b, 'Game: verification or validation?', 'Verification checks each phase against the previous one; validation checks the finished system against the SRS.', [['ver', 'Verification'], ['val', 'Validation']], [
      ['Review the design against the SRS', 'ver'], ['Code inspection against the detailed design', 'ver'], ['Unit test a module against its design', 'ver'], ['Achieve phase containment of errors', 'ver'], ['System test the complete product against the SRS', 'val'], ['Acceptance test with the customer', 'val'], ['Check that the correct software has been built', 'val']]);
    H(b, TRAP('"Ensuring that the correct software has been developed" is validation, not verification (2019 W12 Q4).', 'Every mistake does NOT show up as a failure (2019 W12 Q10). A finding from code review that needs a change is a defect (2019 W11 Q10).', 'Fault vs failure: fault = incorrect step in code; failure = observable deviation (AI mock 3 Q9).'));
  } });

/* ===== Week 1 · story + theory ===== */
learn('t-intro', { ch: '1.1', title: 'The project nobody could see', line: 'Riya is promoted to project manager and learns why software is harder to manage than a building.' }, L => {
  H(L, STORY('1.1', 'The project nobody could see', `
    ${NARR('Monday, 9:30 a.m., Sahyadri Softworks, Pune. Riya has written code here for five years. Today her name is on a new door: <b>Project Manager</b>.')}
    ${SAY('kul', 'Your first project is a big one. Pune City Transport wants <b>Saarthi</b>: passengers see where their bus is and buy tickets on the phone, depot managers plan routes on a web portal, and every bus gets a small GPS unit that reports its position. Two thousand buses.')}
    ${SAY('riya', 'I have written code for five years, sir. How hard can managing it be?')}
    ${NARR('Kulkarni sir walks her to the window. Across the road, a metro station is going up.')}
    ${SAY('kul', 'How far along is that station?')}
    ${SAY('riya', 'Maybe sixty percent? The pillars are up and half the deck is cast.')}
    ${SAY('kul', 'Good. Now tell me how far along our billing project in the next bay is.')}
    ${NARR('Riya looks at the bay: twelve people, twelve screens, folders of code and documents. She has no idea.')}
    ${SAY('kul', 'That is lesson one. You cannot see software until it runs. Everything we will learn, estimation, milestones, reviews, earned value, exists to make invisible work visible.')}`));

  H(L, `<h2>1 · The software crisis</h2>
    <p>The course opens with a paradox. Software runs almost everything and the world spends trillions of dollars a year on it, yet software projects fail far more often than bridges or buildings. Engineers call this the <b>software crisis</b>. Its four symptoms are easy to remember because every user has seen them:</p>
    ${STEPS(['Software <b>fails to meet user requirements</b>: it does the wrong thing, or the right thing badly.', 'Software is <b>expensive</b>.', 'Software is <b>difficult to alter, debug and enhance</b>.', 'Software is <b>often delivered late</b>.'])}
    <p>How bad is it? The <b>Standish Group CHAOS report</b>, quoted in the lecture, sorts projects into three bins. Press play and watch a hundred typical projects fill in.</p>`);
  const waffle = (() => { let s = ''; for (let i = 0; i < 100; i++) { const x = 20 + (i % 20) * 28, y = 18 + Math.floor(i / 20) * 28, c = i < 29 ? 'fill-g' : i < 81 ? 'fill-a' : 'fill-r', st = i < 29 ? 1 : i < 81 ? 2 : 3; s += `<rect x="${x}" y="${y}" width="22" height="22" rx="4" class="fill-s"/><rect x="${x}" y="${y}" width="22" height="22" rx="4" class="${c}"${S(st)}/>`; } return s; })();
  stepper(L, 'CHAOS report: 100 software projects', SVG(600, 200, waffle + tx(90, 168, '29 succeed', { c: 'lg grn', at: S(1) }) + tx(300, 168, '52 challenged', { c: 'lg hot', at: S(2) }) + tx(510, 168, '19 fail', { c: 'lg red', at: S(3) })),
    ['One hundred software projects, before we know how they end.', '<b>29 % succeed</b>: on time, on budget, with the promised features.', '<b>52 % are "challenged"</b>: they finish, but late, over budget or with fewer features than promised. The biggest bin.', '<b>19 % fail</b> outright: cancelled, or delivered and never used. So fewer than one in three projects goes to plan. Notice that most trouble is "challenged", not dramatic failure: exactly what project management can fix.']);
  H(L, `<h3>Hardware got cheap, software did not</h3>
    <p>Prof. Mall's example: a laptop costs about <b>Rs. 45,000</b>, operating system included. A professional design tool to run on it (Rational suite) costs <b>Rs. 3,14,600</b> node-locked and <b>Rs. 6,03,200</b> as a floating licence. In 1960 most of a system's cost was hardware; today almost all of it is software.</p>`);
  H(L, SVG(600, 210, `<line x1="60" y1="170" x2="570" y2="170" class="ln"/><line x1="60" y1="170" x2="60" y2="20" class="ln"/>
    ${tx(40, 95, 'share of\nsystem cost', { c: 'xs mu' })}${tx(70, 188, '1960', { c: 'sm mu' })}${tx(555, 188, '2019', { c: 'sm mu' })}
    <path d="M70 40 C 220 60, 330 140, 560 158" class="ln thick b draw" style="--len:600"/>${tx(500, 140, 'hardware', { c: 'sm brd' })}
    <path d="M70 155 C 220 140, 330 60, 560 32" class="ln thick r draw" style="--len:600;--dur:3s"/>${tx(500, 22, 'software', { c: 'sm red' })}`));
  H(L, `<p>So why not build everything in hardware? Because software has two virtues hardware can never have: it is <b>relatively easy to change</b>, and it <b>consumes no space, weight or power</b>. "Otherwise all might as well be hardware."</p>
    <h3>Two characteristics that trap every software team</h3>

  H(L, `<h3>Why the crisis happens: five contributors</h3>

  stepper(L, 'Visible progress vs invisible progress', SVG(600, 250, `
    <rect x="50" y="34" width="170" height="168" rx="4" class="bx ghost"/>${tx(135, 22, 'Metro station', { c: 'sm mu' })}${floors}

  H(L, `<h2>4 · Stakeholders: everyone with something at stake</h2>

  H(L, SVG(620, 330, `<circle cx="310" cy="165" r="150" class="bx s2"/><circle cx="310" cy="165" r="92" class="bx blu"/><circle cx="310" cy="165" r="40" class="bx b"/>

    ${tx(310, 92, 'INTERNAL', { c: 'xs blu' })}${tx(310, 115, 'Riya (PM) · project team', { c: 'sm' })}${tx(310, 228, 'Sahyadri top\nmanagement', { c: 'sm' })}

    <g class="pulse">${tx(310, 300, 'all of them can push the project', { c: 'xs pur' })}</g>`));
  H(L, `${COLS(`<h4>Key stakeholders (lecture)</h4><ul><li><b>Project manager</b>: responsible for managing the project</li><li><b>Customer</b>: will use the project's product or service</li><li><b>Project team members</b>: perform the work</li><li><b>Sponsor</b>: provides the financial resources</li></ul>`, `<h4>Internal vs external</h4><ul><li><b>Internal</b>: project manager, project team, top management</li><li><b>External</b>: the customers (if outside the organisation), vendors, other affected parties</li></ul>`)}`);
  choice(L, 'Mr Bhosale only signs the cheques; he will never use the app. Is he a stakeholder?', [
    ['No: only people who use or build the product are stakeholders.', 'The sponsor provides the financial resources. That alone makes him a key stakeholder (2026 assignment 1).', false],

  choice(L, 'And the security guard at Sahyadri\'s gate?', [

    <p><b>Project scope</b> is what needs to be achieved and the work that must be done to deliver the project: a list of specific <b>goals, deliverables, tasks, deadlines and costs</b>. The PM must understand it before anything else, because a poorly defined scope is where most failures begin. The lecture lists the "sounds of failure's footsteps":</p>
    <div class="cols"><div>${STEPS(['Development team does not understand the customer\'s needs', 'Project scope is poorly defined', 'Changes are poorly managed', 'The chosen technology changes'])}</div><div><ol class="steps" start="5" style="counter-reset:st 4">${['Business needs change (e.g. a shop moving from a physical store to online retail)', 'Unrealistic deadlines (they force cuts in requirements, design and testing)', 'Inexperienced team', 'Poor project management'].map(x => `<li>${x}</li>`).join('')}</ol></div></div>
    <h3>W5HH: Boehm's seven questions</h3>
    <p>To pin the scope down, Barry Boehm proposed the <b>W5HH principle</b>: five W questions and two H questions. Kulkarni sir makes Riya answer them for Saarthi before she writes a single plan. Open each one:</p>
    ${REVEAL('<b>Why</b> is the software being built?', 'Passengers wait without knowing when the bus will come; PCT loses revenue to cash leakage and cannot see where its 2,000 buses are. Saarthi gives live tracking, cashless tickets and fleet visibility.')}

    ${REVEAL('<b>Where</b> are they organisationally located?', 'Software team at Sahyadri, Pune; hardware vendor in Bengaluru; client users at PCT\'s 14 depots.')}

    ${REVEAL('<b>How much</b> of each resource is needed?', 'Person-months of effort, test buses, servers, hardware units: the subject of estimation (weeks 4-5).')}
    <p class="cap">Exam trap: "Who will be the project manager?" is <b>not</b> one of the W5HH questions.</p>`);

    ${ar(430, 124, 400, 160)}${ar(530, 124, 560, 160)}${bx(330, 160, 140, 54, 'Developed at the\nuser\'s request', { lh: 14 })}${bx(490, 160, 140, 54, 'Developer tailors\nits generic solution', { lh: 14 })}
    ${tx(110, 234, 'MS Office, antivirus', { c: 'xs mu' })}${tx(245, 234, 'banking, mobile billing', { c: 'xs mu' })}${tx(480, 234, 'customisation · maintenance · testing · contract programming', { c: 'xs mu' })}`, 'wide'));
  H(L, `<p>The world software business is about <b>US $3.5 trillion</b>, roughly half products and half services, and the <b>services segment is growing fast</b>. Three reasons push everyone towards services:</p>
    ${STEPS(['<b>Lots of code is already available</b> in a company: new software is developed by modifying the closest existing one.', '<b>Business velocity</b> has increased tremendously: nobody wants multi-year projects; customers expect results in weeks or months.', '<b>Program sizes have become large</b>: customising existing components is more practical than writing from scratch.'])}
    <p><b>Why have Indian companies focused on services?</b> A product needs a large investment up front for something that may or may not succeed in the market (if it does, it brings steady revenue, like Oracle). A service brings an assured one-time revenue for each project. Services avoid the risk.</p>
    <p>By <b>what it does</b>: <b>information systems</b> store, process and present data and statistics (MIS, hotel management, patient management; web-based or stand-alone), while <b>embedded software</b> controls hardware (automobile control, nuclear plant control, robots, toys, TV remote). Saarthi is both: the app and the depot portal are information systems; the firmware in the bus unit is embedded software. That mix will matter when we estimate it with COCOMO in chapter 5.</p>`);

learn('t-pm', { ch: '1.2', title: 'Plan the work, work the plan', line: 'What a project manager actually does, the project life cycle, PMBOK vs PRINCE2, and why a life cycle model stops the "99 % complete" trap.' }, L => {
  H(L, STORY('1.2', 'Plan the work, work the plan', `
    ${SAY('riya', 'I\'ll get Arjun and Pooja started on the app today. We can figure out the rest as we go.')}
    ${SAY('kul', 'That is how a student does an assignment: code, test, fix, repeat. It works when the whole problem fits in one head. Saarthi will have fifteen people. If Arjun starts coding, Neha starts writing test documents, Imran defines the file formats and Pooja designs the screens, each in their own order, you will have chaos by Friday.')}
    ${SAY('riya', 'Then what do I do first?')}
    ${SAY('kul', 'First, decide whether the project is worth doing at all. Then plan it. Then run the plan and keep checking it. And choose a life cycle model, so that at any moment you can say "we are in design" instead of asking people how they feel.')}
    ${NARR('He writes six words on the whiteboard: <b>plan the work, work the plan</b>.')}`));

  H(L, `<h2>1 · What a project manager does</h2>
    <p>Project management is summarised as <b>"plan the work and work the plan"</b>. The lecture splits it into four activities:</p>`);
  H(L, SVG(600, 280, `<circle cx="300" cy="140" r="58" class="bx b"/>${tx(300, 132, 'Project', { c: 'wh' })}${tx(300, 150, 'manager', { c: 'wh' })}
    ${bx(205, 6, 190, 58, 'PLANNING\nestimation, resource\nallocation, scheduling', { c: 'blu', lh: 14 })}
    ${bx(420, 111, 175, 58, 'STAFFING\nrecruiting and\nmotivating people', { c: 'grn', lh: 14 })}
    ${bx(205, 216, 190, 58, 'DIRECTING\nensure the team\nacts as a whole', { c: 'amb', lh: 14 })}
    ${bx(5, 111, 175, 58, 'MONITORING &\nCONTROLLING: detect\ndeviations, correct', { c: 'red', lh: 14 })}
    ${pth('M395 50 C 470 60, 500 80, 505 108', { c: 'flow' })}${pth('M505 170 C 500 200, 470 222, 397 238', { c: 'flow' })}${pth('M205 238 C 130 222, 100 200, 95 172', { c: 'flow' })}${pth('M95 110 C 100 80, 130 60, 203 50', { c: 'flow' })}`));
  H(L, `<h3>The PM's job, in time order</h3>`);
  stepper(L, 'Three responsibilities across the project', SVG(640, 150, `
    ${bx(10, 40, 180, 60, 'Feasibility study', { c: 'pur', at: S(0) })}${ar(190, 70, 222, 70, { at: S(1) })}
    ${bx(224, 40, 180, 60, 'Planning', { c: 'blu', at: S(1) })}${ar(404, 70, 436, 70, { at: S(2) })}
    ${bx(438, 40, 192, 60, 'Execution: monitor\n& control', { c: 'red', at: S(2) })}
    ${pth('M534 40 C 520 0, 330 0, 316 38', { c: 'dash a', at: S(3) })}${tx(425, 12, 'plan revised as the project proceeds', { c: 'xs hot', at: S(3) })}
    ${tx(100, 122, 'worth doing? technically\nfeasible?', { c: 'xs mu', at: S(0) })}${tx(314, 122, 'only if feasible;\nbefore development starts', { c: 'xs mu', at: S(1) })}${tx(534, 122, 'whole active duration', { c: 'xs mu', at: S(2) })}`),

  H(L, `<h2>2 · The project life cycle</h2>
    <p>Every project, software or not, passes through the same life cycle. Watch Saarthi move through it:</p>`);

    ${bx(4, 60, 92, 50, 'Need', { c: 's2', at: S(0), g: '' })}${ar(96, 85, 112, 85, { at: S(1) })}
    ${bx(114, 60, 100, 50, 'Initiate', { c: 'pur', at: S(1) })}${ar(214, 85, 230, 85, { at: S(2) })}
    ${bx(232, 60, 92, 50, 'Plan', { c: 'blu', at: S(2) })}${ar(324, 85, 340, 85, { at: S(3) })}

    ${bx(342, 4, 100, 40, 'Control', { c: 'red', at: S(4) })}${pth('M420 58 L420 46', { c: 'r', at: S(4) })}${pth('M364 46 L364 58', { c: 'r', at: S(4) })}
    ${ar(442, 85, 470, 85, { at: S(5) })}${bx(472, 60, 110, 50, 'Close out', { c: 'amb', at: S(5) })}
    ${tx(330, 150, '', { c: 'sm' })}`),
