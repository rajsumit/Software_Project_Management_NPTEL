/* ===== Week 4 (lectures 16-20): estimation basics, techniques, function points ===== */
page({ id: 't-estbasics', wk: 4, topic: 1, stars: 2, lec: [16], title: 'Planning & estimation basics', kw: 'project planning SPMP sliding window estimation sequence size effort duration cost person month 152 hours pricing factors Parkinson Weinberg underestimate', lede: 'Planning starts only after feasibility is established. Its first job: turn a vague problem into size, effort, duration and cost numbers.',
  gens: ['pm-hours'],
  render(b) {
    H(b, MUST('Planning activities: <b>estimation</b> (effort, cost, resources, duration), <b>scheduling</b>, <b>staff organisation</b>, <b>risk handling</b>, misc plans (QA, configuration management). Initial plan before development, updated frequently (<b>sliding window planning</b>: plan in stages, avoid big early commitments).',
      'Plans are documented in the <b>SPMP</b>: introduction, project estimates, resource plan, schedules (WBS, task network, Gantt, PERT), risk management plan, tracking & control plan, misc plans.',
      'Order of estimation: <b>size → effort → duration → cost</b> (size is the fundamental attribute).',
      '<b>1 person-month = 152 hours</b> (19 days × 8 h). Person-months, not person-days (tedious) or person-years (too coarse). 30 people × 1 day ≠ 1 person × 30 days.',
      'Effort cost (salaries) dominates; overheads (building, heating, lighting, networking, shared facilities) roughly equal the effort cost.',
      '<b>Parkinson\'s law</b>: work expands to fill the time available. <b>Weinberg\'s zeroth law of reliability</b>: a project that does not have to meet a reliability requirement can meet any other requirement.'));
    H(b, `<h2>Planning steps (DPM)</h2><ol class="steps"><li>Identify the steps to accomplish the objectives</li><li>Identify the tasks in each step (WBS)</li><li>Estimate the effort per task</li><li>Estimate the resources per task</li><li>From 3 and 4: how long each task takes</li><li>From 4 and 5: task, step and project costs</li><li>Determine task inter-dependencies</li><li>Prepare the schedule (milestones, deliverables, costs, payments)</li></ol>
    <p>Why care: unrealistic estimates cause irritating delays, customer dissatisfaction, poor morale, poor quality and project failure.</p>`);
    H(b, `<h2>Costing is not pricing</h2>${TBL(['Pricing factor', 'Effect on the price quoted'], [['Market opportunity', 'Quote low to enter a new segment; experience may allow new products'], ['Cost estimate uncertainty', 'Add contingency over normal profit'], ['Contractual terms', 'Lower price if the developer keeps the source code to reuse'], ['Requirements volatility', 'Lower price to win, charge high for later changes'], ['Financial health', 'Developers in difficulty lower price: better a small profit than going out of business']])}
    <p>When estimates are needed: initiation (time, cost, benefit in the project definition), planning (time in schedule, cost in budget, cost and benefit in the business case), start of each stage (reconfirmed). Problems: subjective nature, political pressure to reduce estimates, changing technologies (learning curve), projects differ.</p>`);
    const L = lab(b, 'Over- vs under-estimating', 'Move the estimate relative to the true effort. Parkinson punishes generous estimates, aggressive ones damage morale and quality.');
    const sc = L.scope({ xmin: 50, xmax: 150, ymin: 0, ymax: 160, xt: 5, yt: 4, h: 210, xl: 'estimate as % of true effort', yl: 'actual effort %' });
    const ro = L.readout(); const v = controls(L.body, [{ k: 'e', label: 'Estimate (% of true)', min: 50, max: 150, v: 100, d: 0, unit: '%' }], () => d());
    const act = e => e >= 100 ? e * 0.85 + 15 : 100 + (100 - e) * 1.1;
    function d() { sc.draw([{ fn: act, c: '--ch-i' }, { fn: x => x, c: '--muted', dash: [5, 4], w: 1 }], { v: [{ x: v.e, t: 'your estimate', c: '--ch-v' }], h: [{ y: 100, t: 'true effort', c: '--muted' }] }); ro([['actual effort', fmt(act(v.e), 0) + ' %'], ['what happens', v.e > 105 ? 'Parkinson: work expands to fill the time' : v.e < 95 ? 'Underestimate: low morale, substandard rushed work, may be abandoned' : 'Realistic: least total effort']]); }
    d();
    H(b, TRAP('A person-month is 152 h, not 160 or 172 (2026 A4 Q1, 2019 W4 Q1).', 'COCOMO order is size, effort, duration, cost (2019 W4 Q2).', 'Underestimating: no overspend, but the system is usually unfinished; research shows motivation drops with highly aggressive targets.'));
  } });

page({ id: 't-esttech', wk: 4, topic: 1, stars: 3, lec: [17, 18], title: 'Estimation techniques: expert, Delphi, analogy, top-down, bottom-up', kw: 'top down bottom up parametric algorithmic expert judgement Delphi weighted average consensus analogy price to win lines of code LOC shortcomings calibration empirical heuristic analytical', lede: 'From an educated guess to a calibrated formula: which technique to use when, and why lines of code is a poor size measure.',
  gens: ['simple-effort', 'three-point'],
  render(b) {
    H(b, MUST('Taxonomy: <b>top-down / bottom-up</b>, <b>parametric/algorithmic</b> (FP, COCOMO), <b>expert judgement</b>, <b>analogy</b>, <b>price to win</b>.',
      '<b>Price to win</b>: project costs whatever the customer can spend. You win the contract but costs do not reflect the work. May be the only option when detailed information is lacking.',
      'Expert judgement techniques: basic expert judgement, <b>weighted average</b> = (O + 4M + P)/6 (sensitivity analysis estimating), consensus estimating, <b>Delphi</b> (anonymous, coordinator circulates rationale, experts never meet; reduces individual bias and dominance).',
      '<b>Analogy</b>: compare with a similar past project; best when an existing system is modified/enhanced; impossible without a comparable project and a cost database.',
      '<b>Top-down</b>: overall estimate from past data then split; fast, includes system-level costs, but underestimates low-level complexity. <b>Bottom-up</b>: estimate leaf tasks (1-2 weeks of one person) and add; stable, but time-consuming, needs early detail, misses integration/CM/QA.',
      'LOC shortcomings: language- and programmer-dependent, penalises high-level languages, reuse and compact code, only measures coding, hard to estimate early.',
      'Categories (L24): <b>empirical</b> (educated guess: expert, Delphi), <b>heuristic</b> (formula: COCOMO), <b>analytical</b> (scientific basis: Halstead).'));
    H(b, `<h2>Top-down vs bottom-up</h2>${VS([['Top-down', 'overall first, then divide', ['Overall estimate from effort drivers and past projects, then split (e.g. design 30 %, code 30 %, test 40 % of 100 days)', '✔ Accounts for system-level activities: integration, documentation, CM', '✔ Needs minimal detail; faster', '✘ Tends to underestimate and overlook low-level complexities', '✘ No detailed basis for justifying estimates']], ['Bottom-up', 'leaves first, then add', ['Break work down until one person can do a piece in 1-2 weeks', '✔ Each group estimates what it knows; errors tend to balance out (more stable)', '✔ Use when there is no data about similar past projects', '✘ May overlook system-level costs (integration, CM, QA)', '✘ Information may not be available early; time-consuming']], ['Algorithmic models', '', ['✔ Repeatable, easy to modify, supports sensitivity analysis, can be calibrated', '✘ Cannot handle exceptional teamwork or skill-task match', '✘ Garbage in, garbage out (size and cost drivers)', '✘ Experience, cohesion hard to quantify', 'Good model: defined, accurate, objective, understandable, stable, easy, <b>causal</b> (no future data needed)']]])}`);
    const L = lab(b, 'Delphi vs a group meeting', 'Five experts estimate the same module. In a face-to-face meeting the dominant senior pulls everyone to his number; in Delphi, anonymous rounds with circulated rationale converge on the evidence.');
    const sc = L.scope({ xmin: 0, xmax: 4, ymin: 0, ymax: 60, xt: 4, yt: 6, h: 230, xl: 'round', yl: 'estimate (person-days)', xfmt: v => 'R' + v });
    let mode = 'delphi'; segmented(L.body, [['delphi', 'Delphi (anonymous)'], ['meet', 'Open meeting with a dominant expert']], mode, k => { mode = k; d(); }); const ro = L.readout();
    const truth = 30, start = [18, 26, 31, 44, 52], boss = 50;
    function d() { const ser = start.map((s0, i) => { const xs = [0], ys = [s0]; let e = s0; for (let r = 1; r <= 4; r++) { const target = mode === 'delphi' ? truth + (s0 - truth) * 0.1 : boss; e = e + (target - e) * 0.55; xs.push(r); ys.push(e); } return { x: xs, y: ys, c: ['--ch-v', '--ch-d', '--ch-b', '--ch-x', '--ch-i'][i], w: 2, dots: 3 }; }); sc.draw(ser, { h: [{ y: truth, t: 'true effort 30', c: '--muted' }] }); const fin = ser.map(s => s.y[4]), avg = fin.reduce((a, b) => a + b, 0) / 5; ro([['final average', fmt(avg, 1)], ['error', fmt(avg - truth, 1)], ['why', mode === 'delphi' ? 'anonymity removes group-think and dominance' : 'group-think: the loudest voice wins']]); }
    d();
    H(b, `<h2>The simplistic model (lecture example)</h2>${F('Effort = size ÷ productivity', '38 KSLOC at 400 SLOC/SM → ≈ 95-100 SM')}<p>The lecture then estimates the shortest schedule as 0.75 × T with T = 2.5·SM<sup>1/3</sup>: 1.875 × 100<sup>1/3</sup> ≈ 9 months. What is wrong with the simplistic model? Productivity itself depends on size, team, tools and language.</p>
    <p><b>Recommendations</b>: do not depend on a single estimate; use several techniques and explain large differences; document assumptions; monitor to detect wrong assumptions; keep a historical database. <b>Calibration</b> customises a generic model (product types, environments, labour rates…) to your organisation.</p>`);
    H(b, TRAP('Price-to-win is "most appropriate when detailed information is lacking" (2019 W4 Q4).', 'Analogy suits modifying an existing system; Delphi\'s key advantage over one expert is freedom from individual bias (2026 A4 Q2, Q3).', 'Calibration is a STRENGTH of algorithmic models, not a limitation (2026 A4 Q4).', 'COCOMO and Halstead are NOT expert-judgement techniques; only expert judgement and Delphi are "educated guess" (2026 A5 Q1, Q7).', '"LOC depends on the complexity of the requirements" is NOT a reason LOC is poor (2019 W4 Q3).'));
  } });

page({ id: 't-fp', wk: 4, topic: 1, stars: 3, lec: [19, 20], title: 'Function points: IFPUG, Mark II, COSMIC', kw: 'function point IFPUG Albrecht external input output inquiry internal logical file external interface file UFP VAF TDI general system characteristics 14 AFP Mark II Symons COSMIC Cfsu feature point object point', lede: 'Function points measure size from the user\'s view of the requirements, so you can size a system before a line of code exists.',
  gens: ['ufp', 'vaf', 'afp', 'mk2', 'cosmic'],
  render(b) {
    H(b, MUST('IFPUG/Albrecht (IBM) five components: <b>External Inputs</b> (update internal files), <b>External Outputs</b> (reports, derived data), <b>External Inquiries</b> (retrieval, no update, no derived data), <b>Internal Logical Files</b> (maintained inside the boundary), <b>External Interface Files</b> (referenced, maintained by another application).',
      'Weights low/average/high: EI 3/4/6, EO 4/5/7, EQ 3/4/6, ILF 7/10/15, EIF 5/7/10. <b>UFP = Σ count × weight</b>.',
      '14 general system characteristics, degree of influence 0-5 → TDI (0-70). <b>VAF = 0.65 + 0.01 × TDI</b> (0.65 to 1.35). <b>AFP = UFP × VAF</b>. All DI = 3 → VAF 1.07; all 5 → 1.35.',
      'FP: language-independent, from the user\'s external view, early in analysis, understandable by clients, hard to fudge, shows feature creep. Cons: labour-intensive, extensive training, ignores <b>algorithmic complexity</b> (→ feature points), weighted to file manipulation.',
      '<b>Mark II</b> (Symons): FP = 0.58·Ni + 1.66·Ne + 0.26·No. <b>COSMIC</b> (embedded/real-time): entries, exits, reads, writes, 1 Cfsu each. <b>Object points</b>: screens, reports, modules (used in COCOMO II).'));
    const L = lab(b, 'Function point calculator', 'Enter counts per complexity. Presets: the lecture spell-checker (UFP 55) and 2026 A4 Q10 (UFP 969).');
    const K = ['EI', 'EO', 'EQ', 'ILF', 'EIF'], WT = { EI: [3, 4, 6], EO: [4, 5, 7], EQ: [3, 4, 6], ILF: [7, 10, 15], EIF: [5, 7, 10] }, NAMES = { EI: 'External inputs', EO: 'External outputs', EQ: 'External inquiries', ILF: 'Internal logical files', EIF: 'External interface files' };
    let cnt = { EI: [0, 2, 0], EO: [0, 3, 0], EQ: [0, 2, 0], ILF: [0, 1, 0], EIF: [0, 2, 0] }; let di = Array(14).fill(3);
    const presets = { spell: ['Spell checker (UFP 55)', { EI: [0, 2, 0], EO: [0, 3, 0], EQ: [0, 2, 0], ILF: [0, 1, 0], EIF: [0, 2, 0] }], a4: ['2026 A4 Q10: 80/60/50/10/7', { EI: [0, 80, 0], EO: [0, 60, 0], EQ: [0, 50, 0], ILF: [0, 10, 0], EIF: [0, 7, 0] }], dpm: ['DPM: 50/40/35/6/4 (UFP 628)', { EI: [0, 50, 0], EO: [0, 40, 0], EQ: [0, 35, 0], ILF: [0, 6, 0], EIF: [0, 4, 0] }], pay: ['Payroll example (UFP 30)', { EI: [0, 1, 1], EO: [0, 1, 0], EQ: [0, 0, 0], ILF: [0, 1, 0], EIF: [1, 0, 0] }] };
    const ps = h('select', { class: 'sel' }, Object.entries(presets).map(([k, v]) => h('option', { value: k }, v[0]))); L.add(h('div', { class: 'calc' }, h('div', { class: 'inputs' }, h('label', {}, 'Preset', ps))));
    const tb = h('table', { class: 'etbl' }); L.add(h('div', { class: 'tblwrap' }, tb));
    const gsc = ['Data communication', 'Distributed data processing', 'Performance objectives', 'Heavily used configuration', 'Transaction rate', 'On-line data entry', 'End-user efficiency', 'On-line update', 'Complex processing', 'Reusability', 'Conversion & install ease', 'Operational ease', 'Multiple-site use', 'Facilitate change'];
    const det = h('details', {}, h('summary', {}, '14 general system characteristics (degree of influence 0-5)')); L.add(det); const gwrap = h('div', { class: 'ctls' }); det.append(gwrap);
    const allBtns = h('div', { class: 'flowline' }); [0, 3, 5].forEach(k => allBtns.append(h('button', { class: 'btn', onclick: () => { di = Array(14).fill(k); drawG(); calcF(); } }, 'All = ' + k))); det.append(allBtns);
    const ro = L.readout();
    function drawT() { tb.innerHTML = '<tr><th>Component</th><th class="num">Low</th><th class="num">Average</th><th class="num">High</th><th class="num">Points</th></tr>'; K.forEach(k => { const tr = h('tr', {}, h('td', {}, `${NAMES[k]} (${WT[k].join('/')})`)); [0, 1, 2].forEach(i => { const inp = h('input', { type: 'number', min: 0, value: cnt[k][i] }); inp.addEventListener('input', () => { cnt[k][i] = Math.max(0, +inp.value || 0); calcF(); }); tr.append(h('td', {}, inp)); }); tr.append(h('td', { class: 'num', 'data-k': k })); tb.append(tr); }); }
    function drawG() { gwrap.innerHTML = ''; gsc.forEach((g, i) => { const id = 'g' + i, out = h('output', {}, String(di[i])), inp = h('input', { type: 'range', min: 0, max: 5, value: di[i], id }); inp.addEventListener('input', () => { di[i] = +inp.value; out.textContent = inp.value; calcF(); }); gwrap.append(h('div', { class: 'ctl' }, h('label', { for: id }, (i + 1) + '. ' + g), inp, out)); }); }
    function calcF() { let ufp = 0; K.forEach(k => { const p = cnt[k].reduce((s, c, i) => s + c * WT[k][i], 0); ufp += p; const td = $(`[data-k="${k}"]`, tb); if (td) td.textContent = p; }); const tdi = di.reduce((a, b) => a + b, 0), vaf = 0.65 + 0.01 * tdi; ro([['UFP', ufp], ['TDI', tdi], ['VAF', vaf.toFixed(2)], ['AFP = UFP × VAF', fmt(ufp * vaf, 2)], ['size @ 59 LOC/FP (Java)', fmt(ufp * vaf * 59 / 1000, 2) + ' KLOC']]); }
    ps.addEventListener('change', () => { cnt = JSON.parse(JSON.stringify(presets[ps.value][1])); drawT(); calcF(); });
    drawT(); drawG(); calcF();
    H(b, `<h2>The five components with the lecture's pictures in words</h2>${TBL(['Type', 'Definition', 'Example'], [['EI', 'Data from outside the boundary that <b>adds or changes</b> data in an ILF', 'On-line entry of customer information (update)'], ['EO', 'Data sent outside the boundary, usually reports with derived data', 'Categorised customer summary'], ['EQ', 'Input-output pair: retrieval, <b>no update, no derived data</b>', 'Display selected customer info'], ['ILF', 'User-identifiable group of data <b>maintained inside</b> the application', 'Customer info file'], ['EIF', 'Data <b>referenced</b> but maintained by another application', 'ZIP code table used to validate addresses']])}
    <p><b>Worked lecture example (spell checker)</b>: 2 inputs (document file name, personal dictionary name), 3 outputs (error report, word count, misspelled count), 2 inquiries (#words? #errors?), 1 internal file (dictionary), 2 external files (document, personal dictionary), all average → UFP = 2×4 + 3×5 + 2×4 + 1×10 + 2×7 = <b>55</b>. With all DI = 3: VAF 1.07, FP 58.85; with the listed DIs (TDI 36): VAF 1.01, FP 55.55.</p>
    ${TBL(['Language', 'Median SLOC per FP'], [['C', '104'], ['C++', '53'], ['HTML', '42'], ['Java', '59'], ['Perl', '60'], ['J2EE', '50']])}`);
    H(b, `<h2>Other function-point families</h2>${VS([['Mark II (Symons, UK)', 'simpler, widely used in UK', ['Per transaction count input items Ni, output items No, entity types accessed Ne', 'FP = <b>0.58 Ni + 1.66 Ne + 0.26 No</b>']], ['COSMIC full FP', 'embedded / real-time', ['Software seen as a layer: requests from above, services from below, peers, persistent storage', 'Data groups move by <b>entries, exits, reads, writes</b>: 1 Cfsu each, sum them', 'ISO standard; ignores processing inside the component → not for complex maths']], ['Feature & object points', '', ['Feature points add <b>algorithm complexity</b> to FP', 'Object points (nothing to do with OOP): screens, reports, modules; simpler, account for GUI']]])}`);
    H(b, TRAP('FP is NOT computed from code (2026 A4 Q6); "Number of operations" / "External operations" is not a component (2026 A4 Q7, 2019 W4 Q7).', '14 GSCs, not 12/13/15 (2019 W4 Q8). All DI = 5 → TDI 70 → VAF 1.35, not 70 (2026 A4 Q8).', '"Hard to fudge" and "language independent" are advantages; "ignores algorithmic complexity" and "needs extensive training" are limitations (2026 A4 Q9).', 'Embedded systems → COSMIC (2019 W4 Q10).'));
  } });

/* ===== Week 5 (lectures 21-25): COCOMO, COCOMO II, Halstead, staffing ===== */
const COCOMO_MODES = { organic: { a: 2.4, b: 1.05, c: 0.38, ai: 3.2, d: 'Familiar, stable environment; product similar to earlier ones; small team; e.g. accounting, student information system (< 50 KDSI)' }, semidetached: { a: 3.0, b: 1.12, c: 0.35, ai: 3.0, d: 'Between the two; mixed experience; e.g. compilers, linkers, utility programs' }, embedded: { a: 3.6, b: 1.20, c: 0.32, ai: 2.8, d: 'New, innovative; tight hardware/interface constraints; e.g. operating systems, real-time systems' } };
page({ id: 't-cocomo', wk: 5, topic: 1, stars: 3, lec: [21, 22], title: 'COCOMO 81: basic, intermediate, complete', kw: 'COCOMO Boehm organic semidetached embedded effort development time KLOC person months EAF cost drivers RELY MODP complete detailed subsystem', lede: 'Boehm\'s Constructive Cost Model (1981, 63 projects): size in KLOC goes in, effort, duration and staffing come out.',
  gens: ['cocomo-effort', 'cocomo-tdev', 'cocomo-staff', 'cocomo-int'],
  render(b) {
    H(b, MUST('Effort = <b>a·(KLOC)<sup>b</sup></b> PM; Tdev = <b>2.5·(Effort)<sup>c</sup></b> months. Organic a 2.4, b 1.05, c 0.38 · Semi-detached 3.0, 1.12, 0.35 · Embedded 3.6, 1.20, 0.32.',
      'Effort is <b>super-linear</b> in size (b > 1: bigger projects need disproportionately more); Tdev is <b>sub-linear</b> (c < 1: double size ≠ double time) and roughly the <b>same for all three modes</b> (60 KLOC ≈ 18 months).',
      'Average staff = effort ÷ Tdev; productivity = LOC ÷ effort; cost = effort × monthly cost.',
      '<b>Intermediate COCOMO</b>: multiply the basic estimate by the <b>EAF</b> = product of 15 cost-driver multipliers (product, computer, personnel, project attributes). Stringent reliability → scale up (RELY 1.15/1.40); modern programming practices → scale down (MODP 0.91/0.82). EAF typically 0.9-1.4.',
      '<b>Complete (detailed) COCOMO</b>: the system is a set of <b>heterogeneous sub-systems</b> (e.g. database semi-detached, GUI organic, communication embedded); estimate each separately and add.',
      'Accuracy: basic within a factor of 2 of actuals 60 % of the time; intermediate within 20 % 68 % of the time. Must be calibrated; assumes waterfall and from-scratch development.'));
    const L = lab(b, 'COCOMO 81 calculator', 'Lecture examples to try: organic 32 KLOC → 91 PM, 14 months; embedded 50 KLOC → 394 PM, 17 months, 23 people; organic 7.5 KLOC → 20 PM, 8 months.');
    let mode = 'organic'; segmented(L.body, [['organic', 'Organic'], ['semidetached', 'Semi-detached'], ['embedded', 'Embedded']], mode, k => { mode = k; d(); });
    const desc = h('p', { class: 'cap' }); L.add(desc);
    const v = controls(L.body, [{ k: 'kloc', label: 'Size (KLOC)', min: 2, max: 200, step: .5, v: 32, d: 1 }, { k: 'sal', label: 'Cost per PM (Rs.)', min: 5000, max: 200000, step: 1000, v: 15000, d: 0 }], () => d());
    const ro = L.readout();
    const sc = L.scope({ xmin: 0, xmax: 200, ymin: 0, ymax: 1500, xt: 5, yt: 5, h: 220, xl: 'KLOC', yl: 'effort (PM)' }); L.legend([['organic', '--ch-d'], ['semi-detached', '--ch-v'], ['embedded', '--ch-i']]);
    const sc2 = L.scope({ xmin: 0, xmax: 200, ymin: 0, ymax: 40, xt: 5, yt: 4, h: 180, xl: 'KLOC', yl: 'Tdev (months)' });
    function d() { const m = COCOMO_MODES[mode], E = m.a * v.kloc ** m.b, T = 2.5 * E ** m.c; desc.textContent = m.d; ro([['effort', fmt(E, 1) + ' PM'], ['Tdev', fmt(T, 1) + ' months'], ['average staff', fmt(E / T, 1)], ['productivity', fmt(v.kloc * 1000 / E, 0) + ' LOC/PM'], ['cost', 'Rs. ' + fmt(E * v.sal, 0)]]);
      const cols = { organic: '--ch-d', semidetached: '--ch-v', embedded: '--ch-i' };
      sc.draw(Object.keys(COCOMO_MODES).map(k => ({ fn: x => COCOMO_MODES[k].a * x ** COCOMO_MODES[k].b, c: cols[k], w: k === mode ? 3 : 1.5 })), { v: [{ x: v.kloc, t: fmt(E, 0) + ' PM' }] });
      sc2.draw(Object.keys(COCOMO_MODES).map(k => ({ fn: x => 2.5 * (COCOMO_MODES[k].a * x ** COCOMO_MODES[k].b) ** COCOMO_MODES[k].c, c: cols[k], w: k === mode ? 3 : 1.5 })), { v: [{ x: v.kloc, t: fmt(T, 1) + ' months' }] }); }
    d();
    H(b, `<p class="cap">Notice in the lower plot that the three Tdev curves almost coincide: development time is roughly independent of the mode, because larger and more complex products have more parallel activities.</p>
    <h2>Intermediate COCOMO: 15 cost drivers</h2><p>Basic COCOMO assumes effort and time depend on size alone. Intermediate COCOMO refines it with 15 multipliers in four groups: <b>product</b> (RELY reliability, DATA database size, CPLX complexity), <b>computer</b> (TIME execution-time constraint, STOR storage, VIRT VM volatility, TURN turnaround), <b>personnel</b> (ACAP analyst capability, AEXP application experience, PCAP programmer capability, VEXP VM experience, LEXP language experience), <b>project</b> (MODP modern practices, TOOL software tools, SCED schedule).</p>`);
    const drivers = [['RELY Required reliability', [.75, .88, 1, 1.15, 1.40]], ['DATA Database size', [null, .94, 1, 1.08, 1.16]], ['CPLX Product complexity', [.70, .85, 1, 1.15, 1.30]], ['TIME Execution time constraint', [null, null, 1, 1.11, 1.30]], ['STOR Memory constraint', [null, null, 1, 1.06, 1.21]], ['VIRT Virtual machine volatility', [null, .87, 1, 1.15, 1.30]], ['TURN Turnaround time', [null, .87, 1, 1.07, 1.15]], ['ACAP Analyst capability', [1.46, 1.19, 1, .86, .71]], ['AEXP Application experience', [1.29, 1.13, 1, .91, .82]], ['PCAP Programmer capability', [1.42, 1.17, 1, .86, .70]], ['VEXP Virtual machine experience', [1.21, 1.10, 1, .90, null]], ['LEXP Language experience', [1.14, 1.07, 1, .95, null]], ['MODP Modern practices', [1.24, 1.10, 1, .91, .82]], ['TOOL Software tools', [1.24, 1.10, 1, .91, .83]], ['SCED Schedule', [1.23, 1.08, 1, 1.04, 1.10]]];
    const LV = ['very low', 'low', 'nominal', 'high', 'very high'];
    const L2 = lab(b, 'Intermediate COCOMO: set the cost drivers', 'Lecture example 1: 10 KLOC organic, ACAP low, AEXP low, PCAP low, LEXP high → EAF 1.49, effort 40 PM, 10.2 months.');
    const v2 = controls(L2.body, [{ k: 'E0', label: 'Basic COCOMO effort (PM)', min: 5, max: 500, step: .1, v: 26.9, d: 1 }], () => c2());
    const tb = h('table', { class: 'etbl' }); L2.add(h('div', { class: 'tblwrap' }, tb)); const rating = drivers.map(() => 2); const ro2 = L2.readout();

    const subs = [['Database', 'semidetached', 20], ['GUI', 'organic', 15], ['Communication', 'embedded', 10]]; const st = h('table', { class: 'etbl' }); L3.add(h('div', { class: 'tblwrap' }, st)); const ro3 = L3.readout();

page({ id: 't-cocomo2', wk: 5, topic: 1, stars: 2, lec: [23], title: 'COCOMO II', kw: 'COCOMO II application composition early design reuse post architecture scale factors PREC FLEX RESL TEAM PMAT effort multipliers object points NAP productivity DSI SLOC', lede: 'Boehm\'s 1995 update for reuse, GUIs and component-based development: four sub-models used at different stages of the same project.',
  gens: ['cocomo2-exp', 'appcomp'],
  render(b) {
    H(b, MUST('Four sub-models, increasingly accurate: <b>application composition</b> (software composed from existing parts / prototyping; object points) → <b>early design</b> (requirements available, design not started; 7 multipliers) → <b>reuse</b> (effort to integrate reusable or generated code) → <b>post-architecture</b> (after architecture design; <b>17</b> multipliers; most accurate).',
      'Core model: <b>PM = A × Size<sup>B</sup> × Π EM</b>, A = 2.94, Size in KSLOC, <b>B = 0.91 + 0.01 × Σ scale factors</b> (0.91 to 1.23). All nominal → B ≈ 1.0997 (8 KSLOC → 28.9 PM).',
      'Five scale factors replace the COCOMO 81 modes: <b>PREC</b> precedentedness (past examples), <b>FLEX</b> development flexibility, <b>RESL</b> architecture/risk resolution (uncertainty about requirements), <b>TEAM</b> cohesion, <b>PMAT</b> process maturity (from CMM KPAs).',
      'Application composition: <b>PM = NAP × (1 − %reuse/100) / PROD</b>. Object points: screens 1/2/3, reports 2/5/8, each 3GL module 10. PROD 4, 7, 13, 25, 50 NAP/month (very low → very high).',

    const L = lab(b, 'Scale factors and effort multipliers', 'Lecture example: PREC very high 1.24, FLEX very low 5.07, RESL high 2.83, TEAM high 2.19, PMAT low 6.24 → B = 1.0857; 10 KSLOC → 35.8 PM; with RCPX 1.91, PDIF 1.81, PERS 0.50 → 61.9 PM.');
    const SF = { PREC: [6.20, 4.96, 3.72, 2.48, 1.24, 0], FLEX: [5.07, 4.05, 3.04, 2.03, 1.01, 0], RESL: [7.07, 5.65, 4.24, 2.83, 1.41, 0], TEAM: [5.48, 4.38, 3.29, 2.19, 1.10, 0], PMAT: [7.80, 6.24, 4.68, 3.12, 1.56, 0] };
    const EM = { RCPX: [0.49, 0.60, 0.83, 1.00, 1.33, 1.91, 2.72], RUSE: [null, null, 0.95, 1.00, 1.07, 1.15, 1.24], PDIF: [null, null, 0.87, 1.00, 1.29, 1.81, 2.61], PERS: [2.12, 1.62, 1.26, 1.00, 0.83, 0.63, 0.50], PREX: [1.59, 1.33, 1.12, 1.00, 0.87, 0.74, 0.62], FCIL: [1.43, 1.30, 1.10, 1.00, 0.87, 0.73, 0.62], SCED: [null, 1.43, 1.14, 1.00, 1.00, 1.00, null] };
    const LS = ['very low', 'low', 'nominal', 'high', 'very high', 'extra high'], LE = ['extra low', 'very low', 'low', 'nominal', 'high', 'very high', 'extra high'];
    const sfr = { PREC: 4, FLEX: 0, RESL: 3, TEAM: 3, PMAT: 1 }, emr = { RCPX: 3, RUSE: 3, PDIF: 3, PERS: 3, PREX: 3, FCIL: 3, SCED: 3 };
    const grid = h('div', { class: 'calc' }), inp = h('div', { class: 'inputs' }); grid.append(inp); L.add(grid);
    const ks = h('input', { type: 'number', value: 10, step: 'any' }); inp.append(h('label', {}, 'Size (KSLOC)', ks)); ks.addEventListener('input', c);
    Object.keys(SF).forEach(k => { const s = h('select', {}, SF[k].map((x, j) => h('option', { value: j, selected: j === sfr[k] }, `${LS[j]} (${x})`))); s.addEventListener('change', () => { sfr[k] = +s.value; c(); }); inp.append(h('label', {}, 'SF ' + k, s)); });
    Object.keys(EM).forEach(k => { const s = h('select', {}, EM[k].map((x, j) => x == null ? null : h('option', { value: j, selected: j === emr[k] }, `${LE[j]} (${x})`)).filter(Boolean)); s.addEventListener('change', () => { emr[k] = +s.value; c(); }); inp.append(h('label', {}, 'EM ' + k, s)); });
    const ro = L.readout();
    function c() { const sum = Object.keys(SF).reduce((s, k) => s + SF[k][sfr[k]], 0), B = 0.91 + 0.01 * sum, size = +ks.value || 0, nom = 2.94 * size ** B, em = Object.keys(EM).reduce((p, k) => p * EM[k][emr[k]], 1), pm = nom * em, tdev = 3 * pm ** (0.33 + 0.2 * (B - 1.01)); ro([['Σ scale factors', sum.toFixed(2)], ['exponent B', B.toFixed(4)], ['nominal PM', fmt(nom, 1)], ['Π EM', em.toFixed(3)], ['effort', fmt(pm, 1) + ' PM'], ['TDEV = 3·PM^(0.33+0.2(B−1.01))', fmt(tdev, 1) + ' months']]); }
    c();
    H(b, `${TBL(['Scale factor', 'Meaning', 'Very low … extra high'], [['PREC', 'Degree to which there are past examples that can be consulted', 'thoroughly unprecedented … thoroughly familiar'], ['FLEX', 'Degree of flexibility in implementing the project', 'rigorous … general goals'], ['RESL', 'Degree of uncertainty about requirements (architecture/risk resolution)', 'little (20 %) … full (100 %)'], ['TEAM', 'How well the team works together', 'very difficult … seamless interactions'], ['PMAT', 'Process maturity, weighted sum of 18 CMM KPAs', '']])}
    ${TRAP('Requirements known, design not started → <b>early design</b> (2026 A5 Q5, 2019 W5 Q6). Most accurate → <b>post-architecture</b> (2019 W5 Q5).', 'Post-architecture: effort from the design specification AND evaluating the impact of cost drivers and scale factors (2026 A5 Q6, two answers).', 'RESL = uncertainty about requirements, not "past examples" (that is PREC) (2019 W5 Q7).', 'Application points count screens, reports and modules (AI mock 4 Q30).')}`);
  } });

page({ id: 't-halstead', wk: 5, topic: 1, stars: 2, lec: [24], title: "Halstead's software science", kw: 'Halstead operators operands length vocabulary volume potential minimum volume program level effort time mental discriminations empirical heuristic analytical', lede: 'An analytical technique: count operators and operands, and derive length, volume, effort and time. Best known for estimating maintenance effort.',
  gens: ['halstead', 'halstead-e'],
  render(b) {
    H(b, MUST('Three estimation categories: <b>empirical</b> (educated guess: expert judgement, Delphi), <b>heuristic</b> (mathematical model: COCOMO), <b>analytical</b> (scientific basis from assumptions: <b>Halstead</b>).',
      'η₁, η₂ = unique operators, operands; N₁, N₂ = total operators, operands. <b>Length N = N₁ + N₂</b>; <b>vocabulary η = η₁ + η₂</b>; <b>volume V = N log₂ η</b> (bits needed to encode; compensates for the language).',
      'Potential minimum volume <b>V* = (2 + η₂) log₂(2 + η₂)</b> (program written as one call f(d1…dn)); program level <b>L = V*/V</b>; effort <b>E = V/L = V²/V*</b> (mental discriminations) → effort varies as the <b>square of the volume</b>.',
      'Time <b>T = E/S</b>, S = 18 mental discriminations per second. Higher-level language → higher L → less effort.',
      'Counting rules: assignment, arithmetic, logical operators; a pair of parentheses or begin-end = one operator; if…then…else…endif and while…do = one operator; ";" = one operator; a function name in a call = operator; GOTO target label = operator. Variables/constants in expressions = operands; declarations and parameter lists in definitions are not counted.'));
    const L = lab(b, 'Halstead counter', 'Type a small C fragment. This counter follows the lecture rules approximately (keywords and paired brackets count as one operator each; identifiers and constants are operands; declarations are skipped).');
    const ta = h('textarea', { rows: 4, class: 'sel', style: 'width:100%;font:600 .95rem var(--f-mono)' }); ta.value = 'x = a + b;\ny = x * x;\nprint(y);'; L.add(ta);
    const out = h('div', { class: 'ivtxt' }); L.add(out); const ro = L.readout();
    function count() {
      const src = ta.value.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '').replace(/\b(int|float|double|char|long|short|void|unsigned)\s+[\w\s,*\[\]=0-9]*;/g, '');
      const toks = src.match(/[A-Za-z_]\w*|\d+(?:\.\d+)?|==|!=|<=|>=|&&|\|\||\+\+|--|\+=|-=|\*=|\/=|->|<<|>>|[-+*\/%=<>!&|^~?:;,.(){}\[\]]/g) || [];
      const KW = ['if', 'else', 'while', 'for', 'do', 'switch', 'case', 'default', 'return', 'break', 'continue', 'goto'];
      const ops = {}, opd = {}; let N1 = 0, N2 = 0; const add = (m, k) => { m[k] = (m[k] || 0) + 1; };
      toks.forEach((t, i) => { if (t === ')' || t === '}' || t === ']') return; if (t === '(') { if (i > 0 && /^[A-Za-z_]\w*$/.test(toks[i - 1]) && !KW.includes(toks[i - 1])) return; add(ops, '()'); N1++; return; } if (t === '{') { add(ops, '{}'); N1++; return; } if (t === '[') { add(ops, '[]'); N1++; return; } if (t === 'else') return; if (KW.includes(t)) { add(ops, t === 'if' ? 'if…else' : t); N1++; return; } if (/^[A-Za-z_]\w*$/.test(t) && toks[i + 1] === '(') { add(ops, t + '()'); N1++; return; } if (/^[A-Za-z_]\w*$|^\d/.test(t)) { add(opd, t); N2++; return; } add(ops, t); N1++; });
      const n1 = Object.keys(ops).length, n2 = Object.keys(opd).length, N = N1 + N2, eta = n1 + n2, V = eta > 1 ? N * Math.log2(eta) : 0, Vs = (2 + n2) * Math.log2(2 + n2), Lv = V ? Vs / V : 0, E = Lv ? V / Lv : 0;
      out.innerHTML = `Operators: ${Object.entries(ops).map(([k, c]) => `<code>${k.replace(/</g, '&lt;')}</code>×${c}`).join(' ')}<br>Operands: ${Object.entries(opd).map(([k, c]) => `<code>${k}</code>×${c}`).join(' ')}`;
      ro([['η₁ / η₂', n1 + ' / ' + n2], ['N₁ / N₂', N1 + ' / ' + N2], ['length N', N], ['vocabulary η', eta], ['volume V', fmt(V, 1) + ' bits'], ['V* (η₂* = η₂)', fmt(Vs, 1)], ['level L = V*/V', fmt(Lv, 3)], ['effort E = V²/V*', fmt(E, 0)], ['time T = E/18', fmt(E / 18, 1) + ' s']]);
    }
    ta.addEventListener('input', count); count();
    H(b, `<p class="cap">Lecture examples: <code>a = &b;</code> → operands a, b; operators =, &, ;. <code>func(a, b);</code> → operators func, ",", ";" and operands a, b. (In the real method η₂* in V* is the number of input/output parameters of the algorithm; here it is approximated by η₂.)</p>
    ${TRAP('Programming effort varies as the SQUARE of the volume (2026 A5 Q8). Higher-level language → LESS effort (2019 W5 Q8).', 'Halstead is analytical, not expert judgement; Delphi and expert judgement are the "educated guess" techniques (2026 A5 Q1, Q7).', 'Halstead is especially useful for estimating MAINTENANCE effort; it gives gross estimates for large collections, inaccurate for individual cases.')}`);
  } });

page({ id: 't-staffing', wk: 5, topic: 1, stars: 3, lec: [25], title: 'Staffing: Rayleigh, Putnam, Jensen', kw: 'staffing level Rayleigh curve Norden Putnam technology constant Ck schedule compression fourth power Jensen square Boehm 75 percent Brooks law adding manpower late project', lede: 'How many people when, and what happens if the customer wants it sooner. The favourite numerical: "time halved → effort ×16".',
  gens: ['putnam', 'jensen'],
  render(b) {
    H(b, MUST('Norden (1958): staffing of R&D projects follows the <b>Rayleigh curve</b> (few people for planning, peak, then decline). Putnam (1976) applied it to software; the peak (td) corresponds to system testing and product release; ≈ 40 % of the area is left of td, 60 % right.',
      'Putnam: <b>L = C<sub>k</sub> K<sup>1/3</sup> t<sub>d</sub><sup>4/3</sup></b> (L size in KLOC, K effort, t<sub>d</sub> time). C<sub>k</sub> = 2 poor, 8 good, 11 excellent environment. For a fixed size <b>K = C₁/t<sub>d</sub><sup>4</sup></b> ⇒ <b>K₁/K₂ = (t<sub>d2</sub>/t<sub>d1</sub>)<sup>4</sup></b>: halve the time → 16× effort.',
      'Putnam penalises compression and rewards extension extremely; works for very large systems, overestimates small and medium ones. <b>Jensen</b>: L = C<sub>te</sub> t<sub>d</sub> K<sup>1/2</sup> ⇒ <b>K ∝ 1/t<sub>d</sub>²</b>: halve the time → 4×. Softer, applicable to small and medium projects.',
      'Boehm: schedule cannot be compressed below about <b>75 % of the nominal estimate</b> by adding personnel or equipment (limited parallel activities, sequential tasks).',
      'Adding manpower to a late project makes it later (Brooks): more communication, newcomers must learn, experienced members must train them, limited parallelism. NOT because scope increases.'));
    const L = lab(b, 'Rayleigh staffing curve', 'Effort K is the area under the curve; t<sub>d</sub> is where staffing peaks. Compress t<sub>d</sub> and watch the area (effort) explode under Putnam.');
    const v = controls(L.body, [{ k: 'td', label: 'Development time t_d (months)', min: 6, max: 24, step: .5, v: 12, d: 1 }, { k: 'K0', label: 'Effort at nominal 12 months (PM)', min: 20, max: 300, v: 100, d: 0 }], () => d());
    let law = 'putnam'; segmented(L.body, [['putnam', 'Putnam (1/t⁴)'], ['jensen', 'Jensen (1/t²)']], law, k => { law = k; d(); });
    const sc = L.scope({ xmin: 0, xmax: 50, ymin: 0, ymax: 30, xt: 10, yt: 5, h: 230, xl: 'month', yl: 'people' }); const ro = L.readout();
    function d() { const p = law === 'putnam' ? 4 : 2, K = v.K0 * (12 / v.td) ** p, a = 1 / (2 * v.td * v.td), m = t => 2 * K * a * t * Math.exp(-a * t * t), pk = m(v.td); sc.set({ ymax: Math.max(10, Math.ceil(pk * 1.2 / 5) * 5) }); sc.draw([{ fn: m, c: '--ch-i', fill: true, w: 2.5 }], { v: [{ x: v.td, t: 't_d (peak)' }, { x: 9, t: '75 % of nominal', c: '--bad', dy: 14 }] }); ro([['effort K', fmt(K, 0) + ' PM'], ['× nominal effort', fmt(K / v.K0, 2)], ['peak staff', fmt(pk, 1)], ['Boehm check', v.td < 9 ? 'below 75 % of 12 months: very unlikely to succeed' : 'within the feasible region']]); }
    d();
    const L2 = lab(b, 'Compression calculator', 'The two laws side by side.');
    const v2 = controls(L2.body, [{ k: 't1', label: 'Nominal time (months)', min: 3, max: 36, v: 18, d: 0 }, { k: 't2', label: 'Required time (months)', min: 2, max: 36, v: 9, d: 0 }], () => d2()); const ro2 = L2.readout();
    function d2() { const r = v2.t1 / v2.t2; ro2([['time ratio', fmt(r, 3)], ['Putnam effort ×', fmt(r ** 4, 2)], ['Jensen effort ×', fmt(r ** 2, 2)], ['% of nominal', fmt(v2.t2 / v2.t1 * 100, 0) + ' %']]); }
    d2();
    H(b, `<p class="cap">Check against the assignments: 18 → 9 months, Putnam → 16× (2019 W5 Q9). 18 → 6 months, Jensen → 9× (2026 A5 Q10). 1 year → 6 months: Putnam 16×, Jensen 4×.</p>
    ${F('Putnam: K = L³/(C<sub>k</sub>³ t<sub>d</sub>⁴) = C₁/t<sub>d</sub>⁴  ·  K₁/K₂ = t<sub>d2</sub>⁴/t<sub>d1</sub>⁴')}${F('Jensen: L = C<sub>te</sub> · t<sub>d</sub> · K<sup>1/2</sup>  ·  K₁/K₂ = t<sub>d2</sub>²/t<sub>d1</sub>²')}${F('COCOMO II calendar time: TDEV = 3 × PM<sup>(0.33 + 0.2 (B − 1.01))</sup>')}
    <p>Staffing facts (DPM): staff required cannot be computed by dividing effort by the required schedule; the number varies by phase; more people usually means more total effort; a very rapid build-up of people often correlates with schedule slippage. Benefits come from using fewer people over a somewhat longer time.</p>
    ${TRAP('Putnam uses the FOURTH power, Jensen the SQUARE. Read which model the question names.', 'Boehm\'s limit is 75 % of the nominal time (not 25 % or 50 %) (2019 W5 Q10).', '"Increased project scope" is NOT a reason why adding people delays a late project (2026 A5 Q9).')}`);
  } });

page({ id: 't-wbs', wk: 6, topic: 1, stars: 2, lec: [26, 27], title: 'Scheduling, WBS & activity networks', kw: 'project scheduling process activity work breakdown structure WBS granularity deliverable task network activity on node activity on arrow PERT CPM DuPont Polaris dangle loop', lede: 'Turn the scope into activities, arrange them in a network, and the critical path tells you the shortest possible project.',
  render(b) {
    H(b, MUST('Scheduling process: define objective (scope) → <b>WBS</b> → precedence relationships → estimate time → resources → draw PERT diagram → ES/EF/LS/LF, slack, critical path → <b>Gantt chart</b> → reallocate resources → monitor/revise.',
      'An <b>activity</b> has a duration (start and end points), resource requirements (usually constant) and may depend on others (precedence).',
      '<b>WBS</b>: hierarchical decomposition of project work into smaller manageable components (work packages, deliverables, sub-tasks). It does <b>not</b> show durations or precedence. Too fine → management overhead; too coarse → loss of control.',
      '<b>Activity network</b> (task network): depicts task flow, length, sequence, concurrency and dependencies. Activity-on-node: nodes are activities. Activity-on-arrow: arrows are activities, nodes are events (one start, one end node).',
      '<b>CPM</b>: DuPont, chemical plant maintenance, one deterministic duration per activity. <b>PERT</b>: US Navy, Polaris missile, 3 time estimates (statistical). Over time they merged into CPM/PERT.',
      'Network rules: one start and one end node, <b>no loops</b>, <b>no dangles</b>.'));
    H(b, `<h2>Which chart shows what?</h2>${TBL(['Chart', 'Shows', 'Does not show'], [['Work breakdown structure', 'Hierarchy: deliverables → tasks → sub-tasks', 'Durations, precedence, critical path'], ['Activity network / PERT chart', 'Sequence, dependencies, concurrency, critical path; used for monitoring progress', 'Calendar picture of resource use'], ['Gantt chart', 'Bars along a time line, durations, slack; used for <b>resource planning</b>; today cursor in monitoring', 'Dependencies clearly'], ['Resource histogram', 'Demand for one resource over time', 'Activity durations']])}`);
    const L = lab(b, 'WBS explorer: an MIS project', 'Click a node to expand it. A WBS answers "what work is there?", not "when?" or "in what order?".');
    const tree = { n: 'MIS project', c: [{ n: 'Feasibility', c: [{ n: 'Overall requirements' }, { n: 'Risk analysis' }, { n: 'Cost/benefit' }] }, { n: 'Analysis', c: [{ n: 'Interview users' }, { n: 'Write SRS' }, { n: 'Review SRS' }] }, { n: 'Design', c: [{ n: 'Architecture' }, { n: 'Database design' }, { n: 'UI design' }] }, { n: 'Programming', c: [{ n: 'Code module A' }, { n: 'Code module B' }, { n: 'Test plan' }] }, { n: 'Testing', c: [{ n: 'Integration test' }, { n: 'System test' }] }] };
    const box = h('div'); L.add(box); const open = new Set(['MIS project']);

page({ id: 't-cpm', wk: 6, topic: 1, stars: 3, lec: [27, 28, 29, 30], title: 'CPM/PERT: forward & backward pass', kw: 'earliest start finish latest start finish float slack forward pass backward pass merge burst critical path sub-critical free float Gantt', lede: 'The most reliable source of marks in the course: given a table of activities, find ES, EF, LS, LF, float and the critical path. Practise until it is mechanical.',

    H(b, MUST('<b>Forward pass</b> (earliest times): first activities start at day 0; EF = ES + d; at a <b>merge point</b> ES = the <b>maximum</b> EF of the predecessors.',
      '<b>Backward pass</b> (latest times): last activity LF = its EF (project end); LS = LF − d; at a <b>burst point</b> LF = the <b>minimum</b> LS of the successors.',
      '<b>Float (slack)</b> = LS − ES = LF − EF = LF − ES − d. Critical activities have zero float; critical path = longest path start→finish = <b>minimum project duration</b>.',

    const L = lab(b, 'CPM workbench', 'Edit the activity table (predecessors separated by commas) or load a preset. The network, table and Gantt chart are recomputed. Try delaying an activity.');

    const tb = h('table', { class: 'etbl' }); L.add(h('div', { class: 'tblwrap' }, tb));
    L.add(h('div', { class: 'flowline' }, h('button', { class: 'btn', onclick: () => { const id = String.fromCharCode(65 + rows.length); rows.push([id, '', 3, rows.length ? rows[rows.length - 1][0] : '']); delay = {}; draw(); } }, '+ activity'), h('button', { class: 'btn', onclick: () => { delay = {}; draw(); } }, 'Clear delays')));
    const netBox = h('div', { class: 'netwrap' }); L.add(netBox); const ro = L.readout(); const res = h('div'); L.add(res); const gBox = h('div', { class: 'netwrap' }); L.add(gBox);
    ps.addEventListener('change', () => { rows = presets[ps.value][1].map(r => r.slice()); delay = {}; draw(); });
    function draw() {

      rows.forEach((r, i) => { const mk = (k, w) => { const inp = h('input', { value: r[k], style: w ? `width:${w}` : '' }); inp.addEventListener('change', () => { r[k] = k === 2 ? Math.max(0, +inp.value || 0) : inp.value.toUpperCase().replace(/\s/g, ''); if (k === 1) r[k] = inp.value; draw(); }); return inp; }; const dl = h('input', { type: 'number', min: 0, value: delay[r[0]] || 0 }); dl.addEventListener('change', () => { delay[r[0]] = Math.max(0, +dl.value || 0); draw(); }); tb.append(h('tr', {}, h('td', {}, mk(0, '3.2em')), h('td', {}, mk(1)), h('td', {}, mk(2, '4.5em')), h('td', {}, mk(3, '6em')), h('td', {}, dl), h('td', {}, h('button', { class: 'rm', title: 'remove', onclick: () => { rows.splice(i, 1); draw(); } }, '×')))); });
      const ids = rows.map(r => r[0]); const acts = rows.map(r => ({ id: r[0], name: r[1], d: (+r[2] || 0) + (delay[r[0]] || 0), pre: (r[3] || '').split(',').map(s => s.trim()).filter(s => s && ids.includes(s)) }));
      // topological order check
      const order = [], seen = new Set(); let guard = 0; while (order.length < acts.length && guard++ < 500) { acts.forEach(a => { if (!seen.has(a.id) && a.pre.every(p => seen.has(p))) { seen.add(a.id); order.push(a); } }); }

      const net = GEN.cpm(order);

      const lvl = {}; order.forEach(a => lvl[a.id] = a.pre.length ? Math.max(...a.pre.map(p => lvl[p])) + 1 : 0); const maxL = Math.max(...Object.values(lvl)); const cols = {}; order.forEach(a => (cols[lvl[a.id]] = cols[lvl[a.id]] || []).push(a));
      const colW = 170, H0 = Math.max(...Object.values(cols).map(c => c.length)) * 78 + 40, Wd = (maxL + 1) * colW + 200;
      const nodes = [{ id: '_S', name: 'Start', pill: 1, x: 40, y: H0 / 2, cr: 1 }]; order.forEach(a => { const c = cols[lvl[a.id]], k = c.indexOf(a); nodes.push({ id: a.id, name: (a.id + (a.name ? '. ' + a.name : '')).slice(0, 18), x: 160 + lvl[a.id] * colW, y: (k + 1) * H0 / (c.length + 1), es: a.es, d: a.d, ef: a.ef, ls: a.ls, fl: a.fl, lf: a.lf, cr: a.fl === 0 }); }); nodes.push({ id: '_F', name: 'Finish', pill: 1, x: Wd - 50, y: H0 / 2, cr: 1 });
      const edges = []; order.forEach(a => { if (!a.pre.length) edges.push(['_S', a.id]); a.pre.forEach(p => edges.push([p, a.id])); if (!order.some(s => s.pre.includes(a.id))) edges.push([a.id, '_F']); });
      netBox.innerHTML = netSVG(nodes, edges, { w: Wd, h: H0, k: 'cpm', bw: 132 }) + NODE_KEY;
      const base = presets[ps.value] ? null : null;
      ro([['project duration', net.T], ['critical path(s)', net.paths.map(p => p.join('-')).join(' · ') || '—'], ['activities with float', order.filter(a => a.fl > 0).map(a => a.id + ':' + a.fl).join(' ') || 'none']]);
      res.innerHTML = GEN.netWork(net);
      // gantt
      const T = net.T || 1, gw = 640, rowH = 22, gx = v => 90 + v / T * (gw - 110); let g = `<svg class="gantt" viewBox="0 0 ${gw} ${order.length * rowH + 30}">`; for (let t = 0; t <= T; t += Math.max(1, Math.round(T / 10))) g += `<line class="ax" x1="${gx(t)}" y1="0" x2="${gx(t)}" y2="${order.length * rowH + 4}"/><text class="axt" x="${gx(t)}" y="${order.length * rowH + 18}" text-anchor="middle">${t}</text>`;
      order.forEach((a, i) => { const y = i * rowH + 4; g += `<text x="6" y="${y + 13}">${a.id}${a.name ? ' ' + a.name.slice(0, 9) : ''}</text><rect class="bar${a.fl === 0 ? ' cr' : ''}" x="${gx(a.es)}" y="${y}" width="${Math.max(2, gx(a.ef) - gx(a.es))}" height="14" rx="3"/>${a.fl > 0 ? `<rect class="fl" x="${gx(a.ef)}" y="${y}" width="${gx(a.lf) - gx(a.ef)}" height="14" rx="3"/>` : ''}`; });
      gBox.innerHTML = g + '</svg><p class="cap">Gantt chart at earliest start; dashed box = float (the unshaded "lax time" of the lecture\'s Gantt chart).</p>';
    }

    H(b, `<h2>Worked lecture example</h2><p>A 6 (–), B 4 (–), C 3 (A), D 4 (B), E 3 (B), F 10 (–), G 3 (E, F), H 2 (C, D). Forward pass: A 0-6, B 0-4, F 0-10, C 6-9, D 4-8, E 4-7, G starts at max(EF<sub>E</sub> 7, EF<sub>F</sub> 10) = 10 → 13, H starts at max(9, 8) = 9 → 11. Project end = 13. Backward pass: G LF 13, LS 10; H LF 13, LS 11; F LF = LS<sub>G</sub> = 10 (float 0); E LF 10, LS 7 (float 3); C LF 11, LS 8 (float 2); D LF 11, LS 7 (float 3); B is a burst point: LF = min(LS<sub>D</sub> 7, LS<sub>E</sub> 7) = 7, LS 3 (float 3); A LF 8, LS 2 (float 2). <b>Critical path F-G</b> (13 weeks).</p>
    ${TRAP('The critical path need not contain the most activities, and never contains all of them (unless the network is one chain) (2026 A6 Q4, 2019 W6 Q7).', 'Float = LS − ES, NOT duration-dependent; critical activities have ZERO float; not all activities can have float (2026 A6 Q9).', 'ES = 5, LF = 30, d = 10 → EF 15, LS 20, float 15 (2026 A6 Q10).', 'Delay D by 2 weeks in the 2026 figure: D finishes at 10, project still 13, D still not critical (it had 3 weeks of float) (2026 A6 Q8).', 'Merge point → MAX of predecessor EFs; burst point → MIN of successor LSs. Do not swap them.')}`);

page({ id: 't-pert', wk: 7, topic: 1, stars: 3, lec: [31], title: 'PERT three-point estimates & crashing', kw: 'PERT optimistic most likely pessimistic expected time variance standard deviation crashing crash cost critical path tools', lede: 'PERT adds uncertainty to activity durations; crashing buys time with money. Both are short calculations that appear every year.',
  gens: ['pert-te', 'pert-var'],
  render(b) {
    H(b, MUST('PERT uses three estimates: optimistic <b>a</b> (shortest), most likely <b>m</b>, pessimistic <b>b</b>. Expected time <b>t<sub>e</sub> = (a + 4m + b)/6</b>; variance <b>σ² = ((b − a)/6)²</b>; standard deviation σ = (b − a)/6.',
      'Path: expected length = Σ t<sub>e</sub>, variance = Σ σ² of its activities (independent activities).',
      '<b>Crashing</b> = shortening project duration by deploying more resources on <b>critical</b> activities (more people, overtime, faster tools), at extra cost. Simple approach: find the critical path → cost per day to expedite each critical task → reduce the <b>cheapest</b> as much as possible or until the critical path changes → repeat.',
      'After every reduction re-check: another path may become critical. Reducing scope is NOT crashing. Speeding up non-critical tasks does not shorten the project.'));
    const L = lab(b, 'PERT calculator', '2026 A7 Q1: a = 4, m = 10, b = 16 → t<sub>e</sub> = 10, σ² = 4, σ = 2.');
    const v = controls(L.body, [{ k: 'a', label: 'Optimistic a', min: 0, max: 30, step: .5, v: 4, d: 1 }, { k: 'm', label: 'Most likely m', min: 0, max: 40, step: .5, v: 10, d: 1 }, { k: 'b', label: 'Pessimistic b', min: 0, max: 60, step: .5, v: 16, d: 1 }], () => d());
    const sc = L.scope({ xmin: 0, xmax: 40, ymin: 0, ymax: 1, xt: 8, yt: 2, h: 190, xl: 'duration', yfmt: () => '' }); const ro = L.readout();
    function d() { const a = Math.min(v.a, v.m), bb = Math.max(v.b, v.m), te = (a + 4 * v.m + bb) / 6, s = (bb - a) / 6; sc.set({ xmax: Math.max(10, Math.ceil(bb * 1.2)) }); const pdf = x => { if (x <= a || x >= bb) return 0; return x < v.m ? (x - a) / (v.m - a || 1) : (bb - x) / (bb - v.m || 1); }; sc.draw([{ fn: pdf, c: '--ch-v', fill: true }], { v: [{ x: a, t: 'a' }, { x: v.m, t: 'm' }, { x: bb, t: 'b' }, { x: te, t: 'tₑ', c: '--ch-i' }] }); ro([['tₑ = (a+4m+b)/6', fmt(te, 2)], ['σ = (b−a)/6', fmt(s, 3)], ['σ²', fmt(s * s, 3)]]); }
    d();
    const L2 = lab(b, 'Crashing simulator (lecture 31 example)', 'Network: A → B → C and A → D → C. Durations A 10, B 10, C 20, D 8 weeks. Crash cost per week and weeks available: A Rs. 500 (2), B 1800 (3), C 2000 (2), D 2500 (2). Click to crash one week at a time.');
    const base = { A: 10, B: 10, C: 20, D: 8 }, cost = { A: 500, B: 1800, C: 2000, D: 2500 }, maxc = { A: 2, B: 3, C: 2, D: 2 }; let cr = { A: 0, B: 0, C: 0, D: 0 }, spent = 0, log = [];
    const bt = h('div', { class: 'flowline' }); L2.add(bt); const ro2 = L2.readout(); const lg = h('div', { class: 'ivtxt' }); L2.add(lg);
    function d2() { const dur = k => base[k] - cr[k], p1 = dur('A') + dur('B') + dur('C'), p2 = dur('A') + dur('D') + dur('C'), T = Math.max(p1, p2), crit = { A: 1, C: 1, B: p1 === T, D: p2 === T };
      bt.innerHTML = ''; Object.keys(base).forEach(k => bt.append(h('button', { class: 'btn' + (crit[k] ? ' primary' : ''), disabled: cr[k] >= maxc[k], onclick: () => { const before = T; cr[k]++; spent += cost[k]; const np1 = base.A - cr.A + base.B - cr.B + base.C - cr.C, np2 = base.A - cr.A + base.D - cr.D + base.C - cr.C, nT = Math.max(np1, np2); log.push(`Crash ${k} (Rs. ${cost[k]}): project ${before} → ${nT}${nT === before ? ' (no gain: ' + k + ' was not on every critical path)' : ''}`); d2(); } }, `Crash ${k} −1 wk (Rs. ${cost[k]}) [${maxc[k] - cr[k]} left]`)));
      bt.append(h('button', { class: 'btn', onclick: () => { cr = { A: 0, B: 0, C: 0, D: 0 }; spent = 0; log = []; d2(); } }, 'Reset'));
      ro2([['A-B-C', p1 + ' wk'], ['A-D-C', p2 + ' wk'], ['project duration', T + ' wk'], ['critical', Object.keys(crit).filter(k => crit[k]).join(', ')], ['money spent', 'Rs. ' + fmt(spent, 0)]]);
      lg.innerHTML = (log.slice(-4).join('<br>') || 'Blue buttons are on the critical path. Cheapest first: A (both paths share it).') + (p1 === p2 && T < 40 ? '<br><b>Two critical paths now:</b> crash a shared activity (C, Rs. 2000) or B and D together (Rs. 4300). The lecture simply says "reduce D as well"; crashing C is cheaper.' : ''); }
    d2();
    H(b, `<p class="cap">Lecture walk-through: crash A twice (Rs. 500 each) → 38 weeks, other path 36. Crash B once → 37; again → 36 and now both paths are critical: any further week must shorten both paths.</p><p>Scheduling tools mentioned: OpenProj, TaskJuggler, dotProject, Collabtive, GanttProject, Microsoft Project, OpenGoo, PHProjekt, ProjectPier, ConsultComm, Redmine.</p>
    ${TRAP('Crashing = add skilled people, faster tools, overtime on CRITICAL activities. Increasing durations or reducing scope is not crashing (2026 A7 Q2).', 'Variance uses (b − a)/6 squared: a = 4, b = 16 → 4, not 2 (2 is σ) (2026 A7 Q1).', 'When two paths are critical, crashing an activity on only one of them gives no gain.')}`);
  } });

page({ id: 't-people', wk: 7, topic: 1, stars: 3, lec: [32], title: 'Team management & motivation', kw: 'Hawthorne effect Taylor scientific management McGregor theory X Y Belbin eligible suitable Maslow hierarchy Herzberg hygiene motivators Vroom expectancy instrumentality Oldham Hackman skill variety task identity significance autonomy feedback stress job enrichment', lede: 'Software is intellectual work, so managing people is managing the product. Six theories, each one exam question waiting to happen.',
  render(b) {
    H(b, MUST('<b>Hawthorne</b> (1920s, Western Electric, Chicago): productivity rose whether light was raised or lowered: simply showing interest in a group increased productivity; being observed changes behaviour.',
      '<b>Taylor</b> (father of scientific management): select the best people, instruct them in the best methods, pay piece-rate incentives. <b>McGregor</b>: Theory X (need for coercion, direction, control) vs Theory Y (work is as natural as rest or play).',
      '<b>Belbin</b>: <b>eligible</b> (right qualifications) vs <b>suitable</b> (can do the job). Danger: eligible but not suitable. Best: suitable but not eligible (cheaper, likely to stay).',
      '<b>Maslow</b>: physiological → safety → social (love, belonging) → esteem → <b>self-actualisation</b>; as a lower level is satisfied the next emerges; motivations vary between individuals.',
      '<b>Herzberg</b>: <b>hygiene</b> factors (pay, working conditions, company policy, supervision, relations) prevent dissatisfaction; <b>motivators</b> (recognition, the job itself, achievement, promotion) increase satisfaction and make the job worthwhile.',
      '<b>Vroom</b>: expectancy (effort → performance), instrumentality (performance → reward), perceived value of the reward. <b>Oldham-Hackman</b>: skill variety, task identity, task significance (meaningfulness) + autonomy + feedback.',
      'Stress: >48 h/week doubled coronary risk (1960 US study); XP: 40-hour week. Good PM reduces stress: realistic estimates, good control (fewer crises), clear expectations (less role ambiguity), less role conflict. Bullying = incompetent PM.'));
    const L = lab(b, "Maslow's hierarchy: click a level", 'Lowest at the bottom. A senior manager whose lower needs are met is motivated by a more interesting job, not by allowances (2019 W7 Q1).');
    const lv = [['Physiological / survival', 'Overcome hunger, thirst, sleep; food and shelter', 'Lunch allowance, basic salary'], ['Safety', 'Security, protection from danger', 'Job security, insurance'], ['Social (love, affection, belongingness)', 'Friendship, social activities, group membership', 'Team events, being part of a respected team'], ['Esteem', 'Self-confidence, achievement, recognition, appreciation', 'Recognition in the team meeting, a title'], ['Self-actualisation', 'Develop and realise one\'s full potential', 'Challenging, interesting assignments, technical leadership']];
    const pyr = h('div', { class: 'pyr' }); L.add(pyr); const info = h('div', { class: 'ivtxt' }, 'Pick a level.'); L.add(info);
    lv.slice().reverse().forEach((l, i) => { const w = 40 + i * 14; const bt = h('button', { style: `width:${w}%`, 'aria-pressed': 'false', onclick: () => { $$('button', pyr).forEach(x => x.setAttribute('aria-pressed', 'false')); bt.setAttribute('aria-pressed', 'true'); info.innerHTML = `<b>${l[0]}</b>: ${l[1]}. <i>At work:</i> ${l[2]}.`; } }, l[0]); pyr.append(bt); });
    sorter(b, 'Game: Herzberg hygiene factor or motivator?', 'Hygiene factors only remove dissatisfaction; motivators make the job worthwhile.', [['hyg', 'Hygiene factor'], ['mot', 'Motivator (satisfier)']], [
      ['Pay / salary', 'hyg'], ['Working conditions', 'hyg'], ['Company policy', 'hyg'], ['Good supervision', 'hyg'], ['Job security', 'hyg'], ['Good relations with co-workers and managers', 'hyg'],
      ['Recognition of effort and performance', 'mot'], ['The nature of the job itself (challenge)', 'mot'], ['Sense of achievement', 'mot'], ['Opportunity for promotion (regular promotions)', 'mot']]);
    H(b, `<h2>Vroom and Oldham-Hackman</h2>${VS([['Vroom (expectancy theory)', 'motivation = all three', ['<b>Expectancy</b>: working harder leads to better performance', '<b>Instrumentality</b>: better performance will be rewarded', '<b>Perceived value</b> of the reward']], ['Oldham-Hackman job characteristics', 'make a job meaningful', ['<b>Skill variety</b>: several skills used', '<b>Task identity</b>: see a whole, identifiable piece of work', '<b>Task significance</b>: the job matters to others', '+ <b>Autonomy</b> and <b>feedback</b> add to satisfaction', 'NOT: task complexity, salary']], ['Improve job satisfaction', '', ['Set specific goals', 'Give feedback on progress towards them', 'Job redesign: <b>job enlargement</b> (more varied tasks), <b>job enrichment</b> (more responsibility, whole tasks)']]])}
    <h2>Do good developers have innate characteristics?</h2><p>A 1968 study found a 1:25 difference in time taken by different programmers; experience predicted software skill better than maths; early research suggested developers were less sociable, later surveys found no difference. Motivation and hard work can often make up for shortfalls in innate skill.</p>
    ${TRAP('Hawthorne: productivity is NOT independent of observation; lighting is NOT the sole determinant (2026 A7 Q3).', 'Herzberg motivators do NOT eliminate dissatisfaction (that is hygiene) and do NOT include working conditions (2026 A7 Q8).', 'Maslow: food and shelter are LOWER needs; not everyone has the same needs (2026 A7 Q6).', 'Oldham-Hackman: the 2026 key accepted skill variety, task identity, feedback (and flagged "task significance" wording as doubtful) (2026 A7 Q9).', 'Systemic answer to stress: change the job role, not deep breathing (2019 W7 Q4).')}`);
  } });

page({ id: 't-org', wk: 7, topic: 1, stars: 3, lec: [33, 34], title: 'Organisation & team structures', kw: 'functional organization project organization matrix weak strong democratic team egoless programming chief programmer hierarchical mixed communication paths', lede: 'Organisation structure = how the company is split into teams. Team structure = how individuals are arranged inside one team. Two levels, two different sets of questions.',
  gens: ['paths'],
  render(b) {
    H(b, MUST('<b>Organisation structure</b> (teams within the organisation) and <b>team structure</b> (individuals within a team) operate at different levels.',
      '<b>Functional</b>: grouped by specialisation (analysts, designers, testers), pyramidal; military, police, hospitals. ✔ specialists share knowledge, better technical capability, flexible staff use, cost-effective. ✘ PM vs functional manager conflicts, less PM control, lack of job variety.',
      '<b>Project</b> (projectized): each project has its own team for its whole duration under the PM. ✔ job rotation, easy communication, easier staffing. ✘ hard to share expertise across projects, inefficient staffing.',
      '<b>Matrix</b>: project structure over a functional one, two bosses. Weak matrix: PM controls budget, can accept/reject workers. Strong matrix: functional managers assign workers. ✘ multiple bosses, reduced PM control, fire-fighting shifts; team building hardest. ✔ specialists consult easily, growth path.',
      'Team structures: <b>democratic</b> (consensus, egoless programming, ≤ 10, shared code ownership; small complex projects; communication overhead grows), <b>chief programmer</b> (CP does design, critical code, interfaces, reviews; best for low-difficulty work; single point of failure), <b>hierarchical/mixed</b> (project leader → seniors → juniors; large projects).'));
    sorter(b, 'Game: functional, project or matrix?', 'Match the description to the organisation structure.', [['fun', 'Functional'], ['pro', 'Project (projectized)'], ['mat', 'Matrix']], [
      ['Team set up per contract and dissolved at the end', 'pro'], ['Grouped by specialisation, pyramidal', 'fun'], ['Common in military, police, hospitals', 'fun'], ['Members report to two managers', 'mat'], ['Lack of job variety', 'fun'], ['Easy communication and job rotation', 'pro'], ['Hard to share expertise across projects', 'pro'], ['Team building most difficult', 'mat'], ['Weak vs strong variants', 'mat'], ['Maximum flexibility in the use of staff', 'fun']]);
    const L = lab(b, 'Why democratic teams do not scale', 'In a democratic team everyone talks to everyone: n(n−1)/2 paths. A hierarchy limits each member to a few links.');
    const v = controls(L.body, [{ k: 'n', label: 'Team size n', min: 2, max: 20, v: 7, d: 0 }], () => d()); const box = h('div', { class: 'netwrap' }); L.add(box); const ro = L.readout();
    function d() { const n = v.n, R = 110, cx = 150, cy = 130; let s = `<svg class="net" viewBox="0 0 620 260" style="min-width:520px">`; const P = Array.from({ length: n }, (_, i) => [cx + R * Math.cos(2 * Math.PI * i / n - Math.PI / 2), cy + R * Math.sin(2 * Math.PI * i / n - Math.PI / 2)]); for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) s += `<line class="ed" x1="${P[i][0]}" y1="${P[i][1]}" x2="${P[j][0]}" y2="${P[j][1]}" style="stroke-width:1"/>`; P.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="7" style="fill:var(--ch-v)"/>`);
      const lead = [460, 40], seniors = Math.max(1, Math.ceil((n - 1) / 4)); const SP = Array.from({ length: seniors }, (_, i) => [340 + (i + .5) * 240 / seniors, 120]); SP.forEach(p => s += `<line class="ed" x1="${lead[0]}" y1="${lead[1]}" x2="${p[0]}" y2="${p[1]}"/>`); let k = 0; for (let j = 0; j < n - 1 - seniors; j++) { const sp = SP[j % seniors], x = sp[0] - 30 + (Math.floor(j / seniors)) * 20, y = 210; s += `<line class="ed" x1="${sp[0]}" y1="${sp[1]}" x2="${x}" y2="${y}"/><circle cx="${x}" cy="${y}" r="6" style="fill:var(--ch-d)"/>`; k++; } SP.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="7" style="fill:var(--ch-b)"/>`); s += `<circle cx="${lead[0]}" cy="${lead[1]}" r="9" style="fill:var(--ch-i)"/><text x="150" y="255" text-anchor="middle" style="fill:var(--muted);font:600 11px var(--f-mono)">democratic</text><text x="460" y="255" text-anchor="middle" style="fill:var(--muted);font:600 11px var(--f-mono)">hierarchical</text></svg>`;
      box.innerHTML = s; ro([['democratic paths n(n−1)/2', n * (n - 1) / 2], ['hierarchical links (tree)', n - 1], ['ratio', fmt(n / 2, 1) + '×']]); }
    d();
    H(b, `${VS([['Democratic team', 'small, complex, research-type', ['Decisions by consensus; technical leader by consensus; manager gives administrative leadership', 'Egoless programming: code owned by all, exchanged for review', '✘ inefficient as team size grows (communication)']], ['Chief programmer team', 'small, low difficulty', ['Chief programmer: architecture, allocates coding, writes critical code, handles interfaces, reviews all work, responsible for every line', '✘ depends on one person (single point of failure)']], ['Hierarchical (mixed) team', 'large projects', ['Juniors report to senior programmers, seniors to a project leader', 'Technical leadership shared by leader and seniors']]])}
    ${TRAP('Functional organisations do NOT remove management layers and do NOT discourage specialisation (2026 A7 Q4).', 'Small yet complex project → democratic team (2019 W7 Q7). Team building is hardest in a matrix (2019 W7 Q8).', 'Org structure → teams within the organisation; team structure → individuals within a team; they work at different levels (2026 A7 Q7).')}`);
  } });

page({ id: 't-risk', wk: 7, topic: 1, stars: 3, lec: [34, 35], title: 'Risk management: RE, RRL, Boehm\'s top 10', kw: 'risk definition PRINCE2 PMBOK proactive reactive identification checklist brainstorming causal mapping analysis prioritisation risk exposure probability planning acceptance avoidance reduction transfer mitigation contingency monitoring risk reduction leverage Boehm top ten gold plating', lede: 'Risks are possible future problems, not current ones. Identify, rank by exposure, plan a response, monitor.',
  gens: ['re', 'rrl'],
  render(b) {
    H(b, MUST('Definitions: "the chance of adverse consequences of future events" (PRINCE2); "an uncertain event or condition that, if it occurs, has a positive or negative effect on a project\'s objectives" (PMBOK).',
      'Approaches: <b>proactive</b> (anticipate and act) vs <b>reactive</b> (no action until it happens). Framework: <b>identification → analysis & prioritisation → planning → monitoring</b>. Identification: checklists, brainstorming, causal mapping.',
      '<b>Risk exposure RE = potential damage × probability</b> (e.g. Rs. 1 billion × 0.01 = Rs. 10 million; like an insurance premium). Qualitative: high > 50 %, significant 30-50 %, moderate 10-29 %, low < 10 %.',
      'Responses: <b>acceptance, avoidance, reduction, transfer, mitigation/contingency</b>.',
      '<b>RRL = (RE<sub>before</sub> − RE<sub>after</sub>) / cost of risk reduction</b>; RRL > 1 ⇒ worth doing (fire alarm example: (1 % − 0.5 %) × 200k / 500 = 2).',
      'Risk categories: market, financial, technology, project (people, schedule…).'));
    H(b, `<h2>Boehm's top-10 risks and their remedies</h2>${TBL(['Risk', 'Risk reduction techniques'], [['Personnel shortfalls', 'Staffing with top talent; training and career development'], ['Unrealistic time and cost estimates', 'Multiple estimation techniques; incremental development'], ['Developing the wrong software functions', 'Improved software evaluation; user surveys; prototyping'], ['Developing the wrong user interface', 'Prototyping; task analysis; user involvement'], ['<b>Gold plating</b> (adding unrequested features)', 'Requirements scrubbing, prototyping, cost-benefit analysis'], ['Late changes to requirements', 'Change control, incremental development'], ['Shortfalls in externally supplied components', 'Benchmarking, inspections, formal specifications, contracts, QC'], ['Shortfalls in externally performed tasks', 'QA procedures, competitive design'], ['Real-time performance problems', 'Simulation, prototyping, tuning'], ['Development technically too difficult', 'Technical analysis, cost-benefit analysis, prototyping, training']])}`);
    const L = lab(b, 'Risk register', 'Edit probabilities and damages; the register ranks by exposure. Then test a mitigation with RRL.');
    const R = [['Key developer leaves', 0.2, 500000], ['Late requirement changes', 0.4, 300000], ['Hardware delivery delayed', 0.1, 1200000], ['Fire in server room', 0.01, 200000]];
    const tb = h('table', { class: 'etbl' }); L.add(h('div', { class: 'tblwrap' }, tb));
    const v = controls(L.body, [{ k: 'i', label: 'Mitigate risk #', min: 1, max: 4, v: 4, d: 0 }, { k: 'p2', label: 'Probability after (×)', min: 0, max: 1, step: .05, v: .5, d: 2 }, { k: 'c', label: 'Cost of measure (Rs.)', min: 100, max: 200000, step: 100, v: 500, d: 0 }], () => d()); const ro = L.readout();
    function d() { const re = R.map(r => r[1] * r[2]), rank = re.map((x, i) => [x, i]).sort((a, b) => b[0] - a[0]).map(x => x[1]); tb.innerHTML = '<tr><th>#</th><th>Risk</th><th class="num">Probability</th><th class="num">Damage (Rs.)</th><th class="num">RE</th><th>Rank</th></tr>'; R.forEach((r, i) => { const pi = h('input', { type: 'number', step: .01, min: 0, max: 1, value: r[1] }), di = h('input', { type: 'number', step: 1000, value: r[2] }); pi.addEventListener('change', () => { r[1] = +pi.value; d(); }); di.addEventListener('change', () => { r[2] = +di.value; d(); }); tb.append(h('tr', {}, h('td', {}, String(i + 1)), h('td', {}, r[0]), h('td', {}, pi), h('td', {}, di), h('td', { class: 'num' }, fmt(re[i], 0)), h('td', {}, h('span', { class: 'chipnum' }, String(rank.indexOf(i) + 1))))); });
      const k = v.i - 1, bef = re[k], aft = R[k][1] * v.p2 * R[k][2], rrl = (bef - aft) / v.c; ro([['RE before', fmt(bef, 0)], ['RE after', fmt(aft, 0)], ['RRL', fmt(rrl, 2)], ['decision', rrl > 1 ? 'worth doing' : 'not cost-effective']]); }
    d();
    sorter(b, 'Game: name the risk response', 'Reduction lowers the probability; mitigation/contingency limits the damage if it happens; transfer shifts it to someone else (insurer, subcontractor); avoidance removes the cause.', [['acc', 'Acceptance'], ['avo', 'Avoidance'], ['red', 'Reduction'], ['tra', 'Transfer'], ['mit', 'Mitigation / contingency']], [
      ['Lease equipment locally while the vendor shipment is stuck in customs', 'mit'], ['Buy insurance against fire damage', 'tra'], ['Fixed-price subcontract for a risky module', 'tra'], ['Drop the untested new framework and use the familiar one', 'avo'], ['Build a UI prototype so the chance of a wrong interface drops', 'red'], ['A minor cosmetic risk: note it and do nothing', 'acc'], ['Keep a standby developer in case a key person leaves', 'mit']]);
    H(b, TRAP('RE is damage × probability, not damage ÷ probability.', 'RRL > 1 means the measure is cost-effective; it does not mean the risk is eliminated (AI mock 5 Q28).', 'Interim lease of equipment during a vendor delay = mitigation (2019 W7 Q10).'));
  } });
