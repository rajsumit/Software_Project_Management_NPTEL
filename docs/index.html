 resource allocation, risk assessment, cost schedule","activity plan, risk assessment, cost schedule, resource allocation","activity plan, risk assessment, resource allocation, cost schedule","activity plan, cost schedule, risk assessment, resource allocation","activity plan, resource allocation, cost schedule, risk assessment"],"ans":[2],"exp":"The logical sequence begins with the activity plan (defining tasks, durations, and dependencies), followed by risk assessment to identify uncertainties that could affect scheduling or resources. Next, resource allocation assigns people and equipment to activities (often requiring adjustments), and finally, the cost schedule is developed based on the allocated resources and timelines. This order ensures that risks are considered before committing resources, and costs are calculated after resource needs are known.","topic":"t-costsched"},{"id":"A26-8-7","src":"A26","wk":8,"n":7,"type":"msq","text":"Which of the followings are examples of oral formal regular reporting method?","opts":["Weekly progress meetings","Monthly progress meetings","Through progress reports","Through exception reports","Social interaction"],"ans":[0,1],"exp":"Oral formal regular reporting involves spoken, structured, and scheduled communication—weekly and monthly progress meetings fit this category. Progress reports and exception reports are written, not oral, and social interaction is informal, not formal. Thus, only (a) and (b) are correct.","topic":"t-monitor"},{"id":"A26-8-8","src":"A26","wk":8,"n":8,"type":"msq","text":"Canteen discussion is an example of which category of reporting method?","opts":["Oral formal regular","Oral formal adhoc","Written formal regular","Written formal adhoc","Oral informal adhoc"],"ans":[4],"exp":"A canteen discussion is spoken (oral), lacks any formal structure or agenda (informal), and happens spontaneously without a fixed schedule (adhoc). Therefore, it falls under oral informal adhoc reporting. It is neither formal, written, nor regular, making all other options incorrect.","topic":"t-monitor"},{"id":"A26-8-9","src":"A26","wk":8,"n":9,"type":"mcq","text":"In Red/Amber/Green reporting, Green represents which one of the followings?","opts":["The tasks are ‘on target’","The tasks are ‘not on target but recoverable’","The tasks are ‘not on target and recoverable only with difficulty’","The tasks are ‘not on target and not recoverable’","The tasks have been completed but are awaiting formal approval"],"ans":[0],"exp":"In Red/Amber/Green (RAG) status reporting, Green indicates that tasks are progressing as planned and on target. Amber means \"not on target but recoverable,\" while Red means \"not on target and recoverable only with difficulty\" or \"not recoverable.\" Thus, (a) is the correct answer.","topic":"t-monitor"},{"id":"A26-8-10","src":"A26","wk":8,"n":10,"type":"mcq","text":"Which one of the followings is the proper sequence of activities in the review process?","opts":["Planning, Review preparation, Review meeting, Rework and follow up","Planning, Review meeting, Review preparation, Rework and follow up","Review preparation, Planning, Review meeting, Rework and follow up","Review preparation, Review meeting, Planning, Rework and follow up","Review meeting, Review preparation, Planning, Rework and follow up"],"ans":[0],"exp":"The standard review process follows a logical sequence: Planning (define objectives, select reviewers, schedule), Review preparation (participants examine the work product individually), Review meeting (team discusses findings and identifies defects), and finally Rework and follow up (author fixes issues and moderator verifies corrections). Any other order, such as holding the meeting before preparation or planning, is incorrect. Thus, (a) is the proper sequence.","topic":"t-review"},{"id":"A26-9-1","src":"A26","wk":9,"n":1,"type":"msq","text":"When is code review performed during software life cycle?","opts":["After unit testing","After coding and compiling","During integration testing","During system testing","During acceptance testing"],"ans":[1],"exp":"Code review is a static testing technique performed after coding and compiling but before dynamic testing (such as unit testing). It is done to find defects early by examining the source code without executing it. Performing it later—during or after integration, system, or acceptance testing—would be too late in the lifecycle. Thus, (b) is the correct answer.","topic":"t-codereview"},{"id":"A26-9-2","src":"A26","wk":9,"n":2,"type":"mcq","text":"Cleanroom technique does not use which one of the following activities?","opts":["Code walkthrough","Code inspection","Formal verification for bug removal","Testing of code by executing it","Statistical quality control"],"ans":[3],"exp":"The Cleanroom software engineering technique emphasizes defect prevention through formal verification (mathematical correctness), code walkthroughs and inspections (static reviews), and statistical quality control (usage-based reliability certification). It deliberately avoids execution- based testing during development—the team does not run the code to find bugs; instead, they rely on formal methods and statistical testing by a separate team for certification. Thus, (d) is the activity not used in Cleanroom.","topic":"t-codereview"},{"id":"A26-9-3","src":"A26","wk":9,"n":3,"type":"mcq","text":"Which one of the following is true of a code review meeting?","opts":["It seeks to identify errors, the person(s) responsible for the identified errors, and the solutions for the identified errors","It seeks to identify errors and the person(s) responsible for the identified errors, but does not seek solutions","It seeks to identify errors, but does not seek solutions or identify the person(s) responsible for the identified errors","It seeks to identify errors and their cause as well as outlines the solutions","It seeks to identify errors as well as recommends solutions for the same, but does not attribute blame for the error to anyone in particular"],"ans":[2],"exp":"A code review meeting focuses on finding defects in the work product, not on fixing them or assigning blame. The goal is to improve quality by identifying errors, while solutions are developed later during rework, and responsibility is not attributed to individuals—the review is about the product, not the producer. Thus, (c) is the correct statement.","topic":"t-codereview"},{"id":"A26-9-4","src":"A26","wk":9,"n":4,"type":"msq","text":"Which of the following charts records and displays the way in which targets have changed throughout the duration of the project?","opts":["Gantt chart","Pie chart","Timeline chart","PERT chart","Flow chart"],"ans":[2],"exp":"A timeline chart records and displays how project targets, such as milestone dates or deadlines, have changed over the course of the project. It visually tracks the evolution of planned versus actual dates, making it useful for monitoring schedule slips. Gantt charts, PERT charts, pie charts, and flow charts do not serve this specific purpose. Thus, (c) is the correct answer according to your book's terminology.","topic":"t-visual"},{"id":"A26-9-5","src":"A26","wk":9,"n":5,"type":"mcq","text":"The total value credited to a project at any point is known as","opts":["the planned value","the earned value","the actual cost","the average cost","the optimal cost","total value"],"ans":[1],"exp":"In Earned Value Management (EVM), Earned Value (EV) is the value of work actually completed at a given point in time, representing the budgeted cost of that completed work. Planned Value (PV) is the value of work scheduled, Actual Cost (AC) is what has been spent, and the other options are not standard EVM terms. Thus, (b) is correct.","topic":"t-eva"},{"id":"A26-9-6","src":"A26","wk":9,"n":6,"type":"mcq","text":"As part of the implementation of an Employee Payroll Information System project, a number of employee data records have to be manually typed into a database. Which one of the following techniques will be most appropriate for assigning earned value to this project?","opts":["The 0/100 technique","The 50/50 technique","The 75/25 technique","The 25/75 technique","The 100/100 technique","The milestone technique","The percentage complete technique"],"ans":[6],"exp":"Manually typing a large number of employee records into a database is a repetitive, quantifiable task where progress can be measured incrementally (e.g., records completed / total records). The percentage complete technique assigns earned value proportionally as work progresses—if 40% of records are typed, 40% of the budgeted value is earned. Fixed- ratio techniques (0/100, 50/50, etc.) or milestone techniques are better suited for discrete, non-divisible deliverables, not for continuous, measurable tasks like data entry. Thus, (g) is the most appropriate choice.","topic":"t-eva"},{"id":"A26-9-7","src":"A26","wk":9,"n":7,"type":"msq","text":"Suppose the work with a PV of Rs. 55,000 should have been completed by now. Some of that work has not been done, so the EV is only Rs. 45,000. What is the value of Schedule Variance (SV)?","opts":["Rs. 10,000","- Rs. 10,000","Rs. 1,00,000","Rs. 5,000","- Rs. 5,000"],"ans":[1],"exp":"Schedule Variance (SV) is calculated as: SV=EV−PV Given: EV = Rs. 45,000 PV = Rs. 55,000 SV=45,000−55,000=−10,000","topic":"t-eva"},{"id":"A26-9-8","src":"A26","wk":9,"n":8,"type":"msq","text":"Suppose, the work with a PV of Rs. 50,000 should have been completed by now. In fact, some of that work has not been done, so that the EV is only Rs. 40,000. Also, it is given that Rs. 60,000 had actually been spent to get this EV. What is the value of Schedule Performance Index (SPI)?","opts":["0.67","0.75","0.80","1.25","1.20","0.83"],"ans":[2],"exp":"The Schedule Performance Index (SPI) is calculated as: SPI=EV/PV​ Given: EV = Rs. 40,000 PV = Rs. 50,000 SPI=40,000/50,000=0.80","topic":"t-eva"},{"id":"A26-9-9","src":"A26","wk":9,"n":9,"type":"msq","text":"A negative CV means that,","opts":["the project is over cost","the project is below cost","the project is as per the planned cost","The project is having moderate cost","no effect on cost"],"ans":[0],"exp":"In Earned Value Management (EVM), Cost Variance (CV) is calculated as CV = EV − AC. A negative CV means that the actual cost (AC) is higher than the earned value (EV), indicating that the project is over budget (over cost).","topic":"t-eva"},{"id":"A26-9-10","src":"A26","wk":9,"n":10,"type":"msq","text":"Assume that a medium-sized project is experiencing considerable schedule slippage. Which of the followings may not help to get the project back on schedule?","opts":["Shortening the critical path","Altering the activity precedence requirements","Speeding up non-critical path activities","Reducing scope of the project","Reducing the quality of the product"],"ans":[2],"exp":"Speeding up non-critical path activities does not help recover schedule slippage because these activities have slack/float and do not affect the project's overall completion date—only the critical path determines the project duration. Shortening the critical path (a), altering precedence (b), reducing scope (d), or even temporarily reducing quality (e) could potentially shorten the schedule, though reducing quality is unethical and not recommended. Thus, (c) is the action that may not help.","topic":"t-backontrack"},{"id":"A26-10-1","src":"A26","wk":10,"n":1,"type":"msq","text":"Which of the following work products (such as code, design document, code, etc.) associated with the software continually change during the development as well as the maintenance phase?","opts":["SRS document","Data Flow Diagrams","UML Diagrams","Code","Test cases","All of these"],"ans":[5],"exp":"During both development and maintenance, all software work products—SRS documents, Data Flow Diagrams, UML diagrams, code, and test cases—are subject to continual change. Requirements evolve, designs are refined, code is updated for bug fixes or enhancements, and test cases are modified to reflect new functionality or changes. Thus, all of these work products change throughout the software life cycle, making (f) the correct answer.","topic":"t-scm"},{"id":"A26-10-2","src":"A26","wk":10,"n":2,"type":"mcq","text":"Which one of the following is an important purpose of software configuration management?","opts":["To support efficient customer relationship management such as providing technical help and accepting bug reports","To avoid maintaining multiple copies of the same project files","To Keep track of which team member would perform which task and by when","To manage the workflow across the team members","To carry out feasibility study of the software to be developed"],"ans":[1],"exp":"Software Configuration Management (SCM) is primarily concerned with controlling changes and maintaining integrity of software artifacts. A key purpose is to avoid duplication and confusion by centrally managing versions of project files, preventing multiple uncontrolled copies. Customer relationship management (a), task assignment (c), workflow management (d), and feasibility studies (e) are outside the scope of SCM. Thus, (b) is correct.","topic":"t-scm"},{"id":"A26-10-3","src":"A26","wk":10,"n":3,"type":"msq","text":"Which of the followings are usually NOT a work product category associated with a software development process?","opts":["Uncontrolled","Pre-controlled","Controlled","Post-controlled","Semi-controlled"],"ans":[3,4],"exp":"Standard SCM categories are Uncontrolled, Pre-controlled, and Controlled — representing the state of control over work products. Post-controlled is sometimes used informally but is not a core SCM category, and Semi-controlled is not a recognized term in formal SCM frameworks. Thus, both are usually NOT considered standard work product categories.","topic":"t-scm"},{"id":"A26-10-4","src":"A26","wk":10,"n":4,"type":"mcq","text":"Which one of the following statements is NOT correct regarding SCCS tool?","opts":["It stands for Source Code Control System","It is a popular configuration management tool on UNIX systems","It can be used for controlling and managing different versions of text files","It can handle binary files","It provides an efficient way of storing versions that minimize the amount of occupied disk space"],"ans":[3],"exp":"SCCS (Source Code Control System) is a UNIX-based version control tool designed primarily for text files (like source code). It stores changes efficiently by saving deltas (differences) between versions, which minimizes disk space. However, it does not handle binary files well—binary diffs are not efficiently stored, and SCCS is not suited for binary data. Thus, (d) is the statement that is NOT correct.","topic":"t-scm"},{"id":"A26-10-5","src":"A26","wk":10,"n":5,"type":"msq","text":"Which of the following project management tools do not support portfolio management?","opts":["Ganttproject","Microsoft Project","ProjectLibre Desktop","Primavera","None of these"],"ans":[0,2],"exp":"GanttProject and ProjectLibre Desktop are desktop scheduling tools focused on individual project planning and Gantt charts; they lack strategic portfolio management capabilities.","topic":"t-scm"},{"id":"A26-10-6","src":"A26","wk":10,"n":6,"type":"mcq","text":"A system / software which is bought ‘as is’, is known as","opts":["Bespoke system","Off-the-shelf package","Customized off-the-shelf (COTS) software","Open source software","Free software"],"ans":[1],"exp":"An off-the-shelf package is a software product purchased \"as is,\" with no modifications or only minimal configuration, ready for immediate use. A bespoke system is custom-built, customized COTS involves modifications, and open source/free software refer to licensing, not the \"as is\" purchase model. Thus, (b) is correct.","topic":"t-contract"},{"id":"A26-10-7","src":"A26","wk":10,"n":7,"type":"msq","text":"In fixed price per unit delivered contracts, how the price is calculated?","opts":["The price is fixed when the contract is signed","The customer is charged at a fixed rate per unit of effort","Function Point (FP) counting is used for calculating the price to be quoted","The customer is charged based on the expected time to complete the project and the volume of materials needed","The price varies dynamically"],"ans":[2],"exp":"In a fixed price per unit delivered contract, the total price is determined by multiplying the number of functional units (e.g., function points) by a fixed rate per unit. Function Point counting is commonly used to measure the size of the software to be delivered, which then forms the basis for quoting the price. The price is not fixed upfront (a), nor is it based on effort (b), time and materials (d), or dynamic variation (e). Thus, (c) is correct.","topic":"t-contract"},{"id":"A26-10-8","src":"A26","wk":10,"n":8,"type":"mcq","text":"Which one of the following occurs in restricted tendering process?","opts":["Any supplier can bid in response to the invitation to tender","Bids are received only from those suppliers who have been specifically invited","Bids are received only from the local suppliers","Negotiation is made with only one supplier","Negotiation is made with a group of suppliers"],"ans":[1],"exp":"In restricted tendering (also called selective tendering), only a limited number of pre-qualified suppliers are invited to submit bids. This contrasts with open tendering (a), where any supplier can bid; local supplier restrictions (c) are not the basis; and negotiation with one supplier (d) or a group (e) describes single-source or negotiated tendering, not restricted tendering. Thus, (b) is correct.","topic":"t-contract"},{"id":"A26-10-9","src":"A26","wk":10,"n":9,"type":"msq","text":"Which of the following are NOT services?","opts":["Equipment","Training","Documentation","Consumables","Transitional insurance arrangements","Providing telecommunication facilities","All of these"],"ans":[0,3],"exp":"Services are intangible activities done for the client (training, documentation, insurance arrangements, telecom facilities). Equipment and consumables are tangible goods, so (a) and (d) are NOT services. The official key text printed 'c. Consumables' but consumables is option (d); the solution itself says (a) and (d).","topic":"t-contract"},{"id":"A26-10-10","src":"A26","wk":10,"n":10,"type":"msq","text":"Which of the following are important reasons for not properly closing the projects?","opts":["Lack of interest by the project team","Underestimation of how fast know-how can get lost","Emotional factors","Indecision regarding project closure","Availability of a well-defined project closure process"],"ans":[0,1,2,3],"exp":"Projects often fail to close properly due to team disinterest (a), underestimation of knowledge loss (b), emotional attachment (c), and indecision about when or how to close (d). In contrast, a well- defined project closure process (e) helps ensure proper closure—it is a solution, not a cause of improper closure. Thus, (a), (b), (c), and (d) are correct.","topic":"t-closeout"},{"id":"A26-11-1","src":"A26","wk":11,"n":1,"type":"msq","text":"Which of the following are desirable characteristics of good software?","opts":["Huge size of code base","Correctness","Reliability","Usability","Hardware dependence"],"ans":[1,2,3],"exp":"Desirable characteristics of good software include correctness (performs functions accurately), reliability (operates without failure under specified conditions), and usability (easy to learn and use). A huge code base (a) indicates complexity and higher maintenance costs, and hardware dependence (e) reduces portability—both are undesirable.","topic":"t-quality"},{"id":"A26-11-2","src":"A26","wk":11,"n":2,"type":"msq","text":"Which statements regarding ISO 9001 are correct?","opts":["It mandates the use of a specific programming language","It guarantees defect-free products","It emphasizes management responsibility","It requires a quality system to be established","It includes process control requirements"],"ans":[2,3,4],"exp":"ISO 9001 is a quality management system standard that focuses on processes, not specific technical outcomes. It emphasizes management responsibility (c), requires a documented quality system (d), and includes process control requirements (e). It does not mandate programming languages (a) or guarantee defect-free products (b).","topic":"t-iso"},{"id":"A26-11-3","src":"A26","wk":11,"n":3,"type":"msq","text":"Which statements about ISO 9001 certification are correct?","opts":["Certification indicates that documented procedures are followed","Certification automatically improves software reliability","Certification alone does not guarantee product quality","A certified organization may still have an ineffective process","Certification removes the need for management oversight"],"ans":[0,2,3],"exp":"ISO 9001 certification confirms that an organization follows documented procedures (a), but it does not guarantee product quality (c) or reliability (b)—it only ensures processes are defined and followed, not that they are optimal. A certified organization can still have ineffective processes (d), and certification does not remove the need for management oversight (e)—in fact, it emphasizes management responsibility.","topic":"t-iso"},{"id":"A26-11-4","src":"A26","wk":11,"n":4,"type":"msq","text":"Which statements about the Initial (Level 1) maturity level are correct?","opts":["Processes are typically ad hoc and chaotic","Processes are quantitatively managed","Continuous process improvement is institutionalized","Success depends heavily on individual effort","It is the lowest maturity level"],"ans":[0,3,4],"exp":"At CMM Level 1 (Initial), processes are ad hoc, chaotic, and unpredictable (a), success depends heavily on individual effort rather than repeatable processes (d), and it is the lowest maturity level in the model (e). Quantitative management (b) is characteristic of Level 4, and continuous improvement (c) belongs to Level 5 (Optimizing).","topic":"t-cmm"},{"id":"A26-11-5","src":"A26","wk":11,"n":5,"type":"msq","text":"Which statements about the Defined (Level 3) maturity level are true?","opts":["Processes are primarily ad hoc","Processes are documented and standardized","A consistent process is followed across projects","Organizational standards are established","Continuous optimization is the primary focus"],"ans":[1,2,3],"exp":"At CMM Level 3 (Defined), processes are documented, standardized, and consistently followed across projects, with organizational standards established (b, c, d). Ad hoc processes (a) describe Level 1 (Initial), and continuous optimization (e) is the focus of Level 5 (Optimizing).","topic":"t-cmm"},{"id":"A26-11-6","src":"A26","wk":11,"n":6,"type":"msq","text":"Which of the following correctly match a maturity level with its characteristic?","opts":["Repeatable (Level 2) – Disciplined process","Defined (Level 3) – Standard, consistent process","Initial (Level 1) – Continuously improving process","Managed (Level 4) – Predictable process","Optimizing (Level 5) – Ad hoc process"],"ans":[0,1,3],"exp":"The CMM maturity levels are correctly matched as follows: Repeatable (Level 2) focuses on disciplined project management processes, Defined (Level 3) establishes standardized and consistent processes across the organization, and Managed (Level 4) uses quantitative metrics to achieve predictable process performance. In contrast, Initial (Level 1) is characterized by ad hoc, chaotic processes rather than continuous improvement (which belongs to Level 5 Optimizing), and Optimizing (Level 5) is about continuous process improvement, not ad hoc behavior.","topic":"t-cmm"},{"id":"A26-11-7","src":"A26","wk":11,"n":7,"type":"msq","text":"Which statements about CMM Level 5 are correct?","opts":["It is less mature than the Defined level","It discourages process innovation","It focuses on optimization and continuous improvement","It includes Defect Prevention as a key process area","It includes Technology Change Management as a key process area"],"ans":[2,3,4],"exp":"CMM Level 5 (Optimizing) is the highest maturity level, focusing on continuous process improvement, defect prevention, and technology change management to proactively enhance quality and efficiency. It is more mature than the Defined level (Level 3), not less, and it actively encourages process innovation rather than discouraging it.","topic":"t-cmm"},{"id":"A26-11-8","src":"A26","wk":11,"n":8,"type":"msq","text":"Which of the following are recognized Level 5 Key Process Areas (KPAs) in the SW-CMM?","opts":["Quantitative Process Management","Defect Prevention","Software Project Tracking and Oversight","Technology Change Management","Process Change Management"],"ans":[1,3,4],"exp":"In the SW-CMM, Level 5 (Optimizing) focuses on continuous process improvement through three Key Process Areas: Defect Prevention (to proactively eliminate errors), Technology Change Management (to adopt beneficial new technologies), and Process Change Management (to drive ongoing process enhancements). Quantitative Process Management belongs to Level 4 (Managed), and Software Project Tracking and Oversight is part of Level 2 (Repeatable), making (b), (d), and (e) the correct Level 5 KPAs.","topic":"t-cmm"},{"id":"A26-11-9","src":"A26","wk":11,"n":9,"type":"msq","text":"Which of the following statements correctly describe Quality Assurance (QA)?","opts":["QA focuses on improving development processes","QA is limited to software testing","QA begins only after coding is completed","QA aims to prevent defects from occurring","QA is process-oriented"],"ans":[0,3,4],"exp":"Quality Assurance (QA) is a process-oriented approach that focuses on preventing defects by improving development and management processes throughout the lifecycle, starting from project inception. It is not limited to testing (which is Quality Control) and does not begin only after coding—it spans the entire development process.","topic":"t-quality"},{"id":"A26-11-10","src":"A26","wk":11,"n":10,"type":"msq","text":"Which of the following statements correctly describe Quality Control (QC)?","opts":["QC aims primarily at process improvement","QC is performed only during requirements analysis","QC focuses on identifying defects in software products","QC is product-oriented","QC includes activities such as testing and inspections"],"ans":[2,3,4],"exp":"Quality Control (QC) is a product-oriented process that focuses on identifying defects in the actual work products through activities like testing, inspections, and reviews. It is performed throughout the development lifecycle—not just during requirements analysis—and its goal is defect detection, not process improvement (which is the aim of QA).","topic":"t-quality"},{"id":"A26-12-1","src":"A26","wk":12,"n":1,"type":"msq","text":"Which of the following correctly match the CMMI flavor with its focus area?","opts":["CMMI for Development → Software and systems engineering activities","CMMI for Development → Exclusive focus on supplier contracts","CMMI for Services → Limited only to IT help desks","CMMI for Services → Organizations providing services","CMMI for Acquisition → Acquiring products and services"],"ans":[0,3,4],"exp":"CMMI has distinct models: CMMI for Development covers software, systems, and hardware engineering (a); CMMI for Services applies to any service-providing organization, not just IT help desks (d); and CMMI for Acquisition focuses on acquiring products and services (e). It does not exclusively focus on supplier contracts (b—that’s part of acquisition, not development), and it is not limited to IT help desks (c).","topic":"t-cmmi"},{"id":"A26-12-2","src":"A26","wk":12,"n":2,"type":"msq","text":"Which of the following statements about the Personal Software Process (PSP) are true?","opts":["PSP recognizes that an individual process differs from a team project process","PSP provides a defined process for individual use","PSP is designed exclusively for large teams","PSP can be fine-tuned by individuals","PSP eliminates the need for any development process"],"ans":[0,1,3],"exp":"The Personal Software Process (PSP) is a disciplined framework designed for individual developers to plan, track, and improve their own work. It acknowledges the difference between individual and team processes (a), provides a defined personal process (b), and allows individuals to tailor it to their needs (d). It is not designed for large teams (c—that’s the Team Software Process, TSP), nor does it eliminate the need for other development processes (e).","topic":"t-cmmi"},{"id":"A26-12-3","src":"A26","wk":12,"n":3,"type":"msq","text":"Which of the following statements about PSP evolution are true?","opts":["Measurement activities appear before planning activities","Quality management is introduced before personal planning","Personal process evolution is a PSP3 activity","Design and code reviews are introduced in PSP0","PSP consists of four levels: PSP0 through PSP3"],"ans":[0,2,4],"exp":"PSP evolves through four levels: PSP0 (basic measurement of time and defects), PSP1 (adds size estimation and planning), PSP2 (introduces design and code reviews for quality management), and PSP3 (focuses on personal process evolution and scaling). Thus, measurement (a) comes before planning, personal process evolution (c) is a PSP3 activity, and PSP has four levels (e). Quality management is introduced in PSP2, after planning (b), and reviews are not in PSP0 (d).","topic":"t-cmmi"},{"id":"A26-12-4","src":"A26","wk":12,"n":4,"type":"msq","text":"Which of the following statements about Six Sigma are true?","opts":["Six Sigma allows up to 340 defects per million opportunities","A Six Sigma process produces no more than 3.4 defects per million opportunities","A Five Sigma process produces about 230 defects per million opportunities","A Four Sigma process produces about 6210 defects per million opportunities","Four Sigma produces fewer defects than Five Sigma"],"ans":[1,2,3],"exp":"Six Sigma is a quality management methodology that aims to reduce defects to 3.4 per million opportunities (DPMO), making (b) correct. A Five Sigma process corresponds to about 230 DPMO (c), and Four Sigma corresponds to about 6,210 DPMO (d). Option (a) is incorrect because 340 DPMO lies between Five Sigma and Six Sigma, not at Six Sigma. Option (e) is false because Four Sigma produces more defects (6,210) than Five Sigma (230).","topic":"t-cmmi"},{"id":"A26-12-5","src":"A26","wk":12,"n":5,"type":"msq","text":"Which statements explain why software reliability can vary among users?","opts":["Reliability is unaffected by how software is used","Users may exercise different features of the software","Different usage patterns can expose different failures","Every user interacts with software in exactly the same way","Failures visible to one user may not appear for another"],"ans":[1,2,4],"exp":"Software reliability can vary among users because different users may exercise different features (b), follow different usage patterns that expose distinct failures (c), and encounter failures that are visible to some but not others (e). Reliability is strongly affected by usage (a is false), and users do not interact identically (d is false).","topic":"t-reliab"},{"id":"A26-12-6","src":"A26","wk":12,"n":6,"type":"msq","text":"Which of the following statements correctly compare software and hardware failure curves?","opts":["Software and hardware have identical failure behavior over time","Hardware typically exhibits a \"bathtub curve\" failure pattern","Software does not wear out physically with age like hardware","Hardware failure rate remains constant throughout its lifetime","Software changes can introduce new failures"],"ans":[1,2,4],"exp":"Hardware follows a \"bathtub curve\"—early failures, constant random failures during useful life, and increasing wear-out failures as it ages (b). Software, however, does not physically wear out (c); it can degrade due to changes, which may introduce new defects (e). Hardware failure rates are not constant throughout (d—they increase during burn-in and wear-out phases). Software and hardware do not have identical failure behavior (a).","topic":"t-reliab"},{"id":"A26-12-7","src":"A26","wk":12,"n":7,"type":"msq","text":"A POFOD value of 0.001 implies that:","opts":["Approximately 1 out of 1000 service requests may result in failure","Approximately 10 out of 1000 service requests may result in failure","The probability of failure on a demand is 0.1%","The system fails once every 1000 hours","The metric explicitly depends on time"],"ans":[0,2],"exp":"POFOD (Probability of Failure on Demand) measures the likelihood that a system will fail when a service is requested. A value of 0.001 means there is a 0.1% chance of failure per demand, which translates to approximately 1 failure out of 1,000 service requests (a and c). It does not imply 10 out of 1,000 (b—that would be 0.01), nor is it time-based (d and e—that would describe MTBF, not POFOD).","topic":"t-reliab"},{"id":"A26-12-8","src":"A26","wk":12,"n":8,"type":"msq","text":"Which of the following statements about a reliability growth model are true?","opts":["It is used only after software deployment","It models how software reliability grows over time","Reliability improves as errors are detected and repaired","It assumes reliability decreases whenever defects are fixed","It can help estimate future reliability levels"],"ans":[1,2,4],"exp":"A reliability growth model tracks how software reliability improves over time as defects are detected and fixed, making (b) and (c) correct. It is primarily used during system testing, not only after deployment (a is false). It assumes reliability increases, not decreases, when defects are fixed (d is false). It can also help estimate future reliability levels (e).","topic":"t-relgrowth"},{"id":"A26-12-9","src":"A26","wk":12,"n":9,"type":"msq","text":"Which of the following are implications of the Littlewood and Verall model?","opts":["Every bug contributes identically to reliability improvement","The order of bug removal has no effect on reliability growth","Reliability growth is not necessarily uniform across bug fixes","Early testing may produce substantial reliability gains","Remaining bugs after extensive testing may have smaller reliability impacts"],"ans":[2,3,4],"exp":"The Littlewood–Verrall model assumes that different faults have different sizes/impacts, so reliability growth is not uniform across fixes (c). Early testing tends to find the most impactful faults, leading to substantial early gains (d), while the remaining faults after extensive testing are likely to have smaller impacts (e). The model does not assume identical contributions (a), and the order of removal does affect growth because fixing larger-impact faults earlier yields more improvement (b is false).","topic":"t-relgrowth"},{"id":"A26-12-10","src":"A26","wk":12,"n":10,"type":"msq","text":"Which of the following statements about statistical testing are true?","opts":["Statistical testing uses only randomly generated source code","Test cases are selected based on the expected operational profile of the software","It ignores user behavior patterns","Statistical testing aims to reflect actual system usage","It can be used to assess software reliability"],"ans":[1,3,4],"exp":"Statistical testing (also called operational profile testing) selects test cases based on the expected operational profile (b) to reflect actual system usage (d). By measuring failures during such testing, it helps assess software reliability (e). It does not use randomly generated source code (a—it uses the actual software), and it explicitly incorporates user behavior patterns, not ignore them (c is false).","topic":"t-relgrowth"},{"id":"A19-1-1","src":"A19","wk":1,"n":1,"type":"mcq","text":"Which one of the following can be considered to be a job rather than a project?","opts":["Construction of a house","A political election campaign","Buying grocery from a supermarket","A wedding"],"ans":[2],"exp":"A job is routine and repetitive with almost no uncertainty (buying groceries). House construction, a campaign and a wedding are one-off, goal-driven, time-bound: projects.","topic":"t-intro"},{"id":"A19-1-2","src":"A19","wk":1,"n":2,"type":"mcq","text":"Who among the following is not a project stakeholder?","opts":["Project manager","Customer","Project team member","Security personnel guarding the project building"],"ans":[3],"exp":"Stakeholders are people/organisations involved in, or affected by, the project (PM, customer, team, sponsor, top management, vendors). A security guard of the building is neither involved in nor affected by the project outcome.","topic":"t-intro"},{"id":"A19-1-3","src":"A19","wk":1,"n":3,"type":"mcq","text":"Managing a software development project is much harder than managing a road construction project. Which one of the following is NOT a major reason for this?","opts":["Large sized project","Managing something that is intangible","Managing intellectual work","Large impact of any requirements change"],"ans":[0],"exp":"Software is harder to manage because it is intangible, it is intellectual work and changes have a large ripple effect. Size is not special to software: a road project is also large.","topic":"t-intro"},{"id":"A19-1-4","src":"A19","wk":1,"n":4,"type":"mcq","text":"Which one of the following is not a characteristic of a software development project?","opts":["A software development project can have several non-routine tasks that involve challenge","A software development project can have several routine tasks","The resources available for a software development project are usually constrained","Every software development project has a well-defined starting point but may continue indefinitely"],"ans":[3],"exp":"A project is of finite duration with a defined start AND end. 'May continue indefinitely' describes an operation/job, not a project.","topic":"t-intro"},{"id":"A19-1-5","src":"A19","wk":1,"n":5,"type":"mcq","text":"Which one of the following statements concerning the business case for a project is false?","opts":["It clearly states the cost that would be incurred to complete the project","It provides the benefits that are expected to accrue from undertaking the project","It presents a cost-benefit analysis","Once the business case is completed and approved by the project sponsor, the feasibility study is undertaken"],"ans":[3],"exp":"The order is the other way round: the feasibility study is what produces the business case (justification). So 'business case first, then feasibility study' is false.","topic":"t-bizcase"},{"id":"A19-1-6","src":"A19","wk":1,"n":6,"type":"mcq","text":"Which one of the following is the most acceptable definition of a project?","opts":["A series of activities","A set of activities undertaken within a defined time period in order to meet a specific set of goals/objectives within a budget","A coordinated effort to accomplish a well-defined goal but in general can continue indefinitely","Any activity that requires human and other resources for it to proceed"],"ans":[1],"exp":"PMBOK/lecture definition: a set of activities undertaken within a defined time period to meet a specific set of goals within a budget (temporary, unique, constrained).","topic":"t-intro"},{"id":"A19-1-7","src":"A19","wk":1,"n":7,"type":"mcq","text":"Which one of the following is usually not recognized as a phase of the software project management life cycle?","opts":["Execution","Initiation","Maintenance","Closing"],"ans":[2],"exp":"Project management life cycle: initiation → planning → execution (monitoring &amp; control) → closing. Maintenance belongs to the software (product) life cycle, not to project management.","topic":"t-pm"},{"id":"A19-1-8","src":"A19","wk":1,"n":8,"type":"mcq","text":"Which one of the following most closely describes the sequence of phases of a project management life cycle?","opts":["Initiation, planning, executing, and closing","Concept, definition, development, closure","Initiation, definition, planning, monitoring","Concept, definition, implementation, maintenance"],"ans":[0],"exp":"The PMBOK-style sequence is initiation, planning, executing (with controlling) and closing.","topic":"t-pm"},{"id":"A19-1-9","src":"A19","wk":1,"n":9,"type":"mcq","text":"Which one of the following is not a pertinent question to ask for defining the scope of a project?","opts":["Why is the software being built?","What will be done?","When will it be done?","Who will be the project manager?"],"ans":[3],"exp":"W5HH asks Why, What, When, Who is responsible for a function, Where they are located, How (technically and managerially), How much. 'Who will be the project manager' is not a scope question.","topic":"t-intro"},{"id":"A19-1-10","src":"A19","wk":1,"n":10,"type":"mcq","text":"Which one of the following is not a software service type of project?","opts":["A software customization project","A novel antivirus software development project","A software maintenance project","A software testing project"],"ans":[1],"exp":"Services = customization, maintenance, testing, contract programming (work done on/for existing software at a customer's request). A novel antivirus is a new generic product.","topic":"t-intro"},{"id":"A19-2-1","src":"A19","wk":2,"n":1,"type":"mcq","text":"Which one of the following SDLC models would be suitable for a moderate-sized project involving customization of a student registration and grading package for academic institutions? Assume the project would be developed by a team of experienced personnel and that the schedule has been very aggressively set.","opts":["Spiral model","Iterative waterfall model","V model","Agile model"],"ans":[3],"exp":"Customizing an existing package with an aggressive schedule and an experienced team is a service-type project with changing details: agile fits (frequent releases, small team).","topic":"t-agile"},{"id":"A19-2-2","src":"A19","wk":2,"n":2,"type":"mcq","text":"Which one of the following is not an agile software development methodology?","opts":["Extreme Programming (XP)","Scrum","Prototyping model","Lean software development"],"ans":[2],"exp":"XP, Scrum, Lean (and Crystal, DSDM, Unified Process) are agile methodologies. Prototyping is a waterfall-derived model.","topic":"t-agile"},{"id":"A19-2-3","src":"A19","wk":2,"n":3,"type":"mcq","text":"Members of a Scrum team are not expected to answer which one of the following questions during a daily Scrum meeting?","opts":["What did you do yesterday?","Why are you getting delayed?","What will you do today?","What obstacles are in your way?"],"ans":[1],"exp":"Daily scrum: What did you do yesterday? What will you do today? What obstacles are in your way? It is NOT a way to find out who is behind schedule or why.","topic":"t-agile"},{"id":"A19-2-4","src":"A19","wk":2,"n":4,"type":"mcq","text":"Which one of the following is not a Sprint ceremony in Scrum?","opts":["Sprint planning meeting","Daily stand-up meeting","Sprint retrospective meeting","Project start-up meeting"],"ans":[3],"exp":"Scrum ceremonies: sprint planning, daily scrum (stand-up), sprint review, sprint retrospective. There is no 'project start-up meeting' ceremony.","topic":"t-agile"},{"id":"A19-2-5","src":"A19","wk":2,"n":5,"type":"mcq","text":"Which one of the following characteristics of a moderate-sized project would indicate the suitability of the Extreme Programming (XP) model in preference to the waterfall model?","opts":["Stable and well understood requirements","Mission critical software","Service-oriented project","Extremely large project"],"ans":[2],"exp":"Agile/XP suits service-type projects (customization, maintenance) with changing requirements and small teams. Stable requirements, mission-critical or very large projects point to waterfall/V-model.","topic":"t-agile"},{"id":"A19-2-6","src":"A19","wk":2,"n":6,"type":"mcq","text":"Which one of the following life cycle models is least similar to the waterfall model?","opts":["Prototyping model","V model","Spiral model","Scrum"],"ans":[3],"exp":"Prototyping, V and spiral all keep the step-wise waterfall phases (spiral subsumes waterfall). Scrum is an agile, iterative framework with no phase sequence: least similar.","topic":"t-agile"},{"id":"A19-2-7","src":"A19","wk":2,"n":7,"type":"mcq","text":"Which one of the following is not a goal of requirements analysis?","opts":["Weed out ambiguities in the requirements","Weed out inconsistencies in the requirements","Weed out non-functional requirements","Weed out incompleteness in the requirements"],"ans":[2],"exp":"Requirements analysis removes ambiguity, inconsistency and incompleteness. Non-functional requirements are part of the SRS; they are documented, not 'weeded out'.","topic":"t-waterfall"},{"id":"A19-2-8","src":"A19","wk":2,"n":8,"type":"mcq","text":"How is agility achieved in the agile model of software development?","opts":["Elaborate documentation","Rigorous planning","Avoidance of things that waste time","Prototype construction"],"ans":[2],"exp":"Agility is achieved by fitting the process to the project and avoiding things that waste time (heavy documentation, long-term plans).","topic":"t-agile"},{"id":"A19-2-9","src":"A19","wk":2,"n":9,"type":"mcq","text":"In the agile model, why are spikes constructed during development?","opts":["To explore potential solutions","To propose a common vision of what is required","To restructure code without affecting behaviour","To construct simpler use cases"],"ans":[0],"exp":"Spike = a simple program to explore potential solutions. Metaphor = common vision; refactoring = restructure without changing behaviour; user stories are simpler than use cases.","topic":"t-agile"},{"id":"A19-2-10","src":"A19","wk":2,"n":10,"type":"mcq","text":"Which one of the following is false about an iteration in the agile model?","opts":["A new release is made at the end of each iteration","A new release may not be made at the end of some iterations","No new functionality may have been incorporated at the end of an iteration","Existing functionalities may have been enhanced at the end of an iteration"],"ans":[1],"exp":"In agile a new release is invariably made at the end of every iteration, even if little functionality was added. So 'a release may not be made' is false.","topic":"t-agile"},{"id":"A19-3-1","src":"A19","wk":3,"n":1,"type":"mcq","text":"Which one of the following is not an element of project portfolio management?","opts":["Portfolio definition","Portfolio management","Portfolio optimization","Portfolio deletion"],"ans":[3],"exp":"The three PPM elements are portfolio definition, portfolio management and portfolio optimisation. There is no 'portfolio deletion'.","topic":"t-bizcase"},{"id":"A19-3-2","src":"A19","wk":3,"n":2,"type":"mcq","text":"Which one of the following is the proper sequence of undertaking project portfolio management activities?","opts":["Portfolio definition, portfolio optimization, portfolio management","Portfolio optimization, portfolio definition, portfolio management","Portfolio definition, portfolio management, portfolio optimization","Portfolio management, portfolio definition, portfolio optimization"],"ans":[2],"exp":"First define the portfolio (what projects are in it), then manage it (record costs/performance), then optimise it (balance risk vs value).","topic":"t-bizcase"},{"id":"A19-3-3","src":"A19","wk":3,"n":3,"type":"mcq","text":"Consider that a software development department of a company is being set up. Which one of the following can be considered to be a direct cost?","opts":["Insurance","Building maintenance","Purchase of a box of CDs","Air conditioning"],"ans":[2],"exp":"Direct costs can be associated with a specific money figure/item (a box of CDs). Insurance, building maintenance and air-conditioning are overheads (indirect).","topic":"t-bizcase"},{"id":"A19-3-4","src":"A19","wk":3,"n":4,"type":"mcq","text":"Consider a company that has undertaken a software development project. Which of the following is not a tangible benefit?","opts":["Benefits due to bonus payment on completing the project in fewer hours","Benefits due to an improved corporate image","Benefits due to producing reports with no errors","Benefits due to saving manpower costs"],"ans":[1],"exp":"Tangible benefits can be measured (fewer hours, error-free reports, manpower savings). An improved corporate image is real but not measurable: intangible.","topic":"t-bizcase"},{"id":"A19-3-5","src":"A19","wk":3,"n":5,"type":"mcq","text":"The method of IRR is considered to be inferior to the NPV method, because","opts":["it may give multiple rates of return","it is relatively difficult to compute","it does not indicate the absolute size of the return","All of the above"],"ans":[3],"exp":"IRR can give multiple rates, is harder to compute, and does not show the absolute size of the return (NPV 100k at 15 % may beat NPV 10k at 18 %). Hence all of the above.","topic":"t-cba"},{"id":"A19-3-6","src":"A19","wk":3,"n":6,"type":"mcq","text":"In break-even analysis, the investment period is the period when","opts":["the cost of the candidate system is less than that of the current system","the cost of the candidate system is higher than that of the current system","the cost of the candidate system is equal to that of the current system","none of the above"],"ans":[1],"exp":"Break-even analysis compares current vs candidate system costs. Before break-even the candidate costs more: investment period. After it, the candidate gives more benefit: return period.","topic":"t-cba"},{"id":"A19-3-7","src":"A19","wk":3,"n":7,"type":"mcq","text":"Where a project is relatively risky, it is a common practice to use","opts":["a lower discount rate to calculate net present value","an average discount rate to calculate net present value","a higher discount rate to calculate net present value","none of the above"],"ans":[2],"exp":"Risky projects are discounted with a higher rate (a risk premium of e.g. +2 % for a safe project, +5 % for a fairly risky one).","topic":"t-riskeval"},{"id":"A19-3-8","src":"A19","wk":3,"n":8,"type":"mcq","text":"Which one of the following risk evaluation methods is suitable when it is required to evaluate whether the risk is important and decide on a suitable course of action?","opts":["Risk identification and ranking","C-B analysis","Risk profile analysis","Using decision trees"],"ans":[3],"exp":"Decision trees are used when the manager must decide a course of action (e.g. extend vs replace a system) and evaluate expected values of each path.","topic":"t-riskeval"},{"id":"A19-3-9","src":"A19","wk":3,"n":9,"type":"mcq","text":"The projects that an organization undertakes within a planning cycle are referred to as","opts":["Business cycle programmes","Strategic programmes","Infrastructure programmes","Research and development programmes"],"ans":[0],"exp":"Business cycle programmes = the projects an organisation undertakes within a particular planning cycle (e.g. the year's budget).","topic":"t-programme"},{"id":"A19-3-10","src":"A19","wk":3,"n":10,"type":"mcq","text":"Benefits that BSNL will get from obtaining local administration approval for constructing a mobile tower in a street can be","opts":["quantified and valued","quantified but not valued","identified and easily quantified","identified but not easily quantified"],"ans":[3],"exp":"Public approval/goodwill of the locality is a benefit you can identify but cannot easily quantify (the lecture's example: public approval for an organisation in its locality).","topic":"t-programme"},{"id":"A19-4-1","src":"A19","wk":4,"n":1,"type":"mcq","text":"How many man-hours is a man-month?","opts":["142","152","162","172"],"ans":[1],"exp":"152 hours per person-month = 19 working days × 8 hours (COCOMO default).","topic":"t-estbasics"},{"id":"A19-4-2","src":"A19","wk":4,"n":2,"type":"mcq","text":"Which one of the following is the correct order in which a software project manager estimates various project parameters while using COCOMO?","opts":["cost, effort, duration, size","cost, duration, effort, size","size, effort, duration, cost","size, cost, effort, duration"],"ans":[2],"exp":"COCOMO starts from size (KLOC), computes effort (PM), then duration (Tdev = f(effort)), then cost (effort × rate).","topic":"t-estbasics"},{"id":"A19-4-3","src":"A19","wk":4,"n":3,"type":"mcq","text":"Which one of the following is NOT a factor for 'lines of code' being considered a poor software size metric?","opts":["It is programming language dependent","It penalizes efficient and compact coding","It is programmer dependent","It is dependent on the complexity of the requirements"],"ans":[3],"exp":"LOC is criticised for being language-dependent, programmer-dependent (style) and for penalising compact code. Depending on requirement complexity is what a size measure SHOULD do.","topic":"t-esttech"},{"id":"A19-4-4","src":"A19","wk":4,"n":4,"type":"mcq","text":"Which one of the following estimating methods is most appropriate when detailed information about the project is lacking?","opts":["Parametric models","Basic expert judgement technique","Analogy-based method","Price to win"],"ans":[3],"exp":"When detailed information is lacking, price-to-win (cost = what the customer can spend, then constrain development to that) may be the only appropriate strategy.","topic":"t-esttech"},{"id":"A19-4-5","src":"A19","wk":4,"n":5,"type":"mcq","text":"Which one of the following is NOT a limitation of bottom-up estimation?","opts":["It may overlook many of the system-level costs","It may be inaccurate because the necessary information may not be available in the early phase","It tends to underestimate and overlook complexities of low-level components","It tends to be more time-consuming"],"ans":[2],"exp":"Underestimating low-level complexity is a weakness of TOP-DOWN estimation. Bottom-up's weaknesses: overlooks system-level costs, needs early detail, time-consuming.","topic":"t-esttech"},{"id":"A19-4-6","src":"A19","wk":4,"n":6,"type":"mcq","text":"Which one of the following is NOT a desirable characteristic of a good algorithmic estimation model?","opts":["A clear procedure for estimation is provided","Subjective factors are avoided","Results are valid for a wide range of parameter values","Requires data that are accurately known only in future"],"ans":[3],"exp":"A good algorithmic model is causal: it needs only data available now, not data known accurately only in future.","topic":"t-esttech"},{"id":"A19-4-7","src":"A19","wk":4,"n":7,"type":"mcq","text":"Which one of the following is NOT a key component in function point analysis?","opts":["External Inputs","External Outputs","External Operations","External Inquiries"],"ans":[2],"exp":"Five IFPUG components: external inputs, external outputs, external inquiries, internal logical files, external interface files. 'External operations' is not one.","topic":"t-fp"},{"id":"A19-4-8","src":"A19","wk":4,"n":8,"type":"mcq","text":"In function point analysis, how many general system characteristics are evaluated and used to compute the Value Adjustment Factor (VAF)?","opts":["12","13","14","15"],"ans":[2],"exp":"14 general system characteristics, each rated 0-5; TDI = sum; VAF = 0.65 + 0.01 × TDI (range 0.65 to 1.35).","topic":"t-fp"},{"id":"A19-4-9","src":"A19","wk":4,"n":9,"type":"mcq","text":"Which one of the following is NOT a disadvantage of function point analysis?","opts":["It is labour intensive","Extensive training is required","It does not consider algorithmic complexity of a function","It is hard to fudge"],"ans":[3],"exp":"'Hard to fudge' is a PRO of function points. Cons: labour-intensive, extensive training, ignores algorithmic complexity, inexperience gives inaccuracy.","topic":"t-fp"},{"id":"A19-4-10","src":"A19","wk":4,"n":10,"type":"mcq","text":"Which one of the following function points is most suitable for use in embedded system development projects?","opts":["IFPUG function points","Mark II function points","COSMIC function points","None of the above"],"ans":[2],"exp":"COSMIC full function points were designed for embedded/real-time software (layers, data movements: entries, exits, reads, writes). IFPUG and Mark II target information systems.","topic":"t-fp"},{"id":"A19-5-1","src":"A19","wk":5,"n":1,"type":"mcq","text":"Which one of the following is an example of an organic project?","opts":["An accounting system development project","A compiler writing project","An operating system development project","A real-time database system development project"],"ans":[0],"exp":"Organic = familiar, stable, small team, information systems (accounting, student info). Compilers/linkers = semi-detached; OS, real-time systems = embedded.","topic":"t-cocomo"},{"id":"A19-5-2","src":"A19","wk":5,"n":2,"type":"mcq","text":"Which one of the following statements is true of the COCOMO model?","opts":["Cost is considered to be the most fundamental attribute of a software product, based on which the project size and duration are measured","Size is considered to be the most fundamental attribute of a software product, based on which the project cost and duration are measured","Effort is considered to be the most fundamental attribute of a software product, based on which the project size and cost are measured","Duration is considered to be the most fundamental attribute of a software product, based on which the project size and effort are measured"],"ans":[1],"exp":"In COCOMO size is the fundamental attribute: effort, duration and cost are all derived from size.","topic":"t-cocomo"},{"id":"A19-5-3","src":"A19","wk":5,"n":3,"type":"mcq","text":"In intermediate COCOMO, if modern programming practices are used, then the initial cost and effort estimates obtained by the basic COCOMO are","opts":["scaled downwards","scaled upwards","remained unchanged","none of the above"],"ans":[0],"exp":"MODP (modern programming practices) multiplier is below 1 when practices are used (High 0.91, Very high 0.82): estimates scale downwards.","topic":"t-cocomo"},{"id":"A19-5-4","src":"A19","wk":5,"n":4,"type":"mcq","text":"Which one of the following COCOMO estimation models considers the project as a collection of heterogeneous sub-systems?","opts":["Basic COCOMO","Intermediate COCOMO","Detailed (Complete) COCOMO","All of the above"],"ans":[2],"exp":"Complete/Detailed COCOMO treats the system as heterogeneous sub-systems (e.g. database semi-detached, GUI organic, communication embedded) and adds their costs.","topic":"t-cocomo"},{"id":"A19-5-5","src":"A19","wk":5,"n":5,"type":"mcq","text":"Which one of the following COCOMO II estimation levels would provide the most accurate estimations?","opts":["Application composition","Early design","Post-architecture","All COCOMO II estimation levels provide equally accurate results"],"ans":[2],"exp":"Accuracy increases as more is known: application composition → early design → post-architecture (17 multipliers, most detail).","topic":"t-cocomo2"},{"id":"A19-5-6","src":"A19","wk":5,"n":6,"type":"mcq","text":"The early design model of COCOMO II would be used","opts":["when software is composed from existing parts","when requirements are available but design has not yet started","to compute the effort of integrating reusable components","once the system architecture has been designed and more information about the system is available"],"ans":[1],"exp":"Early design: requirements available, design not yet started (7 effort multipliers). Post-architecture: after architecture design.","topic":"t-cocomo2"},{"id":"A19-5-7","src":"A19","wk":5,"n":7,"type":"mcq","text":"In COCOMO II, the scale factor Architecture/risk resolution (RESL) refers to","opts":["The degree to which there are past examples that can be consulted","The degree of flexibility that exists when implementing the project","The degree of uncertainty about requirements","None of the above"],"ans":[2],"exp":"RESL (architecture/risk resolution) reflects the degree of uncertainty about requirements. PREC = past examples; FLEX = flexibility in implementing.","topic":"t-cocomo2"},{"id":"A19-5-8","src":"A19","wk":5,"n":8,"type":"mcq","text":"In Halstead's software science, the higher the level of a language,","opts":["the less effort it takes to develop a program using that language","the more effort it takes to develop a program using that language","the same effort it takes to develop a program using that language","None of the above"],"ans":[0],"exp":"Program level L = V*/V; effort E = V/L. A higher-level language has a higher L, so E is smaller: less effort (assembly takes more effort than a high-level language).","topic":"t-halstead"},{"id":"A19-5-9","src":"A19","wk":5,"n":9,"type":"mcq","text":"Suppose the development time of a large software product has been estimated to be one and a half years. Then, in order to develop the product in nine months, what will be the total increase in development effort? (Use Putnam's model.)","opts":["2 times","4 times","8 times","16 times"],"ans":[3],"exp":"Putnam: K ∝ 1/td⁴. 18 → 9 months halves td, so effort grows (18/9)⁴ = 16 times.","topic":"t-staffing"},{"id":"A19-5-10","src":"A19","wk":5,"n":10,"type":"mcq","text":"Boehm observed: \"There is a limit beyond which the schedule of a software project cannot be reduced by buying any more personnel or equipment.\" This limit occurs roughly at","opts":["25% of the nominal time estimate","50% of the nominal time estimate","75% of the nominal time estimate","90% of the nominal time estimate"],"ans":[2],"exp":"Boehm: schedule cannot be compressed below about 75 % of the nominal estimate by adding people or equipment (limited parallel activities).","topic":"t-staffing"},{"id":"A19-6-1","src":"A19","wk":6,"n":1,"type":"mcq","text":"Which one of the following charts would be the most useful to decompose the project activities into smaller tasks that are more meaningfully managed?","opts":["PERT chart","Gantt chart","Task network representation","Work breakdown structure"],"ans":[3],"exp":"A work breakdown structure decomposes the project hierarchically into smaller, manageable tasks. It shows neither durations nor precedence.","topic":"t-wbs"},{"id":"A19-6-2","src":"A19","wk":6,"n":2,"type":"mcq","text":"Which one of the following is the critical path for the activity network given in the figure? (Numbers on the arrows are durations.)","opts":["A, B, F, H, G, I, L","A, B, F, H, I, L","A, C, D, J, K, L","A, C, D, G, K, L"],"ans":[2],"exp":"Path lengths: A-C-D-J-K-L = 2+3+3+1+3 = 12 (longest). A-C-D-G-K-L = 11, A-B-E-H-I-L = 11, A-B-E-L = 10, A-B-F-H-I-L = 8. Critical path = longest.","topic":"t-cpm","fig":"net19"},{"id":"A19-6-3","src":"A19","wk":6,"n":3,"type":"mcq","text":"Consider the portion of a PERT network shown in the figure. What is the LF of activity C?","opts":["10","11","16","17"],"ans":[3],"exp":"Backward pass at a burst point: LF of C = minimum of the LS of its successors = min(LS of D = 17, LS of E = 17) = 17.","topic":"t-cpm","fig":"cnode19"},{"id":"A19-6-4","src":"A19","wk":6,"n":4,"type":"mcq","text":"Consider the portion of a PERT network shown in the figure. What is the ES of activity C?","opts":["9","10","11","12"],"ans":[1],"exp":"Forward pass at a merge point: ES of C = maximum of the EF of its predecessors = max(EF of A = 9, EF of B = 10) = 10.","topic":"t-cpm","fig":"cnode19"},{"id":"A19-6-5","src":"A19","wk":6,"n":5,"type":"mcq","text":"The PERT method differs from CPM in which one of the following aspects?","opts":["PERT uses statistical time durations whereas CPM uses deterministic time durations","PERT uses dummy activities whereas CPM does not","PERT uses free float, whereas CPM uses total float in critical path calculations","PERT uses activity on arc whereas CPM uses activity on node networks"],"ans":[0],"exp":"PERT uses three time estimates (statistical: te = (a+4m+b)/6), CPM uses one deterministic duration per activity.","topic":"t-cpm"},{"id":"A19-6-6","src":"A19","wk":6,"n":6,"type":"mcq","text":"Activities, durations and predecessors: A = 14 (–), B = 13 (A), C = 20 (A), D = 10 (B, C). What is the total project duration?","opts":["37","44","47","57"],"ans":[1],"exp":"A (0-14), B (14-27), C (14-34), D starts after both B and C: max(27, 34) = 34, finishes 34+10 = 44.","topic":"t-cpm"},{"id":"A19-6-7","src":"A19","wk":6,"n":7,"type":"mcq","text":"Which one of the following is true of a critical path in a PERT chart?","opts":["It is the path having the maximum number of tasks","It is the shortest path in terms of time","It is the longest path in terms of time","It is the path with the largest amount of slack time"],"ans":[2],"exp":"The critical path is the longest path (in time) from start to finish; it fixes the minimum project duration. It need not have the most tasks.","topic":"t-cpm"},{"id":"A19-6-8","src":"A19","wk":6,"n":8,"type":"mcq","text":"Which one of the following statements regarding critical paths in a PERT chart is true?","opts":["A critical path through a PERT chart is any path that contains the least number of edges","Some activities on the critical path can have slack","Every PERT chart has exactly one critical path","It is possible that in the PERT chart for a project, there can be multiple critical paths, all having exactly the same duration"],"ans":[3],"exp":"A network can have several critical paths of exactly equal duration. Critical activities have zero slack.","topic":"t-cpm"},{"id":"A19-6-9","src":"A19","wk":6,"n":9,"type":"mcq","text":"Activity (immediate followers, time in weeks): A (E, B; 3), B (C, F; 2), C (D, G; 8), D (F; 4), E (F; 5), F (–; 10), G (–; 10). Which sequence of activities is on the critical path?","opts":["A-E-F","A-B-C-G","A-B-C-D-F","A-B-F"],"ans":[2],"exp":"Paths: A-E-F = 3+5+10 = 18, A-B-C-G = 3+2+8+10 = 23, A-B-C-D-F = 3+2+8+4+10 = 27, A-B-F = 3+2+10 = 15. Longest = A-B-C-D-F.","topic":"t-cpm"},{"id":"A19-6-10","src":"A19","wk":6,"n":10,"type":"mcq","text":"Same project as before but E now takes 3 weeks: A (E, B; 3), B (C, F; 2), C (D, G; 8), D (F; 4), E (F; 3), F (–; 10), G (–; 10). Which one of the following paths has the greatest slack time?","opts":["A-E-F","A-B-C-G","A-B-C-D-F","A-B-F"],"ans":[3],"exp":"With E = 3: A-E-F = 16, A-B-C-G = 23, A-B-C-D-F = 27, A-B-F = 15. Slack = 27 − path length, largest for the shortest path A-B-F (12).","topic":"t-cpm"},{"id":"A19-7-1","src":"A19","wk":7,"n":1,"type":"mcq","text":"Which one of the following may be the highest motivator for a senior manager of a software development organization?","opts":["Lunch allowance","House rent allowance","Company provided car","More interesting job assignment at the same pay"],"ans":[3],"exp":"Senior managers have their lower needs met; per Maslow/Herzberg the motivator is the job content itself (interesting, challenging work), not allowances.","topic":"t-people"},{"id":"A19-7-2","src":"A19","wk":7,"n":2,"type":"mcq","text":"Which one of the following is the most accurate ranking of human needs as per Maslow (highest first)?","opts":["Self actualization; self promotion; social; security and physiological needs","Self esteem; self actualization; social; security and physiological","Self actualization; self esteem; social; security and physiological","Self fulfillment; self esteem; social; security and physiological"],"ans":[2],"exp":"Maslow, top to bottom: self-actualisation, esteem, social (love/belonging), safety/security, physiological.","topic":"t-people"},{"id":"A19-7-3","src":"A19","wk":7,"n":3,"type":"mcq","text":"Which one of the following has been identified by Herzberg as a factor which, if present, will lead to increased motivation?","opts":["Good supervision","Job security","Regular promotions","Documented company policies"],"ans":[2],"exp":"Herzberg motivators: recognition, the job itself, achievement, opportunity for promotion. Supervision, security and company policy are hygiene factors.","topic":"t-people"},{"id":"A19-7-4","src":"A19","wk":7,"n":4,"type":"mcq","text":"If a team member is finding it extremely stressful, which one of the following stress management techniques would be suggested by a systemic approach?","opts":["Rolling head from side to side","Change of job role","Deep breathing","Increased social interactions"],"ans":[1],"exp":"A systemic (organisational) approach removes the cause of stress, e.g. changing the job role, rather than individual relaxation techniques.","topic":"t-people"},{"id":"A19-7-5","src":"A19","wk":7,"n":5,"type":"mcq","text":"Which one is not a factor in job satisfaction according to the Oldham-Hackman job characteristics model?","opts":["Skill variety","Task identity","Task complexity","Task significance"],"ans":[2],"exp":"Oldham-Hackman: skill variety, task identity, task significance (+ autonomy, feedback). Task complexity is not one of them.","topic":"t-people"},{"id":"A19-7-6","src":"A19","wk":7,"n":6,"type":"mcq","text":"Which one of the following is a 'hygiene factor' under Herzberg's Motivation-Hygiene theory?","opts":["Recognition for excellent work","Self-actualization","Good relations with co-workers and managers","Clean work environment"],"ans":[2],"exp":"Hygiene factors relate to the job context: pay, working conditions, company policy, supervision and relations with co-workers. Recognition and self-actualisation are motivators. Note: a clean work environment (working conditions) is ALSO a hygiene factor in Herzberg's theory, but the 2019 key accepted only (c). If both appear in an MSQ, tick both.","topic":"t-people"},{"id":"A19-7-7","src":"A19","wk":7,"n":7,"type":"mcq","text":"Which one of the following types of team organization would be most suitable for a small yet complex project?","opts":["Chief programmer","Democratic","Hybrid","Squat"],"ans":[1],"exp":"Democratic (egoless) teams suit small but complex/research-type projects: everyone reviews, ideas are pooled. Chief programmer teams suit simple, well-understood work.","topic":"t-org"},{"id":"A19-7-8","src":"A19","wk":7,"n":8,"type":"mcq","text":"In which one of the following types of organization is team building likely to be most difficult?","opts":["Functional","Projectized","Matrix","Hybrid"],"ans":[2],"exp":"In a matrix organisation members report to two bosses (functional and project) and shift between projects, so building a stable team is hardest.","topic":"t-org"},{"id":"A19-7-9","src":"A19","wk":7,"n":9,"type":"mcq","text":"Joy works for a company that accepts outsourcing projects from overseas clients. Each time it accepts a project it sets up a team; when the project completes the team is dissolved and the engineers are assigned to other projects. What is the organization structure of Joy's company?","opts":["Matrix","Projectized","Functional","Hybrid"],"ans":[1],"exp":"Team formed per project and dissolved at the end, members belong to the project for its duration: projectized (project) organisation.","topic":"t-org"},{"id":"A19-7-10","src":"A19","wk":7,"n":10,"type":"mcq","text":"A hardware vendor has told you that a customs-clearance problem may delay your network equipment by several months. You arrange to lease network equipment from a local company as an interim arrangement. Which risk response strategy have you adopted?","opts":["Transference","Acceptance","Mitigation","Avoidance"],"ans":[2],"exp":"Leasing interim equipment reduces the impact of the delay without removing the risk: mitigation. Transference would shift it to a third party (insurance/contract); avoidance would remove the cause.","topic":"t-risk"},{"id":"A19-8-1","src":"A19","wk":8,"n":1,"type":"mcq","text":"Which one of the following is true regarding the activity schedule?","opts":["It indicates the planned start and completion dates for each activity","It shows the dates on which each resource will be required and the level of requirement","It shows the planned cumulative expenditure incurred by the use of resources over time","All of the above"],"ans":[0],"exp":"Activity schedule = planned start and completion dates of each activity. Resource schedule = when each resource is needed and at what level. Cost schedule = planned cumulative expenditure.","topic":"t-resource"},{"id":"A19-8-2","src":"A19","wk":8,"n":2,"type":"mcq","text":"Which one of the following shows the dates on which each resource will be required for an activity and the level of that requirement?","opts":["Activity schedule","Resource schedule","Cost schedule","All of the above"],"ans":[1],"exp":"Resource schedule: dates on which each resource will be required and the level of that requirement.","topic":"t-resource"},{"id":"A19-8-3","src":"A19","wk":8,"n":3,"type":"mcq","text":"Which one of the following is FALSE regarding resource scheduling?","opts":["Resource scheduling may lead to changing the durations of some activities on the PERT chart","Resource scheduling may not affect the critical path","Resource scheduling usually shortens the critical path","Resource scheduling can create additional critical paths"],"ans":[2],"exp":"Resource scheduling usually DELAYS activities (uses float) and may create new critical paths; it does not shorten the critical path.","topic":"t-resource"},{"id":"A19-8-4","src":"A19","wk":8,"n":4,"type":"mcq","text":"Given: 1. shortest critical activities, 2. critical activities, 3. non-critical activities, 4. non-critical activities with least float, 5. shortest non-critical activities. Which is the correct order of priorities in Burman's priority list?","opts":["1-2-3-4-5","1-2-5-4-3","2-1-5-4-3","5-4-3-2-1"],"ans":[1],"exp":"Burman's priority list: (1) shortest critical activities, (2) other critical activities, (3) shortest non-critical, (4) non-critical with least float, (5) other non-critical.","topic":"t-resource"},{"id":"A19-8-5","src":"A19","wk":8,"n":5,"type":"mcq","text":"Which one of the following is the best way of publishing and communicating project schedules?","opts":["Activity plan","Activity bar charts","Resource histograms","Work schedule"],"ans":[3],"exp":"Activity plans, bar charts and histograms are planning tools; a work plan/work schedule (lists or charts per person) is the best way to publish and communicate schedules.","topic":"t-costsched"},{"id":"A19-8-6","src":"A19","wk":8,"n":6,"type":"mcq","text":"Which one of the following is the proper scheduling sequence?","opts":["activity plan, resource allocation, risk assessment, cost schedule","activity plan, risk assessment, cost schedule, resource allocation","activity plan, risk assessment, resource allocation, cost schedule","activity plan, cost schedule, risk assessment, resource allocation"],"ans":[2],"exp":"Activity plan → risk assessment → resource allocation → cost schedule (each later step may force revisions of the earlier ones).","topic":"t-costsched"},{"id":"A19-8-7","src":"A19","wk":8,"n":7,"type":"mcq","text":"Which one of the following is an example of the oral formal regular reporting method?","opts":["Weekly progress meetings","End-of-stage review meetings","Progress reports","Exception reports"],"ans":[0],"exp":"Oral + formal + regular = weekly/monthly progress meetings. End-of-stage reviews are oral formal ad hoc; progress reports written formal regular; exception reports written formal ad hoc.","topic":"t-monitor"},{"id":"A19-8-8","src":"A19","wk":8,"n":8,"type":"mcq","text":"Which one of the following checkpoints is a time-driven checkpoint?","opts":["Production of the SRS document","Production of a coding module","Production of test cases","Checking the progress monthly"],"ans":[3],"exp":"Time-driven checkpoints fall on pre-set dates (weekly/monthly checks). Event-driven checkpoints are tied to deliverables (SRS, module, test cases).","topic":"t-monitor"},{"id":"A19-8-9","src":"A19","wk":8,"n":9,"type":"mcq","text":"In Red/Amber/Green reporting, Amber represents which one of the following?","opts":["The tasks are 'on target'","The tasks are 'not on target but recoverable'","The tasks are 'not on target and recoverable only with difficulty'","The tasks are 'not on target and not recoverable'"],"ans":[1],"exp":"Green = on target; Amber = not on target but recoverable; Red = not on target and recoverable only with difficulty.","topic":"t-monitor"},{"id":"A19-8-10","src":"A19","wk":8,"n":10,"type":"mcq","text":"Which one of the following statements concerning reviews is true?","opts":["Usually, review is more cost-effective in removing defects as compared to testing","Usually, review is less cost-effective in removing defects as compared to testing","Usually, review is as cost-effective in removing defects as testing","Reviews are considered a dynamic analysis technique"],"ans":[0],"exp":"Reviews find defects directly (no debugging needed) and work on non-executable documents too, so they are more cost-effective than testing. Reviews are static, not dynamic.","topic":"t-review"},{"id":"A19-9-1","src":"A19","wk":9,"n":1,"type":"mcq","text":"Code review does not target to detect which one of the following types of errors?","opts":["Logical error","Algorithmic error","Syntax error","Programming errors"],"ans":[2],"exp":"Code review is done after a module compiles, so syntax errors are already gone. It targets logical, algorithmic and programming errors.","topic":"t-codereview"},{"id":"A19-9-2","src":"A19","wk":9,"n":2,"type":"mcq","text":"When is code review performed during the software life cycle?","opts":["After unit testing","After coding and compiling","During integration testing","During system testing"],"ans":[1],"exp":"After the module is coded and successfully compiled (syntax-clean), before testing.","topic":"t-codereview"},{"id":"A19-9-3","src":"A19","wk":9,"n":3,"type":"mcq","text":"The Cleanroom technique does not use which one of the following activities?","opts":["Code walkthrough","Code inspection","Formal verification for bug removal","Testing of code by executing it"],"ans":[3],"exp":"Cleanroom relies on walkthroughs, inspection and formal verification; programmers may not test their code by executing it (only syntax checks with a compiler).","topic":"t-codereview"},{"id":"A19-9-4","src":"A19","wk":9,"n":4,"type":"mcq","text":"In a slip chart, the more the slip line bends,","opts":["the greater is the variation from the plan","the smaller is the variation from the plan","no change happens in the plan","None of the above"],"ans":[0],"exp":"The more a slip line bends (jagged), the greater the deviation from plan; a very jagged line means rescheduling is needed.","topic":"t-visual"},{"id":"A19-9-5","src":"A19","wk":9,"n":5,"type":"mcq","text":"Which one of the following charts shows the slippage of the project completion date through the life of the project?","opts":["Gantt chart","Slip chart","Timeline chart","PERT chart"],"ans":[2],"exp":"Gantt and slip charts are snapshots. The timeline chart records how target completion dates changed over the life of the project.","topic":"t-visual"},{"id":"A19-9-6","src":"A19","wk":9,"n":6,"type":"mcq","text":"Which one of the following methods is preferred for assigning an earned value (EV) in software projects?","opts":["The 0/100 technique","The 50/50 technique","The 75/25 technique","The milestone technique"],"ans":[0],"exp":"The 0/100 technique (value only when finished) is preferred for software because partial completion is hard to judge (99 % complete syndrome).","topic":"t-eva"},{"id":"A19-9-7","src":"A19","wk":9,"n":7,"type":"mcq","text":"Work with a PV of Rs. 40,000 should have been completed by now. Some of that work has not been done, so the EV is only Rs. 30,000. What is the Schedule Variance (SV)?","opts":["10000","-10000","70000","None of the above"],"ans":[1],"exp":"SV = EV − PV = 30,000 − 40,000 = −10,000 (negative ⇒ behind schedule).","topic":"t-eva"},{"id":"A19-9-8","src":"A19","wk":9,"n":8,"type
