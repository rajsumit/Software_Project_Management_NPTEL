 Subcritical Path","The Optimal Route","The Critical Path","The Baseline Schedule"],"ans":[2],"exp":"Critical path: zero-float path that fixes the minimum project duration.","topic":"t-cpm","lec":28},{"id":"AI-4-11","src":"AI","paper":4,"wk":6,"n":11,"type":"mcq","diff":"Medium","text":"In a PERT/CPM forward pass, how is the Earliest Start (ES) time determined for an activity with multiple predecessors?","opts":["It is the earliest (minimum) of the Earliest Finish (EF) times of all its predecessors.","It is the average of the Earliest Finish (EF) times of all its predecessors.","It is the latest (maximum) of the Earliest Finish (EF) times of all its immediate predecessors.","It is determined by the project manager's discretion."],"ans":[2],"exp":"ES at a merge = max of predecessor EFs.","topic":"t-cpm","lec":29},{"id":"AI-4-12","src":"AI","paper":4,"wk":7,"n":12,"type":"mcq","diff":"Medium","text":"According to Herzberg's Two-Factor Theory, which of the following is considered a 'Motivator' rather than a 'Hygiene Factor'?","opts":["Company policy","Pay","Working conditions","Recognition of effort and performance"],"ans":[3],"exp":"Recognition is a motivator (satisfier).","topic":"t-people","lec":32},{"id":"AI-4-13","src":"AI","paper":4,"wk":2,"n":13,"type":"mcq","diff":"Medium","text":"What is the key difference between the RAD model and the traditional prototyping model?","opts":["The RAD model does not involve customer feedback.","In RAD, the prototype is refined into the final product, whereas in the prototyping model, it is typically thrown away.","The RAD model is only suitable for large, multi-year projects.","The prototyping model uses a 'time box' approach, while RAD does not."],"ans":[1],"exp":"RAD refines the prototype into the product; prototyping throws it away.","topic":"t-proto","lec":7},{"id":"AI-4-14","src":"AI","paper":4,"wk":9,"n":14,"type":"mcq","diff":"Medium","text":"In Earned Value Analysis, if a project has a Schedule Performance Index (SPI) of 0.88 and a Cost Performance Index (CPI) of 0.64, what does this indicate?","opts":["The project is ahead of schedule and under budget.","The project is ahead of schedule but over budget.","The project is behind schedule and over budget.","The project is behind schedule but under budget."],"ans":[2],"exp":"SPI 0.88 &lt; 1 behind schedule; CPI 0.64 &lt; 1 over budget.","topic":"t-eva","lec":44},{"id":"AI-4-15","src":"AI","paper":4,"wk":12,"n":15,"type":"mcq","diff":"Medium","text":"What is the primary reason software reliability measurement is more complex than hardware reliability measurement?","opts":["Software is more expensive than hardware.","Hardware failures are always caused by user error.","Software failures are due to design flaws, not physical wear, and reliability changes with each bug fix.","There are no standardized metrics for hardware reliability."],"ans":[2],"exp":"Software failures stem from design faults; reliability changes after each fix and depends on the user's operational profile.","topic":"t-reliab","lec":57},{"id":"AI-4-16","src":"AI","paper":4,"wk":7,"n":16,"type":"mcq","diff":"Medium","text":"How does a 'Project Organization' structure differ from a 'Functional Organization'?","opts":["A Project Organization is permanent, while a Functional Organization is temporary.","In a Project Organization, employees report to a functional manager, while in a Functional Organization, they report to a project manager.","A Project Organization offers less job variety for team members.","In a Project Organization, employees are dedicated to a single project team for its duration, whereas in a Functional Organization, they are drawn from specialized departments."],"ans":[3],"exp":"Project organisation: team dedicated to one project for its whole duration under the PM. Functional: people stay in specialist departments.","topic":"t-org","lec":47},{"id":"AI-4-17","src":"AI","paper":4,"wk":10,"n":17,"type":"mcq","diff":"Medium","text":"In the context of contract management, what is the main purpose of a Memoranda of Agreement (MoA)?","opts":["To serve as the final legal contract for payment.","To document the minutes of all project meetings.","To freeze the technical specifications of a solution so subsequent tenders can be judged primarily on price.","To outline the marketing strategy for the new product."],"ans":[2],"exp":"MoA: technical proposals are discussed and the agreed solution frozen; tenders are then judged on price.","topic":"t-contract","lec":49},{"id":"AI-4-18","src":"AI","paper":4,"wk":2,"n":18,"type":"mcq","diff":"Medium","text":"According to the lecture, what is a primary limitation of the classical waterfall model that the iterative waterfall model attempts to address?","opts":["Its lack of clear phases.","Its inability to handle rework and defects discovered in later phases.","Its unsuitability for projects with stable requirements.","Its over-reliance on customer feedback."],"ans":[1],"exp":"Classical waterfall assumes no defects; iterative waterfall adds feedback paths to rework earlier phases.","topic":"t-waterfall","lec":6},{"id":"AI-4-19","src":"AI","paper":4,"wk":9,"n":19,"type":"mcq","diff":"Medium","text":"What is the key difference between a 'slip chart' and a 'Gantt chart' for project monitoring?","opts":["A Gantt chart is used for cost monitoring, while a slip chart is for schedule monitoring.","A slip chart visually emphasizes deviations from the schedule, while a Gantt chart provides a static snapshot of planned durations.","Only Gantt charts can show the critical path.","Slip charts are used for initial planning, while Gantt charts are for post-implementation review."],"ans":[1],"exp":"Slip chart: the bend of the slip line shows deviation from plan; a Gantt chart is a static snapshot with a today cursor.","topic":"t-visual","lec":42},{"id":"AI-4-20","src":"AI","paper":4,"wk":7,"n":20,"type":"mcq","diff":"Medium","text":"In the context of risk management, what does 'Risk Reduction Leverage (RRL)' measure?","opts":["The total number of risks in a project.","The probability of a risk occurring.","The cost-effectiveness of a risk handling technique.","The amount of time a project is delayed by a risk."],"ans":[2],"exp":"RRL = (RE before − RE after) / cost of risk reduction; &gt; 1 means the measure is worth it.","topic":"t-risk","lec":35},{"id":"AI-4-21","src":"AI","paper":4,"wk":4,"n":21,"type":"mcq","diff":"Medium","text":"What is the primary purpose of the 'Value Adjustment Factor (VAF)' in Albrecht/IFPUG function point analysis?","opts":["To convert function points into lines of code.","To calculate the initial raw count of functional units.","To determine the number of user inputs and outputs.","To refine the raw functional size by accounting for technical and environmental complexity."],"ans":[3],"exp":"VAF refines the unadjusted count for technical and environmental complexity (14 GSCs).","topic":"t-fp","lec":19},{"id":"AI-4-22","src":"AI","paper":4,"wk":11,"n":22,"type":"mcq","diff":"Medium","text":"In the SEI CMM, what distinguishes Level 4 (Managed) from Level 3 (Defined)?","opts":["Level 4 introduces basic project management, while Level 3 is chaotic.","Level 4 focuses on continuous process improvement, while Level 3 focuses on repeating success.","Level 4 introduces quantitative measurement and control of processes, while Level 3 focuses on standardizing and documenting them.","Level 4 requires peer reviews, while Level 3 does not."],"ans":[2],"exp":"Level 4 (Managed): quantitative quality goals, process and product measured and controlled. Level 3: defined/documented process.","topic":"t-cmm","lec":55},{"id":"AI-4-23","src":"AI","paper":4,"wk":5,"n":23,"type":"mcq","diff":"Hard","text":"According to Putnam's model, if a project's development time is compressed by 50% (e.g., from 2 years to 1 year), by what factor does the required effort increase?","opts":["2 times","4 times","8 times","16 times"],"ans":[3],"exp":"Putnam: (2/1)⁴ = 16.","topic":"t-staffing","lec":25},{"id":"AI-4-24","src":"AI","paper":4,"wk":6,"n":24,"type":"mcq","diff":"Hard","text":"In a PERT/CPM backward pass, how is the Latest Finish (LF) time determined for an activity that is a 'burst point' (i.e., has multiple successors)?","opts":["It is the latest (maximum) of the Latest Start (LS) times of all its successors.","It is the smallest (minimum) of the Latest Start (LS) times of all its immediate successors.","It is the average of the Latest Start (LS) times of all its successors.","It is equal to the project's overall earliest finish time."],"ans":[1],"exp":"LF at a burst point = min of successors' LS.","topic":"t-cpm","lec":29},{"id":"AI-4-25","src":"AI","paper":4,"wk":5,"n":25,"type":"mcq","diff":"Hard","text":"In Halstead's Software Science, how is Programming Effort (E) calculated, and what does it represent?","opts":["E = V * L, representing the total lines of code.","E = N * log2(η), representing the program volume.","E = V^2 / V*, representing the number of mental discriminations required to implement the program.","E = V / S, representing the total development time in months."],"ans":[2],"exp":"E = V/L and L = V*/V, so E = V²/V*; E is the number of mental discriminations. Time T = E/S, S = 18.","topic":"t-halstead","lec":24},{"id":"AI-4-26","src":"AI","paper":4,"wk":12,"n":26,"type":"mcq","diff":"Hard","text":"What is a fundamental difference in how the Jelinski Moranda model and the Littlewood and Verall’s model account for reliability growth?","opts":["Jelinski Moranda is a step function model, while Littlewood and Verall's is linear.","Littlewood and Verall’s model accounts for negative reliability growth and diminishing returns, while Jelinski Moranda assumes reliability improvement is proportional to remaining faults.","Jelinski Moranda is used for hardware reliability, while Littlewood and Verall's is for software.","Littlewood and Verall’s model assumes each bug fix contributes equally to reliability, which Jelinski Moranda refutes."],"ans":[1],"exp":"J-M: failure rate ∝ remaining faults. L-V: each fix's contribution is a random variable (gamma), allows negative growth and diminishing returns.","topic":"t-relgrowth","lec":59},{"id":"AI-4-27","src":"AI","paper":4,"wk":9,"n":27,"type":"mcq","diff":"Hard","text":"A project manager is using the 0/100 technique for earned value. A task with a Planned Value (PV) of $10,000 is scheduled for completion by week 4. At the end of week 4, the task is 90% complete with an Actual Cost (AC) of $8,000. What are the Earned Value (EV), Cost Variance (CV), and Schedule Variance (SV)?","opts":["EV = $9,000, CV = $1,000, SV = -$1,000","EV = $0, CV = -$8,000, SV = -$10,000","EV = $10,000, CV = $2,000, SV = $0","EV = $0, CV = $2,000, SV = -$10,000"],"ans":[1],"exp":"0/100: no value until 100 % done, so EV = 0. CV = EV − AC = −8,000; SV = EV − PV = −10,000.","topic":"t-eva","lec":43},{"id":"AI-4-28","src":"AI","paper":4,"wk":11,"n":28,"type":"mcq","diff":"Hard","text":"Why is an organization with ISO 9001 certification prohibited from advertising its individual products as 'ISO 9000 compliant'?","opts":["Because ISO 9001 certification is only valid for one year.","Because the ISO organization charges a separate fee for product-level advertising.","Because ISO 9001 certifies the organization's quality process, not the individual products themselves.","Because only organizations in the manufacturing sector can advertise product compliance."],"ans":[2],"exp":"Certification is of the organisation's process, not products.","topic":"t-iso","lec":52},{"id":"AI-4-29","src":"AI","paper":4,"wk":7,"n":29,"type":"mcq","diff":"Hard","text":"In the context of team structures, why is a hierarchical team structure considered more suitable for large projects than a democratic team structure?","opts":["A hierarchical team is less expensive to manage.","A hierarchical structure scales effectively by distributing leadership, whereas the N-squared communication paths in a democratic team become highly inefficient as team size increases.","Democratic teams are only suitable for maintenance projects.","Hierarchical teams do not require a project manager."],"ans":[1],"exp":"Communication paths grow as n(n−1)/2 in a democratic team; a hierarchy limits paths and shares leadership with senior programmers.","topic":"t-org","lec":34},{"id":"AI-4-30","src":"AI","paper":4,"wk":5,"n":30,"type":"mcq","diff":"Hard","text":"In COCOMO II's Application Composition Model, what three components are counted to determine the Number of Application Points (NAP)?","opts":["Number of lines of code, number of developers, and project duration.","Number of use cases, number of actors, and number of classes.","Number of separate screens, number of reports produced, and number of modules.","Number of hardware devices, number of databases, and number of network connections."],"ans":[2],"exp":"Application (object) points: screens (1/2/3), reports (2/5/8) and 3GL modules (10 each).","topic":"t-cocomo2","lec":23},{"id":"AI-5-1","src":"AI","paper":5,"wk":6,"n":1,"type":"mcq","diff":"Easy","text":"According to the lecture, what is the primary purpose of a Work Breakdown Structure (WBS)?","opts":["To calculate the project's total cost and budget.","To create a hierarchical decomposition of project work into smaller, manageable components.","To assign specific developers to each task in the project.","To determine the critical path of the project."],"ans":[1],"exp":"WBS: hierarchical decomposition of work into manageable components.","topic":"t-wbs","lec":26},{"id":"AI-5-2","src":"AI","paper":5,"wk":2,"n":2,"type":"mcq","diff":"Easy","text":"In the Scrum framework, what is a 'Sprint'?","opts":["A long-term project plan spanning several months.","A daily 15-minute meeting for the development team.","A fixed-duration iteration, typically one month long, to develop a product increment.","The final phase of the project where all features are integrated."],"ans":[2],"exp":"Sprint: fixed-duration (target one month) iteration producing an increment.","topic":"t-agile","lec":10},{"id":"AI-5-3","src":"AI","paper":5,"wk":4,"n":3,"type":"mcq","diff":"Easy","text":"What does Parkinson's Law state in the context of project estimation?","opts":["The best way to estimate a project is to break it down into its smallest parts.","Work expands to fill the time available.","A project without a reliability requirement can meet any other requirement.","The more people you add to a late project, the later it gets."],"ans":[1],"exp":"Parkinson's law: work expands to fill the time available (over-estimation risk).","topic":"t-estbasics","lec":16},{"id":"AI-5-4","src":"AI","paper":5,"wk":8,"n":4,"type":"mcq","diff":"Easy","text":"In project monitoring and control, what is a 'milestone'?","opts":["A daily task assigned to a junior developer.","A designated key event or significant point in a project's timeline.","The total budget allocated for a project phase.","An informal discussion about project progress."],"ans":[1],"exp":"Milestone: a key event such as completion of the SRS review; reaching it shows measurable progress.","topic":"t-monitor","lec":39},{"id":"AI-5-5","src":"AI","paper":5,"wk":9,"n":5,"type":"mcq","diff":"Easy","text":"In Earned Value Analysis, what is 'Planned Value (PV)'?","opts":["The actual cost incurred for the work performed.","The total value credited to a project at a specific point in time.","The original budgeted cost for work scheduled to be completed by a given date.","The final profit earned at the end of the project."],"ans":[2],"exp":"PV (BCWS): budgeted cost of the work scheduled to be done by a given date.","topic":"t-eva","lec":43},{"id":"AI-5-6","src":"AI","paper":5,"wk":7,"n":6,"type":"mcq","diff":"Easy","text":"What is the Hawthorne Effect?","opts":["The tendency for project scope to expand over time.","The phenomenon where individuals improve performance in response to being observed.","The principle that 90% of execution time is spent in 10% of the code.","A management style that assumes employees are inherently lazy."],"ans":[1],"exp":"Hawthorne experiments: productivity rose whatever the lighting because the workers were being observed (interest shown in them).","topic":"t-people","lec":31},{"id":"AI-5-7","src":"AI","paper":5,"wk":7,"n":7,"type":"mcq","diff":"Easy","text":"What is a 'functional organization' structure?","opts":["A structure where teams are formed for a single project and then disbanded.","A structure where employees are grouped by specialized functions like design or testing.","A hybrid structure with dual reporting lines to project and functional managers.","A flat structure where all decisions are made by consensus."],"ans":[1],"exp":"Functional organisation: grouped by function/specialisation.","topic":"t-org","lec":33},{"id":"AI-5-8","src":"AI","paper":5,"wk":8,"n":8,"type":"mcq","diff":"Easy","text":"What is a 'resource histogram' used for in project management?","opts":["To calculate the total cost of all project resources.","To list all activities on the critical path.","To visualize the demand for a specific resource over the project's timeline.","To document the project's communication plan."],"ans":[2],"exp":"Resource histogram: demand for a resource over time.","topic":"t-resource","lec":37},{"id":"AI-5-9","src":"AI","paper":5,"wk":10,"n":9,"type":"mcq","diff":"Easy","text":"In contract management, what is a 'bespoke system'?","opts":["A generalized software package available for immediate purchase.","A software system specifically created and tailored for a single customer's unique requirements.","A core system that is purchased and then customized to meet specific needs.","A contract where the customer is charged per hour of work."],"ans":[1],"exp":"Bespoke system: created specially for one customer.","topic":"t-contract","lec":18},{"id":"AI-5-10","src":"AI","paper":5,"wk":1,"n":10,"type":"mcq","diff":"Easy","text":"What is meant by the 'intangibility' of software?","opts":["Software is very easy to change and modify.","Software does not consume physical space or have weight.","Software progress is difficult to visually assess until it is fully operational.","Software development is primarily intellectual work."],"ans":[2],"exp":"Intangible: software is invisible until it is ready and runs, so progress is hard to see.","topic":"t-intro","lec":1},{"id":"AI-5-11","src":"AI","paper":5,"wk":2,"n":11,"type":"mcq","diff":"Medium","text":"In the Incremental Model, how is the Value-to-Cost (V/C) ratio used?","opts":["To calculate the total net profit of the project.","To determine the number of developers needed for a task.","To prioritize which increments to develop next by comparing customer value to development cost.","To decide whether to use the Waterfall model or the RAD model."],"ans":[2],"exp":"Value-to-cost: score value 1-10 (customer) and cost 0-10 (developers); develop the highest V/C increment first.","topic":"t-proto","lec":7},{"id":"AI-5-12","src":"AI","paper":5,"wk":2,"n":12,"type":"mcq","diff":"Medium","text":"What is the primary role of the Scrum Master in a Scrum team?","opts":["To define features and prioritize the Product Backlog.","To write the code for the most complex user stories.","To act as a servant-leader who facilitates the process and removes impediments.","To represent the customer's interests and accept or reject completed work."],"ans":[2],"exp":"Scrum master: essentially the project manager; removes impediments, shields the team, facilitates the process.","topic":"t-agile","lec":10},{"id":"AI-5-13","src":"AI","paper":5,"wk":3,"n":13,"type":"mcq","diff":"Medium","text":"What is the key difference between Project Risk and Business Risk?","opts":["Project Risk relates to budget overruns, while Business Risk relates to schedule delays.","Project Risk threatens the successful execution of the project, while Business Risk threatens the benefits of the delivered project.","Project Risk is managed by the development team, while Business Risk is managed by the customer.","Project Risk is only relevant for technical projects, while Business Risk applies to all projects."],"ans":[1],"exp":"Project risk vs business risk (see business case).","topic":"t-bizcase","lec":11},{"id":"AI-5-14","src":"AI","paper":5,"wk":3,"n":14,"type":"mcq","diff":"Medium","text":"How does Net Present Value (NPV) analysis improve upon evaluation techniques like ROI and Payback Period?","opts":["It is simpler to calculate and requires less data.","It provides a result as a percentage, which is easier to understand.","It ignores future cash flows, focusing only on the initial investment.","It accounts for the time value of money by discounting future cash flows."],"ans":[3],"exp":"NPV considers both profitability and the timing of cash flows.","topic":"t-cba","lec":13},{"id":"AI-5-15","src":"AI","paper":5,"wk":6,"n":15,"type":"mcq","diff":"Medium","text":"In a PERT/CPM network, what is the rule for calculating the Earliest Start (ES) time for an activity at a merge point (an activity with multiple predecessors)?","opts":["It is the average of the Earliest Finish (EF) times of all its predecessors.","It is the earliest (minimum) of the Earliest Finish (EF) times of all its predecessors.","It is the latest (maximum) of the Earliest Finish (EF) times of all its predecessors.","It is determined by the duration of the longest predecessor activity."],"ans":[2],"exp":"ES at a merge = max EF of predecessors.","topic":"t-cpm","lec":29},{"id":"AI-5-16","src":"AI","paper":5,"wk":2,"n":16,"type":"mcq","diff":"Medium","text":"How does the V-Model emphasize verification and validation compared to the classical waterfall model?","opts":["It removes the testing phase entirely to speed up development.","It integrates test planning and design activities into every development phase.","It performs all testing only after the coding phase is 100% complete.","It relies on customer feedback instead of formal testing activities."],"ans":[1],"exp":"V-model plans testing in parallel with each development phase.","topic":"t-waterfall","lec":6},{"id":"AI-5-17","src":"AI","paper":5,"wk":2,"n":17,"type":"mcq","diff":"Medium","text":"What is the purpose of 'refactoring' in agile development?","opts":["To add new features requested by the customer during an iteration.","To fix bugs discovered during the testing phase.","To restructure existing code without changing its external behavior, to improve its internal design.","To create the initial design metaphor for the project."],"ans":[2],"exp":"Refactoring: restructure code without changing external behaviour.","topic":"t-agile","lec":9},{"id":"AI-5-18","src":"AI","paper":5,"wk":4,"n":18,"type":"mcq","diff":"Medium","text":"In the IFPUG function point method, how is the Value Adjustment Factor (VAF) calculated?","opts":["By multiplying the number of user inputs by the number of user outputs.","By summing the weights of all functional units.","By using the formula VAF = 0.65 + (0.01 * TDI), where TDI is the Total Degree of Influence.","By dividing the estimated lines of code by the number of function points."],"ans":[2],"exp":"VAF = 0.65 + 0.01 × TDI.","topic":"t-fp","lec":19},{"id":"AI-5-19","src":"AI","paper":5,"wk":6,"n":19,"type":"mcq","diff":"Medium","text":"What is a subcritical path and why is it important for project managers to monitor?","opts":["It is a path with negative float, indicating the project is already late.","It is the shortest path in the network, representing the fastest possible completion.","It is a path where activities have a very small, but non-zero, amount of float, which could easily become critical.","It is a path that has been intentionally delayed to save costs."],"ans":[2],"exp":"Sub-critical paths have small float; a slip can make them critical, so monitor them too.","topic":"t-cpm","lec":30},{"id":"AI-5-20","src":"AI","paper":5,"wk":7,"n":20,"type":"mcq","diff":"Medium","text":"What is a primary advantage of a project organization structure in terms of job satisfaction?","opts":["It allows specialists to focus on a single type of task, enhancing their expertise.","It provides job variety and rotation, as team members engage in diverse activities.","It guarantees lifetime employment on a single project.","It minimizes communication, allowing developers to work in isolation."],"ans":[1],"exp":"Project organisation advantages: job rotation/variety, easy communication, easier staffing.","topic":"t-org","lec":33},{"id":"AI-5-21","src":"AI","paper":5,"wk":10,"n":21,"type":"mcq","diff":"Medium","text":"What is the primary advantage of a Time and Material contract for the customer?","opts":["The total project cost is fixed and known upfront.","The supplier has a strong incentive to be cost-effective.","It is easy to change or add new requirements during development.","It shifts all financial risk to the supplier."],"ans":[2],"exp":"Time &amp; materials: easy to change requirements, no price pressure on quality; but the customer carries the risk.","topic":"t-contract","lec":18},{"id":"AI-5-22","src":"AI","paper":5,"wk":4,"n":22,"type":"mcq","diff":"Medium","text":"In the context of algorithmic estimation, what is the purpose of 'model calibration'?","opts":["To select the programming language for the project.","To create a detailed Work Breakdown Structure (WBS).","To customize a generic model to fit specific organizational needs and project characteristics.","To calculate the final price charged to the customer."],"ans":[2],"exp":"Calibration customises a generic model (COCOMO etc.) to the organisation's environment using past project data.","topic":"t-esttech","lec":18},{"id":"AI-5-23","src":"AI","paper":5,"wk":10,"n":23,"type":"mcq","diff":"Hard","text":"In the contract tendering process, what is the primary purpose of establishing a Memoranda of Agreement (MoA)?","opts":["To finalize the payment schedule and contract price with the chosen vendor.","To invite as many suppliers as possible to bid on the project.","To freeze the technical specifications so that subsequent tenders can be judged primarily on price.","To legally bind all potential bidders to a non-disclosure agreement."],"ans":[2],"exp":"MoA freezes the technical solution so tenders compete on price.","topic":"t-contract","lec":49},{"id":"AI-5-24","src":"AI","paper":5,"wk":4,"n":24,"type":"mcq","diff":"Hard","text":"Why is Weinberg's Zeroth Law of Reliability ('a software project that does not have to meet a reliability requirement can meet any other requirement') a critical principle in project estimation?","opts":["It implies that reliability is the easiest requirement to achieve.","It suggests that if reliability is not a strict requirement, other aspects might be prioritized at its expense, affecting true project cost and quality.","It proves that over-estimating project duration always leads to better reliability.","It states that reliability can only be estimated after the project is 100% complete."],"ans":[1],"exp":"Weinberg's zeroth law: a project that does not have to meet a reliability requirement can meet any other requirement (quality is what gets squeezed).","topic":"t-estbasics","lec":16},{"id":"AI-5-25","src":"AI","paper":5,"wk":9,"n":25,"type":"mcq","diff":"Hard","text":"What is the defining characteristic of the Cleanroom technique for bug removal?","opts":["It relies exclusively on automated testing tools to find all defects.","It requires managers to personally review and approve every line of code.","Programmers are strictly not allowed to test their code by executing it for bug removal.","It is an informal process where developers mentally simulate code execution."],"ans":[2],"exp":"Cleanroom: no execution-based testing by programmers; walkthroughs, inspection and formal verification instead.","topic":"t-codereview","lec":41},{"id":"AI-5-26","src":"AI","paper":5,"wk":12,"n":26,"type":"mcq","diff":"Hard","text":"Why is Probability of Failure On Demand (POFOD) often a more relevant reliability metric for software systems than time-based metrics like MTTF?","opts":["POFOD is easier to calculate without any user data.","Software often operates on demand rather than continuously, making the success rate of individual invocations more meaningful.","POFOD accounts for the physical wear and tear of software components.","POFOD is the only metric that can be used for hardware reliability."],"ans":[1],"exp":"POFOD measures failure probability per service request; it does not involve time, so it suits on-demand systems.","topic":"t-reliab","lec":58},{"id":"AI-5-27","src":"AI","paper":5,"wk":2,"n":27,"type":"mcq","diff":"Hard","text":"Why is the Spiral Model considered a 'meta-model'?","opts":["It is the oldest and most foundational of all lifecycle models.","It can only be applied to metaphysical or abstract software problems.","It is exclusively focused on risk handling and ignores other development activities.","It can incorporate aspects of waterfall, iterative, and prototyping models within its loops."],"ans":[3],"exp":"Spiral subsumes waterfall, prototyping and evolutionary development: meta-model.","topic":"t-proto","lec":8},{"id":"AI-5-28","src":"AI","paper":5,"wk":7,"n":28,"type":"mcq","diff":"Hard","text":"How is Risk Reduction Leverage (RRL) used to make decisions about which risk handling techniques to implement?","opts":["A higher RRL indicates a risk is more severe and should be avoided at all costs.","An RRL greater than 1 indicates the technique is cost-effective because the reduction in risk exposure outweighs the cost.","RRL is calculated by dividing the cost of the technique by the potential damage.","An RRL less than 1 means the risk handling technique is guaranteed to eliminate the risk."],"ans":[1],"exp":"RRL &gt; 1 means the reduction in risk exposure is bigger than the cost of the measure: worth doing.","topic":"t-risk","lec":35},{"id":"AI-5-29","src":"AI","paper":5,"wk":10,"n":29,"type":"mcq","diff":"Hard","text":"What is the key difference between a 'version' and a 'revision' in the context of Software Configuration Management (SCM)?","opts":["A version refers to source code, while a revision refers to documentation.","A version is a specific configuration of the entire product at a point in time, while a revision is a successive state of a single configuration item.","A version is created by the project manager, while a revision is created by a junior developer.","Versions are used for internal tracking, while revisions are released to customers."],"ans":[1],"exp":"Version: configuration (set of items) at a point in time. Revision: successive state of one configuration item.","topic":"t-scm","lec":47},{"id":"AI-5-30","src":"AI","paper":5,"wk":5,"n":30,"type":"mcq","diff":"Hard","text":"According to Putnam's model, what is the expected impact on total effort if a project's development time is compressed by 50%?","opts":["The effort will decrease by 50%.","The effort will double (increase by 2 times).","The effort will quadruple (increase by 4 times).","The effort will increase by 16 times."],"ans":[3],"exp":"Putnam: halving td → 16× effort.","topic":"t-staffing","lec":25}];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c)));
  return e;
}
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (x, d = 2) => (Math.abs(x) >= 1e7 || (Math.abs(x) < 1e-3 && x !== 0)) ? x.toExponential(2) : (+x.toFixed(d)).toLocaleString('en-IN', { maximumFractionDigits: d });
const store = {
  get(k, d) { try { const v = localStorage.getItem('spm:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('spm:' + k, JSON.stringify(v)); } catch (e) {} }
};

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const Theme = {
  mode: store.get('theme', 'auto'),
  apply() {
    const r = document.documentElement;
    if (this.mode === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', this.mode);
    window.dispatchEvent(new Event('themechange'));
  },
  cycle() { this.mode = ({ auto: 'light', light: 'dark', dark: 'auto' })[this.mode]; store.set('theme', this.mode); this.apply(); return this.mode; }
};

/* ===== canvas plotter ===== */
class Scope {
  constructor(cv, o) {
    this.cv = cv; this.o = Object.assign({ xmin: 0, xmax: 1, ymin: -1, ymax: 1, xt: 5, yt: 4, xl: '', yl: '', h: 240, pad: [52, 14, 30, 12], xfmt: null, yfmt: null }, o);
    this.last = null;
    this._rs = () => this.draw(this.last && this.last.s, this.last && this.last.x);
    window.addEventListener('themechange', this._rs); window.addEventListener('resize', this._rs);
    onLeave(() => { window.removeEventListener('themechange', this._rs); window.removeEventListener('resize', this._rs); });
  }
  set(o) { Object.assign(this.o, o); }
  draw(series, extra) {
    this.last = { s: series, x: extra };
    const cv = this.cv, o = this.o, dpr = Math.min(window.devicePixelRatio || 1, 2);

  const nav = $('#nav'); const q = ($('#search').value || '').toLowerCase().trim(); nav.innerHTML = '';
  let lastMod = null;
  PAGES.forEach(p => {
    if (q && !(p.title + ' ' + (p.kw || '') + ' ' + MODULES[p.mod]).toLowerCase().includes(q)) return;
    if (p.mod !== lastMod) { nav.append(h('div', { class: 'navmod' }, MODULES[p.mod])); lastMod = p.mod; }
    nav.append(h('button', { class: 'navitem', 'data-id': p.id, onclick: () => go(p.id), 'aria-current': (location.hash.slice(1) || 'home') === p.id ? 'page' : null },
      h('span', {}, p.title), done[p.id] ? h('span', { class: 'done', title: 'studied' }) : (p.stars ? h('span', { class: 'stars', title: IMPORT[p.stars] }, '★'.repeat(p.stars)) : null)));
  });
}
function closeRail() { $('#rail').classList.remove('open'); const s = $('.scrim'); if (s) s.remove(); }
function openRail() { $('#rail').classList.add('open'); document.body.append(h('div', { class: 'scrim', onclick: closeRail })); }
function boot() {
  Theme.apply(); if (window.svgDefs) svgDefs();
  const tt = {}; PAGES.forEach(p => { if (p.topic) tt[p.id] = p.title; }); (window.QBANK || []).forEach(q => q.topicTitle = tt[q.topic] || q.topic);
  buildNav();
  $('#search').addEventListener('input', buildNav);
  $$('.themebtn').forEach(b => b.addEventListener('click', () => { const m = Theme.cycle(); $$('.themebtn').forEach(x => x.textContent = 'Theme: ' + m); }));
  $$('.themebtn').forEach(x => x.textContent = 'Theme: ' + Theme.mode);
  $('#menu').addEventListener('click', openRail);
  window.addEventListener('hashchange', () => renderPage(location.hash.slice(1) || 'home'));
  renderPage(location.hash.slice(1) || 'home');
}

        nat({ g: 'p-tdev', wk: 5, topic: 't-cocomo', v: T, rel: 0.012, unit: 'months', d: 1, text: 'Nominal development time (months)?', exp: `2.5 × ${nf(E, 1)}<sup>0.38</sup> = <b>${nf(T, 1)} months</b>; average staff ${nf(E / T, 1)}; cost ≈ Rs. ${nf(E * sal, 0)}.` })] };
    },
    sched: () => { const net = network(7); const a = pick(net.acts.filter(x => x.fl > 0)) || net.acts[1]; const b = pick(net.acts.filter(x => x.pre.length > 1)) || net.acts[net.acts.length - 1]; const delay = a.fl + rnd(1, 3);
      const cp = net.paths[0] ? net.paths[0].join('-') : ''; const cps = net.paths.map(p => p.join('-')); let wrong = shuffle(net.all.filter(x => x[1] < net.T).map(x => x[0].join('-'))).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3); ['A-B-D-G', 'A-C-E-G', 'B-D-F', 'A-C-F-G', 'B-C-E-G', 'A-E-G'].forEach(x => { if (wrong.length < 3 && !cps.includes(x) && !wrong.includes(x)) wrong.push(x); });
      return { title: 'Activity network', topic: 't-cpm', html: `<b class="k">Case: Office relocation IT project.</b> The activities, durations (weeks) and immediate predecessors are:` + netTable(net), qs: [
        nat({ g: 'p-T', wk: 6, topic: 't-cpm', v: net.T, rel: 0, abs: 0.01, unit: 'weeks', d: 0, text: 'What is the minimum project duration?', exp: netWork(net) + `Duration = <b>${net.T}</b>.` }),
        mcq({ g: 'p-cp', wk: 6, topic: 't-cpm', text: 'Which is a critical path?', opts: [cp].concat(wrong), ans: [0], exp: `Zero-float chain from start to finish: <b>${net.paths.map(p => p.join('-')).join(', ')}</b>.` }),
        nat({ g: 'p-fl', wk: 6, topic: 't-cpm', v: a.fl, rel: 0, abs: 0.01, unit: 'weeks', d: 0, text: `What is the total float of activity ${a.id}?`, exp: `LS − ES = ${a.ls} − ${a.es} = <b>${a.fl}</b>.` }),
        nat({ g: 'p-es', wk: 6, topic: 't-cpm', v: b.es, rel: 0, abs: 0.01, unit: 'weeks', d: 0, text: `What is the earliest start (ES) of activity ${b.id}?`, exp: `ES = max EF of predecessors ${b.pre.join(', ')} = <b>${b.es}</b>.` }),
        nat({ g: 'p-delay', wk: 6, topic: 't-cpm', v: net.T + (delay - a.fl), rel: 0, abs: 0.01, unit: 'weeks', d: 0, text: `If activity ${a.id} is delayed by ${delay} weeks (all else unchanged), what is the new project duration?`, exp: `${a.id} has ${a.fl} weeks of float; a ${delay}-week delay uses it and pushes the end date by ${delay - a.fl}: <b>${net.T + delay - a.fl} weeks</b>.` })] };
    },
    eva: () => { const bac = pick([200, 240, 300, 400]) * 1000, m = pick([3, 4, 5, 6]), dur = 12, pct = pick([20, 25, 30, 35, 45, 50]), ac = Math.round(bac * (pct / 100) * pick([0.8, 0.9, 1.1, 1.25, 1.4]) / 1000) * 1000; const pv = bac * m / dur, ev = bac * pct / 100; const sv = ev - pv, cv = ev - ac, spi = ev / pv, cpi = ev / ac, eac = bac / cpi;
      const st = (spi < 1 ? 'behind schedule' : 'ahead of schedule') + ' and ' + (cpi < 1 ? 'over budget' : 'within budget');
      return { title: 'Earned value status', topic: 't-eva', html: `<b class="k">Case: Library automation.</b> Budget at completion Rs. ${nf(bac, 0)}, planned duration 12 months with work spread evenly. At the end of month ${m} the project is ${pct} % complete and Rs. ${nf(ac, 0)} has actually been spent.`, qs: [
        nat({ g: 'p-pv', wk: 9, topic: 't-eva', v: pv, rel: 0, abs: 1, unit: 'Rs.', d: 0, text: 'Planned value (PV) now?', exp: `PV = ${m}/12 × ${nf(bac, 0)} = <b>${nf(pv, 0)}</b>.` }),
        nat({ g: 'p-sv', wk: 9, topic: 't-eva', v: sv, rel: 0, abs: 1, unit: 'Rs.', d: 0, text: 'Schedule variance SV (with sign)?', exp: `EV = ${pct} % × BAC = ${nf(ev, 0)}; SV = EV − PV = <b>${nf(sv, 0)}</b>.` }),
        nat({ g: 'p-cpi', wk: 9, topic: 't-eva', v: cpi, rel: 0, abs: 0.006, d: 2, text: 'Cost performance index (CPI)?', exp: `CPI = EV/AC = ${nf(ev, 0)}/${nf(ac, 0)} = <b>${cpi.toFixed(2)}</b>.` }),
        nat({ g: 'p-eac', wk: 9, topic: 't-eva', v: eac, rel: 0.01, unit: 'Rs.', d: 0, text: 'Estimate at completion (EAC = BAC/CPI)?', exp: `EAC = ${nf(bac, 0)}/${cpi.toFixed(3)} = <b>${nf(eac, 0)}</b>.` }),
        mcq({ g: 'p-st', wk: 9, topic: 't-eva', text: 'Overall status of the project?', opts: [st].concat(['ahead of schedule and within budget', 'behind schedule and over budget', 'ahead of schedule and over budget', 'behind schedule and within budget'].filter(x => x !== st)), ans: [0], exp: `SPI = ${spi.toFixed(2)}, CPI = ${cpi.toFixed(2)} → <b>${st}</b>. (CV = ${nf(cv, 0)}.)` })] };
    },
    risk: () => { const R = [['Key developer leaves', pick([0.1, 0.2, 0.3]), pick([4, 5, 8]) * 1e5], ['Requirements change late', pick([0.3, 0.4, 0.5]), pick([2, 3, 4]) * 1e5], ['Server hardware delivery delayed', pick([0.05, 0.1, 0.2]), pick([6, 10, 12]) * 1e5]]; const RE = R.map(r => r[1] * r[2]); const top = RE.indexOf(Math.max(...RE)); const cost = pick([10, 20, 30, 50]) * 1000, newp = R[top][1] / 2; const rrl = (RE[top] - newp * R[top][2]) / cost;
      return { title: 'Risk register', topic: 't-risk', html: `<b class="k">Case: Risk register for an e-governance portal.</b> ${R.map((r, i) => `R${i + 1}: ${r[0]}, probability ${r[1]}, potential damage Rs. ${nf(r[2], 0)}.`).join(' ')} A mitigation for the highest-exposure risk costs Rs. ${nf(cost, 0)} and would halve its probability.`, qs: [
        nat({ g: 'p-re1', wk: 7, topic: 't-risk', v: RE[0], rel: 0, abs: 1, unit: 'Rs.', d: 0, text: 'Risk exposure of R1?', exp: `RE = ${R[0][1]} × ${nf(R[0][2], 0)} = <b>${nf(RE[0], 0)}</b>.` }),
        mcq({ g: 'p-rank', wk: 7, topic: 't-risk', text: 'Which risk has the highest exposure?', opts: ['R1', 'R2', 'R3'], ans: [top], exp: `RE: ${RE.map((x, i) => `R${i + 1} = ${nf(x, 0)}`).join(', ')}. Highest: <b>R${top + 1}</b>.` }),
        nat({ g: 'p-rrl', wk: 7, topic: 't-risk', v: rrl, rel: 0.01, d: 2, text: 'Risk reduction leverage of the proposed mitigation?', exp: `RRL = (RE<sub>before</sub> − RE<sub>after</sub>)/cost = (${nf(RE[top], 0)} − ${nf(newp * R[top][2], 0)})/${nf(cost, 0)} = <b>${nf(rrl)}</b> → ${rrl > 1 ? 'worth doing' : 'not worth doing'}.` }),
        mcq({ g: 'p-resp', wk: 7, topic: 't-risk', text: 'For R3 the team leases equipment locally as an interim arrangement. This response is…', opts: ['Mitigation (reduce impact)', 'Avoidance', 'Transfer', 'Acceptance'], ans: [0], exp: 'An interim arrangement that limits the damage while the risk still exists is mitigation (2019 assignment, week 7).' })] };
    },
    reliab: () => { const dem = pick([2000, 4000, 5000]), fail = rnd(2, 20); let t = 0; const ts = Array.from({ length: 5 }, () => (t += rnd(30, 150))); const mttf = (ts[4] - ts[0]) / 4, mttr = pick([2, 3, 4, 6]); const A = (mttf) / (mttf + mttr) * 100;
      return { title: 'Reliability log', topic: 't-reliab', html: `<b class="k">Case: Railway reservation server.</b> In the last test campaign the server failed at t = ${ts.join(', ')} hours of operation; each repair took ${mttr} hours on average. In a separate test, ${fail} of ${nf(dem, 0)} booking requests failed.`, qs: [
        nat({ g: 'p-mttf', wk: 12, topic: 't-reliab', v: mttf, rel: 0.004, unit: 'h', d: 2, text: 'MTTF from the failure times?', exp: `(${ts[4]} − ${ts[0]})/4 = <b>${nf(mttf)} h</b>.` }),
        nat({ g: 'p-mtbf', wk: 12, topic: 't-reliab', v: mttf + mttr, rel: 0.004, unit: 'h', d: 2, text: 'MTBF (= MTTF + MTTR)?', exp: `${nf(mttf)} + ${mttr} = <b>${nf(mttf + mttr)} h</b>.` }),
        nat({ g: 'p-av', wk: 12, topic: 't-reliab', v: (mttf + mttr) / (mttf + 2 * mttr) * 100, rel: 0, abs: 0.06, unit: '%', d: 2, text: 'Inherent availability = MTBF/(MTBF + MTTR), in %?', exp: `${nf(mttf + mttr)}/(${nf(mttf + mttr)} + ${mttr}) = <b>${nf((mttf + mttr) / (mttf + 2 * mttr) * 100)} %</b> (course formula A = MTBF/(MTBF + MTTR)).` }),
        nat({ g: 'p-pofod', wk: 12, topic: 't-reliab', v: fail / dem * 100, rel: 0.003, unit: '%', d: 3, text: 'POFOD in % for the booking requests?', exp: `${fail}/${dem} = <b>${nf(fail / dem * 100, 3)} %</b>.` }),
        mcq({ g: 'p-why', wk: 12, topic: 't-reliab', text: 'Why can two users of this server perceive different reliability?', opts: ['They exercise different features (different operational profiles)', 'Software wears out faster for heavy users', 'MTTF is observer-independent', 'Failures are always permanent'], ans: [0], exp: 'Reliability is observer-dependent: it depends on the operational profile.' })] };
    },
    compress: () => { const t1 = pick([12, 18, 24]), f = pick([0.5, 2 / 3, 0.75]), t2 = Math.round(t1 * f); const pu = (t1 / t2) ** 4, je = (t1 / t2) ** 2;
      return { title: 'Schedule compression', topic: 't-staffing', html: `<b class="k">Case: Tax-season deadline.</b> The nominal development time of a mid-sized product is ${t1} months. Marketing wants it in ${t2} months and offers to hire more developers.`, qs: [
        nat({ g: 'p-pu', wk: 5, topic: 't-staffing', v: pu, rel: 0.01, unit: 'times', d: 2, text: 'Effort increase factor by Putnam?', exp: `(${t1}/${t2})⁴ = <b>${nf(pu)}</b>.` }),
        nat({ g: 'p-je', wk: 5, topic: 't-staffing', v: je, rel: 0.01, unit: 'times', d: 2, text: 'Effort increase factor by Jensen?', exp: `(${t1}/${t2})² = <b>${nf(je)}</b>.` }),
        mcq({ g: 'p-feas', wk: 5, topic: 't-staffing', text: 'According to Boehm, is the compression feasible?', opts: f < 0.75 ? ['No: compressing below about 75 % of the nominal time is very unlikely to succeed', 'Yes: any compression is possible with enough staff', 'Yes, because Jensen predicts a small effort increase', 'No: no compression is ever possible'] : ['Borderline: 75 % of nominal is roughly the limit; more staff beyond this does not help', 'No: no compression is ever possible', 'Yes: any compression is possible with enough staff', 'Yes, because effort decreases when time is compressed'], ans: [0], exp: `Required = ${nf(f * 100, 0)} % of nominal. Boehm: the limit is about 75 % of the nominal estimate (limited parallel activities).` }),
        mcq({ g: 'p-brooks', wk: 5, topic: 't-staffing', type: 'msq', text: 'Why might adding developers late make the project later? (Select all that apply.)', opts: ['More communication paths', 'Newcomers must learn the system', 'Experienced members spend time training them', 'Limited scope for parallel work', 'Project scope automatically increases'], ans: [0, 1, 2, 3], exp: 'Brooks: communication overhead, learning, training effort and limited parallelism. Scope does not grow by itself (2026 assignment 5 Q9).' })] };
    },
    halstead: () => { const prog = pick([{ c: 'a = b + c;', ops: ['=', '+', ';'], opd: ['a', 'b', 'c'], N1: 3, N2: 3 }, { c: 'x = x * y + z;', ops: ['=', '*', '+', ';'], opd: ['x', 'y', 'z'], N1: 4, N2: 4 }, { c: 'if (a > b) max = a; else max = b;', ops: ['if…else', '()', '>', '=', ';'], opd: ['a', 'b', 'max'], N1: 7, N2: 6 }, { c: 'sum = sum + a[i]; i = i + 1;', ops: ['=', '+', '[]', ';'], opd: ['sum', 'a', 'i', '1'], N1: 7, N2: 7 }]); const n1 = prog.ops.length, n2 = prog.opd.length, N = prog.N1 + prog.N2, eta = n1 + n2, V = N * Math.log2(eta);
      return { title: 'Halstead metrics', topic: 't-halstead', html: `<b class="k">Snippet:</b> <code>${prog.c}</code><br>Using the lecture's counting rules (a statement terminator ';' is one operator, a parenthesis pair and if…else are single operators), the unique operators are ${prog.ops.map(o => `<code>${o}</code>`).join(' ')} (η₁ = ${n1}) and the unique operands are ${prog.opd.map(o => `<code>${o}</code>`).join(' ')} (η₂ = ${n2}). Total operators N₁ = ${prog.N1}, total operands N₂ = ${prog.N2}.`, qs: [
        nat({ g: 'p-N', wk: 5, topic: 't-halstead', v: N, rel: 0, abs: 0.01, d: 0, text: 'Program length N?', exp: `N = N₁ + N₂ = <b>${N}</b>.` }),
        nat({ g: 'p-eta', wk: 5, topic: 't-halstead', v: eta, rel: 0, abs: 0.01, d: 0, text: 'Vocabulary η?', exp: `η = η₁ + η₂ = <b>${eta}</b>.` }),
        nat({ g: 'p-V', wk: 5, topic: 't-halstead', v: V, rel: 0.006, unit: 'bits', d: 2, text: 'Volume V = N log₂ η?', exp: `${N} × log₂${eta} = <b>${nf(V)}</b>.` }),
        mcq({ g: 'p-E', wk: 5, topic: 't-halstead', text: 'How does Halstead effort E depend on V?', opts: ['E = V²/V*, i.e. it varies as the square of V', 'E = V × L', 'E = V/18', 'E is independent of V'], ans: [0], exp: 'E = V/L with L = V*/V ⇒ E = V²/V*. Time T = E/S, S = 18.' })] };
    },
    // ---- theory case studies (fixed text, randomised option order)
    caseStartup: () => ({ title: 'Case: outsourcing start-up', topic: 't-org', html: `<b class="k">Case.</b> Nimbus Soft is a 40-person start-up in Pune doing outsourced customization and maintenance projects for overseas clients. Each new contract gets its own team, which is dissolved when the contract ends. Requirements change every few weeks, the teams are small (5-8) and clients want frequent demos. Management wants a process certification that customers will recognise, at minimum cost.`, qs: [
      mcq({ g: 'c-org', wk: 7, topic: 't-org', text: 'Which organisation structure does Nimbus use?', opts: ['Project (projectized) organisation', 'Functional organisation', 'Strong matrix', 'Weak matrix'], ans: [0], exp: 'A team formed per project and dissolved at its end = project organisation (2019 assignment W7 Q9).' }),
      mcq({ g: 'c-sdlc', wk: 2, topic: 't-agile', text: 'Most suitable life cycle model?', opts: ['Agile (e.g. Scrum/XP)', 'Classical waterfall', 'V-model', 'Spiral with full risk analysis per loop'], ans: [0], exp: 'Small teams, frequently changing requirements, service-type (customization/maintenance) work and frequent demos → agile.' }),
      mcq({ g: 'c-cmm', wk: 11, topic: 't-cmm', text: 'Which SEI CMM level should it aim for first?', opts: ['Level 2 (Repeatable)', 'Level 4 (Managed)', 'Level 5 (Optimizing)', 'Level 1 (Initial)'], ans: [0], exp: 'A small outsourcing/maintenance company first needs basic project management (cost, schedule tracking, CM): level 2 (2019 W11 Q9).' }),
      mcq({ g: 'c-iso', wk: 11, topic: 't-iso', text: 'Which ISO standard applies to it?', opts: ['ISO 9001', 'ISO 9002', 'ISO 9003', 'ISO 9000-3 certification'], ans: [0], exp: 'ISO 9001 covers design, development, production and servicing, i.e. software development. ISO 9000-3 is only guidance for applying 9001 to software.' }),
      mcq({ g: 'c-contract', wk: 10, topic: 't-contract', text: 'Since requirements change every few weeks, which contract type suits the CLIENT best?', opts: ['Time and materials', 'Fixed price', 'Fixed price per delivered unit with frozen FP count', 'Open tendering'], ans: [0], exp: 'T&M makes changing requirements easy (customer pays per unit of effort); the customer carries the risk. Open tendering is a selection procedure, not a payment type.' })] }),
    caseAvionics: () => ({ title: 'Case: flight control software', topic: 't-waterfall', html: `<b class="k">Case.</b> AeroDyn is building flight-control software for a drone: 120 KLOC, hard real-time constraints, tight interfaces with new hardware, all requirements fixed by a certification authority, and the highest reliability requirement.`, qs: [
      mcq({ g: 'c-v', wk: 2, topic: 't-waterfall', text: 'Most suitable life cycle model?', opts: ['V-model', 'RAD', 'Build and fix', 'Scrum'], ans: [0], exp: 'V-model: natural choice for safety-critical, high-reliability systems with requirements known up front (test design in parallel with each phase).' }),
      mcq({ g: 'c-mode', wk: 5, topic: 't-cocomo', text: 'COCOMO 81 mode?', opts: ['Embedded', 'Organic', 'Semi-detached', 'Detached'], ans: [0], exp: 'New, innovative product with tight hardware/real-time constraints = embedded.' }),
      mcq({ g: 'c-rely', wk: 5, topic: 't-cocomo', text: 'In intermediate COCOMO, the very high reliability requirement will…', opts: ['scale the estimate upwards (RELY 1.40)', 'scale it downwards', 'leave it unchanged', 'only change the duration, not effort'], ans: [0], exp: 'Stringent reliability → RELY > 1 (very high 1.40) → effort scaled up (2026 A5 Q3).' }),
      mcq({ g: 'c-fp', wk: 4, topic: 't-fp', text: 'Best function point method for sizing it?', opts: ['COSMIC full function points', 'IFPUG function points', 'Mark II function points', 'Object points'], ans: [0], exp: 'COSMIC was designed for embedded/real-time software (entries, exits, reads, writes).' }),
      mcq({ g: 'c-team', wk: 7, topic: 't-org', text: 'Team structure for a project this large?', opts: ['Hierarchical (mixed) team', 'Chief programmer team', 'Democratic team', 'No structure: self-organising pairs'], ans: [0], exp: 'Large projects need a hierarchical structure (project leader → senior programmers → juniors); chief programmer and democratic teams suit small projects.' })] }),
    caseScrum: () => ({ title: 'Case: a Scrum team', topic: 't-agile', html: `<b class="k">Case.</b> A 7-member team builds a mobile wallet in month-long iterations. Riya decides which features matter most to customers and orders the list of all desired work. Arjun removes blockers and shields the team. Every morning the team meets standing for 15 minutes. Mid-iteration a sales head asks to add a new feature to the current iteration.`, qs: [
      mcq({ g: 's-po', wk: 2, topic: 't-agile', text: 'Riya\'s role is…', opts: ['Product owner', 'Scrum master', 'Chief programmer', 'Configuration librarian'], ans: [0], exp: 'The product owner represents the customer and prioritises the product backlog.' }),
      mcq({ g: 's-sm', wk: 2, topic: 't-agile', text: 'Arjun\'s role is…', opts: ['Scrum master', 'Product owner', 'Moderator', 'Programme manager'], ans: [0], exp: 'Scrum master: facilitates, removes impediments, buffers outside interference.' }),
      mcq({ g: 's-chg', wk: 2, topic: 't-agile', text: 'How should the mid-sprint feature request be handled?', opts: ['Add it to the product backlog for a later sprint', 'Add it to the current sprint backlog immediately', 'The scrum master implements it himself', 'Extend the sprint by two weeks'], ans: [0], exp: 'No changes are entertained during a sprint; new work goes to the product backlog and is prioritised by the PO.' }),
      mcq({ g: 's-q', wk: 2, topic: 't-agile', type: 'msq', text: 'Which questions are answered in the daily scrum? (Select all.)', opts: ['What did I do yesterday?', 'What will I do today?', 'What obstacles are in my way?', 'Who is behind schedule and why?', 'How do we fix the bug in the payment module?'], ans: [0, 1, 2], exp: 'Three questions only; not a problem-solving or blame session.' }),
      mcq({ g: 's-bd', wk: 2, topic: 't-agile', type: 'msq', text: 'A sprint burndown chart shows… (Select all.)', opts: ['Remaining effort (hours)', 'Progress across the sprint days', 'Work left until sprint completion', 'Customer satisfaction', 'Number of employees'], ans: [0, 1, 2], exp: 'Sprint burndown: remaining sprint-backlog hours per day, ideally reaching zero at the end (2026 A2 Q9).' })] }),
    caseConfig: () => ({ title: 'Case: version chaos', topic: 't-scm', html: `<b class="k">Case.</b> In a 12-person team two developers edited the same module and one overwrote the other's fix. Nobody could tell who changed the billing code last week or roll back to last month's release. The manager decides to put the SRS, design, code and test cases under a configuration management tool with reserve/restore operations and a change control board.`, qs: [
      mcq({ g: 'k-1', wk: 10, topic: 't-scm', text: 'Knowing who changed what and when is called…', opts: ['System accounting', 'Variant handling', 'Release management', 'Baselining'], ans: [0], exp: 'System accounting = who, what, when of each change.' }),
      mcq({ g: 'k-2', wk: 10, topic: 't-scm', text: 'The overwrite problem is solved because…', opts: ['Only one developer can reserve a module at a time until it is restored', 'The tool stores deltas', 'Variants are created for each developer', 'The CCB writes all code'], ans: [0], exp: 'Reserve/restore: a reserved item cannot be reserved by anyone else until restored (concurrent access problem).' }),
      mcq({ g: 'k-3', wk: 10, topic: 't-scm', text: 'Before a changed module is restored into the configuration…', opts: ['the change control board must approve it', 'the customer must sign it', 'it must be compiled to a binary for SCCS', 'all variants must be deleted'], ans: [0], exp: 'Restoring needs CCB approval (well-motivated, documented, tested, consistent with other changes).' }),
      mcq({ g: 'k-4', wk: 10, topic: 't-scm', text: 'A design note that will be put under configuration control after review is…', opts: ['Pre-controlled', 'Controlled', 'Uncontrolled', 'Post-controlled'], ans: [0], exp: 'Pre-controlled: not yet under configuration control but will be.' }),
      mcq({ g: 'k-5', wk: 10, topic: 't-scm', text: 'A Unix tool like SCCS stores versions MOD1.1, 1.2, 1.3 as…', opts: ['the original plus deltas (changes)', 'three complete copies', 'binary images', 'only the latest version'], ans: [0], exp: 'SCCS/RCS store the original and deltas to save disk space; they handle text files only.' })] }),
    casePeople: () => ({ title: 'Case: team motivation', topic: 't-people', html: `<b class="k">Case.</b> After a pay rise and a new air-conditioned office, the testers of a team are still unmotivated. They test only small fragments, never see the full product, and do not hear back about whether their bug reports mattered. Meanwhile the project manager asks everyone to work 60-hour weeks.`, qs: [
      mcq({ g: 'm-1', wk: 7, topic: 't-people', text: 'Pay and office conditions did not motivate them. Herzberg calls these…', opts: ['Hygiene factors', 'Motivators', 'Self-actualisation needs', 'Expectancy'], ans: [0], exp: 'Hygiene factors only remove dissatisfaction; motivators (achievement, recognition, the work itself, promotion) increase satisfaction.' }),
      mcq({ g: 'm-2', wk: 7, topic: 't-people', type: 'msq', text: 'Which Oldham-Hackman characteristics are missing? (Select all.)', opts: ['Task identity (seeing a whole piece of work)', 'Feedback', 'Salary', 'Task complexity'], ans: [0, 1], exp: 'They never see the whole product (task identity) and hear nothing back (feedback). Salary and "task complexity" are not in the model.' }),
      mcq({ g: 'm-3', wk: 7, topic: 't-people', text: 'Making each tester own a complete feature end to end is called…', opts: ['Job enrichment / job redesign', 'Theory X control', 'Resource smoothing', 'Crashing'], ans: [0], exp: 'Job redesign: enlargement (more tasks) or enrichment (more responsibility, whole tasks).' }),
      mcq({ g: 'm-4', wk: 7, topic: 't-people', text: 'The 60-hour week…', opts: ['raises stress and health risk; good PM (realistic estimates, control) should avoid it', 'is recommended by XP', 'is a Herzberg motivator', 'reduces role ambiguity'], ans: [0], exp: 'XP recommends a 40-hour week; studies linked >48 h/week to heart-disease risk. Good PM reduces stress via realistic estimates, fewer crises, clear roles.' })] }),

      <text x="${x + c3 / 2}" y="${y + 13}" text-anchor="middle">${v('es')}</text><text x="${x + 1.5 * c3}" y="${y + 13}" text-anchor="middle">${v('d')}</text><text x="${x + 2.5 * c3}" y="${y + 13}" text-anchor="middle">${v('ef')}</text>

  [7, 'Crashing', 'Shorten critical activities at extra cost, cheapest per day first, re-checking the critical path each step.'],
  [7, 'Hawthorne effect', 'Productivity rises simply because people know they are being observed or cared about.'],
  [7, 'McGregor X and Y', 'Theory X: people dislike work, need control. Theory Y: work is natural, people seek responsibility.'],
  [7, 'Maslow (bottom → top)', 'Physiological, safety, social, esteem, self-actualisation.'],
  [7, 'Herzberg', 'Hygiene (pay, conditions, policy, supervision) prevent dissatisfaction; motivators (achievement, recognition, the work itself, responsibility, advancement) motivate.'],
  [7, 'Vroom', 'Motivation = expectancy × instrumentality × valence.'],
  [7, 'Oldham-Hackman', 'Skill variety, task identity, task significance, autonomy, feedback.'],
  [7, 'Belbin: selecting people', 'Distinguish eligible (right qualifications) from suitable (can do the job) candidates; hiring eligible-but-unsuitable is the danger.'],
  [7, 'Matrix organisation', 'Staff report to a functional manager and a project manager (two bosses).'],
  [7, 'Chief programmer team', 'One expert leads, others support; good for small, simple projects; single point of failure.'],
  [7, 'Democratic team', 'No formal leader; good for small, complex/research projects; n(n−1)/2 paths.'],
  [7, 'Risk exposure', 'Probability × loss (impact).'],
  [7, 'Risk responses', 'Accept, avoid, reduce (mitigate), transfer, plus contingency planning.'],
  [7, 'RRL', '(RE before − RE after) / cost of the risk-reduction action; > 1 worth doing.'],
  [8, 'Resource histogram', 'Bar chart of resource need over time; smooth peaks by moving activities within float.'],
  [8, 'Three schedules from resource allocation', 'Activity schedule, resource schedule, cost schedule.'],
  [8, 'RAG reporting', 'Green on target; amber not on target but recoverable; red not recoverable without difficulty.'],
  [8, 'Checkpoints', 'Regular (time-driven, e.g. weekly) or tied to events (milestones, end of a phase).'],
  [8, 'Report categories', 'Oral formal regular (weekly meetings), oral formal ad hoc (end-of-stage review), written formal regular (job sheets), written formal ad hoc (exception reports), oral informal ad hoc (canteen chat).'],
  [9, 'Why review before test', 'Cheaper defect removal; works on non-executable documents; spreads knowledge.'],
  [9, 'Code walkthrough', 'Informal: team members trace the code by hand with test cases.'],
  [9, 'Code inspection', 'Formal review for common errors using checklists (e.g. uninitialised variables, mismatched interfaces).'],
  [9, 'Slip chart', 'Alternative to the Gantt chart: the slip line bends more sharply the further an activity falls behind schedule.'],
  [9, 'Timeline chart', 'Shows how targets and planned completion dates have changed over the project\'s duration.'],
  [9, 'PV, EV, AC', 'PV = BCWS (planned), EV = BCWP (earned, value of work done), AC = ACWP (actual cost).'],
  [9, '0/100 technique', 'Credit 0 until the task completes, then 100 %: preferred for software (avoids "99 % complete").'],
  [9, 'SPI and CPI', 'EV/PV and EV/AC; below 1 = behind schedule / over budget.'],
  [10, 'Baseline', 'A configuration formally reviewed and agreed, the basis for further development; changed only via change control.'],
  [10, 'Version, revision, variant', 'Version: a configuration that existed at a point in time (version m.n). Revision: successive state of one configuration item after each update. Variants: versions meant to coexist (different OS, hardware or feature levels).'],
  [10, 'Reserve / restore', 'Check-out a configuration item to a private workspace; check-in after the change control board approves.'],
  [10, 'SCCS / RCS', 'Early version-control tools storing deltas of text files; not for binaries.'],
  [10, 'Fixed price contract', 'Price agreed up front; risk on the supplier.'],
  [10, 'Time & materials contract', 'Customer pays a rate per unit of effort; risk on the customer.'],
  [10, 'Fixed price per unit', 'Paid per function point (or unit of size) delivered.'],
  [10, 'Tendering', 'Open (any supplier), restricted (invited suppliers), negotiated (one supplier).'],
  [10, 'Project close-out', 'Administrative closure and contract closure; lessons learnt, archive, release resources.'],
  [11, 'Quality: traditional definition', 'Fitness for purpose / conformance to requirements; not enough for software (usability, maintainability matter).'],
  [11, 'QA vs QC', 'QA: process-oriented, preventive. QC: product-oriented, detects defects (inspection, testing).'],
  [11, 'Quality evolution', 'Inspection → quality control → quality assurance → total quality management.'],
  [11, 'ISO 9000 series', 'Process standards (1987). 9001: design, development, production, servicing (applies to software firms); 9002: production only, no design (not for software); 9003: inspection and testing only.'],
  [11, 'ISO 9001 vs CMM', 'ISO: certification, pass/fail, generic. CMM: five levels, software-specific, roadmap for improvement; ISO 9001 ≈ level 3.'],
  [11, 'CMM level 1-5', 'Initial, Repeatable, Defined, Managed, Optimizing.'],
  [11, 'Level-2 KPAs', 'Requirements management, project planning, tracking & oversight, subcontract mgmt, SQA, configuration management.'],
  [11, 'Level-5 KPAs', 'Defect prevention, technology change management, process change management.'],
  [12, 'CMMI flavours', 'Successor of CMM integrating many models into one framework (v1.1 2002, v1.2 2006): CMMI for Development, for Services, for Acquisition.'],
  [12, 'PSP levels', 'PSP0 personal measurement, PSP1 personal planning, PSP2 personal quality (reviews), PSP3 personal process evolution.'],
  [12, 'Six Sigma', '3.4 defects per million opportunities; DMAIC for existing processes, DMADV for new ones.'],
  [12, 'Reliability', 'Probability of correct operation for a given time under given conditions; observer-dependent.'],
  [12, '90-10 rule', '90 % of execution time is spent in 10 % of the code (core), so where bugs are matters.'],
  [12, 'POFOD vs ROCOF', 'POFOD: failures per demand (no time). ROCOF: failures per unit time.'],
  [12, 'Jelinski-Moranda', 'Reliability growth model: each fix removes one fault; failure rate ∝ faults remaining.'],
  [12, 'Littlewood-Verall', 'Growth model allowing negative growth (a fix can add faults).'],
  [12, 'Operational profile', 'Probability of each kind of input in use; drives statistical testing.'],
  [12, 'Error → fault → failure', 'Human mistake → defect in the product → observable wrong behaviour.'],
  [12, 'Verification vs validation', 'Verification: building the product right (each phase). Validation: building the right product (final vs requirements).']];

page({ id: 'flashcards', mod: 'home', title: 'Flashcards', kw: 'flashcards definitions recall terms flip memorise', render(b) {
  H(b, `<h1>Flashcards</h1><p class="lede">${FLASH.length} cards, one concept each. Say the answer out loud, flip, then be honest: "Again" puts the card back in your pile. Keys: space flips, ← again, → got it.</p>`);
  const FP = store.get('flash', {});
  const deck = h('select', { class: 'sel' }, h('option', { value: 'all' }, 'All weeks'), h('option', { value: 'again' }, 'Only my "again" cards'), ...Array.from({ length: 12 }, (_, i) => h('option', { value: i + 1 }, 'Week ' + (i + 1) + ` (${FLASH.filter(c => c[0] === i + 1).length})`)));
  const stat = h('div', { class: 'qscore' }), wrap = h('div', { class: 'flash' }), card = h('div', { class: 'fc', tabindex: 0, role: 'button', 'aria-label': 'flip card' });
  const again = h('button', { class: 'btn' }, '← Again'), got = h('button', { class: 'btn primary' }, 'Got it →'), flipB = h('button', { class: 'btn' }, 'Flip');
  b.append(h('div', { class: 'calc' }, h('div', { class: 'inputs' }, h('label', {}, 'Deck', deck))), stat, wrap);
  wrap.append(card, h('div', { class: 'nextprev', style: 'justify-content:center;gap:10px' }, again, flipB, got));
  let pile = [], i = 0, back = false;
  const key = c => 'f' + FLASH.indexOf(c);
  function build() { const v = deck.value; pile = shuffle(FLASH.filter(c => v === 'all' ? true : v === 'again' ? FP[key(c)] === 0 : c[0] === +v)); i = 0; show(); }
  function show() { back = false; const c = pile[i]; const known = FLASH.filter(x => FP[key(x)] === 1).length;
    stat.innerHTML = `<div><small>card</small><b>${pile.length ? Math.min(i + 1, pile.length) : 0} / ${pile.length}</b></div><div><small>known</small><b>${known} / ${FLASH.length}</b></div><div><small>again pile</small><b>${FLASH.filter(x => FP[key(x)] === 0).length}</b></div>`;
    card.classList.remove('back');
    if (!c) { card.innerHTML = `<div><small>deck finished</small>${deck.value === 'again' ? 'No cards in the again pile.' : 'Done. Pick another deck or press Got it to reshuffle.'}</div>`; return; }
    card.innerHTML = `<div><small>Week ${c[0]} · term</small><b>${c[1]}</b></div>`; }
  function flip() { const c = pile[i]; if (!c) return; back = !back; card.classList.toggle('back', back); card.innerHTML = back ? `<div><small>${c[1]}</small>${c[2]}</div>` : `<div><small>Week ${c[0]} · term</small><b>${c[1]}</b></div>`; }
  function mark(ok) { const c = pile[i]; if (!c) { build(); return; } FP[key(c)] = ok ? 1 : 0; store.set('flash', FP); i++; show(); }
  card.addEventListener('click', flip); flipB.onclick = flip; again.onclick = () => mark(false); got.onclick = () => mark(true);
  const kd = e => { if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === ' ') { e.preventDefault(); flip(); } else if (e.key === 'ArrowRight') mark(true); else if (e.key === 'ArrowLeft') mark(false); };
  document.addEventListener('keydown', kd); onLeave(() => document.removeEventListener('keydown', kd));
  deck.addEventListener('change', build); build();
  H(b, `<h2>All cards as a list</h2>`);
  const d = h('details', {}, h('summary', {}, 'Show every card (for a quick read-through)'));
  d.insertAdjacentHTML('beforeend', TBL(['Week', 'Term', 'Meaning'], FLASH.map(c => ['W' + c[0], `<b>${c[1]}</b>`, c[2]])));
  b.append(d);
} });
